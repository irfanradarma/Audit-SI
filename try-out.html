<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CISA Mastery Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .flashcard-wrapper { perspective: 1000px; height: 380px; margin: 0 auto; max-width: 480px; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 24px; padding: 2.5rem; text-align: center; }
        .flashcard-front { background: linear-gradient(135deg, #4f46e5, #3730a3); color: white; font-size: 1.75rem; font-weight: 800; border: 4px solid #312e81; }
        .flashcard-back { background-color: #f0fdf4; color: #166534; transform: rotateY(180deg); font-size: 1.25rem; font-weight: 600; border: 4px solid #16a34a; }
        .subject-card { cursor: pointer; transition: all 0.3s ease; background: white; border: 1px solid #e5e7eb; }
        .subject-card:hover { transform: translateY(-8px); border-color: #4f46e5; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 flex items-center justify-center">

    <div id="mainApp" class="max-w-5xl w-full bg-white rounded-[2rem] shadow-2xl p-6 md:p-12 my-8 border border-slate-100">
        <header class="mb-10 text-center">
            <div class="inline-block px-4 py-1.5 mb-4 text-xs font-bold tracking-widest text-indigo-600 uppercase bg-indigo-50 rounded-full">ISACA Certification Prep</div>
            <h1 class="text-4xl font-black text-slate-900 mb-2">CISA Study Stream</h1>
            <button onclick="navigateTo('home')" class="mt-4 px-6 py-2 rounded-full border border-slate-200 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition">Dashboard</button>
        </header>

        <div id="statusMessage" class="text-center py-20 font-bold text-slate-400">Loading CISA Domains...</div>

        <div id="appViewsContainer" class="hidden">
            <div id="homeView" class="view">
                <div id="subjectCardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12"></div>
            </div>

            <div id="studyView" class="view hidden">
                <div class="flex flex-col md:flex-row gap-4 mb-8 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                    <select id="subjectSelect" class="flex-grow p-3 rounded-xl border-slate-200 font-semibold text-slate-700" onchange="handleSubjectChange()"></select>
                    <div class="flex gap-2">
                        <button id="btnQuiz" onclick="setFeature('quiz')" class="px-6 py-3 rounded-xl font-bold transition">Quiz</button>
                        <button id="btnFlashcard" onclick="setFeature('flashcard')" class="px-6 py-3 rounded-xl font-bold transition">Flashcards</button>
                    </div>
                </div>

                <div id="featureContent" class="min-h-[400px]">
                    <div id="quizContainer" class="hidden">
                        <div id="quizQuestion" class="mb-8"></div>
                        <div id="quizFeedback" class="hidden mb-6 p-4 rounded-xl text-center font-bold"></div>
                        <div class="flex justify-between items-center border-t pt-6">
                            <span id="quizScoreDisplay" class="font-bold text-slate-400"></span>
                            <button id="nextQuestionBtn" onclick="nextQuestion()" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold hover:bg-indigo-700 disabled:opacity-50">Next Question</button>
                        </div>
                    </div>

                    <div id="flashcardContainer" class="hidden">
                        <div id="flashcardDeck" class="flashcard-wrapper"></div>
                        <div class="mt-10 flex justify-center items-center gap-8">
                            <button onclick="prevCard()" id="prevCardBtn" class="p-4 bg-slate-100 rounded-full hover:bg-slate-200">←</button>
                            <span id="flashcardIndex" class="font-bold text-slate-700 text-lg"></span>
                            <button onclick="nextCard()" id="nextCardBtn" class="p-4 bg-indigo-600 text-white rounded-full hover:bg-indigo-700">→</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // UPDATE THIS URL to point to your hosted JSON file
        const DATA_URL = 'https://github.com/irfanradarma/Audit-SI/raw/main/exercise-data.json'; 
        
        let studyData = [];
        let currentSubjectIndex = 0;
        let currentFeature = 'quiz';
        let quizState = { currentQuestionIndex: 0, score: 0, totalAnswered: 0 };
        let flashcardState = { currentCardIndex: 0 };

        async function loadData() {
            try {
                const response = await fetch(DATA_URL);
                studyData = await response.json();
                initApp();
            } catch (err) {
                document.getElementById('statusMessage').textContent = "Error loading data. Ensure data_source.json is in the same folder.";
            }
        }

        function initApp() {
            document.getElementById('statusMessage').classList.add('hidden');
            document.getElementById('appViewsContainer').classList.remove('hidden');
            
            const select = document.getElementById('subjectSelect');
            const container = document.getElementById('subjectCardContainer');
            
            studyData.forEach((s, i) => {
                const opt = document.createElement('option');
                opt.value = i; opt.textContent = s.subjectName;
                select.appendChild(opt);

                container.innerHTML += `
                    <div onclick="startSubject(${i})" class="subject-card p-8 rounded-[2rem] flex flex-col h-full">
                        <div class="bg-indigo-100 text-indigo-700 w-12 h-12 rounded-2xl flex items-center justify-center mb-6 font-bold">D${i+1}</div>
                        <h3 class="text-xl font-bold text-slate-900 mb-2">${s.subjectName}</h3>
                        <p class="text-slate-500 text-sm mb-6 flex-grow">${s.description}</p>
                        <div class="text-indigo-600 font-bold text-sm">Start Study →</div>
                    </div>`;
            });
            navigateTo('home');
        }

        function startSubject(i) {
            currentSubjectIndex = i;
            document.getElementById('subjectSelect').value = i;
            navigateTo('study');
        }

        function navigateTo(view) {
            document.getElementById('homeView').classList.toggle('hidden', view !== 'home');
            document.getElementById('studyView').classList.toggle('hidden', view !== 'study');
            if(view === 'study') handleSubjectChange();
        }

        function handleSubjectChange() {
            currentSubjectIndex = parseInt(document.getElementById('subjectSelect').value);
            resetQuiz();
            setFeature(currentFeature);
        }

        function setFeature(f) {
            currentFeature = f;
            const isQuiz = f === 'quiz';
            document.getElementById('btnQuiz').className = isQuiz ? 'px-6 py-3 rounded-xl font-bold bg-indigo-600 text-white shadow-lg' : 'px-6 py-3 rounded-xl font-bold bg-white text-slate-600 border border-slate-200';
            document.getElementById('btnFlashcard').className = !isQuiz ? 'px-6 py-3 rounded-xl font-bold bg-indigo-600 text-white shadow-lg' : 'px-6 py-3 rounded-xl font-bold bg-white text-slate-600 border border-slate-200';
            document.getElementById('quizContainer').classList.toggle('hidden', !isQuiz);
            document.getElementById('flashcardContainer').classList.toggle('hidden', isQuiz);
            isQuiz ? renderQuizQuestion() : renderFlashcard();
        }

        function resetQuiz() { quizState = { currentQuestionIndex: 0, score: 0, totalAnswered: 0 }; }

        function renderQuizQuestion() {
            const q = studyData[currentSubjectIndex].quizQuestions[quizState.currentQuestionIndex];
            if (!q) {
                document.getElementById('quizQuestion').innerHTML = `<div class="text-center py-10 font-bold text-2xl">Domain Complete!</div>`;
                return;
            }
            document.getElementById('quizFeedback').classList.add('hidden');
            document.getElementById('nextQuestionBtn').disabled = true;
            document.getElementById('quizScoreDisplay').textContent = `Score: ${quizState.score}/${quizState.totalAnswered}`;
            document.getElementById('quizQuestion').innerHTML = `
                <h3 class="text-2xl font-bold text-slate-800 mb-8">${q.question}</h3>
                <div class="space-y-3">${q.options.map((opt, i) => `<button onclick="checkAnswer(this, ${i})" class="quiz-option w-full p-5 text-left rounded-2xl border-2 border-slate-100 hover:border-indigo-200 font-medium">${opt}</button>`).join('')}</div>`;
        }

        function checkAnswer(btn, idx) {
            const q = studyData[currentSubjectIndex].quizQuestions[quizState.currentQuestionIndex];
            const correct = idx === q.answerIndex;
            quizState.totalAnswered++; if(correct) quizState.score++;
            const f = document.getElementById('quizFeedback');
            f.textContent = correct ? "Correct!" : `Incorrect. Answer: ${q.options[q.answerIndex]}`;
            f.className = `mb-6 p-4 rounded-xl text-center font-bold ${correct ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
            f.classList.remove('hidden');
            document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
            document.getElementById('nextQuestionBtn').disabled = false;
        }

        function nextQuestion() { quizState.currentQuestionIndex++; renderQuizQuestion(); }

        function renderFlashcard() {
            const cards = studyData[currentSubjectIndex].flashcards;
            const c = cards[flashcardState.currentCardIndex];
            document.getElementById('flashcardDeck').innerHTML = `<div class="flashcard" onclick="this.classList.toggle('flipped')"><div class="flashcard-front">${c.term}</div><div class="flashcard-back">${c.definition}</div></div>`;
            document.getElementById('flashcardIndex').textContent = `${flashcardState.currentCardIndex + 1} / ${cards.length}`;
            document.getElementById('prevCardBtn').disabled = flashcardState.currentCardIndex === 0;
            document.getElementById('nextCardBtn').disabled = flashcardState.currentCardIndex === cards.length - 1;
        }

        function nextCard() { flashcardState.currentCardIndex++; renderFlashcard(); }
        function prevCard() { flashcardState.currentCardIndex--; renderFlashcard(); }

        window.onload = loadData;
    </script>
</body>
</html>
