<html lang="en">

        }
        
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

            transition: width 0.3s ease-in-out;
        }

            <div class="flex items-center space-x-4">

                <div class="w-8 h-8 rounded-full bg-indigo-800 border border-indigo-600 flex items-center justify-center">

            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden h-full">

            async function loadStandardsFromWorkbook() {
                try {
                    const binary = atob(COBIT_FRAMEWORK_WORKBOOK_BASE64);
                    const workbookBytes = new Uint8Array(binary.length);
                    for (let index = 0; index < binary.length; index += 1) {
                        workbookBytes[index] = binary.charCodeAt(index);
                    }
                    const arrayBuffer = workbookBytes.buffer;
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    const objectivesSheet = workbook.Sheets['Objective'];
                    const practicesSheet = workbook.Sheets['Practice'];
                    const activitiesSheet = workbook.Sheets['Activity'];

                    if (!objectivesSheet || !practicesSheet || !activitiesSheet) {
                        throw new Error('The workbook must contain "Objective", "Practice", and "Activity" sheets.');
                    }

                    const objectiveRows = XLSX.utils.sheet_to_json(objectivesSheet, { defval: '' });
                    const practiceRows = XLSX.utils.sheet_to_json(practicesSheet, { defval: '' });
                    const activityRows = XLSX.utils.sheet_to_json(activitiesSheet, { defval: '' });

                    const bySortOrder = (left, right) => Number(left.sortOrder || 0) - Number(right.sortOrder || 0);
                    const activitiesByPracticeId = new Map();
                    activityRows
                        .filter((row) => row.id && row.practiceId)
                        .sort(bySortOrder)
                        .forEach((row) => {
                            const practiceId = String(row.practiceId).trim();
                            const activityId = String(row.id).trim();
                            const activityCode = String(row.activityCode || activityId).trim();
                            if (!activitiesByPracticeId.has(practiceId)) {
                                activitiesByPracticeId.set(practiceId, []);
                            }
                            activitiesByPracticeId.get(practiceId).push({
                                id: activityId,
                                key: activityId,
                                code: activityCode,
                                desc: String(row.description || '').trim(),
                                level: Number(row.capabilityLevel) || 1,
                                sortOrder: Number(row.sortOrder) || 0
                            });
                        });

                    const practicesByObjectiveId = new Map();
                    practiceRows
                        .filter((row) => row.id && row.objectiveId && row.practiceCode)
                        .sort(bySortOrder)
                        .forEach((row) => {
                            const objectiveId = String(row.objectiveId).trim();
                            const practiceId = String(row.id).trim();
                            const practiceCode = String(row.practiceCode).trim();
                            if (!practicesByObjectiveId.has(objectiveId)) {
                                practicesByObjectiveId.set(objectiveId, []);
                            }
                            practicesByObjectiveId.get(objectiveId).push({
                                id: practiceId,
                                code: practiceCode,
                                name: String(row.name || `Practice ${practiceCode}`).trim(),
                                desc: String(row.description || '').trim(),
                                sortOrder: Number(row.sortOrder) || 0,
                                activities: activitiesByPracticeId.get(practiceId) || []
                            });
                        });

                    const objectives = objectiveRows
                        .filter((row) => row.id && row.code)
                        .sort(bySortOrder)
                        .map((row) => {
                            const objectiveId = String(row.id).trim();
                            const objectiveCode = String(row.code).trim();
                            return {
                                id: objectiveId,
                                code: objectiveCode,
                                domain: String(row.domain || objectiveCode.slice(0, 3)).trim(),
                                name: String(row.name || objectiveCode).trim(),
                                desc: String(row.description || '').trim(),
                                purpose: String(row.purpose || '').trim(),
                                sortOrder: Number(row.sortOrder) || 0,
                                practices: practicesByObjectiveId.get(objectiveId) || []
                            };
                        });

                    seedDemoAssessments(objectives);

                    STATE.standards = [
                        {
                            id: 'STD-C19',
                            name: 'COBIT 2019 IT Governance Assessment',
                            version: '2019',
                            desc: 'Imported from the COBIT 2019 workbook.',
                            objectives
                        }
                    ];
                    seedDemoEvidence();
                } catch (error) {
                    console.error('Unable to load workbook standards data:', error);
                    STATE.standards = [
                        {
                            id: 'STD-C19',
                            name: 'COBIT 2019 IT Governance Assessment',
                            version: '2019',
                            desc: 'Fallback standard data.',
                            objectives: []
                        }
                    ];
                }
            }

            function toggleSidebar() {
                STATE.isSidebarCollapsed = !STATE.isSidebarCollapsed;
                const sidebar = document.getElementById('sidebar');
                if (STATE.isSidebarCollapsed) {
                    sidebar.classList.add('w-16', 'sidebar-collapsed');
                    sidebar.classList.remove('w-64');
                } else {
                    sidebar.classList.remove('w-16', 'sidebar-collapsed');
                    sidebar.classList.add('w-64');
                }
            }

            function loadFilesFromStorage() {
                try {
                    const stored = localStorage.getItem('cobit-ams-files');
                    if (stored) {
                        STATE.files = JSON.parse(stored);
                    }
                } catch (error) {
                    console.error('Unable to load stored files:', error);
                }
            }

            function saveFilesToStorage() {
                localStorage.setItem('cobit-ams-files', JSON.stringify(STATE.files));
            }

            function renderCurrentView() {
                const container = document.getElementById('app-container');
                if (!container) return;
                switch (STATE.activeMenu) {
                    case 'dashboard': renderDashboard(container); break;
                    case 'standards': renderStandards(container); break;
                    case 'assessment': renderAssessment(container); break;
                    case 'files': renderFileManagement(container); break;
                    case 'admin': renderAdmin(container); break;
                    default: renderDashboard(container); break;
                }
            }

            function openAttachmentModal(targetType, targetKey, label) {
                STATE.attachmentTarget = { type: targetType, key: targetKey, label };
                renderCurrentView();
            }

            function closeAttachmentModal() {
                STATE.attachmentTarget = null;
                renderCurrentView();
            }

            function getTargetContext(targetType, targetKey) {
                for (const std of STATE.standards) {
                    for (const objective of std.objectives || []) {
                        if (targetType === 'practice') {
                            const practice = (objective.practices || []).find((item) => item.code === targetKey);
                            if (practice) {
                                return { std, objective, practice };
                            }
                        } else if (targetType === 'activity') {
                            for (const practice of objective.practices || []) {
                                const activity = (practice.activities || []).find((item) => item.key === targetKey);
                                if (activity) {
                                    return { std, objective, practice, activity };
                                }
                            }
                        }
                    }
                }
                return null;
            }

            function attachFileToTarget(fileId) {
                if (!STATE.attachmentTarget) return;
                const context = getTargetContext(STATE.attachmentTarget.type, STATE.attachmentTarget.key);
                if (!context) return;

                const target = STATE.attachmentTarget.type === 'practice' ? context.practice : context.activity;
                if (!target.attachments) {
                    target.attachments = [];
                }
                if (!target.attachments.includes(fileId)) {
                    target.attachments.push(fileId);
                }

                const file = STATE.files.find((item) => item.id === fileId);
                if (file) {
                    if (!file.linkedActivities) file.linkedActivities = [];
                    if (!file.linkedActivities.includes(STATE.attachmentTarget.key)) {
                        file.linkedActivities.push(STATE.attachmentTarget.key);
                    }
                }
                saveFilesToStorage();
                closeAttachmentModal();
            }

            function removeFileFromTarget(targetType, targetKey, fileId) {
                const context = getTargetContext(targetType, targetKey);
                if (!context) return;
                const target = targetType === 'practice' ? context.practice : context.activity;
                if (!target.attachments) return;
                target.attachments = target.attachments.filter((id) => id !== fileId);
                const file = STATE.files.find((item) => item.id === fileId);
                if (file) {
                    file.linkedActivities = (file.linkedActivities || []).filter((key) => key !== targetKey);
                }
                saveFilesToStorage();
                renderCurrentView();
            }

            function handleAttachmentUpload(event) {
                const files = Array.from(event.target.files || []);
                if (files.length === 0) return;

                Promise.all(files.map((file) => new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const contentText = file.type.startsWith('text/') || /\.(txt|json|csv|md|log)$/i.test(file.name)
                            ? reader.result
                            : '';
                        const storedFile = {
                            id: `file-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                            name: file.name,
                            type: file.type || 'application/octet-stream',
                            size: file.size,
                            uploadedAt: new Date().toISOString(),
                            contentText,
                            dataUrl: typeof reader.result === 'string' ? reader.result : ''
                        };
                        STATE.files.push(storedFile);
                        if (STATE.attachmentTarget) {
                            const context = getTargetContext(STATE.attachmentTarget.type, STATE.attachmentTarget.key);
                            if (context) {
                                const target = STATE.attachmentTarget.type === 'practice' ? context.practice : context.activity;
                                if (!target.attachments) target.attachments = [];
                                if (!target.attachments.includes(storedFile.id)) {
                                    target.attachments.push(storedFile.id);
                                }
                            }
                        }
                        resolve();
                    };
                    if (file.type.startsWith('text/') || /\.(txt|json|csv|md|log)$/i.test(file.name)) {
                        reader.readAsText(file);
                    } else {
                        reader.readAsDataURL(file);
                    }
                }))).then(() => {
                    saveFilesToStorage();
                    event.target.value = '';
                    renderCurrentView();
                });
            }

            function runAiAssessmentForTarget(targetType, targetKey) {
                const context = getTargetContext(targetType, targetKey);
                if (!context) return;
                const target = targetType === 'practice' ? context.practice : context.activity;

                if (!target.attachments || target.attachments.length === 0) {
                    target.aiAssessment = {
                        score: 0,
                        summary: 'No attached documents were found. Add evidence files before requesting an AI assessment.',
                        evidence: []
                    };
                    renderCurrentView();
                    return;
                }

                const files = STATE.files.filter((item) => target.attachments.includes(item.id));
                const evidence = files.map((file) => file.name);
                const textSources = files.map((file) => (file.contentText || file.name || '').toLowerCase()).join(' ');

                const keywords = ['policy', 'procedure', 'control', 'evidence', 'approved', 'review', 'risk', 'incident', 'report', 'audit', 'test'];
                const matched = keywords.filter((word) => textSources.includes(word));
                const score = Math.min(100, 40 + matched.length * 10 + (textSources.length > 40 ? 10 : 0));
                const summary = matched.length > 0
                    ? `The attached evidence is aligned with ${matched.slice(0, 3).join(', ')} markers, suggesting the practice is likely ${score >= 70 ? 'well-supported' : 'partially supported'} by documentation.`
                    : 'The attached files do not clearly demonstrate control evidence. Add supporting policy, procedure, or review documents.';

                target.aiAssessment = {
                    score,
                    summary,
                    evidence
                };
                renderCurrentView();
            }

            function updateActivityAssessment(pIdx, aIdx, field, val) {
                const project = STATE.projects.find((item) => item.id === STATE.selectedProjectId);
                const standardId = project ? project.standardId : STATE.activeStandardId;
                const std = STATE.standards.find((s) => s.id === standardId);
                if (!std) return;
                const obj = std.objectives.find((o) => o.id === STATE.selectedAssessmentObjectiveId);
                if (obj) {
                    const practice = obj.practices[pIdx];
                    if (practice && practice.activities[aIdx]) {
                        practice.activities[aIdx][field] = val;
                        if (field === 'assessmentRating') {
                            renderAssessment(document.getElementById('app-container'));
                        }
                    }
                }
            }

            function getAssessmentRatingValue(value) {
                switch (value) {
                    case 'Partially Achieved (15-50%)': return 35;
                    case 'Largely Achieved (50-85%)': return 70;
                    case 'Fully Achieved (85-100%)': return 100;
                    default: return 0;
                }
            }

            function calculateObjectiveCapabilitySummary(objective) {
                const activities = (objective.practices || []).flatMap((practice) => practice.activities || []);
                const summary = [];
                let highestAchievedLevel = 0;
                let shouldStop = false;

                for (let level = 1; level <= 5; level += 1) {
                    const levelActivities = activities.filter((activity) => Number(activity.level || 1) === level);
                    if (levelActivities.length === 0) {
                        continue;
                    }

                    const achievedActivities = levelActivities.filter((activity) => {
                        const ratingValue = getAssessmentRatingValue(activity.assessmentRating || 'Not Achieved (0-15%)');
                        return ratingValue >= 50;
                    }).length;
                    const ratio = achievedActivities / levelActivities.length;
                    const isAchieved = ratio >= 0.5;
                    const canProceed = ratio >= 0.8;

                    summary.push({
                        level,
                        total: levelActivities.length,
                        achieved: achievedActivities,
                        ratio,
                        isAchieved,
                        canProceed
                    });

                    if (!isAchieved) {
                        shouldStop = true;
                        break;
                    }

                    highestAchievedLevel = level;
                    if (!canProceed) {
                        shouldStop = true;
                        break;
                    }
                }

                return {
                    levels: summary,
                    highestAchievedLevel,
                    shouldStop,
                    narrative: highestAchievedLevel === 0
                        ? 'No capability level could be confirmed yet. Complete the assessment to determine maturity.'
                        : `The objective is currently assessed at Capability Level ${highestAchievedLevel}${shouldStop ? ' and higher levels are not yet justified.' : '.'}`
                };
            }

            function calculateProjectReport(standard) {
                const objectives = (standard.objectives || []).map((objective) => ({
                    objective,
                    capability: calculateObjectiveCapabilitySummary(objective)
                }));
                const domains = new Map();
                objectives.forEach((entry) => {
                    const domainCode = String(entry.objective.code || '').slice(0, 3);
                    if (!domains.has(domainCode)) domains.set(domainCode, []);
                    domains.get(domainCode).push(entry);
                });
                return {
                    objectives,

                container.innerHTML = html;
            }

            function viewStandard(id) {
                STATE.activeStandardId = id;
                STATE.activeObjectiveId = null;
                STATE.isEditMode = false;
                renderStandards(document.getElementById('app-container'));
            }

            function closeStandard() {
                STATE.activeStandardId = null;
                STATE.activeObjectiveId = null;
                STATE.isEditMode = false;
                renderStandards(document.getElementById('app-container'));
            }

            function selectObjective(id) {
                STATE.activeObjectiveId = id;
                renderStandards(document.getElementById('app-container'));
            }

            function toggleEditMode() {
                STATE.isEditMode = !STATE.isEditMode;
                renderStandards(document.getElementById('app-container'));
            }

            // --- Edit Functions (Basic Prototype implementations using prompt/direct array manipulation) ---
            function updateStandardDesc(val) {
                const std = STATE.standards.find(s => s.id === STATE.activeStandardId);
                if(std) std.desc = val;
            }

            function addObjective() {
                const std = STATE.standards.find(s => s.id === STATE.activeStandardId);
                const code = prompt("Enter Objective Code (e.g., BAI01):");
                if(!code) return;
                
                const newObj = {
                    id: "OBJ-" + Date.now(),
                    code: code,
                    name: "New Objective",
                    desc: "Enter description here...",
                    purpose: "Enter purpose here...",
                    practices: []
                };
                std.objectives.push(newObj);
                STATE.activeObjectiveId = newObj.id;
                renderStandards(document.getElementById('app-container'));
            }

            function deleteObjective(id) {
                if(!confirm("Are you sure you want to delete this objective?")) return;
                const std = STATE.standards.find(s => s.id === STATE.activeStandardId);
                std.objectives = std.objectives.filter(o => o.id !== id);
                STATE.activeObjectiveId = std.objectives.length > 0 ? std.objectives[0].id : null;
                renderStandards(document.getElementById('app-container'));
            }

            function updateObjField(field, val) {
                const std = STATE.standards.find(s => s.id === STATE.activeStandardId);
                const obj = std.objectives.find(o => o.id === STATE.activeObjectiveId);
                if(obj) obj[field] = val;
            }

            function addPractice() {
                const std = STATE.standards.find(s => s.id === STATE.activeStandardId);
                const obj = std.objectives.find(o => o.id === STATE.activeObjectiveId);
                if(obj) {
                    if(!obj.practices) obj.practices = [];
                    const code = prompt("Enter Practice Code (e.g., " + obj.code + ".01):", obj.code + ".01");
                    if(code) {
                        obj.practices.push({ code: code, name: "New Practice", activities: [] });
                        renderStandards(document.getElementById('app-container'));
                    }
                }
            }
            
            function deletePractice(idx) {
                const std = STATE.standards.find(s => s.id === STATE.activeStandardId);
                const obj = std.objectives.find(o => o.id === STATE.activeObjectiveId);
                if(obj && confirm("Delete practice?")) {
                    obj.practices.splice(idx, 1);
                    renderStandards(document.getElementById('app-container'));
                }
            }

            function updatePracticeField(idx, field, val) {
                const std = STATE.standards.find(s => s.id === STATE.activeStandardId);
                const obj = std.objectives.find(o => o.id === STATE.activeObjectiveId);
                if(obj) obj.practices[idx][field] = val;
            }

            function addActivity(pIdx) {
                const std = STATE.standards.find(s => s.id === STATE.activeStandardId);
                const obj = std.objectives.find(o => o.id === STATE.activeObjectiveId);
                if(obj) {
                    const practice = obj.practices[pIdx];
                    if(!practice.activities) practice.activities = [];
                    practice.activities.push({ id: "a" + (practice.activities.length + 1), key: "a" + (practice.activities.length + 1), desc: "New activity description", level: 1 });
                    renderStandards(document.getElementById('app-container'));
                }
            }

            function deleteActivity(pIdx, aIdx) {
                const std = STATE.standards.find(s => s.id === STATE.activeStandardId);
                const obj = std.objectives.find(o => o.id === STATE.activeObjectiveId);
                if(obj) {
                    obj.practices[pIdx].activities.splice(aIdx, 1);
                    renderStandards(document.getElementById('app-container'));
                }
            }

            function updateActivityField(pIdx, aIdx, field, val) {
                const std = STATE.standards.find(s => s.id === STATE.activeStandardId);
                const obj = std.objectives.find(o => o.id === STATE.activeObjectiveId);
                if(obj) obj.practices[pIdx].activities[aIdx][field] = val;
            }

                     const filteredObjectives = STATE.objectiveDomainFilter === 'ALL'
                         ? std.objectives

                     html += `

                        ${STATE.projectWorkspaceTab === 'reporting' ? renderProjectReport(proj, std) : `

                                    <div class="mb-6 rounded-xl border border-indigo-100 bg-indigo-50 p-4">
                                        <div class="flex flex-wrap items-center justify-between gap-2"><div><p class="text-sm font-semibold text-indigo-700">Live capability score: Level ${capabilitySummary.highestAchievedLevel}</p><p class="mt-1 text-xs text-slate-600">${capabilitySummary.narrative}</p></div><span class="rounded-full bg-white px-3 py-1 text-xs font-bold text-indigo-700">50% achieve · 80% continue</span></div>
                                        <div class="mt-4 flex min-w-max items-stretch gap-2 overflow-x-auto pb-1">${[1,2,3,4,5].map((level) => { const entry=capabilitySummary.levels.find((item) => item.level === level); const reached=level <= capabilitySummary.highestAchievedLevel; return `<div class="flex min-w-[130px] flex-1 items-center gap-2"><div class="flex-1 rounded-lg border px-3 py-2 ${reached ? 'border-emerald-200 bg-emerald-50' : entry && entry.isAchieved ? 'border-amber-200 bg-amber-50' : 'border-slate-200 bg-white'}"><div class="flex items-center justify-between"><span class="text-xs font-bold">Level ${level}</span><span class="text-xs font-semibold">${entry ? Math.round(entry.ratio * 100) + '%' : '—'}</span></div><p class="mt-1 text-[10px] text-slate-500">${entry ? `${entry.achieved}/${entry.total} activities` : 'Not assessed'}</p></div>${level < 5 ? '<i class="fa-solid fa-chevron-right text-slate-300"></i>' : ''}</div>`; }).join('')}</div>
                                    </div>

                                    ${false ? `
                                        <div class="space-y-4">
                                            <div class="rounded-xl border border-indigo-100 bg-indigo-50 p-4">
                                                <p class="text-sm font-semibold text-indigo-700">Capability level summary</p>
                                                <p class="text-sm text-slate-700 mt-1">${capabilitySummary.narrative}</p>
                                            </div>
                                            <div class="rounded-xl border border-slate-200 bg-white p-4">
                                                <div class="space-y-3">
                                                    ${capabilitySummary.levels.map((entry) => `
                                                        <div class="flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2">
                                                            <div>
                                                                <p class="text-sm font-semibold text-slate-700">Level ${entry.level}</p>
                                                                <p class="text-xs text-slate-500">${entry.achieved}/${entry.total} activities met the 50% achievement threshold</p>
                                                            </div>
                                                            <div class="text-right">
                                                                <p class="text-xs font-semibold text-slate-600">${Math.round(entry.ratio * 100)}%</p>
                                                                <span class="mt-1 inline-block rounded-full px-2.5 py-1 text-xs font-semibold ${entry.canProceed ? 'bg-emerald-50 text-emerald-700' : entry.isAchieved ? 'bg-amber-50 text-amber-700' : 'bg-slate-100 text-slate-600'}">${entry.canProceed ? 'Achieved · continue' : entry.isAchieved ? 'Achieved · stop' : 'Not achieved'}</span>
                                                            </div>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            </div>
                                        </div>
                                    ` : `
                                        <div>
                                            <div class="mb-4 flex gap-2 overflow-x-auto border-b border-slate-200 pb-px">
                                                ${selectedObj.practices.map((practice) => `<button type="button" onclick="app.selectPracticeTab('${practice.code}')" class="whitespace-nowrap rounded-t-lg border border-b-0 px-4 py-2.5 font-mono text-xs font-bold transition ${STATE.selectedPracticeCode === practice.code ? 'border-indigo-300 bg-indigo-600 text-white shadow-sm' : 'border-slate-200 bg-slate-50 text-slate-600 hover:bg-indigo-50 hover:text-indigo-700'}">${practice.code}</button>`).join('')}
                                            </div>
                                            ${selectedObj.practices.map((prac) => `
                                                <div class="${STATE.selectedPracticeCode === prac.code ? '' : 'hidden'} border border-slate-200 rounded-lg p-5">
                                                    <div class="flex w-full flex-wrap items-start justify-between gap-3 text-left">
                                                        <div>
                                                            <h4 class="font-bold text-slate-800">${prac.code} ${prac.name}</h4>
                                                            ${prac.desc ? `<p class="text-xs text-slate-500 mt-1">${prac.desc}</p>` : ''}
                                                        </div>
                                                    </div>
                                                    <div class="mt-4">
                                                        <div class="mb-4 flex justify-end gap-2">
                                                            <button type="button" onclick="app.openAttachmentModal('practice', '${prac.code}', '${prac.name.replace(/'/g, "\\'")}')" class="rounded border border-slate-300 bg-white px-2.5 py-1 text-[11px] font-semibold text-slate-700">Attach / Link</button>
                                                            <button type="button" onclick="app.runAiAssessmentForTarget('practice', '${prac.code}')" class="rounded bg-indigo-600 px-2.5 py-1 text-[11px] font-semibold text-white">AI Assess</button>
                                                        </div>
                                                    <div class="rounded-lg border border-slate-200 bg-slate-50 p-3">
                                                        <div class="flex items-center justify-between gap-3">
                                                            <div>
                                                                <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Attached evidence</p>
                                                                <p class="text-xs text-slate-500">${(prac.attachments || []).length > 0 ? `${(prac.attachments || []).length} file(s) linked` : 'No files attached yet'}</p>
                                                            </div>
                                                            <div class="text-xs text-slate-500">Evidence for the whole practice</div>
                                                        </div>
                                                        ${(prac.attachments || []).length > 0 ? `<div class="mt-3 space-y-2">${(prac.attachments || []).map((fileId) => {
                                                            const file = STATE.files.find((item) => item.id === fileId);
                                                            return file ? `<div class="flex items-center justify-between rounded border border-slate-200 bg-white px-3 py-2 text-sm"><span>${file.name}</span><button type="button" onclick="app.removeFileFromTarget('practice', '${prac.code}', '${file.id}')" class="text-xs font-semibold text-red-500">Remove</button></div>` : '';
                                                        }).join('')}</div>` : ''}
                                                        ${prac.aiAssessment ? `<div class="mt-3 rounded border border-indigo-200 bg-indigo-50 p-3">
                                                            <div class="flex items-center justify-between gap-3">
                                                                <div>
                                                                    <p class="text-xs font-semibold uppercase tracking-wide text-indigo-600">AI assessment</p>
                                                                    <p class="text-sm text-slate-700">${prac.aiAssessment.summary}</p>
                                                                </div>
                                                                <span class="rounded-full bg-white px-2.5 py-1 text-xs font-semibold text-indigo-700">Score ${prac.aiAssessment.score}/100</span>
                                                            </div>
                                                        </div>` : ''}
                                                    </div>
                                                    <div class="mt-4 overflow-x-auto rounded-lg border border-slate-200">
                                                        <table class="w-full min-w-[900px] text-left text-sm">
                                                            <thead class="bg-slate-100 text-xs uppercase tracking-wide text-slate-500">
                                                                <tr><th class="w-14 px-3 py-2 text-center">No.</th><th class="px-3 py-2">Activity</th><th class="px-3 py-2 text-center">Capability Level</th><th class="px-3 py-2">Achievement Rating</th><th class="w-[38%] px-3 py-2">Evidence / Justification</th></tr>
                                                            </thead>
                                                            <tbody class="divide-y divide-slate-200 bg-white">
                                                                ${prac.activities.map((act, aIdx) => `
                                                                    <tr class="align-top">
                                                                        <td class="px-3 py-3 text-center font-mono text-xs font-bold text-slate-500">${aIdx + 1}</td>
                                                                        <td class="px-3 py-3 text-slate-700">${String(act.desc || '').replace(/^\s*\d+\.\s*/, '')}</td>
                                                                        <td class="px-3 py-3 text-center"><span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-slate-100 font-bold text-slate-700">${act.level}</span></td>
                                                                        <td class="px-3 py-3"><select onchange="app.updateActivityAssessment(${selectedObj.practices.indexOf(prac)}, ${aIdx}, 'assessmentRating', this.value)" class="w-full min-w-[175px] rounded border border-slate-300 p-1.5 text-xs"><option ${!act.assessmentRating || act.assessmentRating === 'Not Achieved (0-15%)' ? 'selected' : ''}>Not Achieved (0-15%)</option><option value="Partially Achieved (15-50%)" ${act.assessmentRating === 'Partially Achieved (15-50%)' ? 'selected' : ''}>Partially Achieved (15-50%)</option><option value="Largely Achieved (50-85%)" ${act.assessmentRating === 'Largely Achieved (50-85%)' ? 'selected' : ''}>Largely Achieved (50-85%)</option><option value="Fully Achieved (85-100%)" ${act.assessmentRating === 'Fully Achieved (85-100%)' ? 'selected' : ''}>Fully Achieved (85-100%)</option></select></td>
                                                                        <td class="w-[38%] px-3 py-3"><textarea oninput="app.updateActivityAssessment(${selectedObj.practices.indexOf(prac)}, ${aIdx}, 'assessmentNotes', this.value)" class="w-full min-w-[360px] rounded border border-slate-200 bg-slate-50 p-2 text-xs" rows="3" placeholder="Evidence / justification...">${act.assessmentNotes || ''}</textarea></td>
                                                                    </tr>
                                                                `).join('')}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    `}
                                ` : '<p class="text-slate-400">No content structure found.</p>'}
                            </div>
                        </div>
                        `}
                     `;
                }

                container.innerHTML = html + renderAttachmentModal();
            }

            function setAssessmentView(view) {
                STATE.assessmentView = view;
                STATE.assessmentDetailTab = 'assessment';
                if (view !== 'detail') STATE.projectWorkspaceTab = 'assessment';
                renderAssessment(document.getElementById('app-container'));
            }

            function viewAssessmentDetail(id) {
                STATE.selectedProjectId = id;
                STATE.assessmentView = 'detail';
                STATE.assessmentDetailTab = 'assessment';
                STATE.projectWorkspaceTab = 'assessment';
                const proj = STATE.projects.find((p) => p.id === id);
                if (proj) {
                    STATE.activeStandardId = proj.standardId;
                    const std = STATE.standards.find((s) => s.id === proj.standardId);
                    if (std && std.objectives.length > 0) {
                        STATE.selectedAssessmentObjectiveId = std.objectives[0].id;
                    }
                }
                renderAssessment(document.getElementById('app-container'));
            }

            function submitNewProject() {
                const name = document.getElementById('p_name').value;
                const org = document.getElementById('p_org').value;
                const std = document.getElementById('p_std').value;
                const start = document.getElementById('p_start').value;
                const end = document.getElementById('p_end').value;
                
                const typeNodes = document.getElementsByName('assignment_type');
                let assignmentType = 'all';
                for(let i=0; i<typeNodes.length; i++) {
                    if(typeNodes[i].checked) assignmentType = typeNodes[i].value;
                }

                let assignedUsers = [];
                if(assignmentType === 'specific') {
                    const checkboxes = document.getElementsByName('assigned_users');
                    for(let i=0; i<checkboxes.length; i++) {
                        if(checkboxes[i].checked) assignedUsers.push(checkboxes[i].value);
                    }
                    if (assignedUsers.length === 0) {
                        alert('Select at least one person for a specific-personnel assignment.');
                        return;
                    }
                }

                const newProj = {
                    id: "PRJ-" + Math.floor(Math.random() * 1000).toString().padStart(3, '0'),
                    name, org, standardId: std, startDate: start, endDate: end,
                    status: "Draft", assignmentType, assignedUsers
                };

                STATE.projects.unshift(newProj);
                setAssessmentView('list');
                
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg z-50 text-sm font-medium';
                toast.innerText = `Project Created Successfully`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }

            function renderFileManagement(container) {
                container.innerHTML = `
                    <div class="mb-6 flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
                        <div>
                            <h2 class="text-2xl lg:text-3xl font-bold text-slate-800">File Management</h2>
                            <p class="text-slate-500 mt-1">Upload evidence files and link them to assessment practices.</p>
                        </div>
                    </div>

                    <div class="grid gap-6 xl:grid-cols-[1.2fr_0.8fr]">
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-lg font-bold text-slate-800">Stored files</h3>
                                <span class="text-sm text-slate-500">${STATE.files.length} file(s)</span>
                            </div>
                            ${STATE.files.length === 0 ? '<div class="rounded-lg border border-dashed border-slate-200 p-6 text-center text-sm text-slate-500">No files uploaded yet.</div>' : `<div class="space-y-3">${STATE.files.map((file) => `
                                <div class="rounded-lg border border-slate-200 p-4">
                                    <div class="flex items-start justify-between gap-3">
                                        <div>
                                            <p class="font-semibold text-slate-800">${file.name}</p>
                                            <p class="text-xs text-slate-500 mt-1">${file.type} • ${Math.round(file.size / 1024)} KB • uploaded ${new Date(file.uploadedAt).toLocaleString()}</p>
                                            ${file.linkedActivities && file.linkedActivities.length > 0 ? `<p class="text-xs text-indigo-600 mt-2">Linked to ${file.linkedActivities.length} practice(s)</p>` : ''}
                                        </div>
                                        <span class="rounded-full bg-slate-100 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-wide text-slate-600">${file.type.split('/')[0] || 'file'}</span>
                                    </div>
                                </div>
                            `).join('')}</div>`}
                        </div>

                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                            <h3 class="text-lg font-bold text-slate-800">Upload new evidence</h3>
                            <p class="text-sm text-slate-500 mt-2">Add policy documents, screenshots, reports, or notes to support assessments.</p>
                            <label class="mt-4 flex cursor-pointer flex-col items-center justify-center rounded-xl border border-dashed border-slate-300 bg-slate-50 p-6 text-center text-sm text-slate-600 transition hover:border-indigo-300 hover:bg-indigo-50">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-500 mb-2"></i>
                                <span class="font-semibold text-slate-700">Choose files to upload</span>
                                <span class="mt-1 text-xs text-slate-500">Text, images, and documents are supported in the prototype.</span>
                                <input type="file" multiple class="hidden" onchange="app.handleAttachmentUpload(event)">
                            </label>
                        </div>
                    </div>
                ` + renderAttachmentModal();
            }

            function renderAdmin(container) {
                container.innerHTML = `
                    <div class="mb-6">
                        <h2 class="text-2xl lg:text-3xl font-bold text-slate-800">Organizations & Users</h2>
                        <p class="text-slate-500 mt-1">Embedded prototype directory data used when creating and assigning assessments.</p>
                    </div>
                    <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
                        ${STATE.organizationRecords.map((organization) => {
                            const members = STATE.users.filter((user) => user.org === organization.name);
                            return `<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
                                <div class="flex items-start justify-between gap-3">
                                    <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600"><i class="fa-solid fa-building"></i></div>
                                    <span class="rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-semibold text-slate-600">${organization.type}</span>
                                </div>
                                <h3 class="mt-4 font-bold text-slate-800">${organization.name}</h3>
                                <p class="mt-1 font-mono text-xs text-slate-400">${organization.id}</p>
                                <div class="mt-4 border-t border-slate-100 pt-3 text-sm text-slate-600"><i class="fa-solid fa-users mr-2 text-slate-400"></i>${members.length} assigned user${members.length === 1 ? '' : 's'}</div>
                            </div>`;
                        }).join('')}
                    </div>
                    <div class="mt-6 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                        <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
                            <div><h3 class="font-bold text-slate-800">Personnel Directory</h3><p class="text-xs text-slate-500">${STATE.users.length} embedded dummy users</p></div>
                            <span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700">Prototype data</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full min-w-[760px] text-left text-sm">
                                <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-5 py-3">User</th><th class="px-5 py-3">Job title</th><th class="px-5 py-3">Organization</th><th class="px-5 py-3">Role</th></tr></thead>
                                <tbody class="divide-y divide-slate-100">${STATE.users.map((user) => `<tr class="hover:bg-slate-50"><td class="px-5 py-3"><div class="font-semibold text-slate-800">${user.name}</div><div class="text-xs text-slate-500">${user.email}</div></td><td class="px-5 py-3 text-slate-600">${user.title}</td><td class="px-5 py-3 text-slate-600">${user.org}</td><td class="px-5 py-3"><span class="rounded-full px-2.5 py-1 text-xs font-semibold ${user.role === 'ADMIN' ? 'bg-purple-50 text-purple-700' : user.role === 'ASSESSOR' ? 'bg-indigo-50 text-indigo-700' : 'bg-slate-100 text-slate-600'}">${user.role}</span></td></tr>`).join('')}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            function renderAttachmentModal() {
                if (!STATE.attachmentTarget) return '';
                const target = STATE.attachmentTarget;
                return `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 p-4">
                        <div class="w-full max-w-2xl rounded-xl border border-slate-200 bg-white shadow-2xl">
                            <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
                                <div>
                                    <p class="text-xs font-semibold uppercase tracking-wide text-indigo-600">Attach evidence</p>
                                    <h3 class="text-lg font-semibold text-slate-800">${target.label}</h3>
                                </div>
                                <button type="button" onclick="app.closeAttachmentModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-times"></i></button>
                            </div>
                            <div class="p-5">
                                <div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-4">
                                    <label class="flex cursor-pointer flex-col items-center justify-center rounded-lg border border-dashed border-slate-300 bg-white p-5 text-center text-sm text-slate-600 transition hover:border-indigo-300 hover:bg-indigo-50">
                                        <i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-500 mb-2"></i>
                                        <span class="font-semibold text-slate-700">Upload a new file</span>
                                        <input type="file" multiple class="hidden" onchange="app.handleAttachmentUpload(event)">
                                    </label>
                                </div>
                                <div class="mt-5">
                                    <h4 class="text-sm font-semibold text-slate-700">Or link an existing file from File Management</h4>
                                    <div class="mt-3 space-y-2">
                                        ${STATE.files.length === 0 ? '<div class="rounded-lg border border-dashed border-slate-200 p-3 text-sm text-slate-500">No files available yet.</div>' : STATE.files.map((file) => `
                                            <div class="flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2 text-sm">
                                                <div>
                                                    <p class="font-medium text-slate-700">${file.name}</p>
                                                    <p class="text-xs text-slate-500">${file.type}</p>
                                                </div>
                                                <button type="button" onclick="app.attachFileToTarget('${file.id}')" class="rounded bg-indigo-600 px-3 py-1.5 text-xs font-semibold text-white">Link</button>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Public API
            return {
                init, toggleSidebar, switchRole, navigateTo,
                viewStandard, closeStandard, selectObjective, toggleEditMode,
                addObjective, deleteObjective, updateStandardDesc, updateObjField,
                addPractice, deletePractice, updatePracticeField,
                addActivity, deleteActivity, updateActivityField,
                openAttachmentModal, closeAttachmentModal, attachFileToTarget, removeFileFromTarget, handleAttachmentUpload, runAiAssessmentForTarget,
                updateActivityAssessment, selectAssessmentObjective, setAssessmentDetailTab, setProjectWorkspaceTab, filterPersonnelByOrganization,
                toggleObjectivesNav, setObjectiveDomainFilter, togglePractice, selectPracticeTab,
                setAssessmentView, viewAssessmentDetail, submitNewProject
            };

        })();

        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
