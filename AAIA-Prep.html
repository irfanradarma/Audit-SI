B":2},"answer":"B","confidence":"medium","explanation":"Tool deteksi AI menghasilkan false positive yang berdampak serius bagi siswa, sehingga keputusan akhir tidak boleh diserahkan sepenuhnya pada output tool. Melatih guru untuk menafsirkan hasil secara hati-hati dan melakukan review sebelum mengambil tindakan menerapkan prinsip human in the loop yang ditekankan manual untuk keputusan kritis. Ini mengatasi dampak ketidakakuratan tanpa menghilangkan manfaat tool. Opsi lain tidak mengatasi akar masalah atau bahkan memperburuknya.","distractors":{"A":"Menaikkan temperature justru menambah randomness output dan tidak meningkatkan akurasi deteksi.","C":"Membatasi penggunaan tidak mengatasi false positive pada kasus yang tetap diperiksa.","D":"Deklarasi siswa adalah kontrol administratif yang tidak mengatasi kesalahan klasifikasi tool."},"manualRef":{"chapter":2,"section":"2.11.3","title":"Human in the Loop","bookPage":104,"pdfPage":110},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":8,"topic":2,"qn":97,"question":"An organization has exhausted its internal data sources to train an AI model. Which of the following is the BEST source to obtain new data?","options":{"A":"Extended retention of internal data","B":"Copyright-free data","C":"Data from web scraping","D":"Shadow data"},"url":"https://www.examtopics.com/discussions/isaca/view/404670-exam-aaia-topic-2-question-97-discussion/","community":{"B":2},"answer":"B","confidence":"medium","explanation":"Saat data internal habis, sumber eksternal harus dapat dipakai secara sah dan etis. Data bebas hak cipta (copyright-free) meminimalkan risiko pelanggaran IP dan litigasi, yang menurut manual merupakan isu besar dalam training AI karena banyak gugatan terkait penggunaan konten tanpa lisensi. Manual juga menekankan bahwa developer harus memperoleh data training secara hati-hati dan sesuai hukum. Opsi lain menimbulkan risiko legal, privasi, atau governance.","distractors":{"A":"Memperpanjang retensi tidak menghasilkan data baru dan dapat melanggar kebijakan retensi serta prinsip privasi.","C":"Web scraping berisiko melanggar hak cipta, terms of use, dan persetujuan pemilik data.","D":"Shadow data tidak terkelola dan tidak ter-govern, sehingga kualitas, kepemilikan, dan consent-nya tidak jelas."},"manualRef":{"chapter":1,"section":"1.17.5","title":"IP Considerations","bookPage":73,"pdfPage":79},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":9,"topic":1,"qn":135,"question":"An IS auditor is reviewing an organization’s acceptable use policy for its internal AI system.\nWhich of the following is MOST important for the auditor to confirm?","options":{"A":"Employees from all organizational units are required to complete AI system training.","B":"The policy is coordinated with AI strategic and risk management objectives.","C":"The policy stipulates AI system-specific control types and implementation processes.","D":"Ownership of AI system risk has been assigned to the information security function."},"url":"https://www.examtopics.com/discussions/isaca/view/394902-exam-aaia-topic-1-question-135-discussion/","community":{"B":2},"answer":"B","confidence":"high","explanation":"Manual menyatakan bahwa kebijakan dan prosedur AI harus dibuat agar selaras dengan strategi AI organisasi, dan AUP harus mempertimbangkan analisis risk-benefit. Karena itu hal paling penting yang perlu dikonfirmasi auditor adalah keterkaitan AUP dengan tujuan strategis dan manajemen risiko AI. Tanpa keselarasan ini, kebijakan bisa saja lengkap secara teknis tetapi tidak mendukung arah dan risk appetite organisasi. Opsi lain adalah detail implementasi atau penugasan yang kurang tepat.","distractors":{"A":"Training penting untuk mendukung AUP, tetapi tidak semua unit wajib dan ini bukan hal paling fundamental.","C":"AUP bersifat high-level untuk pengguna; detail jenis kontrol dan proses implementasi ada di standar/prosedur.","D":"Kepemilikan risiko AI sebaiknya pada business/risk owner, bukan otomatis pada fungsi keamanan informasi."},"manualRef":{"chapter":1,"section":"1.8","title":"AI-related Policies and Procedures","bookPage":47,"pdfPage":53},"links":[{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"},{"label":"COBIT","url":"https://www.isaca.org/resources/cobit"}]},{"id":10,"topic":3,"qn":103,"question":"Which of the following approaches would an IS auditor test if the developer adjusted preprocessing to improve data quality?","options":{"A":"Long short-term memory networks","B":"Policy gradient methods","C":"Structural causal models","D":"Variational autoencoders"},"url":"https://www.examtopics.com/discussions/isaca/view/394969-exam-aaia-topic-3-question-103-discussion/","community":{"D":1},"answer":"D","confidence":"medium","explanation":"Variational autoencoders (VAEs) mempelajari representasi distribusi data sehingga dapat dipakai dalam preprocessing untuk denoising, imputasi nilai hilang, deteksi anomali, dan pembuatan data sintetis. Jadi jika developer mengubah preprocessing untuk meningkatkan kualitas data, VAE adalah pendekatan yang relevan untuk diuji. Manual juga menyebut VAE sebagai teknik untuk menghasilkan data (synthetic data) dengan pedoman statistik yang ketat. Opsi lain adalah teknik pemodelan untuk tujuan yang berbeda.","distractors":{"A":"LSTM adalah arsitektur RNN untuk data sekuensial/time series, bukan teknik preprocessing kualitas data.","B":"Policy gradient adalah metode reinforcement learning untuk mempelajari kebijakan aksi.","C":"Structural causal models dipakai untuk inferensi sebab-akibat, bukan pembersihan atau perbaikan data."},"manualRef":{"chapter":3,"section":"3.10.2","title":"Testing Data","bookPage":153,"pdfPage":159},"links":[{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":11,"topic":1,"qn":49,"question":"Which of the following is MOST important to have in place before implementing a system that utilizes AI?","options":{"A":"Training on the use of the system's AI capabilities","B":"An AI acceptable use policy","C":"Model evaluation and validation methodology","D":"A project plan for deploying the AI system"},"url":"https://www.examtopics.com/discussions/isaca/view/316561-exam-aaia-topic-1-question-49-discussion/","community":{"C":2,"A":2},"answer":"B","confidence":"medium","explanation":"Dari sudut pandang ISACA, governance dan kebijakan harus ada sebelum teknologi diimplementasikan. AI acceptable use policy menetapkan penggunaan yang diizinkan dan dilarang, ekspektasi governance, serta penggunaan data yang dapat diterima; manual menyatakan sikap organisasi terhadap AI minimal harus terdokumentasi dalam kebijakan formal. Training, metodologi validasi, dan project plan semuanya diturunkan dari atau mengacu pada kebijakan ini. Community terbagi antara A dan C; jawaban ini memilih kebijakan karena menjadi dasar bagi kontrol lainnya.","distractors":{"A":"Training penting, tetapi isinya harus mengacu pada AUP; tanpa kebijakan, training tidak memiliki dasar.","C":"Metodologi validasi model adalah kontrol teknis penting, tetapi tetap berada di bawah kerangka kebijakan.","D":"Project plan mengatur deployment, bukan batasan dan tata kelola penggunaan AI."},"manualRef":{"chapter":1,"section":"1.8.1","title":"Usage Policies","bookPage":47,"pdfPage":53},"links":[{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]},{"id":12,"topic":3,"qn":47,"question":"As a result of regulatory changes, an IS auditor is planning an audit of the legal team’s unlabeled contract repository to identify similarities in contractual terms. Which of the following is the BEST application of AI to improve the audit’s effectiveness?","options":{"A":"Dimension reduction algorithms to compact variables","B":"Clustering algorithms to segment contracts into groups","C":"Regression algorithms to identify contractual relationships","D":"Classification algorithms to define contract categories"},"url":"https://www.examtopics.com/discussions/isaca/view/320617-exam-aaia-topic-3-question-47-discussion/","community":{"B":2},"answer":"B","confidence":"high","explanation":"Repositori kontrak tidak berlabel dan tujuannya menemukan kemiripan, sehingga cocok dengan unsupervised learning. Clustering mengelompokkan data tanpa label berdasarkan kesamaan, sesuai penjelasan manual tentang data clustering. Hasilnya auditor dapat menilai kelompok kontrak yang memiliki ketentuan serupa terhadap perubahan regulasi secara efisien. Classification dan regression memerlukan data berlabel (supervised).","distractors":{"A":"Dimension reduction menyederhanakan variabel, tetapi tidak langsung mengelompokkan kontrak berdasarkan kesamaan.","C":"Regression memprediksi nilai kontinu dan membutuhkan label; tidak cocok untuk data tidak berlabel.","D":"Classification membutuhkan kategori berlabel yang sudah ditentukan sebelumnya, padahal data tidak berlabel."},"manualRef":{"chapter":1,"section":"1.14.6","title":"Data Clustering","bookPage":64,"pdfPage":70},"links":[{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":13,"topic":3,"qn":11,"question":"For a sales promotion, an AI system sorts customer attributes into several categories by analyzing transaction history. Verifying which of the following would BEST validate the effectiveness of this process?","options":{"A":"Stress tests are regularly conducted to maintain consistent AI performance.","B":"The applied methodology adequately reflects business objectives.","C":"Sensitive attributes are converted to other data types prior to input.","D":"Sampling of AI output is conducted to identify unusual decisions."},"url":"https://www.examtopics.com/discussions/isaca/view/318744-exam-aaia-topic-3-question-11-discussion/","community":{"B":2,"D":2},"answer":"B","confidence":"low","explanation":"Efektivitas proses segmentasi pelanggan diukur dari apakah proses itu mencapai tujuan bisnis (promosi penjualan). Pada segmentasi tanpa label, tidak ada jawaban benar yang mutlak, sehingga validasi terbaik adalah memastikan metodologi pengelompokan mencerminkan tujuan bisnis. Manual menekankan bahwa solusi AI harus diverifikasi terhadap tujuan bisnis dan kriteria sukses dari tahap use case. Sampling output (D) berguna untuk mendeteksi anomali, tetapi bersifat detektif dan tidak membuktikan efektivitas terhadap tujuan. Community terbagi rata antara B dan D.","distractors":{"A":"Stress test menguji ketahanan performa, bukan apakah segmentasi efektif untuk tujuan promosi.","C":"Konversi atribut sensitif adalah kontrol privasi/bias, bukan validasi efektivitas.","D":"Sampling output membantu menemukan keputusan tidak wajar, tetapi tidak memvalidasi kesesuaian dengan tujuan bisnis secara keseluruhan."},"manualRef":{"chapter":2,"section":"2.12.3","title":"Objective Verification","bookPage":107,"pdfPage":113},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":14,"topic":3,"qn":76,"question":"Which of the following is the GREATEST data quality risk when using an AI tool to assist with audit procedures?","options":{"A":"Utilizing unstructured data sources without standardized preprocessing","B":"Training models based on historical audit results generated prior to AI adoption","C":"Embedding AI audit tools in transactional systems without user training","D":"Applying automated anomaly detection without human oversight"},"url":"https://www.examtopics.com/discussions/isaca/view/384030-exam-aaia-topic-3-question-76-discussion/","community":{"A":2,"C":1},"answer":"A","confidence":"medium","explanation":"Pertanyaannya spesifik pada risiko kualitas data. Data tidak terstruktur (email, dokumen, log) tidak memiliki skema atau format baku, sehingga tanpa preprocessing standar akan menghasilkan inkonsistensi, ketidaklengkapan, dan salah tafsir oleh AI (garbage in, garbage out). Manual menegaskan bahwa kualitas data sangat penting bagi AI yang dipakai tim audit dan bahwa data harus memenuhi standar akurasi, kelengkapan, konsistensi, dan validitas. Opsi lain lebih merupakan risiko proses, pelatihan, atau oversight daripada kualitas data.","distractors":{"B":"Data historis sebelum adopsi AI tidak otomatis berkualitas buruk; risikonya lebih kecil dibanding data tidak terstruktur tanpa standardisasi.","C":"Kurangnya pelatihan pengguna adalah risiko people/operasional, bukan risiko kualitas data.","D":"Ketiadaan human oversight adalah risiko keandalan output, bukan kualitas data input."},"manualRef":{"chapter":3,"section":"3.13","title":"Data Quality","bookPage":161,"pdfPage":167},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":15,"topic":2,"qn":86,"question":"Which of the following agentic AI models would work BEST to optimize prices of airline tickets based on demand and external market conditions?","options":{"A":"Simple reflex agents","B":"Rule-based agents","C":"Deliberative agents","D":"Learning agents"},"url":"https://www.examtopics.com/discussions/isaca/view/394935-exam-aaia-topic-2-question-86-discussion/","community":{"D":1},"answer":"D","confidence":"medium","explanation":"Optimasi harga tiket berdasarkan permintaan dan kondisi pasar eksternal membutuhkan agen yang terus belajar dari data baru dan hasil keputusannya sendiri. Learning agent memiliki komponen pembelajaran yang memperbaiki kinerjanya seiring waktu, sehingga cocok untuk lingkungan dinamis seperti dynamic pricing. Manual menjelaskan bahwa agentic AI mampu mengambil keputusan otonom untuk mencapai tujuan seperti memaksimalkan efisiensi. Agen reflex atau rule-based hanya merespons aturan tetap dan tidak beradaptasi.","distractors":{"A":"Simple reflex agent hanya bereaksi terhadap kondisi saat ini dengan aturan tetap, tanpa memori atau adaptasi.","B":"Rule-based agent bergantung pada aturan statis yang tidak dapat menyesuaikan diri dengan pasar yang berubah.","C":"Deliberative agent merencanakan berdasarkan model dunia, tetapi tanpa komponen belajar tidak memperbaiki diri dari data pasar baru."},"manualRef":{"chapter":1,"section":"1.1.3","title":"Generative Models (Agentic Artificial Intelligence)","bookPage":24,"pdfPage":30},"links":[{"label":"Wikipedia: Intelligent agent","url":"https://en.wikipedia.org/wiki/Intelligent_agent"}]},{"id":16,"topic":2,"qn":80,"question":"A real estate agency uses an AI tool to predict house values. The model accuracy significantly declined after six months in production.\nWhich of the following is the MOST likely root cause?","options":{"A":"Underfitting","B":"Covariate shift","C":"High bias","D":"Imbalance"},"url":"https://www.examtopics.com/discussions/isaca/view/394929-exam-aaia-topic-2-question-80-discussion/","community":{"B":2},"answer":"B","confidence":"high","explanation":"Model yang awalnya akurat lalu menurun signifikan setelah enam bulan di produksi adalah gejala klasik drift. Covariate shift terjadi ketika distribusi fitur input (mis. kondisi pasar properti, suku bunga, lokasi) berubah dibanding data training. Manual menjelaskan bahwa penurunan performa seiring waktu bisa disebabkan perubahan karakteristik data input baru yang tidak dilatihkan ke model, sehingga perlu monitoring dan retraining. Underfitting, high bias, dan imbalance akan terlihat sejak awal, bukan muncul setelah beberapa bulan.","distractors":{"A":"Underfitting menyebabkan performa buruk sejak awal (pada training dan test), bukan penurunan setelah produksi.","C":"High bias adalah sifat model yang terlalu sederhana dan juga terlihat sejak awal.","D":"Imbalance adalah masalah komposisi data training yang akan memengaruhi performa sejak deployment."},"manualRef":{"chapter":2,"section":"2.8.6","title":"Monitoring and Maintenance (Data and Model Drift)","bookPage":96,"pdfPage":102},"links":[{"label":"Wikipedia: Concept drift","url":"https://en.wikipedia.org/wiki/Concept_drift"}]},{"id":17,"topic":2,"qn":40,"question":"Which of the following controls BEST helps reduce the risk of hallucinations in an AI model?","options":{"A":"Requiring model output explanations","B":"Implementing a human-in-the-loop approach","C":"Improving model transparency","D":"Reducing the model’s creativity score"},"url":"https://www.examtopics.com/discussions/isaca/view/316531-exam-aaia-topic-2-question-40-discussion/","community":{"D":5,"B":4},"answer":"D","confidence":"low","explanation":"Hallucination terjadi ketika model menghasilkan output yang tidak berdasar pada data input atau realitas; parameter seperti temperature/creativity sangat memengaruhi seberapa bervariasi dan kreatif jawaban model. Menurunkan creativity score secara langsung menurunkan kemungkinan model menghasilkan konten yang mengada-ada, sehingga mengurangi risiko di sumbernya. Human-in-the-loop (B) adalah kontrol yang kuat, tetapi bersifat detektif: ia menangkap hallucination setelah terjadi, bukan mengurangi kemunculannya. Soal ini diperdebatkan (community 5 D vs 4 B); pilihan D konsisten dengan soal sejenis di bank soal yang menjadikan pengaturan creativity/temperature sebagai jawaban.","distractors":{"A":"Penjelasan output meningkatkan explainability, tetapi tidak mencegah model berhalusinasi.","B":"HITL mengurangi dampak hallucination dengan review manusia, namun tidak mengurangi frekuensi hallucination dari model itu sendiri.","C":"Transparansi model membantu pemahaman dan akuntabilitas, bukan kontrol langsung terhadap hallucination."},"manualRef":{"chapter":2,"section":"2.11.4","title":"Hallucination","bookPage":104,"pdfPage":110},"links":[{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"}]},{"id":18,"topic":2,"qn":54,"question":"Which of the following are the MOST appropriate stages in the AI life cycle for evaluating edge cases?","options":{"A":"Plan and design","B":"Operate and monitor","C":"Collect and process","D":"Test and verify"},"url":"https://www.examtopics.com/discussions/isaca/view/385131-exam-aaia-topic-2-question-54-discussion/","community":{"D":2},"answer":"D","confidence":"high","explanation":"Edge case adalah input yang valid tetapi ekstrem atau jarang, yang sering menjadi penyebab kegagalan model. Manual menyebut bahwa pada tahap test, evaluate, verify, and validate dilakukan stress testing dengan kondisi ekstrem dan edge case untuk memastikan model mampu menangani skenario tak terduga. Tahap ini adalah titik yang paling tepat sebelum model masuk produksi. Tahap lain memiliki fokus berbeda.","distractors":{"A":"Plan and design mendefinisikan tujuan dan kebutuhan, belum ada model untuk diuji terhadap edge case.","B":"Operate and monitor dapat menemukan edge case di produksi, tetapi evaluasi seharusnya dilakukan sebelum deploy.","C":"Collect and process data berfokus pada kualitas dan kelengkapan data, bukan pengujian perilaku model."},"manualRef":{"chapter":1,"section":"1.4.4","title":"Test, Evaluate, Verify, and Validate","bookPage":35,"pdfPage":41},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":19,"topic":2,"qn":61,"question":"An IS auditor is reviewing a data set used by a university to train a predictive machine learning (ML) model. Which of the following MOST likely indicates risk that the model could not process all data and make necessary correlations?","options":{"A":"Student Number field in integer format","B":"Grade Level field in float format","C":"Final Grade Percent field in object format","D":"Having an undergraduate degree in Boolean format"},"url":"https://www.examtopics.com/discussions/isaca/view/385155-exam-aaia-topic-2-question-61-discussion/","community":{"C":2},"answer":"C","confidence":"high","explanation":"Final Grade Percent seharusnya numerik (float). Jika tersimpan sebagai tipe object (string), model tidak dapat melakukan perhitungan dan korelasi numerik dengan benar, atau record tersebut gagal diproses. Ini melanggar dimensi validity kualitas data, yaitu data harus sesuai sintaks (format, tipe, rentang) definisinya, sebagaimana dijelaskan manual. Tipe data pada opsi lain wajar untuk isinya.","distractors":{"A":"Student Number sebagai integer wajar (walau sebaiknya diperlakukan sebagai identifier), dan tetap dapat diproses.","B":"Grade Level dalam float masih numerik dan dapat diproses model.","D":"Status gelar sarjana memang biner, sehingga Boolean adalah format yang tepat."},"manualRef":{"chapter":1,"section":"1.14.5","title":"Data Cleansing and Retention","bookPage":64,"pdfPage":70},"links":[{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":20,"topic":2,"qn":22,"question":"An anti-fraud team in a financial organization is building a machine learning (ML) model to detect online fraud, and an internal audit team has been engaged to audit the model. When auditing the model training stage, which of the following is MOST important to include in the scope of the audit?","options":{"A":"Data schema","B":"Data fairness","C":"Training staff expertise","D":"Training procedure"},"url":"https://www.examtopics.com/discussions/isaca/view/366567-exam-aaia-topic-2-question-22-discussion/","community":{"B":2},"answer":"D","confidence":"low","explanation":"Lingkup audit pada tahap model training harus mencakup prosedur training: bagaimana data dipisah, bagaimana imbalance kelas fraud ditangani (mis. cost-sensitive algorithm), hyperparameter, monitoring overfitting, dan dokumentasi. Manual menjelaskan bahwa proses training perlu dimonitor untuk masalah seperti overfitting, dan bias/fairness checks ditempatkan terutama pada tahap preprocessing dan testing/validasi. Data fairness penting, tetapi lebih relevan pada tahap pengumpulan data dan evaluasi; untuk model fraud, risiko utama di tahap training adalah prosedur yang tidak terkontrol. Jawaban ini berbeda dengan community (B, hanya 2 vote).","distractors":{"A":"Data schema adalah keputusan desain/data ingestion, bukan fokus utama tahap training.","B":"Fairness penting, namun pengujiannya terutama pada tahap preprocessing dan evaluasi; untuk tahap training, prosedurnya yang paling menentukan.","C":"Keahlian staf adalah faktor pendukung, bukan objek audit utama dari tahap training."},"manualRef":{"chapter":2,"section":"2.8.3","title":"Development (Model Training)","bookPage":95,"pdfPage":101},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":21,"topic":2,"qn":57,"question":"An internal audit department has noticed that AI generated audit reports are generating false conclusions. Which of the following is the BEST way to correct this issue?","options":{"A":"Increase the model context.","B":"Suspend utilization of the tool until resolved.","C":"Decrease the model's creativity score.","D":"Update service level agreements (SLAs)."},"url":"https://www.examtopics.com/discussions/isaca/view/382663-exam-aaia-topic-2-question-57-discussion/","community":{"C":4,"B":2},"answer":"C","confidence":"medium","explanation":"Kesimpulan palsu pada laporan yang dihasilkan AI adalah bentuk hallucination. Manual menjelaskan bahwa parameter seperti temperature dapat diubah dan sangat memengaruhi seberapa kreatif jawaban model; menurunkan creativity score membuat output lebih deterministik dan berbasis data. Ini adalah koreksi langsung atas akar masalah. Menghentikan tool terlalu drastis dan tidak memperbaiki masalah.","distractors":{"A":"Menambah context dapat membantu grounding, tetapi tidak langsung mengatasi kecenderungan model mengarang kesimpulan.","B":"Suspensi bisa menjadi tindakan sementara, tetapi bukan cara mengoreksi masalah dan berdampak pada operasi audit.","D":"SLA mengatur hubungan dengan vendor, bukan perilaku model yang menghasilkan kesimpulan salah."},"manualRef":{"chapter":2,"section":"2.10.2","title":"AI Model","bookPage":101,"pdfPage":107},"links":[{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"}]},{"id":22,"topic":2,"qn":31,"question":"An IS auditor is assessing an AI-powered chatbot that produces inaccurate or fabricated information for customer queries. Which of the following is the BEST recommendation when the model’s configuration emphasizes creativity over accuracy?","options":{"A":"Add more randomness through external prompts.","B":"Allow the AI model to self-correct its hallucinated outputs.","C":"Implement stricter prompt templates to constrain the model's outputs.","D":"Adjust the model’s temperature parameter to lower randomness."},"url":"https://www.examtopics.com/discussions/isaca/view/367062-exam-aaia-topic-2-question-31-discussion/","community":{"D":3},"answer":"D","confidence":"high","explanation":"Soal menyebut akar masalah secara eksplisit: konfigurasi model menekankan kreativitas dibanding akurasi. Parameter temperature mengendalikan randomness output; manual menjelaskan bahwa satu parameter ini dapat mengubah variasi output secara drastis dan menghasilkan jawaban yang lebih kreatif. Menurunkan temperature langsung mengatasi penyebabnya. Prompt template (C) adalah kontrol yang baik untuk prompt injection dan konsistensi, tetapi tidak menyentuh pengaturan randomness yang menjadi akar masalah.","distractors":{"A":"Menambah randomness justru memperparah hallucination.","B":"Model generatif tidak dapat diandalkan untuk mengoreksi hallucination-nya sendiri tanpa kontrol eksternal.","C":"Prompt template membantu struktur input/output, tetapi tidak memperbaiki konfigurasi yang terlalu kreatif."},"manualRef":{"chapter":2,"section":"2.10.2","title":"AI Model","bookPage":101,"pdfPage":107},"links":[{"label":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/"}]},{"id":23,"topic":2,"qn":15,"question":"The PRIMARY objective of machine learning (ML) in data processing is to:","options":{"A":"analyze data sets to identify visual patterns and trends.","B":"enhance the explainability of AI model outputs.","C":"draw statistical inferences for creating artificial human intelligence.","D":"perform actions that would typically require human intelligence."},"url":"https://www.examtopics.com/discussions/isaca/view/315954-exam-aaia-topic-2-question-15-discussion/","community":{"D":3,"C":1},"answer":"D","confidence":"low","explanation":"Machine learning adalah subset AI, dan tujuan AI secara umum adalah memungkinkan sistem melakukan tugas yang biasanya membutuhkan kecerdasan manusia. ML mencapai ini dengan belajar dari data untuk membuat prediksi atau keputusan tanpa diprogram secara eksplisit, sebagaimana manual menyebut ML membangun model prediktif dari data input. Opsi D paling mendekati tujuan utama tersebut dibanding opsi lain yang terlalu sempit atau keliru. Pilihan ini bersifat interpretatif karena tidak ada opsi yang persis sama dengan definisi manual.","distractors":{"A":"Pola visual dan tren hanya salah satu aplikasi analitik, terlalu sempit sebagai tujuan utama ML.","B":"Explainability adalah properti yang diinginkan, bukan tujuan utama ML.","C":"ML memang menggunakan statistik, tetapi tidak bertujuan menciptakan kecerdasan manusia buatan (AGI)."},"manualRef":{"chapter":1,"section":"1.1","title":"Types of AI","bookPage":19,"pdfPage":25},"links":[{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":24,"topic":2,"qn":13,"question":"Which of the following controls MOST effectively helps to ensure an AI model is resilient against external threats?","options":{"A":"Monitoring of AI access logs","B":"AI model configuration testing","C":"AI data set anonymization","D":"Monitoring of AI model developers"},"url":"https://www.examtopics.com/discussions/isaca/view/315099-exam-aaia-topic-2-question-13-discussion/","community":{"B":5},"answer":"B","confidence":"medium","explanation":"Ketahanan terhadap ancaman eksternal harus dibuktikan dengan menguji model dan konfigurasinya secara aktif, misalnya validasi input, sanitasi prompt, throttling, error handling, dan adversarial testing. Manual menjelaskan bahwa robustness dicapai dengan merancang sistem yang dapat menangani input tak terduga dan serangan siber serta gagal secara aman. Configuration testing secara preventif memverifikasi bahwa kontrol tersebut bekerja. Opsi lain bersifat detektif atau fokus pada risiko berbeda.","distractors":{"A":"Monitoring access log bersifat detektif dan tidak memastikan model tahan terhadap serangan.","C":"Anonymization melindungi privasi data, bukan ketahanan model terhadap serangan.","D":"Monitoring developer menangani ancaman internal, bukan eksternal."},"manualRef":{"chapter":2,"section":"2.9.4","title":"Robustness","bookPage":98,"pdfPage":104},"links":[{"label":"MITRE ATLAS","url":"https://atlas.mitre.org/"},{"label":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/"}]},{"id":25,"topic":1,"qn":94,"question":"An IS auditor is reviewing change documentation of an AI model. Which of the following would pose the GREATEST risk?","options":{"A":"Management has not tested the model.","B":"Test results are not in a standardized format.","C":"There is a low number of test scenarios.","D":"The seed used for testing is not documented."},"url":"https://www.examtopics.com/discussions/isaca/view/382603-exam-aaia-topic-1-question-94-discussion/","community":{"D":2,"A":5,"C":1},"answer":"A","confidence":"medium","explanation":"Dalam change management, testing adalah kontrol kunci yang memastikan perubahan tidak merusak fungsi dan sesuai tujuan bisnis sebelum dipromosikan ke produksi. Manual menekankan peran penting testing dalam change management AI dan bahwa solusi yang sudah divalidasi baru boleh dipindah ke produksi sesuai proses perubahan. Jika model sama sekali tidak diuji, tidak ada bukti bahwa perubahan aman, sehingga risikonya paling besar. Opsi lain adalah kelemahan kualitas atau dokumentasi pengujian yang tetap lebih ringan daripada tidak ada pengujian.","distractors":{"B":"Format hasil uji yang tidak standar adalah masalah dokumentasi, bukan ketiadaan assurance.","C":"Skenario uji sedikit menunjukkan cakupan terbatas, tetapi masih lebih baik daripada tidak ada pengujian.","D":"Seed yang tidak terdokumentasi mengurangi reproducibility, tetapi pengujian tetap telah dilakukan."},"manualRef":{"chapter":2,"section":"2.10","title":"Change Management Considerations","bookPage":101,"pdfPage":107},"links":[{"label":"ISACA ITAF","url":"https://www.isaca.org/resources/frameworks-standards-and-models"}]},{"id":26,"topic":1,"qn":33,"question":"An organization shares an AI model with external partners. One partner reports that sensitive data has been inadvertently exposed through the model's outputs. Which of the following is the IS auditor's BEST recommendation?","options":{"A":"Retrain the model immediately and implement privacy-preserving techniques.","B":"Disable the shared model and notify partners of the potential breach.","C":"Limit the model's outputs to anonymized results while investigating further.","D":"Audit the data pipelines of all partners to identify the source of the leak."},"url":"https://www.examtopics.com/discussions/isaca/view/315919-exam-aaia-topic-1-question-33-discussion/","community":{"B":6,"C":2},"answer":"B","confidence":"medium","explanation":"Kebocoran data sensitif melalui output model adalah insiden aktif, sehingga prioritasnya adalah containment untuk menghentikan paparan lebih lanjut, lalu memberi tahu pihak terdampak. Manual menjelaskan bahwa respons insiden AI dimulai dengan menahan penyebaran insiden, termasuk mengisolasi atau menonaktifkan fungsi AI, dan tahap assessment memperhatikan kapan insiden ditemukan karena terkait kewajiban notifikasi. Menonaktifkan model bersama dan memberi tahu partner memenuhi kedua aspek tersebut. Retraining dan audit pipeline dilakukan setelah insiden tertahan.","distractors":{"A":"Retraining adalah langkah eradication/perbaikan jangka panjang dan butuh waktu; kebocoran tetap terjadi selama itu.","C":"Membatasi output ke hasil anonim belum tentu menghentikan kebocoran (anonimisasi bisa gagal) dan tidak mencakup notifikasi.","D":"Mengaudit pipeline semua partner tidak menahan kebocoran saat ini dan sumber masalah kemungkinan ada pada model organisasi sendiri."},"manualRef":{"chapter":2,"section":"2.19.1","title":"Containment","bookPage":120,"pdfPage":126},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"GDPR text","url":"https://gdpr-info.eu/"}]},{"id":27,"topic":3,"qn":65,"question":"Which of the following is MOST important for an IS auditor to consider when collecting data for analysis by AI tools?","options":{"A":"Data classification categories","B":"Location of and access restrictions to the data","C":"Data format and syntax requirements","D":"Model weights used for AI training"},"url":"https://www.examtopics.com/discussions/isaca/view/385120-exam-aaia-topic-3-question-65-discussion/","community":{"C":2,"B":1},"answer":"B","confidence":"medium","explanation":"Manual secara khusus menyatakan bahwa saat menggunakan data untuk AI, auditor harus memperhatikan data yang digunakan, di mana data tersebut berada, dan batasan atau restriksi aksesnya, dengan contoh misconfiguration yang membuat Copilot dapat mengindeks share yang dibatasi. Lokasi dan restriksi akses menentukan apakah auditor berhak memakai data tersebut dan apakah data sensitif terekspos ke tool AI. Format dan sintaks adalah isu teknis yang dapat diatasi melalui ETL. Jawaban ini berbeda dari mayoritas community (C) karena manual mendukung B secara langsung.","distractors":{"A":"Kategori klasifikasi penting, tetapi tanpa mengetahui lokasi dan pembatasan akses, auditor tidak dapat mengendalikan paparan data.","C":"Format dan sintaks dapat ditangani dengan transformasi (ETL); bukan risiko utama.","D":"Model weights tidak relevan dengan pengumpulan data untuk analisis audit."},"manualRef":{"chapter":3,"section":"3.10.3","title":"Unstructured Data Collection","bookPage":154,"pdfPage":160},"links":[{"label":"NIST Privacy Framework","url":"https://www.nist.gov/privacy-framework"}]},{"id":28,"topic":3,"qn":49,"question":"An IS auditor has received all journal entries posted for the fiscal year. Which of the following is the BEST way to use AI to detect anomalies in the population?","options":{"A":"Implement ad hoc monitoring of transactions.","B":"Apply predictive analysis to transactions.","C":"Define risk score criteria for transactions.","D":"Reconcile transactions to invoices processed."},"url":"https://www.examtopics.com/discussions/isaca/view/366547-exam-aaia-topic-3-question-49-discussion/","community":{"C":2,"B":6},"answer":"B","confidence":"low","explanation":"Dengan seluruh populasi jurnal tersedia, cara terbaik memanfaatkan AI adalah menerapkan analitik prediktif/ML yang mempelajari pola normal dari data dan menandai entri yang menyimpang. Manual menyebut AI dalam data analytics dapat mengenali pola dan anomali serta memprediksi area berisiko tinggi berdasarkan data historis, dan teknik anomaly detection memakai ML untuk membangun baseline perilaku. Menetapkan kriteria risk score (C) adalah pendekatan berbasis aturan yang ditentukan manusia dan dapat melewatkan anomali yang tidak terduga. Opsi lain bukan penggunaan AI atas populasi penuh.","distractors":{"A":"Monitoring ad hoc tidak sistematis dan tidak memanfaatkan AI atas seluruh populasi.","C":"Kriteria risk score berbasis aturan hanya menangkap pola yang sudah diketahui, bukan anomali baru.","D":"Rekonsiliasi ke invoice adalah prosedur audit tradisional, bukan pemanfaatan AI untuk deteksi anomali."},"manualRef":{"chapter":3,"section":"3.3.4","title":"Audit-specific AI Applications","bookPage":139,"pdfPage":145},"links":[{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":29,"topic":2,"qn":111,"question":"An IS auditor identified that an AI model based on historical data caused data lag, leading to poor real-time decision making. Which of the following is the BEST mitigation strategy?","options":{"A":"Expand the volume of available test data.","B":"Verify that the data source is credible.","C":"Perform feature weight updating.","D":"Validate the diversity of data."},"url":"https://www.examtopics.com/discussions/isaca/view/404684-exam-aaia-topic-2-question-111-discussion/","community":{"C":2},"answer":"C","confidence":"high","explanation":"Data lag terjadi ketika ada kesenjangan antara data yang dipakai untuk training dan data baru saat model digunakan, sehingga keputusan real-time menjadi kurang relevan. Manual menyebut mitigasinya adalah mengumpulkan data terbaru dan melatih ulang versi model baru dengan feature weights yang diperbarui (atau RAG untuk LLM). Feature weight updating langsung menyelaraskan model dengan kondisi terkini. Opsi lain tidak mengatasi masalah kebaruan data.","distractors":{"A":"Menambah test data tidak membuat model mempelajari kondisi terbaru.","B":"Kredibilitas sumber penting, tetapi data yang kredibel tetap bisa usang.","D":"Keragaman data mengatasi bias/representativeness, bukan keterlambatan data."},"manualRef":{"chapter":2,"section":"2.1.3","title":"Data Lag","bookPage":84,"pdfPage":90},"links":[{"label":"Wikipedia: Concept drift","url":"https://en.wikipedia.org/wiki/Concept_drift"}]},{"id":30,"topic":2,"qn":19,"question":"During an audit of an AI solution, the modeler informs the IS auditor that data augmentation techniques were utilized. Which of the following BEST enables the auditor to determine the effectiveness of the data augmentation?","options":{"A":"Balance of data classes prior to and after augmentation","B":"Performance metrics of the model prior to and after augmentation","C":"Affinity and diversity of augmented data compared to original data","D":"Feature importance summary of the model prior to and after augmentation"},"url":"https://www.examtopics.com/discussions/isaca/view/366573-exam-aaia-topic-2-question-19-discussion/","community":{"C":2,"B":2},"answer":"B","confidence":"low","explanation":"Tujuan data augmentation adalah meningkatkan kinerja dan generalisasi model, sehingga efektivitasnya paling langsung dibuktikan dengan membandingkan metrik performa model (accuracy, precision, recall, F1) sebelum dan sesudah augmentation pada test set yang sama. Manual menekankan evaluasi model menggunakan berbagai metrik setelah training. Affinity dan diversity (C) adalah indikator kualitas data hasil augmentasi yang berguna, tetapi tidak membuktikan bahwa model menjadi lebih baik. Community terbagi rata (B dan C), sehingga keyakinan rendah.","distractors":{"A":"Keseimbangan kelas hanya relevan jika augmentasi bertujuan menyeimbangkan data, dan tidak membuktikan peningkatan performa.","C":"Affinity dan diversity mengukur karakteristik data augmentasi, bukan hasil akhirnya terhadap kinerja model.","D":"Perubahan feature importance menunjukkan perilaku model berubah, tetapi tidak menunjukkan apakah perubahan itu lebih baik."},"manualRef":{"chapter":2,"section":"2.8.4","title":"Evaluation","bookPage":95,"pdfPage":101},"links":[{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":31,"topic":1,"qn":178,"question":"An IS auditor is reviewing the company’s AI procedure. Which of the following would be the MOST critical gap?","options":{"A":"Privacy principles are not defined in the Al procedure.","B":"Procedures for human oversight of automated decisions are not described.","C":"The use of external data sources is not specified.","D":"Mandatory assessments required for critical systems are not specified."},"url":"https://www.examtopics.com/discussions/isaca/view/404665-exam-aaia-topic-1-question-178-discussion/","community":{"D":2},"answer":"D","confidence":"medium","explanation":"Pendekatan berbasis risiko menuntut sistem AI dikategorikan dan sistem berisiko tinggi/kritis menjalani assessment wajib, seperti risk and impact assessment, FRIA untuk high-risk AI di EU AI Act, dan DPIA. Manual menegaskan bahwa AIS harus dikategorikan sehingga sistem berisiko tinggi dikelola dan dinilai sesuai persyaratan. Jika prosedur tidak mewajibkan assessment untuk sistem kritis, kontrol utama pada area dengan dampak terbesar hilang. Gap lain penting, tetapi dampaknya lebih terbatas.","distractors":{"A":"Prinsip privasi biasanya ditetapkan di tingkat kebijakan; ketiadaannya di prosedur kurang kritis.","B":"Human oversight penting, tetapi kebutuhan dan tingkatnya biasanya ditentukan oleh hasil assessment untuk sistem kritis.","C":"Penggunaan data eksternal perlu diatur, tetapi dampaknya lebih sempit dibanding tidak adanya assessment untuk sistem kritis."},"manualRef":{"chapter":3,"section":"3.2","title":"Types of AI Controls","bookPage":135,"pdfPage":141},"links":[{"label":"EU AI Act (EUR-Lex)","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"id":32,"topic":1,"qn":170,"question":"An IS auditor is reviewing AI-driven processes that automate financial approvals. Which of the following poses the GREATEST challenge to maintaining separation of duties?","options":{"A":"Narrowly targeted AI awareness training","B":"Lack of transparency in AI algorithms","C":"Inadequate documentation for AI tools","D":"Use of AI to automate routine manual tasks"},"url":"https://www.examtopics.com/discussions/isaca/view/404657-exam-aaia-topic-1-question-170-discussion/","community":{"B":2},"answer":"B","confidence":"low","explanation":"Separation of duties bergantung pada kemampuan untuk mengetahui siapa atau apa yang melakukan fungsi inisiasi, persetujuan, dan pencatatan. Jika algoritma AI tidak transparan, auditor dan manajemen tidak dapat memverifikasi bagaimana keputusan persetujuan dibuat atau apakah fungsi yang seharusnya terpisah telah tergabung dalam satu proses otomatis. Manual menekankan bahwa AI yang diperlakukan sebagai black box meningkatkan risiko output tidak dapat dipercaya dan konsekuensi yang tidak diinginkan. Opsi lain merupakan kelemahan pendukung, bukan tantangan utama SoD.","distractors":{"A":"Pelatihan yang terlalu sempit berdampak pada kesadaran pengguna, tidak langsung pada pemisahan tugas.","C":"Dokumentasi yang kurang mempersulit audit, tetapi dapat dilengkapi; tidak setara dengan logika keputusan yang tidak dapat dilihat.","D":"Otomatisasi tugas rutin itu sendiri bukan masalah selama kontrol dan transparansinya memadai."},"manualRef":{"chapter":1,"section":"1.17.3","title":"Transparency and Explainability","bookPage":72,"pdfPage":78},"links":[{"label":"Wikipedia: Explainable artificial intelligence","url":"https://en.wikipedia.org/wiki/Explainable_artificial_intelligence"}]},{"id":33,"topic":1,"qn":161,"question":"Which of the following evaluation criteria is the HIGHEST priority when auditing an organization's management of AI vendors?","options":{"A":"Model interpretability for explainable AI decisions and audit trails","B":"Supplier contracts generated via natural language processing (NLP)","C":"Service level objective used to measure AI vendor performance","D":"Hardware requirements for efficient AI model interference"},"url":"https://www.examtopics.com/discussions/isaca/view/404648-exam-aaia-topic-1-question-161-discussion/","community":{"A":2},"answer":"A","confidence":"low","explanation":"Organisasi dapat melakukan outsourcing fungsi AI, tetapi tetap bertanggung jawab atas keputusan yang dihasilkan. Manual menyebut bahwa penilaian vendor AI harus mempertimbangkan kepatuhan pada transparansi dan explainability, selain keselarasan strategi dan keamanan data. Interpretability dan audit trail memungkinkan organisasi menjelaskan, menantang, dan mengaudit keputusan AI vendor, yang merupakan kebutuhan regulasi dan akuntabilitas. SLO/SLA (C) juga diperlukan untuk pengawasan berkelanjutan, tetapi mengukur kinerja layanan, bukan risiko spesifik AI.","distractors":{"B":"Kontrak yang dibuat dengan NLP adalah detail cara pembuatan dokumen, bukan kriteria evaluasi vendor.","C":"Service level objective penting untuk kinerja, tetapi tidak mengatasi risiko akuntabilitas dan explainability keputusan AI.","D":"Kebutuhan hardware untuk inference adalah isu teknis/operasional, bukan prioritas audit manajemen vendor."},"manualRef":{"chapter":1,"section":"1.5.5","title":"Vendors","bookPage":40,"pdfPage":46},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":34,"topic":1,"qn":156,"question":"Which of the following BEST helps an organization manage bias in AI model decisions?","options":{"A":"Data anonymization and classification","B":"Standardization of fairness criteria","C":"Human oversight and feedback mechanisms","D":"Periodic model retraining"},"url":"https://www.examtopics.com/discussions/isaca/view/404643-exam-aaia-topic-1-question-156-discussion/","community":{"C":2},"answer":"C","confidence":"medium","explanation":"Bias dalam keputusan AI bersifat dinamis dan dapat muncul dari data, algoritma, maupun cara manusia menggunakan output. Human oversight dan feedback mechanism memungkinkan bias terdeteksi pada keputusan nyata, dikoreksi, dan diumpanbalikkan ke perbaikan model secara berkelanjutan. Manual menekankan pentingnya keterlibatan manusia dan oversight agar isu etika dan bias dapat diidentifikasi dan diperbaiki. Opsi lain merupakan langkah parsial yang tidak mengelola bias secara menyeluruh.","distractors":{"A":"Anonymization dan klasifikasi melindungi privasi, tetapi bias dapat tetap muncul melalui proxy variable.","B":"Standarisasi kriteria fairness berguna sebagai acuan, tetapi tanpa mekanisme pengawasan dan umpan balik, kriteria tersebut tidak menjamin bias terkelola.","D":"Retraining berkala tanpa koreksi bias dapat mereproduksi bias yang sama."},"manualRef":{"chapter":1,"section":"1.17.2","title":"Bias and Fairness","bookPage":72,"pdfPage":78},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":35,"topic":1,"qn":45,"question":"An IS auditor is participating in a task force to select an AI solution vendor. The vendor states that their product is only functional with web integration activated. Which of the following is the GREATEST concern?","options":{"A":"AI training model environment","B":"Inappropriate algorithms used by the vendor","C":"Data hallucinations and biases","D":"Impacts on employee and contractor workforces"},"url":"https://www.examtopics.com/discussions/isaca/view/316031-exam-aaia-topic-1-question-45-discussion/","community":{"C":4,"A":1},"answer":"C","confidence":"low","explanation":"Jika produk hanya berfungsi dengan web integration aktif, output-nya bergantung pada konten internet yang tidak terverifikasi dan tidak dikendalikan organisasi. Ini meningkatkan risiko hallucination dan bias secara berkelanjutan, karena manual menyebut data input yang ambigu, bias, atau tidak grounded sebagai penyebab utama hallucination. Risiko ini bersifat permanen selama tool dipakai, berbeda dengan isu lingkungan training yang lebih bersifat satu kali. Opsi lain tidak terkait langsung dengan ketergantungan pada web.","distractors":{"A":"Lingkungan training model adalah tanggung jawab vendor dan tidak langsung dipicu oleh kebutuhan web integration.","B":"Kesesuaian algoritma adalah isu umum pemilihan vendor, bukan risiko spesifik dari web integration.","D":"Dampak tenaga kerja relevan untuk adopsi AI secara umum, bukan terkait web integration."},"manualRef":{"chapter":2,"section":"2.11.4","title":"Hallucination","bookPage":104,"pdfPage":110},"links":[{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"}]},{"id":36,"topic":1,"qn":39,"question":"Which of the following will provide the BEST evidence to support the alignment of an AI model with an organization’s business objectives?","options":{"A":"AI change management requests","B":"AI model vulnerability assessment","C":"AI acceptable use policy","D":"AI model inventory"},"url":"https://www.examtopics.com/discussions/isaca/view/315512-exam-aaia-topic-1-question-39-discussion/","community":{"D":3,"A":4,"C":2},"answer":"D","confidence":"low","explanation":"AI model inventory adalah repositori governance yang mencatat setiap sistem AI beserta tujuan (purpose), pemilik akuntabel, stakeholder, dan cara deployment, sehingga auditor dapat menelusuri setiap model ke tujuan bisnis yang dilayaninya. Manual merekomendasikan field standar inventory, termasuk purpose dan accountable owner. Change request (A) hanya membuktikan justifikasi atas perubahan tertentu, bukan keselarasan model secara keseluruhan; AUP adalah aturan penggunaan, bukan bukti per model. Jawaban ini berbeda dari pluralitas community (A).","distractors":{"A":"Change request mendokumentasikan alasan perubahan spesifik, bukan bukti keselarasan model secara utuh dengan tujuan bisnis.","B":"Vulnerability assessment membuktikan postur keamanan, bukan keselarasan bisnis.","C":"AUP mengatur penggunaan yang diizinkan dan dilarang, tidak membuktikan bahwa model tertentu mendukung tujuan bisnis."},"manualRef":{"chapter":3,"section":"3.1.2","title":"Inventory and Data Gathering Methods","bookPage":130,"pdfPage":136},"links":[{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]},{"id":37,"topic":1,"qn":27,"question":"An organization is adopting AI for its procurement and inventory teams, raising concern from stakeholders that they will lose their jobs due to AI. Which of the following is the BEST way for the IS auditor to assess whether the potential negative impacts were minimized?","options":{"A":"Review human-centered design practices to determine how they were considered.","B":"Review how the project management team collected feedback in engagement activities.","C":"Review the current state assessment of how AI may impact the organization.","D":"Review the AI roadmap for short-term and long-term milestones."},"url":"https://www.examtopics.com/discussions/isaca/view/315511-exam-aaia-topic-1-question-27-discussion/","community":{"A":3,"C":1},"answer":"A","confidence":"medium","explanation":"Untuk menilai apakah dampak negatif terhadap pekerja sudah diminimalkan, auditor perlu memeriksa apakah kebutuhan manusia dipertimbangkan dalam desain solusi. Human-centered design memastikan AI dirancang untuk mendukung dan meng-augment pekerjaan manusia, sejalan dengan pembahasan manual tentang job redesign, jalur transisi pekerjaan, dan komunikasi efektif antara pemberi kerja dan karyawan. Review praktik ini memberi bukti bahwa mitigasi sudah tertanam, bukan sekadar diidentifikasi. Opsi lain hanya mengumpulkan masukan atau memetakan dampak tanpa menunjukkan mitigasi.","distractors":{"B":"Pengumpulan feedback menunjukkan keterlibatan stakeholder, tetapi tidak membuktikan bahwa dampak negatif ditangani.","C":"Current state assessment mengidentifikasi potensi dampak, bukan apakah dampak itu sudah diminimalkan.","D":"Roadmap menunjukkan milestone, bukan pertimbangan terhadap dampak pada pekerja."},"manualRef":{"chapter":1,"section":"1.9.1","title":"Talent Management","bookPage":48,"pdfPage":54},"links":[{"label":"OECD AI Principles","url":"https://oecd.ai/en/ai-principles"}]},{"id":38,"topic":3,"qn":72,"question":"Which of the following is the BEST use of AI to audit relationships for conflicts of interest or collusion?","options":{"A":"Correlation matrix","B":"Time series analysis","C":"Graph analytics","D":"Monte Carlo simulation"},"url":"https://www.examtopics.com/discussions/isaca/view/385154-exam-aaia-topic-3-question-72-discussion/","community":{"C":2},"answer":"C","confidence":"medium","explanation":"Konflik kepentingan dan kolusi adalah masalah hubungan antar entitas (karyawan, vendor, alamat, rekening bank, nomor telepon). Graph analytics memodelkan entitas sebagai node dan hubungan sebagai edge, sehingga dapat mengungkap koneksi tersembunyi dan jaringan yang mencurigakan. Manual menyebut aplikasi AI khusus audit seperti pattern recognition untuk mendeteksi aktivitas fraud. Teknik lain menganalisis angka atau waktu, bukan hubungan.","distractors":{"A":"Correlation matrix mengukur hubungan statistik antar variabel, bukan hubungan antar entitas/orang.","B":"Time series analysis menganalisis tren terhadap waktu, bukan jaringan hubungan.","D":"Monte Carlo simulation memodelkan ketidakpastian dan probabilitas hasil, bukan mendeteksi koneksi."},"manualRef":{"chapter":3,"section":"3.3.4","title":"Audit-specific AI Applications","bookPage":139,"pdfPage":145},"links":[{"label":"Wikipedia: Social network analysis","url":"https://en.wikipedia.org/wiki/Social_network_analysis"}]},{"id":39,"topic":3,"qn":71,"question":"Which of the following is MOST effective in analyzing unlabeled data sets to identify anomalies?","options":{"A":"Isolation forest","B":"Principal component analysis","C":"Z-score analysis","D":"Supervised learning"},"url":"https://www.examtopics.com/discussions/isaca/view/385146-exam-aaia-topic-3-question-71-discussion/","community":{"A":2},"answer":"A","confidence":"high","explanation":"Isolation forest adalah algoritma unsupervised yang dirancang khusus untuk deteksi anomali pada data tidak berlabel, dengan prinsip bahwa anomali lebih mudah diisolasi melalui partisi acak. Manual menjelaskan bahwa unsupervised learning dapat mengidentifikasi anomali tanpa label. PCA adalah teknik dimensionality reduction, Z-score hanya efektif untuk distribusi univariat sederhana, dan supervised learning memerlukan label.","distractors":{"B":"PCA terutama untuk dimensionality reduction; dapat membantu, tetapi bukan metode deteksi anomali yang paling efektif.","C":"Z-score bergantung pada asumsi distribusi normal dan bersifat univariat, kurang efektif untuk data kompleks.","D":"Supervised learning membutuhkan data berlabel, sedangkan dataset tidak berlabel."},"manualRef":{"chapter":1,"section":"1.2.1","title":"Basic Models (Unsupervised Learning)","bookPage":26,"pdfPage":32},"links":[{"label":"Wikipedia: Isolation forest","url":"https://en.wikipedia.org/wiki/Isolation_forest"}]},{"id":40,"topic":3,"qn":5,"question":"When an IS auditor is reviewing results from an AI system, which of the following would cause the GREATEST risk?","options":{"A":"Inability to identify where an AI system is housed.","B":"Difficulty of documenting AI algorithm processes.","C":"System output not being checked for inconsistencies.","D":"Cascading failures of AI system outputs."},"url":"https://www.examtopics.com/discussions/isaca/view/318822-exam-aaia-topic-3-question-5-discussion/","community":{"D":2},"answer":"D","confidence":"low","explanation":"Cascading failure terjadi ketika output yang salah dari satu sistem AI menjadi input bagi proses atau sistem lain, sehingga kesalahan berlipat dan menyebar secara sistemik. Manual menjelaskan bahwa komponen AI dapat memiliki dampak kumulatif dan downstream, sehingga pipeline perlu diuji secara terintegrasi. Dampak sistemik ini menjadikannya risiko terbesar dibandingkan opsi lain yang lebih bersifat kelemahan dokumentasi atau kontrol. Tidak adanya pengecekan output (C) adalah kelemahan kontrol yang justru memungkinkan cascading failure terjadi.","distractors":{"A":"Tidak mengetahui lokasi sistem AI adalah masalah inventory/governance, bukan risiko langsung pada hasil.","B":"Kesulitan mendokumentasikan algoritma mengurangi explainability, tetapi tidak secara langsung menimbulkan kerugian.","C":"Kurangnya pengecekan inkonsistensi adalah kelemahan kontrol; dampak terbesarnya justru ketika kesalahan menyebar (cascading)."},"manualRef":{"chapter":2,"section":"2.12.2","title":"Unit and Integration Testing","bookPage":107,"pdfPage":113},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":41,"topic":2,"qn":130,"question":"An IS auditor is reviewing a dataset with fields related to a restaurant’s food delivery process. Which of the following data preparation techniques should be used to ensure that no single feature dominates and all fields are weighted appropriately in the AI model's correlations?","options":{"A":"Scaling the Distance From Restaurant field","B":"Inserting average values where Distance data is missing","C":"Converting Postal Code values from text format to integers","D":"Removing duplicate entries for Customer Address field"},"url":"https://www.examtopics.com/discussions/isaca/view/404703-exam-aaia-topic-2-question-130-discussion/","community":{"A":2},"answer":"A","confidence":"high","explanation":"Agar tidak ada satu fitur yang mendominasi karena rentang nilainya besar, fitur numerik perlu di-scale ke rentang yang sebanding. Glossary manual mendefinisikan scaling sebagai praktik feature engineering untuk menyesuaikan rentang nilai fitur dengan fitur lain, dan preprocessing mencakup normalisasi data. Scaling field Distance memastikan bobot fitur di model lebih proporsional. Opsi lain adalah langkah kualitas data, bukan penyeimbangan pengaruh fitur.","distractors":{"B":"Imputasi nilai hilang memperbaiki kelengkapan, bukan dominasi fitur.","C":"Mengubah kode pos menjadi integer justru menyiratkan urutan dan besaran palsu sehingga dapat menimbulkan dominasi baru.","D":"Menghapus duplikat memperbaiki uniqueness, bukan skala fitur."},"manualRef":{"chapter":2,"section":"2.8.3","title":"Development (Data Preprocessing)","bookPage":94,"pdfPage":100},"links":[{"label":"scikit-learn preprocessing guide","url":"https://scikit-learn.org/stable/modules/preprocessing.html"}]},{"id":42,"topic":3,"qn":40,"question":"Which of the following would BEST provide an IS auditor with information on predictions made by a specific neural network model and provide visibility into risk associated with using that model?","options":{"A":"Code details of the activation layers","B":"Venn diagrams and box charts","C":"Confusion matrix","D":"Correlation matrix"},"url":"https://www.examtopics.com/discussions/isaca/view/366568-exam-aaia-topic-3-question-40-discussion/","community":{"C":2},"answer":"C","confidence":"high","explanation":"Confusion matrix menunjukkan prediksi model dibanding hasil aktual (true/false positive dan negative), sehingga auditor dapat melihat jenis kesalahan yang dibuat model dan risiko penggunaannya, misalnya tingkat false negative yang tinggi. Manual menyebut F1 score, recall, dan confusion matrix sebagai alat yang perlu ditinjau auditor saat menguji performa model klasifikasi. Opsi lain tidak memberikan informasi tentang hasil prediksi.","distractors":{"A":"Kode activation layer menjelaskan arsitektur, bukan kualitas prediksi atau risikonya.","B":"Venn diagram dan box chart adalah visualisasi umum yang tidak mengukur performa prediksi.","D":"Correlation matrix menunjukkan hubungan antar variabel input, bukan performa prediksi model."},"manualRef":{"chapter":3,"section":"3.6.1","title":"AI Systems Overall Testing","bookPage":146,"pdfPage":152},"links":[{"label":"Wikipedia: Confusion matrix","url":"https://en.wikipedia.org/wiki/Confusion_matrix"}]},{"id":43,"topic":2,"qn":102,"question":"Which of the following techniques BEST enhances the security and robustness of AI models against adversarial attacks?","options":{"A":"Defensive distillation","B":"AI security awareness training","C":"User access reviews","D":"Input token limitation"},"url":"https://www.examtopics.com/discussions/isaca/view/404675-exam-aaia-topic-2-question-102-discussion/","community":{"A":2},"answer":"A","confidence":"high","explanation":"Defensive distillation adalah teknik khusus AI: model kedua (distilled model) dilatih dari output probabilistik model 'teacher', sehingga decision boundary menjadi lebih halus dan model lebih tahan terhadap input adversarial. Manual AAIA mencantumkannya sebagai salah satu kontrol untuk AI-related threats, dan juga menyebutnya efektif (bersama regularization) untuk eradikasi serangan adversarial inference. Opsi lain adalah kontrol umum (awareness, access review) atau kontrol sempit yang tidak secara langsung meningkatkan robustness model terhadap perturbasi input.","distractors":{"B":"Awareness training memperbaiki perilaku pengguna, tetapi tidak membuat model itu sendiri lebih robust terhadap input adversarial.","C":"User access review adalah kontrol akses konvensional; tidak mencegah penyerang yang memakai antarmuka sah untuk mengirim input adversarial.","D":"Pembatasan token input membantu mencegah resource exhaustion/DoS atau sebagian penyalahgunaan prompt, bukan memperkuat ketahanan model terhadap adversarial examples."},"manualRef":{"chapter":2,"section":"2.15.4","title":"Defensive Distillation","bookPage":115,"pdfPage":121},"links":[{"label":"MITRE ATLAS","url":"https://atlas.mitre.org/"},{"label":"Wikipedia: Adversarial machine learning","url":"https://en.wikipedia.org/wiki/Adversarial_machine_learning"}]},{"id":44,"topic":2,"qn":129,"question":"Which of the following techniques is BEST to use when there is a limited dataset of detailed images available to train a convolutional neural network (CNN) model?","options":{"A":"Duplication of current dataset","B":"Splitting the dataset 50/50 between training and testing sets","C":"Transfer learning from an open-source model","D":"Minority class undersampling augmentation"},"url":"https://www.examtopics.com/discussions/isaca/view/404702-exam-aaia-topic-2-question-129-discussion/","community":{"C":2},"answer":"C","confidence":"medium","explanation":"Transfer learning memanfaatkan CNN yang sudah dilatih pada dataset gambar berukuran besar (misalnya model open-source pretrained), lalu di-fine-tune dengan dataset kecil milik organisasi, sehingga fitur dasar (edge, texture, shape) tidak perlu dipelajari dari nol. Ini adalah strategi paling efektif untuk mengatasi data scarcity pada computer vision. Manual menyatakan bahwa ukuran dan variasi data yang tersedia harus memandu pemilihan model agar terhindar dari overfitting, dan transfer learning sejalan dengan prinsip tersebut. Dari sisi audit, lisensi dan risiko supply chain model open-source tetap perlu dievaluasi.","distractors":{"A":"Duplikasi data tidak menambah informasi baru dan justru meningkatkan risiko overfitting karena model menghafal sampel yang sama.","B":"Split 50/50 mengurangi data training secara drastis sehingga memperparah keterbatasan data; porsi training yang lazim adalah 60-80%.","D":"Undersampling membuang data dan ditujukan untuk class imbalance, bukan untuk jumlah data yang terbatas secara keseluruhan."},"manualRef":{"chapter":2,"section":"2.6","title":"Data Scarcity","bookPage":87,"pdfPage":93},"links":[{"label":"Wikipedia: Transfer learning","url":"https://en.wikipedia.org/wiki/Transfer_learning"},{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":45,"topic":2,"qn":114,"question":"Which of the following is the GREATEST risk associated with normalizing a data set before splitting it into training, testing, and validation sets?","options":{"A":"The model affects data distribution.","B":"The developer uses tree-based models with the normalized data set.","C":"The model requires external validation.","D":"The model gains indirect knowledge from data leakage."},"url":"https://www.examtopics.com/discussions/isaca/view/404687-exam-aaia-topic-2-question-114-discussion/","community":{"D":2},"answer":"D","confidence":"high","explanation":"Jika normalisasi (misalnya min-max atau z-score) dihitung pada seluruh dataset sebelum split, statistik seperti mean, standar deviasi, atau min/max ikut memuat informasi dari data validation dan test. Akibatnya model secara tidak langsung 'melihat' data uji (data leakage), sehingga hasil evaluasi terlalu optimistis dan tidak mencerminkan performa pada data baru. Manual menekankan bahwa pembagian training/validation/testing dilakukan untuk menjaga integritas fase training dan evaluasi. Praktik yang benar adalah fit preprocessing hanya pada training set, lalu menerapkan parameter tersebut ke set lainnya.","distractors":{"A":"Normalisasi memang mengubah skala data, tetapi itu tujuannya, bukan risiko utama; pernyataan bahwa model memengaruhi distribusi data juga tidak tepat.","B":"Model tree-based relatif tidak sensitif terhadap skala fitur, sehingga memakai data ternormalisasi tidak menimbulkan risiko berarti.","C":"Kebutuhan validasi eksternal bukan konsekuensi dari urutan normalisasi dan split."},"manualRef":{"chapter":2,"section":"2.8.3","title":"Development","bookPage":94,"pdfPage":100},"links":[{"label":"scikit-learn: Preprocessing data","url":"https://scikit-learn.org/stable/modules/preprocessing.html"},{"label":"scikit-learn: Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html"}]},{"id":46,"topic":2,"qn":115,"question":"Which of the following techniques is MOST appropriate for model hyperparameter tuning?","options":{"A":"Bayesian optimization","B":"Log-rank test","C":"F1 score analysis","D":"Analysis of variance"},"url":"https://www.examtopics.com/discussions/isaca/view/404688-exam-aaia-topic-2-question-115-discussion/","community":{"A":2},"answer":"A","confidence":"medium","explanation":"Bayesian optimization adalah metode pencarian hyperparameter yang membangun model probabilistik (surrogate) atas hubungan antara kombinasi hyperparameter dan performa, lalu memilih kombinasi berikutnya secara terarah sehingga lebih efisien daripada grid/random search. Manual menjelaskan bahwa hyperparameter (misalnya learning rate atau kedalaman decision tree) diatur sebelum training dan dituning menggunakan validation dataset; Bayesian optimization adalah teknik yang memang dirancang untuk proses tuning tersebut. Opsi lain adalah uji statistik atau metrik evaluasi, bukan teknik tuning.","distractors":{"B":"Log-rank test adalah uji statistik untuk membandingkan kurva survival (survival analysis), bukan teknik tuning.","C":"F1 score adalah metrik evaluasi yang bisa dijadikan objective saat tuning, tetapi bukan metode untuk mencari hyperparameter.","D":"ANOVA menguji perbedaan rata-rata antarkelompok; tidak dirancang untuk optimasi hyperparameter."},"manualRef":{"chapter":1,"section":"1.3","title":"Algorithms","bookPage":29,"pdfPage":35},"links":[{"label":"Wikipedia: Hyperparameter optimization","url":"https://en.wikipedia.org/wiki/Hyperparameter_optimization"},{"label":"Wikipedia: Bayesian optimization","url":"https://en.wikipedia.org/wiki/Bayesian_optimization"}]},{"id":47,"topic":2,"qn":116,"question":"Which of the following components would MOST effectively address cumulative benefits as part of reinforcement learning (RL)?","options":{"A":"Agent function","B":"Reward function","C":"Value function","D":"Policy function"},"url":"https://www.examtopics.com/discussions/isaca/view/404689-exam-aaia-topic-2-question-116-discussion/","community":{"C":2},"answer":"C","confidence":"medium","explanation":"Dalam reinforcement learning, agent bertujuan memaksimalkan expected cumulative reward, bukan sekadar reward sesaat. Value function memperkirakan total reward jangka panjang (biasanya terdiskonto) yang dapat diperoleh dari suatu state atau pasangan state-action, sehingga komponen inilah yang secara langsung merepresentasikan manfaat kumulatif. Reward function hanya memberi sinyal langsung per langkah, sedangkan policy menentukan aksi yang diambil (sering diturunkan dari value function, misalnya pada Q-learning). Manual menegaskan bahwa RL melatih agent dengan memaksimalkan cumulative reward.","distractors":{"A":"Agent adalah entitas yang bertindak dalam environment, bukan komponen yang mengukur manfaat kumulatif.","B":"Reward function memberi reward/penalti langsung untuk setiap aksi; akumulasi jangka panjangnya diestimasi oleh value function.","D":"Policy function memetakan state ke aksi; ia dapat memakai estimasi nilai, tetapi tidak sendiri mengukur manfaat kumulatif."},"manualRef":{"chapter":1,"section":"1.2.1","title":"Basic Models","bookPage":27,"pdfPage":33},"links":[{"label":"Wikipedia: Reinforcement learning","url":"https://en.wikipedia.org/wiki/Reinforcement_learning"}]},{"id":48,"topic":2,"qn":106,"question":"The accuracy of an AI model used for product recommendations, trained on data from a specific year, is declining two years later as customer buying patterns have shifted toward sustainable products. Which of the following is the MOST likely cause?","options":{"A":"Data labelling","B":"Schema drift","C":"Covariate shift","D":"Data drift"},"url":"https://www.examtopics.com/discussions/isaca/view/404679-exam-aaia-topic-2-question-106-discussion/","community":{"C":2},"answer":"D","confidence":"low","explanation":"Skenario menggambarkan akurasi model yang menurun karena karakteristik data dunia nyata berubah (preferensi pelanggan bergeser ke produk sustainable) dibandingkan data training dari tahun tertentu. Manual AAIA menyebut fenomena ini sebagai data drift, yaitu penurunan performa akibat perubahan karakteristik data input baru seperti musim atau pergeseran preferensi, dan menekankan monitoring drift serta retraining dengan data yang representatif. Covariate shift secara teknis adalah subtipe data drift (hanya distribusi fitur input yang berubah), sedangkan perubahan pola beli juga bisa berupa concept drift; karena itu istilah yang paling konsisten dengan manual adalah data drift. Catatan: mayoritas komunitas memilih C (covariate shift); jawaban ini berbeda karena mengikuti terminologi manual, sehingga confidence rendah.","distractors":{"A":"Masalah labeling memengaruhi kualitas training sejak awal, bukan penurunan bertahap dua tahun kemudian akibat perubahan perilaku pelanggan.","B":"Schema drift adalah perubahan struktur/format data (kolom, tipe data), bukan perubahan pola perilaku pelanggan.","C":"Covariate shift adalah bentuk spesifik data drift (perubahan distribusi input); bisa relevan, tetapi manual memakai istilah data drift untuk pergeseran preferensi, dan perubahan pola beli tidak hanya menyangkut distribusi input."},"manualRef":{"chapter":2,"section":"2.8.6","title":"Monitoring and Maintenance","bookPage":96,"pdfPage":102},"links":[{"label":"Wikipedia: Concept drift","url":"https://en.wikipedia.org/wiki/Concept_drift"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":49,"topic":2,"qn":107,"question":"Which of the following techniques BEST supports machine learning (ML) training in sentiment analysis?","options":{"A":"Image recognition","B":"Log-rank test","C":"Logistic regression","D":"Analysis of variance"},"url":"https://www.examtopics.com/discussions/isaca/view/404680-exam-aaia-topic-2-question-107-discussion/","community":{"C":2},"answer":"C","confidence":"high","explanation":"Sentiment analysis pada dasarnya adalah tugas klasifikasi teks (positif, negatif, atau netral). Logistic regression adalah algoritma supervised classification yang memprediksi probabilitas suatu kelas dan sangat umum dipakai sebagai model dasar untuk klasifikasi sentimen setelah teks diubah menjadi fitur numerik (misalnya TF-IDF). Manual menjelaskan bahwa logistic regression cocok untuk binary classification dan menyebut sentiment analysis sebagai salah satu tugas NLP. Opsi lain tidak relevan untuk melatih model klasifikasi teks.","distractors":{"A":"Image recognition adalah domain computer vision, bukan analisis teks.","B":"Log-rank test adalah uji statistik untuk survival analysis, bukan algoritma ML.","D":"ANOVA adalah uji statistik perbedaan rata-rata, bukan algoritma untuk klasifikasi sentimen."},"manualRef":{"chapter":1,"section":"1.3.1","title":"Classes of Algorithms","bookPage":30,"pdfPage":36},"links":[{"label":"Wikipedia: Logistic regression","url":"https://en.wikipedia.org/wiki/Logistic_regression"},{"label":"Wikipedia: Sentiment analysis","url":"https://en.wikipedia.org/wiki/Sentiment_analysis"}]},{"id":50,"topic":2,"qn":104,"question":"An IS auditor analyzed an AI model scorecard and identified that training data was imbalanced. Which of the following is the BEST recommendation to remediate risk?","options":{"A":"Use class-weighted loss with stratified train/validation splits.","B":"Optimize the decision threshold for maximum F1 on validation.","C":"Tune decision thresholds using expected misclassification costs.","D":"Increase the capacity of the model with early stopping."},"url":"https://www.examtopics.com/discussions/isaca/view/404677-exam-aaia-topic-2-question-104-discussion/","community":{"A":2},"answer":"A","confidence":"medium","explanation":"Remediasi terbaik untuk data yang tidak seimbang adalah menangani akar masalah pada tahap training dan evaluasi. Class-weighted loss (bentuk cost-sensitive learning) memberi bobot lebih besar pada kesalahan minority class, sedangkan stratified split menjaga proporsi kelas tetap konsisten di training dan validation sehingga evaluasi tidak menyesatkan. Manual menyebut oversampling, undersampling, dan cost-sensitive algorithms sebagai teknik mitigasi data imbalance, serta menekankan bahwa proses splitting harus mempertahankan distribusi data. Threshold tuning (B, C) hanya menyesuaikan keputusan setelah model terlatih dan tidak memperbaiki pembelajaran yang bias.","distractors":{"B":"Optimasi threshold untuk F1 adalah penyesuaian pasca-training; berguna, tetapi tidak menangani bias dalam proses training dan berisiko overfit ke validation set.","C":"Threshold berbasis biaya misklasifikasi juga hanya kalibrasi keputusan di output; tidak memperbaiki representasi minority class saat training.","D":"Menambah kapasitas model dengan early stopping berkaitan dengan under/overfitting, bukan class imbalance; model yang lebih besar tetap cenderung bias ke majority class."},"manualRef":{"chapter":2,"section":"2.5","title":"Data Balancing","bookPage":87,"pdfPage":93},"links":[{"label":"scikit-learn: Cross-validation (stratified k-fold)","url":"https://scikit-learn.org/stable/modules/cross_validation.html"},{"label":"Wikipedia: Precision and recall","url":"https://en.wikipedia.org/wiki/Precision_and_recall"}]},{"id":51,"topic":1,"qn":18,"question":"Which of the following is an IS auditor's MOST important course of action when determining whether source data should be entered into approved generative AI tools to assist with an audit?","options":{"A":"Validate that the tool is leveraging the latest model.","B":"Validate that the tool provides a privacy notice.","C":"Determine whether the information is reliable.","D":"Determine whether any AI model hallucinations have occurred."},"url":"https://www.examtopics.com/discussions/isaca/view/316545-exam-aaia-topic-1-question-18-discussion/","community":{"C":1,"B":2},"answer":"C","confidence":"low","explanation":"Karena tool generative AI sudah berstatus approved, aspek keamanan dan privasi tool tersebut semestinya sudah dinilai dalam proses persetujuan dan diatur dalam AI acceptable use policy. Fokus auditor saat memutuskan data sumber apa yang akan dimasukkan adalah apakah informasi tersebut reliable: data yang tidak akurat atau tidak lengkap akan menghasilkan output yang tidak layak dijadikan dasar audit evidence (garbage in, garbage out). Manual menekankan bahwa auditor tetap harus memvalidasi akurasi data yang mendasari output AI. Catatan: mayoritas komunitas memilih B (privacy notice); jawaban ini berbeda karena privasi tool sudah tercakup oleh status approved, namun soal ini diperdebatkan sehingga confidence rendah. Dalam praktik, ketentuan klasifikasi dan sensitivitas data tetap wajib dipatuhi.","distractors":{"A":"Versi model terbaru tidak menjamin kesesuaian atau keamanan, dan bukan faktor utama dalam memutuskan data yang dimasukkan.","B":"Privacy notice relevan untuk transparansi, tetapi tool sudah disetujui organisasi; keberadaan privacy notice saja juga tidak menjamin perlindungan data.","D":"Hallucination menyangkut output dan baru dapat dievaluasi setelah data dimasukkan; tidak menjawab apakah data sumber layak digunakan."},"manualRef":{"chapter":3,"section":"3.8.3","title":"Reduce Workforce Needs","bookPage":148,"pdfPage":154},"links":[{"label":"ISACA ITAF","url":"https://www.isaca.org/resources/frameworks-standards-and-models"},{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"}]},{"id":52,"topic":1,"qn":58,"question":"A banking organization uses AI to support the credit scoring process. Which of the following is the GREATEST benefit of providing interpretations of AI model outputs?","options":{"A":"It ensures the outputs align with the organization's internal ethical standards.","B":"It helps auditors identify areas where the AI model may require retraining.","C":"It allows stakeholders to understand the reasons behind the outputs.","D":"It reduces the need for human oversight in the loan approval process."},"url":"https://www.examtopics.com/discussions/isaca/view/369820-exam-aaia-topic-1-question-58-discussion/","community":{"C":1},"answer":"C","confidence":"high","explanation":"Interpretasi output (explainability) memungkinkan nasabah, regulator, manajemen, dan auditor memahami alasan di balik skor kredit, misalnya faktor apa yang menyebabkan permohonan ditolak. Manual menegaskan bahwa solusi AI harus transparan dan explainable agar pengguna dapat memahami bagaimana keputusan dibuat dan memverifikasi validitasnya; regulasi seperti GDPR dan EU AI Act juga memberi hak atas penjelasan keputusan otomatis. Manfaat lain (penilaian etika, identifikasi kebutuhan retraining) merupakan turunan dari kemampuan memahami alasan output tersebut.","distractors":{"A":"Explainability membantu menilai kesesuaian dengan standar etika, tetapi tidak menjamin output selaras dengan standar tersebut.","B":"Membantu auditor adalah manfaat sekunder; manfaat utama berlaku bagi seluruh stakeholder.","D":"Explainability justru mendukung human oversight, bukan menguranginya; credit scoring adalah use case berisiko tinggi yang membutuhkan pengawasan manusia."},"manualRef":{"chapter":1,"section":"1.17.3","title":"Transparency and Explainability","bookPage":72,"pdfPage":78},"links":[{"label":"Wikipedia: Explainable artificial intelligence","url":"https://en.wikipedia.org/wiki/Explainable_artificial_intelligence"},{"label":"EU AI Act (EUR-Lex)","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"id":53,"topic":1,"qn":55,"question":"Which of the following processes is MOST important for an organization to have in place to ensure the credibility of AI outputs?","options":{"A":"User consent","B":"Model alignment","C":"Data governance","D":"Data analytics"},"url":"https://www.examtopics.com/discussions/isaca/view/366570-exam-aaia-topic-1-question-55-discussion/","community":{"C":2,"B":2,"D":1},"answer":"C","confidence":"medium","explanation":"Kredibilitas output AI sangat bergantung pada kualitas, integritas, dan legitimasi data yang dipakai untuk training maupun inferensi. Data governance adalah proses sistematis untuk mengelola dan meningkatkan kualitas data, memastikan informasi yang sah digunakan, serta menetapkan kepemilikan, klasifikasi, dan kontrol keamanan di sepanjang siklus hidup data, yaitu fondasi agar output dapat dipercaya. Model alignment memang penting, tetapi tanpa data yang terkelola baik, model yang aligned pun tetap bisa menghasilkan output bias atau salah. Sesuai pola pikir ISACA, proses governance didahulukan dibanding teknik spesifik. Catatan: suara komunitas terbagi antara C dan B.","distractors":{"A":"User consent adalah persyaratan legal/privasi atas penggunaan data, bukan penentu kredibilitas output.","B":"Model alignment membuat output sesuai tujuan/nilai yang diinginkan, tetapi bersifat teknis dan tetap bergantung pada data yang berkualitas.","D":"Data analytics adalah aktivitas analisis, bukan proses tata kelola yang menjamin keandalan data dan output."},"manualRef":{"chapter":1,"section":"1.15.2","title":"Data Ownership With Regard to Governance and Privacy
