dapat mengurangi pemahaman pengguna dan bukan pertimbangan utama.","D":"Implementasi bertahap dan stage gate adalah praktik manajemen proyek yang baik, tetapi efektivitasnya tetap bergantung pada dukungan pimpinan."},"manualRef":{"chapter":1,"section":"1.6.1","title":"Strategies","bookPage":44,"pdfPage":50},"links":[{"label":"COBIT","url":"https://www.isaca.org/resources/cobit"},{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]},{"id":97,"topic":1,"qn":106,"question":"Which of the following is the MOST important AI data governance method to protect privacy and data security?","options":{"A":"Using external data sources for AI training","B":"Developing AI acceptable use policies","C":"Optimizing AI model performance metrics","D":"Implementing periodic monitoring"},"url":"https://www.examtopics.com/discussions/isaca/view/383277-exam-aaia-topic-1-question-106-discussion/","community":{"B":5,"D":1},"answer":"B","confidence":"medium","explanation":"AI acceptable use policy adalah kontrol governance preventif yang menetapkan solusi AI yang disetujui serta bagaimana data organisasi boleh dan tidak boleh digunakan di dalamnya. Manual menekankan AUP harus mudah dipahami, mengidentifikasi solusi yang disetujui, memberi panduan penggunaan data organisasi, dan didukung pelatihan pengguna. Kebijakan ini menjadi fondasi; monitoring periodik bersifat detektif dan memerlukan kebijakan sebagai acuan.","distractors":{"A":"Menggunakan sumber data eksternal justru dapat menambah risiko privasi dan lisensi, bukan metode perlindungan.","C":"Optimasi metrik kinerja model berkaitan dengan akurasi, bukan perlindungan privasi dan keamanan data.","D":"Monitoring periodik adalah kontrol detektif yang berguna, tetapi membutuhkan kebijakan sebagai dasar untuk menilai pelanggaran."},"manualRef":{"chapter":1,"section":"1.8.1","title":"Usage Policies","bookPage":48,"pdfPage":54},"links":[{"label":"NIST Privacy Framework","url":"https://www.nist.gov/privacy-framework"},{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]},{"id":98,"topic":1,"qn":97,"question":"Which of the following would pose the GREATEST risk when reviewing AI acceptable use training content?","options":{"A":"The content does not cover the use of effective prompting.","B":"The content does not cover the non-deterministic nature of AI.","C":"The content does not cover AI model architectures.","D":"The content does not cover required performance metrics."},"url":"https://www.examtopics.com/discussions/isaca/view/385156-exam-aaia-topic-1-question-97-discussion/","community":{"B":1},"answer":"B","confidence":"medium","explanation":"Pengguna umum harus memahami bahwa output AI (terutama GenAI) bersifat nondeterministic dan probabilistik: hasil dapat berbeda untuk input yang sama dan bisa salah atau hallucinate. Tanpa pemahaman ini, pengguna cenderung mempercayai output secara berlebihan (overreliance) dan tidak melakukan verifikasi, yang merupakan risiko utama penggunaan AI. Manual menekankan AUP harus sederhana bagi pengguna umum dan didukung pelatihan agar penggunaan AI aman dan bertanggung jawab.","distractors":{"A":"Teknik prompting yang efektif meningkatkan produktivitas, tetapi ketiadaannya tidak menimbulkan risiko sebesar overreliance pada output.","C":"Arsitektur model terlalu teknis untuk pelatihan acceptable use bagi pengguna umum.","D":"Metrik kinerja yang dipersyaratkan relevan untuk tim pengembang/pemilik model, bukan konten inti pelatihan penggunaan."},"manualRef":{"chapter":1,"section":"1.8.1","title":"Usage Policies","bookPage":48,"pdfPage":54},"links":[{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"}]},{"id":99,"topic":1,"qn":92,"question":"Which of the following is the BEST recommendation to mitigate excessive agency when implementing an AI system as a browser extension?","options":{"A":"Minimize browser extension functionality.","B":"Remove user access to browser extensions.","C":"Maximize browser extension functionality.","D":"Use open source browser extensions."},"url":"https://www.examtopics.com/discussions/isaca/view/385124-exam-aaia-topic-1-question-92-discussion/","community":{"A":2},"answer":"A","confidence":"high","explanation":"Excessive agency terjadi ketika sistem AI memiliki fungsi, izin, atau otonomi melebihi yang dibutuhkan, sehingga dapat melakukan tindakan merugikan bila dimanipulasi (mis. lewat prompt injection). Mitigasi utama menurut OWASP Top 10 for LLM adalah meminimalkan fungsi extension/plugin dan izin yang diberikan, sesuai prinsip least privilege. Manual juga menekankan penerapan access control dan least privilege pada komponen AI sebagai kontrol terhadap ancaman AI.","distractors":{"B":"Menghapus akses pengguna ke extension menghilangkan manfaat bisnis dan bukan mitigasi yang proporsional.","C":"Memaksimalkan fungsi justru memperbesar excessive agency.","D":"Open source tidak otomatis membatasi fungsi atau izin; risikonya tetap ada bahkan bisa menambah risiko supply chain."},"manualRef":{"chapter":2,"section":"2.15","title":"Controls for AI-related Threats","bookPage":114,"pdfPage":120},"links":[{"label":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/"}]},{"id":100,"topic":1,"qn":85,"question":"An AI audit reveals that a loan approval model has a significantly higher rejection rate for applicants from a specific demographic group. Which of the following should be management's PRIMARY response?","options":{"A":"Accept the audit findings as within risk tolerance.","B":"Determine if audit sampling is sufficient.","C":"Conduct comprehensive bias analysis.","D":"Synthesize more data of the affected demographic group."},"url":"https://www.examtopics.com/discussions/isaca/view/383756-exam-aaia-topic-1-question-85-discussion/","community":{"C":2},"answer":"C","confidence":"high","explanation":"Tingkat penolakan yang jauh lebih tinggi untuk kelompok demografis tertentu merupakan indikasi bias yang harus ditelusuri akar penyebabnya sebelum menentukan tindakan perbaikan. Manual menjelaskan bahwa bias dapat bersifat systemic, statistical/computational, maupun human, sehingga analisis bias yang komprehensif diperlukan untuk mengetahui apakah sumbernya data, fitur, algoritma, atau proses. Baru setelah itu manajemen dapat memilih remediasi yang tepat (mis. perbaikan data, fairness constraint, retraining).","distractors":{"A":"Menerima temuan sebagai dalam toleransi tanpa analisis mengabaikan risiko diskriminasi dan pelanggaran regulasi.","B":"Kecukupan sampling adalah urusan auditor; respons manajemen seharusnya menangani isu substantif yang ditemukan.","D":"Membuat data sintetis adalah salah satu kemungkinan remediasi, tetapi prematur sebelum akar penyebab bias diketahui."},"manualRef":{"chapter":1,"section":"1.17.2","title":"Bias and Fairness","bookPage":72,"pdfPage":78},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"Wikipedia: Fairness (machine learning)","url":"https://en.wikipedia.org/wiki/Fairness_(machine_learning)"}]},{"id":101,"topic":1,"qn":82,"question":"Which of the following is the GREATEST risk of using AI to generate audit reports?","options":{"A":"The AI system uses inconsistent formatting across audit reports.","B":"The AI system misrepresents control effectiveness.","C":"The AI system cannot integrate with management dashboard tools.","D":"The AI system is not able to include historical audit findings."},"url":"https://www.examtopics.com/discussions/isaca/view/385108-exam-aaia-topic-1-question-82-discussion/","community":{"B":2},"answer":"B","confidence":"high","explanation":"Nilai utama laporan audit adalah memberikan assurance yang akurat kepada manajemen dan komite audit. Jika AI salah menggambarkan efektivitas kontrol (mis. kontrol yang lemah dilaporkan efektif), pengguna laporan akan mengandalkan kesimpulan yang keliru dan risiko yang sebenarnya tidak tertangani. Manual menyebut AI dapat membantu penyusunan laporan audit, sehingga auditor tetap harus memvalidasi output AI; kesalahan substansi jauh lebih berbahaya daripada isu format atau integrasi.","distractors":{"A":"Format yang tidak konsisten adalah isu kualitas presentasi, bukan risiko substantif terhadap assurance.","C":"Ketidakmampuan integrasi dengan dashboard adalah keterbatasan operasional, bukan risiko integritas laporan.","D":"Tidak menyertakan temuan historis mengurangi kelengkapan, tetapi tidak separah salah menyajikan efektivitas kontrol."},"manualRef":{"chapter":3,"section":"3.3.2","title":"Audit Process Improvement","bookPage":138,"pdfPage":144},"links":[{"label":"ISACA ITAF","url":"https://www.isaca.org/resources/frameworks-standards-and-models"},{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"}]},{"id":102,"topic":1,"qn":76,"question":"An organization has deployed a generative AI system for customer support that includes frequent updates to the AI model after deployment. Which of the following represents the GREATEST risk?","options":{"A":"Lack of a change management policy specific to AI","B":"Overreliance on manual review of AI model outputs","C":"Lack of continuous monitoring for model changes","D":"Lack of a dedicated AI governance committee"},"url":"https://www.examtopics.com/discussions/isaca/view/383253-exam-aaia-topic-1-question-76-discussion/","community":{"C":3,"A":2},"answer":"A","confidence":"low","explanation":"Pembaruan model yang sering setelah deployment harus dikendalikan melalui change management yang memperhitungkan karakteristik khusus AI (perubahan data, parameter, atau penggantian model yang dapat mengubah output secara drastis). Manual menyatakan perlu kontrol tambahan khusus untuk risiko change management AI dan bahwa governance atas model AI harus menjadi bagian dari program change management. Tanpa kebijakan ini, pembaruan tidak diuji, disetujui, atau didokumentasikan secara konsisten; monitoring (opsi C) hanya mendeteksi dampaknya setelah terjadi. Jawaban ini berbeda dari mayoritas komunitas (C) karena ISACA cenderung memprioritaskan akar masalah governance/kebijakan preventif dibanding kontrol detektif.","distractors":{"B":"Ketergantungan pada review manual adalah isu efisiensi, bukan risiko terbesar terkait pembaruan model.","C":"Continuous monitoring penting sebagai kontrol detektif, tetapi tanpa kebijakan change management perubahan tetap masuk produksi tanpa validasi.","D":"Komite governance AI berguna, tetapi ketiadaannya tidak secara langsung mengendalikan risiko perubahan model yang sering."},"manualRef":{"chapter":2,"section":"2.10.2","title":"AI Model","bookPage":101,"pdfPage":107},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]},{"id":103,"topic":1,"qn":74,"question":"An organization seeks to sustain effective AI governance and risk management amid rapidly evolving AI technologies.\nWhich of the following represents the MOST effective course of action?","options":{"A":"Provide role-specific AI training to technical staff.","B":"Outsource AI training to external vendors.","C":"Conduct comprehensive AI training for senior management.","D":"Integrate continuous AI training into security awareness programs"},"url":"https://www.examtopics.com/discussions/isaca/view/385093-exam-aaia-topic-1-question-74-discussion/","community":{"D":1},"answer":"D","confidence":"medium","explanation":"Kata kunci soal adalah 'mempertahankan' (sustain) di tengah teknologi yang berkembang cepat, sehingga dibutuhkan pelatihan yang berkelanjutan dan menjangkau seluruh organisasi, bukan pelatihan satu kali atau terbatas pada kelompok tertentu. Mengintegrasikan pelatihan AI ke dalam program security awareness memanfaatkan mekanisme yang sudah berjalan rutin sehingga pengetahuan terus diperbarui. Manual menekankan training dan awareness sebagai elemen governance AI serta kebutuhan continuous improvement karena AI terus berevolusi.","distractors":{"A":"Pelatihan khusus staf teknis penting, tetapi tidak menjangkau seluruh pengguna dan pemangku kepentingan governance.","B":"Outsourcing pelatihan tidak menjamin keberlanjutan maupun keselarasan dengan kebijakan internal.","C":"Pelatihan manajemen senior penting, tetapi cakupannya terbatas dan, bila sekali jalan, tidak berkelanjutan."},"manualRef":{"chapter":1,"section":"1.9","title":"AI Training and Awareness","bookPage":48,"pdfPage":54},"links":[{"label":"NIST AI RMF hub","url":"https://www.nist.gov/itl/ai-risk-management-framework"},{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]},{"id":104,"topic":1,"qn":2,"question":"The BEST way to prevent sensitive information disclosure by large language model (LLM) chatbots is through:","options":{"A":"manual monitoring.","B":"data sanitization.","C":"data masking.","D":"access controls."},"url":"https://www.examtopics.com/discussions/isaca/view/312504-exam-aaia-topic-1-question-2-discussion/","community":{"B":8,"C":11},"answer":"B","confidence":"low","explanation":"Pencegahan sensitive information disclosure oleh chatbot LLM paling efektif dilakukan dengan data sanitization, yaitu membersihkan/menghapus (scrubbing) data sensitif sebelum masuk ke data training, fine-tuning, atau knowledge base RAG, serta menyaring input dan output. OWASP Top 10 for LLM menempatkan sanitization sebagai mitigasi utama untuk risiko ini, dan masking/tokenization merupakan salah satu teknik di dalam cakupan sanitization yang lebih luas. Manual juga menyebut masking/tokenization untuk meminimalkan data sensitif yang diserap dan dikeluarkan AI, yang mendukung prinsip yang sama. Jawaban ini berbeda dari mayoritas komunitas berbobot (C) karena sanitization adalah kontrol yang lebih komprehensif dan langsung mencegah data sensitif berada di dalam model.","distractors":{"A":"Monitoring manual bersifat detektif dan tidak skalabel, sehingga tidak mencegah kebocoran.","C":"Data masking efektif tetapi merupakan salah satu teknik spesifik dalam sanitization; cakupannya lebih sempit.","D":"Access control membatasi siapa yang memakai chatbot, tetapi tidak mencegah model membocorkan data sensitif yang sudah dipelajarinya kepada pengguna yang sah."},"manualRef":{"chapter":1,"section":"1.14","title":"Data Governance","bookPage":59,"pdfPage":65},"links":[{"label":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/"},{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"}]},{"id":105,"topic":1,"qn":70,"question":"A company is developing an AI system to generate videos and images. Which of the following would BEST enable the company to mitigate harm caused by deepfakes?","options":{"A":"Differential privacy","B":"Watermarking","C":"Sanitization","D":"Model encryption"},"url":"https://www.examtopics.com/discussions/isaca/view/366583-exam-aaia-topic-1-question-70-discussion/","community":{"B":2},"answer":"B","confidence":"high","explanation":"Watermarking menyisipkan penanda (terlihat atau tidak terlihat) pada konten gambar/video yang dihasilkan AI sehingga asal-usulnya dapat diverifikasi dan konten sintetis dapat dibedakan dari konten asli. Ini adalah kontrol provenance yang langsung memitigasi penyalahgunaan deepfake, sebagaimana juga ditekankan oleh NIST Generative AI Profile dan kewajiban transparansi EU AI Act. Manual menyebut GenAI (mis. GAN) mampu membuat video dan gambar sangat realistis termasuk deepfake, serta risiko distribusi konten berbahaya bagi pengembang.","distractors":{"A":"Differential privacy melindungi privasi individu dalam data training, bukan mendeteksi atau menandai konten sintetis.","C":"Sanitization membersihkan input/data, tidak membantu mengidentifikasi konten deepfake yang sudah beredar.","D":"Enkripsi model melindungi dari pencurian model, bukan dari penyalahgunaan output yang dihasilkan."},"manualRef":{"chapter":1,"section":"1.1.3","title":"Generative Models","bookPage":23,"pdfPage":29},"links":[{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"},{"label":"Wikipedia: Digital watermarking","url":"https://en.wikipedia.org/wiki/Digital_watermarking"}]},{"id":106,"topic":1,"qn":63,"question":"An IS auditor learns that the organization’s AI solution is configured with web integration enabled. Which of the following is the MOST important control for the auditor to validate?","options":{"A":"Data augmentation activities prior to model building","B":"Key performance indicator (KPI) metrics for model inference time","C":"Activity logging with integration to the organization’s SIEM system","D":"Separation of duties between the model creator and the model tester"},"url":"https://www.examtopics.com/discussions/isaca/view/367063-exam-aaia-topic-1-question-63-discussion/","community":{"C":2,"A":2},"answer":"C","confidence":"medium","explanation":"Web integration membuka permukaan serangan baru: AI dapat menerima konten berbahaya dari web (indirect prompt injection), mengirimkan data internal ke luar, atau melakukan aksi yang tidak semestinya. Kontrol terpenting yang harus divalidasi auditor adalah activity logging yang terhubung ke SIEM agar aktivitas AI terekam sebagai audit trail dan anomali dapat dideteksi serta direspons. Manual menekankan logging input, parameter/versi model, dan output sebagai jejak audit, serta observability untuk mendeteksi penyalahgunaan seperti prompt injection.","distractors":{"A":"Data augmentation adalah aktivitas pengembangan model, tidak mengendalikan risiko dari koneksi web saat operasi.","B":"KPI waktu inferensi adalah metrik kinerja, bukan kontrol keamanan atas integrasi web.","D":"Segregation of duties antara pembuat dan penguji model adalah kontrol pengembangan, tidak terkait langsung dengan risiko web integration."},"manualRef":{"chapter":2,"section":"2.11.1","title":"Logging and Monitoring","bookPage":103,"pdfPage":109},"links":[{"label":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/"},{"label":"MITRE ATLAS","url":"https://atlas.mitre.org/"}]},{"id":107,"topic":3,"qn":28,"question":"When auditing a machine learning (ML) solution, false positives can BEST be assessed by examining the level of:","options":{"A":"precision.","B":"completeness.","C":"recall.","D":"accuracy."},"url":"https://www.examtopics.com/discussions/isaca/view/315979-exam-aaia-topic-3-question-28-discussion/","community":{"A":1},"answer":"A","confidence":"high","explanation":"Precision = TP / (TP + FP), yaitu proporsi prediksi positif yang benar-benar positif, sehingga merupakan metrik yang langsung mencerminkan tingkat false positive. Semakin rendah precision, semakin banyak false positive yang dihasilkan model. Manual menyebut precision, recall, dan F1 sebagai metrik evaluasi model yang perlu dipantau.","distractors":{"B":"Completeness adalah dimensi kualitas data, bukan metrik evaluasi klasifikasi.","C":"Recall mengukur kemampuan menangkap seluruh positif aktual, sehingga terkait false negative, bukan false positive.","D":"Accuracy menggabungkan semua jenis kesalahan sehingga tidak spesifik menggambarkan false positive, dan menyesatkan pada data tidak seimbang."},"manualRef":{"chapter":2,"section":"2.8.4","title":"Evaluation","bookPage":95,"pdfPage":101},"links":[{"label":"Wikipedia: Precision and recall","url":"https://en.wikipedia.org/wiki/Precision_and_recall"},{"label":"Wikipedia: Confusion matrix","url":"https://en.wikipedia.org/wiki/Confusion_matrix"}]},{"id":108,"topic":3,"qn":25,"question":"When auditing a research agency’s use of generative AI models for analyzing scientific data which of the following is MOST critical to evaluate in order to prevent hallucinatory results and ensure the accuracy of outputs?","options":{"A":"The measures in place to ensure the appropriateness and relevance of input data for generative AI models","B":"The frequency of data audits verifying the integrity and accuracy of inputs","C":"The algorithms for generative AI models designed to detect and correct data bias before processing","D":"The effectiveness of data anonymization processes that help preserve data quality"},"url":"https://www.examtopics.com/discussions/isaca/view/315978-exam-aaia-topic-3-question-25-discussion/","community":{"A":1},"answer":"A","confidence":"high","explanation":"Manual menjelaskan penyebab hallucination antara lain data training yang cacat dan input yang ambigu, tidak memadai, atau bias, serta menegaskan bahwa data berkualitas, beragam, dan relevan adalah dasar untuk mengurangi hallucination. Karena itu, kontrol yang menjamin kesesuaian dan relevansi data input untuk model GenAI adalah hal paling kritis untuk dievaluasi demi akurasi output analisis ilmiah. Opsi lain hanya menyentuh sebagian aspek atau tidak terkait langsung dengan hallucination.","distractors":{"B":"Frekuensi audit data adalah kontrol detektif periodik dan tidak secara langsung mencegah hallucination.","C":"Algoritma deteksi bias membantu fairness, tetapi bias bukan satu-satunya atau penyebab utama hallucination.","D":"Anonimisasi berkaitan dengan privasi; tidak meningkatkan akurasi dan bahkan dapat mengurangi utilitas data."},"manualRef":{"chapter":2,"section":"2.11.4","title":"Hallucination","bookPage":104,"pdfPage":110},"links":[{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"},{"label":"Wikipedia: Hallucination (artificial intelligence)","url":"https://en.wikipedia.org/wiki/Hallucination_(artificial_intelligence)"}]},{"id":109,"topic":3,"qn":21,"question":"An IS auditor is auditing a financial system in which a generative AI tool is used to identify trends in batches of 4,000 rows while the generative AI tool has a limit of 3,000 tokens. Which of the following is the GREATEST concern?","options":{"A":"The AI will prioritize high-value entries.","B":"The AI will process only a portion of the data set.","C":"The AI output will be biased toward the first 3,000 tokens.","D":"The AI will reject the data set and not analyze the data."},"url":"https://www.examtopics.com/discussions/isaca/view/315977-exam-aaia-topic-3-question-21-discussion/","community":{"B":1},"answer":"B","confidence":"medium","explanation":"Batch 4.000 baris hampir pasti melebihi batas 3.000 token (context window), sehingga tool GenAI hanya akan memproses sebagian data (sisanya terpotong/truncated) dan tren yang diidentifikasi tidak mewakili seluruh populasi. Bagi auditor, ini adalah masalah kelengkapan (completeness) data yang dapat menghasilkan kesimpulan keliru tanpa peringatan yang jelas. Opsi C adalah gejala turunan dari masalah yang sama, sedangkan inti risikonya adalah analisis tidak lengkap.","distractors":{"A":"Tidak ada mekanisme bawaan yang membuat AI memprioritaskan entri bernilai tinggi akibat batas token.","C":"Kecenderungan pada bagian awal data adalah konsekuensi dari pemrosesan parsial; kekhawatiran utamanya adalah data tidak diproses lengkap.","D":"Banyak tool tidak menolak input tetapi memotongnya diam-diam, sehingga risiko sebenarnya justru analisis parsial yang tidak disadari."},"manualRef":null,"links":[{"label":"Wikipedia: Large language model","url":"https://en.wikipedia.org/wiki/Large_language_model"},{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"}]},{"id":110,"topic":3,"qn":20,"question":"Which of the following is MOST important to consider when auditing an organization’s AI procedures?","options":{"A":"AI data validation and filtration to prevent data poisoning","B":"Backup and recovery in the event of an AI data breach","C":"Employee training on recognized AI best practices","D":"Frequency of AI system updates to enhance security"},"url":"https://www.examtopics.com/discussions/isaca/view/315976-exam-aaia-topic-3-question-20-discussion/","community":{"A":1},"answer":"A","confidence":"medium","explanation":"Data poisoning adalah ancaman khas AI yang dapat terjadi di berbagai titik (sumber, pemasok data, transit, preprocessing, hingga knowledge base RAG) dan dapat menanamkan backdoor atau merusak kinerja model. Prosedur validasi dan penyaringan data untuk mencegah poisoning merupakan kontrol inti yang melindungi integritas model, sehingga paling penting dipertimbangkan saat mengaudit prosedur AI. Opsi lain lebih umum atau kurang langsung terhadap risiko spesifik AI.","distractors":{"B":"Backup dan recovery penting untuk ketahanan, tetapi bersifat korektif setelah insiden, bukan pencegahan risiko inti AI.","C":"Pelatihan karyawan adalah kontrol pendukung, bukan prosedur AI yang paling kritis.","D":"Frekuensi pembaruan tidak otomatis meningkatkan keamanan dan bahkan dapat menambah risiko jika tidak dikendalikan."},"manualRef":{"chapter":2,"section":"2.14.2","title":"Data Poisoning","bookPage":112,"pdfPage":118},"links":[{"label":"MITRE ATLAS","url":"https://atlas.mitre.org/"},{"label":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/"}]},{"id":111,"topic":2,"qn":21,"question":"An AI model's documentation shows that the modeler utilized K-means clustering to categorize a data set that included a large volume of records. Which of the following is an advantage of using a K-means clustering algorithm for determining classification categories to group applicable data before it is inserted into the learning model?","options":{"A":"The algorithm is unsupervised, which eliminates subjectivity and possible bias from data labeling.","B":"The algorithm is supervised and can include the modeler's biases in the analysis.","C":"The algorithm requires the modeler to specify the number of clusters, which significantly affects the outcome.","D":"The algorithm is not significantly affected by outliers, resulting in less need for data cleansing."},"url":"https://www.examtopics.com/discussions/isaca/view/315957-exam-aaia-topic-2-question-21-discussion/","community":{"A":1},"answer":"A","confidence":"medium","explanation":"K-means adalah algoritma unsupervised learning yang mengelompokkan data tanpa label, sehingga tidak memerlukan pelabelan manual yang mahal dan berpotensi subjektif pada volume data besar. Manual menjelaskan bahwa unsupervised learning belajar dari data mentah tanpa label dan tanpa intervensi manusia secara eksplisit, sementara pelabelan manual sering sulit karena volume besar dan kategori yang subjektif. Perlu dicatat klaim 'menghilangkan' bias agak berlebihan (manual juga mengingatkan clustering tetap butuh pengawasan manusia), tetapi hanya opsi A yang merupakan keunggulan yang benar.","distractors":{"B":"K-means bukan algoritma supervised; pernyataan ini salah secara faktual dan juga bukan keunggulan.","C":"Keharusan menentukan jumlah cluster (K) adalah keterbatasan K-means, bukan keunggulan.","D":"K-means justru sensitif terhadap outlier karena centroid berbasis rata-rata, sehingga data cleansing tetap diperlukan."},"manualRef":{"chapter":1,"section":"1.2.1","title":"Basic Models","bookPage":26,"pdfPage":32},"links":[{"label":"Wikipedia: K-means clustering","url":"https://en.wikipedia.org/wiki/K-means_clustering"},{"label":"Wikipedia: Unsupervised learning","url":"https://en.wikipedia.org/wiki/Unsupervised_learning"}]},{"id":112,"topic":2,"qn":18,"question":"An AI system is misclassifying images after a routine model update. An IS auditor discovers that the updated model file was replaced by an unauthorized version. Which of the following is the auditor’s BEST recommendation?","options":{"A":"Notify all users of potential inaccuracies and deactivate the system.","B":"Immediately retrain the model from scratch using a secure data set.","C":"Disable the automated update process to prevent future issues.","D":"Revert to the last verified model version and initiate a root cause analysis."},"url":"https://www.examtopics.com/discussions/isaca/view/315956-exam-aaia-topic-2-question-18-discussion/","community":{"D":1},"answer":"D","confidence":"high","explanation":"Manual menyebut rollback ke model versi sebelumnya sebagai alternatif utama untuk perubahan darurat pada sistem AI, karena melatih ulang model dapat memakan waktu berjam-jam hingga berminggu-minggu. Kembali ke versi terakhir yang terverifikasi segera memulihkan operasi yang andal, sementara root cause analysis diperlukan untuk mengetahui bagaimana file model tidak sah bisa masuk dan memperbaiki kelemahan kontrol (mis. integrity check, change management). Rekomendasi ini menyeimbangkan pemulihan cepat dan pencegahan berulang.","distractors":{"A":"Menonaktifkan sistem dan memberi tahu pengguna mungkin berlebihan bila versi valid tersedia, dan tidak menangani akar masalah.","B":"Retraining dari awal mahal dan lama, padahal masalahnya adalah penggantian file model, bukan data training.","C":"Mematikan proses update otomatis hanya menangani gejala dan dapat menghambat pembaruan yang sah tanpa memperbaiki kontrol integritas."},"manualRef":{"chapter":2,"section":"2.10.4","title":"Emergency Changes","bookPage":102,"pdfPage":108},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"MITRE ATLAS","url":"https://atlas.mitre.org/"}]},{"id":113,"topic":2,"qn":16,"question":"A retail organization uses an AI model to forecast inventory based on customer purchasing trends and updates the model quarterly. The model recently failed to recognize a surge in demand during a popular shopping season. Which of the following issues does this situation BEST demonstrate?","options":{"A":"Data drift impacting system forecasting","B":"Overfitting issues due to a small training data set","C":"Lack of outlier checks in data affecting forecast accuracy","D":"Limited data set diversity impacting model training"},"url":"https://www.examtopics.com/discussions/isaca/view/315955-exam-aaia-topic-2-question-16-discussion/","community":{"A":1},"answer":"A","confidence":"high","explanation":"Kegagalan mengenali lonjakan permintaan musiman menunjukkan bahwa karakteristik data input saat ini berbeda dari data yang digunakan untuk melatih model, yaitu data drift. Manual secara eksplisit menyebut seasonality dan pergeseran preferensi sebagai penyebab drift yang menurunkan kinerja model, sehingga perlu monitoring dan pembaruan model dengan data yang representatif. Pembaruan kuartalan juga dapat terlalu jarang untuk menangkap perubahan pola yang cepat.","distractors":{"B":"Overfitting akibat data kecil tidak didukung informasi soal; masalahnya adalah perubahan pola dari waktu ke waktu.","C":"Lonjakan musiman adalah pola nyata yang harus dipelajari, bukan outlier yang perlu disaring.","D":"Keragaman data bisa berperan, tetapi skenario paling tepat menggambarkan pergeseran data terhadap kondisi saat ini (drift)."},"manualRef":{"chapter":2,"section":"2.8.6","title":"Monitoring and Maintenance","bookPage":96,"pdfPage":102},"links":[{"label":"Wikipedia: Concept drift","url":"https://en.wikipedia.org/wiki/Concept_drift"},{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":114,"topic":2,"qn":14,"question":"Which of the following is the MOST important task when gathering data during the AI system development process?","options":{"A":"Isolating the system","B":"Stratifying the data","C":"Training the system","D":"Cleaning the data"},"url":"https://www.examtopics.com/discussions/isaca/view/315953-exam-aaia-topic-2-question-14-discussion/","community":{"D":1},"answer":"D","confidence":"high","explanation":"Manual menegaskan kualitas data secara langsung menentukan kinerja dan keandalan solusi AI, sehingga data yang dikumpulkan harus dibersihkan dari inkonsistensi, duplikasi, dan error agar akurat dan layak digunakan. Data cleaning adalah langkah krusial pada fase collect and process data sebelum model dibangun. Tanpa data yang bersih, langkah lain seperti stratifikasi atau training akan menghasilkan model yang tidak andal (garbage in, garbage out).","distractors":{"A":"Mengisolasi sistem adalah kontrol keamanan lingkungan, bukan tugas inti pengumpulan data.","B":"Stratifikasi berguna untuk sampling/pembagian data, tetapi dilakukan setelah data bersih dan bukan yang paling penting.","C":"Training sistem adalah tahap setelah pengumpulan dan pemrosesan data, bukan bagian dari gathering data."},"manualRef":{"chapter":1,"section":"1.4.2","title":"Collect and Process Data","bookPage":34,"pdfPage":40},"links":[{"label":"Wikipedia: Data cleansing","url":"https://en.wikipedia.org/wiki/Data_cleansing"},{"label":"scikit-learn preprocessing guide","url":"https://scikit-learn.org/stable/modules/preprocessing.html"}]},{"id":115,"topic":1,"qn":5,"question":"Which of the following is MOST important for an IS auditor to consider when identifying AI risk in a know your customer (KYC) application within a banking organization?","options":{"A":"Business disruption and financial impact","B":"Intellectual property leakage and invalidation","C":"Benchmarking against peer organizations","D":"Incident response plan"},"url":"https://www.examtopics.com/discussions/isaca/view/312551-exam-aaia-topic-1-question-5-discussion/","community":{"A":3},"answer":"A","confidence":"medium","explanation":"Identifikasi dan penilaian risiko AI berfokus pada likelihood dan impact terhadap organisasi; pada aplikasi KYC, kegagalan AI dapat menghentikan onboarding nasabah, menimbulkan denda AML/KYC, dan kerugian finansial. Manual menyarankan memakai definisi risiko organisasi yang ada untuk menilai kemungkinan dan dampak risiko AI yang teridentifikasi. Opsi lain adalah kontrol, aktivitas pembanding, atau risiko yang kurang relevan dengan KYC.","distractors":{"B":"Kebocoran IP kurang relevan untuk aplikasi KYC dibanding dampak operasional, regulasi, dan finansial.","C":"Benchmarking dengan peer dapat memberi konteks, tetapi bukan pertimbangan utama dalam mengidentifikasi risiko.","D":"Incident response plan adalah kontrol mitigasi/respons, bukan faktor untuk mengidentifikasi risiko."},"manualRef":{"chapter":1,"section":"1.12.1","title":"Risk Assessment","bookPage":55,"pdfPage":61},"links":[{"label":"ISO/IEC 23894","url":"https://www.iso.org/standard/77304.html"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":116,"topic":1,"qn":4,"question":"An IS auditor is evaluating an organization’s incident management program to ensure it is sufficiently prepared to manage AI-related incidents. Which of the following is MOST important for the auditor to validate?","options":{"A":"The program includes processes to respond to AI model drift and data integrity attacks.","B":"The program prioritizes incidents based on alignment with industry leading practices.","C":"The program uses past AI-related incidents and resolutions to categorize current incidents.","D":"The program mandates retraining AI systems after incidents are investigated."},"url":"https://www.examtopics.com/discussions/isaca/view/312506-exam-aaia-topic-1-question-4-discussion/","community":{"A":3},"answer":"A","confidence":"high","explanation":"Manual menyatakan banyak organisasi belum menyesuaikan program incident response untuk insiden khusus AI, dan kebijakan IR harus mencakup ancaman spesifik AI beserta teknik deteksi dan responsnya. Program yang siap menangani insiden AI harus memiliki proses untuk model drift, prediksi yang salah/bias, serta serangan integritas data seperti data poisoning. Validasi hal ini menunjukkan program benar-benar mencakup skenario unik AI, bukan hanya insiden TI konvensional.","distractors":{"B":"Prioritas insiden seharusnya berdasarkan dampak dan tingkat keparahan bagi organisasi, bukan keselarasan dengan praktik industri.","C":"Belajar dari insiden masa lalu berguna untuk perbaikan, tetapi tidak menjamin kesiapan menghadapi ancaman AI baru.","D":"Mewajibkan retraining setelah setiap insiden tidak selalu tepat; respons harus disesuaikan dengan akar penyebab."},"manualRef":{"chapter":2,"section":"2.16.1","title":"Policies, Procedures, and Model Documentation","bookPage":118,"pdfPage":124},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"MITRE ATLAS","url":"https://atlas.mitre.org/"}]},{"id":117,"topic":1,"qn":3,"question":"An organization is using information gathered from customer accounts to train its AI chatbot. Which of the following is the GREATEST risk associated with this practice?","options":{"A":"Transparency","B":"AI model hallucinations","C":"AI bias","D":"Disclosure of personal information"},"url":"https://www.examtopics.com/discussions/isaca/view/312505-exam-aaia-topic-1-question-3-discussion/","community":{"D":3},"answer":"D","confidence":"high","explanation":"Data dari akun pelanggan umumnya berisi informasi pribadi; menggunakannya untuk melatih chatbot berisiko membuat model 'mengingat' lalu mengungkapkan data tersebut kepada pengguna lain, serta melanggar persyaratan consent. Manual menekankan bahwa data pelanggan sering memerlukan consent tambahan untuk training AI dan kegagalan mengelolanya dapat berujung pada sanksi regulasi dan hilangnya kepercayaan. Karena itu disclosure data pribadi adalah risiko terbesar dalam skenario ini.","distractors":{"A":"Transparansi tetap penting, tetapi bukan risiko utama yang muncul dari penggunaan data akun pelanggan.","B":"Hallucination adalah risiko umum GenAI, tidak spesifik terhadap penggunaan data pelanggan untuk training.","C":"Bias mungkin terjadi, tetapi dampak kebocoran data pribadi dan pelanggaran privasi lebih langsung dan berat."},"manualRef":{"chapter":2,"section":"2.1.1","title":"Consent","bookPage":84,"pdfPage":90},"links":[{"label":"GDPR text","url":"https://gdpr-info.eu/"},{"label":"NIST Privacy Framework","url":"https://www.nist.gov/privacy-framework"}]},{"id":118,"topic":1,"qn":7,"question":"Which of the following is MOST important for an IS auditor to review during an AI system audit in order to determine compliance with intellectual property and data rights?","options":{"A":"Data performance metrics","B":"Use of open-source intellectual property","C":"Model runtime efficiency logs","D":"Data usage agreements"},"url":"https://www.examtopics.com/discussions/isaca/view/311783-exam-aaia-topic-1-question-7-discussion/","community":{"D":6},"answer":"D","confidence":"high","explanation":"Data usage/licensing agreement adalah dokumen yang secara hukum menetapkan kepemilikan data input dan output, hak IP, serta izin dan batasan penggunaan, distribusi, dan redistribusi data untuk training AI. Manual menjelaskan bahwa data licensing mengatur bagaimana pengembang AI boleh mengakses, menggunakan, dan membagikan data pihak lain, dan kegagalan mengelolanya dapat berujung pada sanksi dan hilangnya kepercayaan publik. Karena itu, inilah bukti utama untuk menilai kepatuhan terhadap IP dan hak data.","distractors":{"A":"Metrik kinerja data tidak menunjukkan apakah data digunakan sesuai hak dan lisensinya.","B":"Penggunaan IP open-source relevan, tetapi hanya sebagian; kepatuhan tetap ditentukan oleh perjanjian/lisensi yang berlaku.","C":"Log efisiensi runtime adalah data operasional, tidak berkaitan dengan IP atau hak data."},"manualRef":{"chapter":1,"section":"1.14.3","title":"Data Licensing","bookPage":61,"pdfPage":67},"links":[{"label":"EU AI Act (EUR-Lex)","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"},{"label":"OECD AI Principles","url":"https://oecd.ai/en/ai-principles"}]},{"id":119,"topic":1,"qn":6,"question":"A digital bank utilizes an AI system to generate credit scores. Which of the following would BEST mitigate the risk of sudden and unexplained changes in a borrower's credit score?","options":{"A":"Using only data from the last six months to one year to avoid outdated information affecting the credit score","B":"Ensuring the system is periodically reviewed and calibrated by human experts to maintain stability in predictions","C":"Obtaining and validating the credit scores from third-party agencies to cross-check AI-generated results","D":"Allowing the AI to operate fully autonomously to prevent processing delays"},"url":"https://www.examtopics.com/discussions/isaca/view/311782-exam-aaia-topic-1-question-6-discussion/","community":{"B":4,"C":2},"answer":"B","confidence":"medium","explanation":"Perubahan skor kredit yang tiba-tiba dan tidak dapat dijelaskan biasanya berasal dari drift, perubahan model, atau parameter yang tidak terkendali. Review dan kalibrasi berkala oleh ahli manusia menggabungkan monitoring berkelanjutan dengan human oversight sehingga stabilitas dan kewajaran prediksi tetap terjaga. Manual menekankan monitoring kinerja, diagnosis akar penyebab anomali, dan pemeliharaan rutin model, serta human in the loop untuk keputusan kritis.","distractors":{"A":"Membatasi data hanya 6-12 bulan dapat menghilangkan histori kredit yang relevan dan justru meningkatkan volatilitas skor.","C":"Cross-check dengan biro kredit pihak ketiga bersifat detektif dan model/datanya berbeda, sehingga tidak menstabilkan perilaku model internal.","D":"Operasi sepenuhnya otonom menghilangkan pengawasan manusia dan memperbesar risiko perubahan yang tidak terdeteksi."},"manualRef":{"chapter":2,"section":"2.8.6","title":"Monitoring and Maintenance","bookPage":96,"pdfPage":102},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"Wikipedia: Concept drift","url":"https://en.wikipedia.org/wiki/Concept_drift"}]},{"id":120,"topic":1,"qn":1,"question":"Which of the following key performance indicators (KPIs) are MOST important when evaluating whether an AI model meets business objectives?","options":{"A":"Cost of resources required for AI model training","B":"AI model accuracy in predicting actual outcomes","C":"Frequency of AI model retraining","D":"Number of users interacting with the AI model"},"url":"https://www.examtopics.com/discussions/isaca/view/312503-exam-aaia-topic-1-question-1-discussion/","community":{"B":4},"answer":"B","confidence":"high","explanation":"Untuk menilai apakah model memenuhi tujuan bisnis, KPI harus mengukur apakah model benar-benar memberikan hasil yang diharapkan, yaitu akurasi prediksi terhadap hasil aktual. Manual menjelaskan objective verification: kriteria sukses dari tahap use case harus ditinjau ulang untuk memastikan pencapaian KPI seperti prediction accuracy, karena solusi AI bisa berfungsi tetapi tidak mencapai tujuan bisnisnya. Opsi lain mengukur biaya, aktivitas operasional, atau adopsi, bukan pencapaian hasil.","distractors":{"A":"Biaya training relevan untuk efisiensi/ROI, tetapi tidak menunjukkan apakah model menghasilkan keluaran yang tepat.","C":"Frekuensi retraining adalah metrik operasional, bukan indikator pencapaian tujuan bisnis.","D":"Jumlah pengguna menunjukkan adopsi, bukan apakah model memberikan hasil yang benar."},"manualRef":{"chapter":2,"section":"2.12.3","title":"Objective Verification","bookPage":107,"pdfPage":113},"links":[{"label":"COBIT","url":"https://www.isaca.org/resources/cobit"},{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":121,"topic":1,"qn":8,"question":"Which of the following is the PRIMARY objective of AI governance?","options":{"A":"Implementing compliance and ethics controls for AI initiatives","B":"Promoting a positive return on investment (ROI) from AI projects","C":"Defining clear roles and responsibilities for AI development, use, and oversight","D":"Ensuring controls over AI are designed well and operate effectively"},"url":"https://www.examtopics.com/discussions/isaca/view/311784-exam-aaia-topic-1-question-8-discussion/","community":{"C":2},"answer":"C","confidence":"medium","explanation":"Manual menjelaskan AI governance dimulai dengan menetapkan strategi serta peran dan tanggung jawab, yang kemudian diarahkan melalui kebijakan, pelatihan, dan metrik program yang dilaporkan ke badan pengawas. Menetapkan peran dan tanggung jawab yang jelas untuk pengembangan, penggunaan, dan pengawasan AI menciptakan akuntabilitas, yang merupakan inti governance (direction and oversight). Implementasi kontrol dan memastikan efektivitas kontrol adalah fungsi manajemen dan assurance, sedangkan ROI adalah hasil yang diharapkan, bukan tujuan utama governance.","distractors":{"A":"Implementasi kontrol kepatuhan dan etika adalah aktivitas manajemen yang dijalankan di bawah kerangka governance.","B":"ROI positif adalah manfaat yang diharapkan, tetapi governance AI berfokus pada arahan, akuntabilitas, dan pengawasan agar AI aman dan etis.","D":"Memastikan desain dan efektivitas operasi kontrol adalah tujuan internal control/assurance (mis. audit), bukan tujuan utama governance."},"manualRef":{"chapter":1,"section":"1.6","title":"AI Strategy (Part B: AI Governance and Program Management)","bookPage":43,"pdfPage":49},"links":[{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"},{"label":"COBIT","url":"https://www.isaca.org/resources/cobit"}]},{"id":122,"topic":1,"qn":10,"question":"An organization deploys an AI recruitment platform to screen job applicants. The IS auditor identifies that the platform’s decisions may be influenced by model bias. Which of the following risk mitigation strategies is BEST for the auditor to recommend?","options":{"A":"Implement a process to periodically test the AI system for biases and adjust parameters as needed.","B":"Suspend the use of the AI system until the training data can be verified for fairness and compliance.","C":"Require manual reviews of all AI-generated recruitment decisions before hiring is finalized.","D":"Retrain the AI model using an external data set certified for inclusivity and fairness."},"url":"https://www.examtopics.com/discussions/isaca/view/311786-exam-aaia-topic-1-question-10-discussion/","community":{"A":2},"answer":"A","confidence":"medium","explanation":"Temuan menunjukkan keputusan 'mungkin' dipengaruhi bias, sehingga rekomendasi terbaik adalah proses pengujian bias secara berkala disertai penyesuaian parameter, yang mengatasi risiko secara berkelanjutan sepanjang life cycle. Manual menekankan bias testing eksplisit di berbagai tahap, dan pengulangan pengujian serta perbaikan hingga tujuan mitigasi bias tercapai. Opsi lain terlalu ekstrem, tidak proporsional, atau hanya solusi sekali jalan.","distractors":{"B":"Menghentikan sistem sepenuhnya tidak proporsional untuk risiko yang belum terkonfirmasi dan mengganggu operasional.","C":"Review manual atas semua keputusan menghilangkan manfaat otomasi dan tetap dapat dipengaruhi bias manusia; lebih cocok sebagai kontrol kompensasi.","D":"Retraining dengan dataset eksternal 'bersertifikat' adalah solusi sekali jalan dan tidak menjamin bias tidak muncul kembali tanpa pengujian berkala."},"manualRef":{"chapter":2,"section":"2.13.2","title":"Bias Testing","bookPage":108,"pdfPage":114},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"EU AI Act (EUR-Lex)","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"id":123,"topic":1,"qn":11,"question":"Which of the following is MOST important to consider when deciding whether to implement an AI solution?","options":{"A":"The space required for AI hardware","B":"The cost of AI implementation","C":"The speed of AI implementation","D":"The ethical implications of AI"},"url":"https://www.examtopics.com/discussions/isaca/view/311787-exam-aaia-topic-1-question-11-discussion/","community":{"D":2},"answer":"D","confidence":"medium","explanation":"Manual menyatakan pertimbangan etis harus ditinjau sejak awal, sebelum proyek AI dimulai, dan solusi AI yang tidak selaras dengan nilai masyarakat atau berpotensi menimbulkan bahaya sebaiknya tidak dibuat. Ethical impact assessment juga direkomendasikan untuk setiap solusi AI baru. Implikasi etis menentukan apakah AI layak diterapkan sama sekali, sedangkan biaya, kecepatan, dan kebutuhan hardware adalah pertimbangan pelaksanaan setelah kelayakan etis dipastikan.","distractors":{"A":"Kebutuhan ruang hardware adalah isu teknis/logistik yang minor dibanding dampak etis.","B":"Biaya penting dalam cost-benefit analysis, tetapi tidak lebih utama daripada potensi bahaya dan risiko etis.","C":"Kecepatan implementasi bukan dasar keputusan untuk menerapkan AI dan dapat mendorong pengabaian risiko."},"manualRef":{"chapter":1,"section":"1.17.1","title":"Ethical Use","bookPage":71,"pdfPage":77},"links":[{"label":"OECD AI Principles","url":"https://oecd.ai/en/ai-principles"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":124,"topic":1,"qn":12,"question":"Which of the following is the PRIMARY purpose of an AI acceptable use policy?","options":{"A":"Establishing guidance on the ethical use of AI","B":"Explaining the distinction between different types of AI","C":"Outlining AI usage monitoring procedures","D":"Educating employees on where to find and how to use AI tools"},"url":"https://www.examtopics.com/discussions/isaca/view/311788-exam-aaia-topic-1-question-12-discussion/","community":{"A":2},"answer":"A","confidence":"high","explanation":"Manual mendefinisikan AI acceptable use policy sebagai kerangka untuk penerapan AI yang etis dan bertanggung jawab, termasuk panduan penggunaan yang mempertimbangkan risk-benefit. Kebijakan ini menetapkan penggunaan AI yang diizinkan dan dilarang, solusi yang disetujui, serta cara penggunaan data organisasi. Karena itu tujuan utamanya adalah memberi panduan penggunaan AI yang etis, bukan edukasi teknis atau prosedur monitoring.","distractors":{"B":"Menjelaskan jenis-jenis AI adalah materi edukasi, bukan tujuan kebijakan acceptable use.","C":"Prosedur monitoring penggunaan merupakan mekanisme penegakan yang mendukung kebijakan, bukan tujuan utamanya.","D":"Informasi lokasi dan cara memakai tool adalah panduan operasional/pelatihan, bukan tujuan utama AUP."},"manualRef":{"chapter":1,"section":"1.8.1","title":"Usage Policies","bookPage":47,"pdfPage":53},"links":[{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":125,"topic":2,"qn":30,"question":"Which of the following is the MOST critical consideration for incident response in AI systems?","options":{"A":"Developing a process to monitor and correct biased outputs in AI models","B":"Assigning accountability for managing and resolving AI -related incidents","C":"Deploying automated incident response systems to flag unusual patterns in AI model behavior","D":"Conducting regular training to enhance understanding of AI troubleshooting"},"url":"https://www.examtopics.com/discussions/isaca/view/315965-exam-aaia-topic-2-question-30-discussion/","community":{"B":1},"answer":"B","confidence":"medium","explanation":"Respons insiden yang efektif memerlukan kejelasan siapa yang bertanggung jawab mengelola, mengeskalasi, dan menyelesaikan insiden AI; tanpa akuntabilitas, deteksi dan tool otomatis tidak akan menghasilkan tindakan yang terkoordinasi. Manual menekankan pembentukan tim incident response AI dengan representasi pemangku kepentingan yang tepat, protokol eskalasi yang terdokumentasi, serta pentingnya akuntabilitas dan kepemilikan karena AI menyentuh banyak unit fungsional. Pendekatan governance-first ini menjadi fondasi bagi kontrol teknis lainnya.","distractors":{"A":"Monitoring dan koreksi output bias adalah kontrol operasional untuk satu jenis risiko, bukan pertimbangan inti incident response.","C":"Sistem otomatis membantu deteksi, tetapi tetap memerlukan pemilik yang bertanggung jawab untuk merespons.","D":"Pelatihan troubleshooting meningkatkan kapabilitas, tetapi tidak efektif tanpa penetapan peran dan akuntabilitas yang jelas."},"manualRef":{"chapter":2,"section":"2.16.2","title":"Incident Response Team","bookPage":118,"pdfPage":124},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]}]}</script>

  return '<div class="opts">'+LETTERS.filter(function(L){return q.options[L]!=null;}).map(function(L){
    var cls = 'opt';
    if(reveal){ if(L===q.answer) cls+=' ok'; else if(L===picked) cls+=' bad'; } else if(L===picked) cls+=' sel';
    return '<button class="'+cls+'" data-opt="'+L+'"'+(reveal?' disabled':'')+'><span class="l">'+L+'</span><span>'+esc(q.options[L])+'</span></button>';
  }).join('')+'</div>';
}
function qHead(q){ return '<div class="qmeta">'+domChip(q)+'<span class="chip">Soal #'+q.id+'</span><span class="chip">ExamTopics T'+q.topic+' · Q'+q.qn+'</span></div>'; }

/* ================= PRACTICE HOME ================= */
function showPanel(id){ ['pHome','pExam','pResult','pRandom'].forEach(function(p){ $('#'+p).classList.toggle('hidden', p!==id); }); if(id==='pHome') renderPHome(); window.scrollTo(0,0); }
function domOptions(){ return '<option value="0">Semua domain ('+Q.length+' soal)</option>'+D.chapters.map(function(c){ var n=Q.filter(function(q){return qDom(q)===c.id;}).length; return '<option value="'+c.id+'">Domain '+c.id+' · '+esc(c.title)+' ('+n+')</option>'; }).join(''); }
function pool(dom){ return Q.filter(function(q){ return !dom || qDom(q)===dom; }).map(function(q){ return q.id; }); }
function renderPHome(){
  var hs = store('history')||[];
  var h = '<div class="phead fade"><div><div class="eyebrow">Practice</div><h1>Latihan soal</h1><p class="muted" style="margin:6px 0 0">'+Q.length+' soal dari bank soal komunitas. Kunci &amp; penjelasan merujuk ke AAIA Review Manual.</p></div></div>';
  h += '<div class="modes"><div class="card mode"><div class="ficon">'+I.exam+'</div><h3>Simulasi Ujian</h3><p>Kerjakan dengan timer. Skor dan pembahasan muncul setelah submit.</p>'+
    '<div class="row"><label class="field"><span>Jumlah soal</span><input type="number" id="exN" min="1" max="'+Q.length+'" value="30"></label><label class="field"><span>Durasi (menit)</span><input type="number" id="exM" min="1" value="50"></label></div>'+
    '<div class="presets"><button data-p="10,17">Kilat · 10 soal</button><button data-p="30,50">Standar · 30 soal</button><button data-p="90,150">Full exam · 90 soal / 150 mnt</button></div>'+
    '<label class="field"><span>Fokus domain</span><select id="exD">'+domOptions()+'</select></label>'+
    '<button class="btn primary" id="exStart" style="width:100%">'+I.clock+'Mulai simulasi</button></div>';
  h += '<div class="card mode alt"><div class="ficon">'+I.shuffle+'</div><h3>Explore Random Question</h3><p>Satu soal per layar. Pilih jawaban, reveal, lalu pelajari penjelasan &amp; referensinya.</p>'+
    '<label class="field"><span>Fokus domain</span><select id="rdD">'+domOptions()+'</select></label>'+
    '<label class="field"><span>Urutan</span><select id="rdOrder"><option value="random">Acak</option><option value="seq">Berurutan sesuai nomor soal</option></select></label>'+
    '<button class="btn primary" id="rdStart" style="width:100%">'+I.shuffle+'Mulai explore</button></div></div>';
  if(hs.length){
    h += '<div class="card" style="margin-top:18px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Riwayat simulasi</h3><button class="btn sm ghost" id="clrHist">Hapus riwayat</button></div><div class="spark" style="margin-top:22px">'+
      hs.slice(-20).map(function(r){ return '<div style="height:'+Math.max(4,r.pct)+'%" title="'+esc(r.date)+': '+r.correct+'/'+r.n+'"><span>'+r.pct+'</span></div>'; }).join('')+'</div></div>';
  }
  var root = $('#pHome'); root.innerHTML = h;
  $$('.presets button', root).forEach(function(b){ b.onclick=function(){ var p=b.dataset.p.split(','); $('#exN').value=p[0]; $('#exM').value=p[1]; }; });
  $('#exStart').onclick = startExam;
  $('#rdStart').onclick = function(){ var d=+$('#rdD').value; var ids=pool(d); startRandom($('#rdOrder').value==='seq'?ids:null, d?('Domain '+d):null, ids, $('#rdOrder').value==='seq'); };
  if($('#clrHist')) $('#clrHist').onclick=function(){ if(confirm('Hapus semua riwayat simulasi?')){ store('history', []); renderPHome(); } };
}

/* ================= EXAM ================= */
var exam = null, tick = null;
function startExam(){
  var d = +$('#exD').value, ids = pool(d);
  var n = Math.max(1, Math.min(ids.length, parseInt($('#exN').value,10)||30));
  var m = Math.max(1, parseInt($('#exM').value,10)||50);
  exam = { ids: shuffle(ids).slice(0,n), ans:{}, flag:{}, cur:0, end: Date.now()+m*60000, start: Date.now(), minutes:m, done:false };
  showPanel('pExam'); renderExam();
  clearInterval(tick); tick = setInterval(updTimer, 1000);
  if(n < parseInt($('#exN').value,10)) toast('Domain ini hanya punya '+n+' soal');
}
function updTimer(){
  if(!exam || exam.done) return;
  var left = (exam.end - Date.now())/1000, el = $('#timer');
  if(el){ el.innerHTML = I.clock+fmtTime(left); el.classList.toggle('low', left<60); }
  if(left<=0) submitExam(true);
}
function renderExam(){
  var q = QBY[exam.ids[exam.cur]], n = exam.ids.length, answered = Object.keys(exam.ans).length;
  var h = '<div class="qbar"><div class="row"><b>Soal '+(exam.cur+1)+' <span class="muted">/ '+n+'</span></b><span class="chip">'+answered+' terjawab</span><span class="sp"></span><span class="timer" id="timer"></span><button class="btn primary sm" id="exSubmit">Submit</button></div>'+
    '<div class="bar qprog"><span style="width:'+(answered/n*100)+'%"></span></div></div>';
  h += '<div class="examlay"><div class="card qcard">'+qHead(q)+'<p class="qtext">'+esc(q.question)+'</p>'+optsHtml(q, exam.ans[q.id], false);
  h += '<div class="qnav"><button class="btn" id="exPrev"'+(exam.cur===0?' disabled':'')+'>← Sebelumnya</button><button class="btn ghost" id="exFlag">'+I.flag+(exam.flag[q.id]?'Ditandai':'Tandai')+'</button><span class="sp"></span>'+
       '<button class="btn primary" id="exNext"'+(exam.cur===n-1?' disabled':'')+'>Berikutnya →</button></div></div>';
  h += '<div class="card navcard"><h3>Navigasi soal</h3><div class="muted" style="font-size:13px">'+answered+' dari '+n+' terjawab</div><div class="navgrid">'+exam.ids.map(function(id,i){ var c=[]; if(exam.ans[id]) c.push('ans'); if(exam.flag[id]) c.push('flag'); if(i===exam.cur) c.push('cur'); return '<button class="'+c.join(' ')+'" data-go="'+i+'">'+(i+1)+'</button>'; }).join('')+'</div>'+
    '<div class="legend"><span><i style="background:var(--accent-soft)"></i>Terjawab</span><span><i style="background:var(--warn);border-radius:50%"></i>Ditandai</span></div>'+
    '<p class="hint"><span class="kbd">A</span>–<span class="kbd">D</span> pilih · <span class="kbd">←</span> <span class="kbd">→</span> pindah</p></div></div>';
  var root = $('#pExam'); root.innerHTML = h; updTimer();
  $$('[data-opt]', root).forEach(function(b){ b.onclick=function(){ exam.ans[q.id]=b.dataset.opt; renderExam(); }; });
  $$('[data-go]', root).forEach(function(b){ b.onclick=function(){ exam.cur=+b.dataset.go; renderExam(); }; });
  $('#exPrev').onclick=function(){ exam.cur--; renderExam(); };
  $('#exNext').onclick=function(){ exam.cur++; renderExam(); };
  $('#exFlag').onclick=function(){ exam.flag[q.id]=!exam.flag[q.id]; renderExam(); };
  $('#exSubmit').onclick=function(){ var un = n - Object.keys(exam.ans).length; if(confirm(un ? ('Masih ada '+un+' soal belum dijawab. Submit sekarang?') : 'Submit jawaban sekarang?')) submitExam(false); };
}
function submitExam(timeout){
  if(!exam || exam.done) return;
  exam.done = true; exam.timeout = timeout; exam.used = Math.min(exam.minutes*60, (Date.now()-exam.start)/1000);
  clearInterval(tick);
  exam.correct = exam.ids.filter(function(id){ return exam.ans[id]===QBY[id].answer; }).length;
  var pct = Math.round(exam.correct/exam.ids.length*100);
  var hs = store('history')||[]; hs.push({pct:pct, correct:exam.correct, n:exam.ids.length, date:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'})}); store('history', hs.slice(-30));
  showPanel('pResult'); renderResult('all', true);
}
function renderResult(filter, animate){
  var n = exam.ids.length, c = exam.correct, pct = Math.round(c/n*100);
  var un = exam.ids.filter(function(id){ return !exam.ans[id]; }).length;
  var msg = pct>=80?'Luar biasa! Kamu siap ujian.':pct>=65?'Bagus! Sedikit lagi untuk aman.':pct>=50?'Lumayan — fokuskan ke domain yang lemah.':'Masih perlu latihan — mulai dari Explore Manual.';
  var rc = pct>=65?'var(--ok)':pct>=50?'var(--warn)':'var(--bad)';
  var h = '<div class="card fade">'+(exam.timeout?'<div class="tip" style="margin:0 0 16px">'+I.clock+'<div><b>Waktu habis.</b> Jawaban otomatis di-submit.</div></div>':'')+
    '<div class="rhero"><div class="ring" id="ring" style="--rc:'+rc+';--p:'+(animate?0:pct)+'"><div><div><b id="ringN">'+(animate?0:pct)+'%</b><small>skor</small></div></div></div>'+
    '<div style="width:100%"><div class="eyebrow">Hasil simulasi</div><h1 style="margin:4px 0 0;font-size:26px">'+msg+'</h1>'+
    '<div class="rstats"><div><b style="color:var(--ok)">'+c+'</b><span>benar</span></div><div><b style="color:var(--bad)">'+(n-c-un)+'</b><span>salah</span></div><div><b>'+un+'</b><span>tidak dijawab</span></div><div><b>'+fmtTime(exam.used)+'</b><span>dari '+exam.minutes+' menit</span></div></div>'+
    '<div class="row"><button class="btn primary" id="reNew">Simulasi baru</button><button class="btn" id="reHome">Kembali ke Practice</button></div></div></div>'+
    '<p class="muted" style="font-size:13px;margin:16px 0 0">Ujian AAIA asli memakai scaled score 200–800 (lulus ≥450), jadi persentase ini hanya indikasi.</p></div>';
  var doms = D.chapters.map(function(ch){ var ids = exam.ids.filter(function(id){ return qDom(QBY[id])===ch.id; }); var ok = ids.filter(function(id){ return exam.ans[id]===QBY[id].answer; }).length; return {ch:ch, n:ids.length, ok:ok}; }).filter(function(d){ return d.n; });
  if(doms.length) h += '<div class="card" style="margin-top:16px"><h3 style="margin:0 0 14px">Performa per domain</h3><div class="dbreak">'+doms.map(function(d){ var p=Math.round(d.ok/d.n*100); return '<div class="r d'+d.ch.id+'"><span><span class="dchip">D'+d.ch.id+'</span> '+esc(d.ch.title)+'</span><div class="bar"><span style="width:'+p+'%"></span></div><b>'+d.ok+'/'+d.n+'</b></div>'; }).join('')+'</div></div>';
  h += '<div class="sec-title" style="margin-top:28px"><h2>Review jawaban</h2></div><div class="filter">'+[['all','Semua ('+n+')'],['bad','Salah / kosong ('+(n-c)+')'],['ok','Benar ('+c+')']].map(function(f){ return '<button data-f="'+f[0]+'" class="'+(filter===f[0]?'on':'')+'">'+f[1]+'</button>'; }).join('')+'</div>';
  exam.ids.forEach(function(id, i){
    var q = QBY[id], a = exam.ans[id], ok = a===q.answer;
    if(filter==='ok' && !ok) return; if(filter==='bad' && ok) return;
    var st = ok?'<span class="st ok">'+I.check+'</span>':(a?'<span class="st bad">'+I.x+'</span>':'<span class="st skip">–</span>');
    h += '<details class="rev"><summary>'+st+'<span class="qs"><b>'+(i+1)+'.</b> '+esc(q.question)+'<small>'+domChip(q)+'<span>Jawabanmu: <b>'+(a||'—')+'</b></span><span>Kunci: <b>'+q.answer+'</b></span></small></span>'+I.chev+'</summary><div class="body">'+optsHtml(q, a, true)+renderExplanation(q, a)+'</div></details>';
  });
  var root = $('#pResult'); root.innerHTML = h; bindCommon(root);
  $$('[data-f]', root).forEach(function(b){ b.onclick=function(){ renderResult(b.dataset.f, false); }; });
  $('#reNew').onclick=function(){ exam=null; showPanel('pHome'); };
  $('#reHome').onclick=function(){ exam=null; showPanel('pHome'); };
  if(animate){ var t0=performance.now(); (function step(t){ var k=Math.min(1,(t-t0)/900), v=Math.round(pct*(1-Math.pow(1-k,3))); var r=$('#ring'); if(!r) return; r.style.setProperty('--p', v); $('#ringN').textContent=v+'%'; if(k<1) requestAnimationFrame(step); })(t0); }
}

/* ================= RANDOM EXPLORE ================= */
var rd = null;
function startRandom(ids, label, all, seq){
  var base = ids || all || Q.map(function(q){return q.id;});
  rd = { ids: seq ? base.slice() : shuffle(base), cur: 0, picked: {}, shown: {}, label: label||null };
  showView('practice'); showPanel('pRandom'); renderRandom();
}
function renderRandom(){
  var q = QBY[rd.ids[rd.cur]], picked = rd.picked[q.id], rev = !!rd.shown[q.id];
  var seen = Object.keys(rd.shown), right = seen.filter(function(id){ return rd.picked[id]===QBY[id].answer; }).length;
  var h = '<div class="qbar"><div class="row"><button class="btn sm" id="rdBack">← Practice</button><b>'+(rd.label?esc(rd.label)+' · ':'')+(rd.cur+1)+' <span class="muted">/ '+rd.ids.length+'</span></b><span class="sp"></span><span class="chip">'+I.check+right+' benar dari '+seen.length+' di-reveal</span></div>'+
    '<div class="bar qprog"><span style="width:'+((rd.cur+1)/rd.ids.length*100)+'%"></span></div></div>';
  h += '<div class="card qcard fade" style="max-width:900px;margin:0 auto">'+qHead(q)+'<p class="qtext">'+esc(q.question)+'</p>'+optsHtml(q, picked, rev);
  if(!rev) h += '<div class="qnav"><button class="btn primary" id="rdReveal">'+(picked?'Reveal jawaban':'Reveal tanpa menjawab')+'</button><span class="muted" style="font-size:13px">Pilih opsi dulu untuk menguji diri.</span></div>';
  else h += renderExplanation(q, picked);
  h += '<div class="qnav"><button class="btn" id="rdPrev"'+(rd.cur===0?' disabled':'')+'>← Sebelumnya</button><span class="sp"></span><button class="btn'+(rev?' primary':'')+'" id="rdNext"'+(rd.cur===rd.ids.length-1?' disabled':'')+'>Soal berikutnya →</button></div>'+
    '<p class="hint"><span class="kbd">A</span>–<span class="kbd">D</span> pilih · <span class="kbd">Enter</span> reveal · <span class="kbd">←</span> <span class="kbd">→</span> pindah soal</p></div>';
  var root = $('#pRandom'); root.innerHTML = h; bindCommon(root);
  $$('[data-opt]', root).forEach(function(b){ b.onclick=function(){ rd.picked[q.id]=b.dataset.opt; renderRandom(); }; });
  if($('#rdReveal')) $('#rdReveal').onclick=function(){ rd.shown[q.id]=true; renderRandom(); };
  $('#rdPrev').onclick=function(){ rd.cur--; renderRandom(); window.scrollTo(0,0); };
  $('#rdNext').onclick=function(){ rd.cur++; renderRandom(); window.scrollTo(0,0); };
  $('#rdBack').onclick=function(){ rd=null; showPanel('pHome'); };
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if(e.target.matches('input,select,textarea') || e.ctrlKey || e.metaKey || e.altKey || view!=='practice') return;
  var k = e.key.toUpperCase();
  if(!$('#pExam').classList.contains('hidden') && exam && !exam.done){
    if(LETTERS.indexOf(k)>=0){ exam.ans[exam.ids[exam.cur]]=k; renderExam(); }
    else if(e.key==='ArrowRight' && exam.cur<exam.ids.length-1){ exam.cur++; renderExam(); }
    else if(e.key==='ArrowLeft' && exam.cur>0){ exam.cur--; renderExam(); }
  } else if(!$('#pRandom').classList.contains('hidden') && rd){
    var id = rd.ids[rd.cur];
    if(LETTERS.indexOf(k)>=0 && !rd.shown[id]){ rd.picked[id]=k; renderRandom(); }
    else if((e.key==='Enter'||e.key===' ') && !rd.shown[id]){ e.preventDefault(); rd.shown[id]=true; renderRandom(); }
    else if(e.key==='ArrowRight' && rd.cur<rd.ids.length-1){ rd.cur++; renderRandom(); }
    else if(e.key==='ArrowLeft' && rd.cur>0){ rd.cur--; renderRandom(); }
  }
});
window.addEventListener('beforeunload', function(e){ if(exam && !exam.done){ e.preventDefault(); e.returnValue=''; } });

renderExplore(); renderPHome(); showView('home');
})();
</script>
</body>
</html>
