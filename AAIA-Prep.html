t AI yang dipakai dalam audit. Domain 3 berbobot 21% dari ujian.","objectives":["Mengevaluasi dampak, peluang, dan risiko ketika solusi AI diintegrasikan ke dalam proses audit.","Memanfaatkan solusi AI untuk meningkatkan proses audit, mencakup planning, execution, dan reporting.","Mengevaluasi monitoring dan pelaporan metrik khusus AI (mis. KPI dan KRI).","Mengevaluasi kebutuhan data input bagi model AI (mis. kesesuaian data, bias, dan privasi)."],"parts":[{"id":"A","title":"Audit Planning and Design","overview":"Langkah perencanaan audit AI pada dasarnya sama dengan audit lain, tetapi kompleksitas dan sifat AI yang masih berkembang menuntut pertimbangan tambahan. Fokus part ini: identifikasi aset AI, pemahaman jenis kontrol AI, use case AI untuk audit, dan kesiapan kompetensi tim audit.","sections":[{"num":"3.1","title":"Identification of AI Assets","bookPage":129,"pdfPage":135,"summary":"AIS berbeda dari aset IT tradisional karena tersusun dari banyak komponen (model, versi, dataset, algoritma, tool pihak ketiga, lisensi) dengan banyak owner dan kewajiban hukum. Karena itu identifikasi aset AI melalui AI inventory menjadi langkah kritis, dan auditor menilai kelengkapan serta akurasi proses pembuatan dan pemeliharaan inventaris tersebut.","points":["Satu AIS bukan sekadar satu aplikasi: bisa memiliki beberapa owner, model, dan versi; banyak requirement (termasuk workflow mapping); banyak dataset (training dan data produksi); beberapa algoritma; pertimbangan SDLC berlapis; tool pihak ketiga (mis. MLflow, Kubeflow, Amazon SageMaker, Azure ML); lisensi beragam; serta berbagai kewajiban legal/regulasi.","Identifikasi aset AI (internal maupun eksternal) butuh pendekatan terstruktur yang menggabungkan governance, risk management, IT operations, dan internal audit. Namun internal audit TIDAK boleh memimpin atau mengelola upaya ini; pemimpinnya adalah fungsi yang memimpin AI dan/atau data management.","AI usage policy sering menjadi titik awal yang baik untuk inventaris karena banyak langkah identifikasi sudah dikerjakan saat menyusun kebijakan. Gunakan katalog/inventaris yang sudah ada; inventaris perlu diperbarui minimal setahun sekali, dan bila belum, owner inventaris harus memulai pembaruan.","Organisasi yang mengembangkan produk/layanan AI sendiri sebaiknya membuat dan memelihara AI model catalog.","3.1.1 Inventory Objectives and Procedures: inventaris AI idealnya meniru proses inventaris aset IT yang sudah ada. Tujuannya mengetahui AI yang sedang dipakai, bukan menghukum unit atau karyawan; komunikasi ke seluruh organisasi harus menegaskan tidak ada sanksi atas pengungkapan pemakaian AI, karena hal ini mendukung governance, kolaborasi, dan keamanan.","3.1.2 Inventory and Data Gathering Methods: untuk AIS buatan internal, baseline relatif mudah dibentuk; audit memeriksa apakah prosesnya memanfaatkan dokumen change, deployment, release, dan program/project management. Tim IT/security juga dapat memakai tool discovery seperti data management dan dataflow diagram (DFD), metadata, serta Active Directory/sistem user access management.","Field data standar untuk inventaris: nama AIS, nomor versi, lisensi, biaya, cara deployment (web interface, aplikasi terinstal, API), tujuan AIS, frekuensi penggunaan, stakeholder, owner organisasi yang akuntabel, dan detail vendor/pihak ketiga bila ada.","Surveys: efisien untuk mengumpulkan baseline. Anonimitas parsial mendorong jawaban jujur, tetapi survei yang sepenuhnya anonim cenderung menurunkan akuntabilitas dan motivasi responden untuk mengisi. Pertanyaan kuantitatif yang menghasilkan data terstruktur membuat survei lebih efektif.","Interviews: pertanyaan harus distandardisasi dengan pilihan jawaban baku agar hasilnya bisa diagregasi; pertanyaan open-ended membuat data sulit diolah. Pewawancara perlu follow-up untuk membedakan tool (mis. jawaban 'ChatGPT' vs Claude, Gemini, Copilot) dan mengelompokkan varian jawaban sejenis. Interview kurang berguna untuk baseline, tetapi bermanfaat di area development yang bereksperimen dengan tool AI.","3.1.3 Documentation: harus tersedia artefak yang menjelaskan misi/tujuan organisasi atas AIS (AI policy) dan proses pengelolaannya, idealnya terintegrasi dengan platform asset management (mis. ServiceNow, Jira). Pemeliharaan inventaris AI lebih sulit daripada aset IT biasa karena sifatnya dinamis, adanya Shadow AI (unit bisnis membeli/menerapkan AI tanpa melibatkan IT, mis. screening CV), dan kepemilikan yang terdesentralisasi."],"terms":[{"term":"AI inventory","def":"Repositori yang mencatat dan terus diperbarui berisi detail tools dan sistem AI yang dipakai perusahaan."},{"term":"AI model catalog","def":"Katalog model AI yang perlu dibuat dan dipelihara oleh organisasi yang mengembangkan produk/layanan AI sendiri."},{"term":"Shadow AI","def":"Penggunaan atau penerapan solusi AI oleh unit bisnis tanpa keterlibatan/izin IT, bentuk AI dari shadow IT."},{"term":"AI usage policy","def":"Kebijakan penggunaan AI; sering menjadi titik awal penyusunan inventaris AI."}],"examTip":"Internal audit tidak memimpin pembuatan inventaris AI; auditor menilai kelengkapan dan akurasi prosesnya. Titik awal yang baik adalah AI usage policy atau inventaris yang sudah ada. Ingat tujuan inventaris bersifat non-punitif; jawaban yang menekankan sanksi biasanya salah."},{"num":"3.2","title":"Types of AI Controls","bookPage":131,"pdfPage":137,"summary":"Kontrol AI mencakup aspek governance, teknis, prosedural, dan etis di sepanjang siklus hidup AI (development, training, deployment, operation, decommissioning). Figure 3.1 mengelompokkan kontrol menjadi enam kategori: Governance & Organizational; Technical, Security & Privacy; Operation & Life Cycle Management; SDLC; Legal, Compliance & Regulatory; serta Ethical & Human Values. Prinsip utamanya: auditor memvalidasi kontrol, bukan mengeksekusinya.","points":["Peran auditor: memvalidasi bahwa kontrol dijalankan, misalnya memastikan bias detection tool sudah dipakai dan pengujian fairness sudah dilakukan sesuai requirement, bukan menjalankan tool itu sendiri. Kontrol AI dapat melintasi banyak unit organisasi.","Kontrol teknis dan nonteknis yang ada mungkin perlu diperluas, kontrol baru ditambahkan, dan control framework perusahaan diperbarui untuk risiko AI. Seperti privacy dan cybersecurity, tidak ada satu fungsi tunggal yang bertanggung jawab: policy/standar/prosedur mengarahkan perilaku, arsitektur teknis bersifat preventif, sedangkan monitoring dan continuous improvement mendeteksi serta meminimalkan dampak kejadian negatif.","Governance & Organizational: accountability (charter/terms of reference, RACI atau accountability matrix, owner yang jelas untuk setiap aset AI dan outcome-nya); peran eksekutif (CDO, CAIO, atau fungsi lain sebagai manajer akuntabel); AI policy yang selaras nilai/budaya/misi serta mencakup regulasi, risk management, dan asset management; adopsi standar/framework; AI asset management (AI registry berisi tujuan, stakeholder, outcome, versi, life cycle).","Governance (lanjutan): risk management AI meliputi risk committee khusus, ownership risiko yang jelas, key risk indicators (KRI), laporan independen dari internal/external audit, dan vendor risk management. Kontrak dan perjanjian legal AI harus memastikan vendor/mitra memenuhi kewajiban hukum AI, misalnya kebutuhan consent baru untuk memakai data dalam training model.","Technical, Security & Privacy: data quality (definisi threshold, aturan, penilaian, resolusi isu, dan monitoring kualitas data); access controls (disesuaikan dengan klasifikasi data dan klasifikasi AIS untuk user privileged/nonprivileged, sistem, aplikasi, pihak ketiga; MFA; monitoring dan recertification akses berkala); configuration management (item konfigurasi terdokumentasi, berbasis risiko, dimonitor dan di-patch, sering diotomasi agar kerentanan terdeteksi sebelum dieksploitasi).","Technical (lanjutan): testing frameworks (end-to-end testing, scenario analysis, bias and fairness testing); privacy (protokol transport, encryption, hashing, de-identification, anonymization, key management, logging, IAM, privacy impact assessment berkala, pelaporan); data management (access control, enkripsi, integrity monitoring, konfigurasi database, backup/resiliency, data architecture, data quality termasuk agregasi/integrasi dan optimization, dokumentasi/modeling, data minimization); AI incident management (auditor memeriksa apakah incident response plan atau data breach response plan sudah mencakup produk/layanan AI).","Operation & Life Cycle Management: DFD (logical, physical, context) dan process flow multi-level; dokumentasi pengambilan keputusan AI (explainability, langkah keputusan, dokumentasi end-user, model documentation tentang arsitektur/algoritma/training data/kinerja, dokumentasi compliance dan etika, data traceability termasuk sumber dan consent); version control (validasi data, reproducibility, environment dan containerization, tool otomatis, approval, prosedur release); change management (proses terdokumentasi, delegasi approval termasuk emergency change, recordkeeping, impact assessment, business approval, continuous auditing); continuous monitoring and logging (validasi input, konsistensi/kelengkapan data, model drift).","SDLC: kontrol bergantung pada metodologi yang dipakai (DevOps/DevSecOps berbeda dengan waterfall). Banyak model AI yang tidak pernah sampai di-deploy, umumnya karena requirement tidak jelas/tidak lengkap atau kepemimpinan lemah. Ideation phase: dokumentasi problem space, tujuan yang selaras strategi bisnis, pemahaman potensi harm. Design phase: desain teknis, data management (apakah data dibeli/diakuisisi, data quality, optimization, data fitness yaitu kelengkapan dan representativeness untuk mitigasi bias), requirement dan tipe model. Deployment management: bila paket/kode dipromosikan otomatis setelah commit, area ini harus dimonitor oleh operasi dan diaudit.","Legal, Compliance & Regulatory: risk and impact assessment untuk mengklasifikasi AIS sehingga sistem high-risk dikelola sesuai aturan (mis. EU AI Act, NYC Local Law 144), dan dilakukan berulang karena sistem dan data terus berubah. FRIA wajib bagi sistem high-risk menurut EU AI Act (mis. biometric identification, infrastruktur kritis, pendidikan, ketenagakerjaan, akses layanan esensial publik/privat, penegakan hukum, migrasi/suaka/perbatasan, administrasi peradilan dan proses demokrasi); DPIA khusus risiko privasi dan perlindungan data. Juga: kepatuhan hukum global/nasional/lokal dan industri, kontrak AI, AI whistleblower process untuk melaporkan potensi harm, serta regulatory reporting (AI masuk program compliance, mungkin melalui voluntary 'Code of Practice').","Ethical & Human Values: ethical impact assessment (selaras framework industri atau korporasi; tersedia framework gratis seperti NIST AI RMF, ISO/IEC 42001, IEEE); consent management (hak opt-out dari keputusan AI, kontrol user atas data pribadi, status consent data training, retensi, right to be forgotten); bias management (uji bias terhadap protected characteristics, cek human bias di tim dan requirement, validasi sampling representatif; contoh studi facial recognition menunjukkan error rate jauh lebih tinggi pada kelompok tertentu); transparency & explainability (disclosure penggunaan AI, dokumentasi kapabilitas/limitasi, tool LIME, SHAP, review aturan pada rule-based model); human oversight (proses review keputusan AI oleh manusia, appeal process, ethical review internal yang independen, review fairness metrics)."],"terms":[{"term":"RACI chart","def":"Matriks Responsible, Accountable, Consulted, Informed untuk memperjelas akuntabilitas atas aset/proses AI."},{"term":"CAIO","def":"Chief AI Officer; peran eksekutif yang dapat ditunjuk sebagai manajer akuntabel untuk AI."},{"term":"FRIA","def":"Fundamental Rights Impact Assessment; wajib untuk AI high-risk menurut EU AI Act, menilai dampak pada hak asasi, keselamatan, dan kesehatan."},{"term":"DPIA","def":"Data Protection Impact Assessment; asesmen khusus risiko privasi dan perlindungan data."},{"term":"LIME","def":"Local Interpretable Model-Agnostic Explanations; menjelaskan prediksi individual."},{"term":"SHAP","def":"SHapley Additive exPlanations; memberi feature importance untuk prediksi individual."},{"term":"Model drift","def":"Penurunan/perubahan kinerja model dari waktu ke waktu karena data atau kondisi berubah; dipantau melalui continuous monitoring."},{"term":"Data minimization","def":"Prinsip hanya mengumpulkan dan memproses data seperlunya; bagian dari kontrol data management."}],"examTip":"Auditor VALIDATES, not executes: jika ditanya peran auditor terhadap bias testing, jawabannya memverifikasi bahwa pengujian dilakukan dan hasilnya memenuhi requirement, bukan menjalankan tool sendiri. Bedakan FRIA (hak fundamental, AI high-risk EU AI Act) dari DPIA (privasi). Cek juga apakah incident response plan sudah mencakup AI."},{"num":"3.3","title":"AI Audit Use Cases","bookPage":137,"pdfPage":143,"summary":"AI sudah banyak dipakai auditor, terutama dalam data analytics untuk mengenali pola dan anomali serta memprediksi area berisiko tinggi. Use case dikelompokkan menjadi LLM, audit process improvement, generative AI, dan audit-specific AI applications.","points":["3.3.1 Large Language Models: (a) contract analysis, yaitu menerapkan kriteria uji pada seluruh populasi kontrak, berguna untuk membandingkan layanan pihak ketiga dengan requirement dan SLA kontrak; (b) data analytics, yaitu akses read-only ke beberapa repositori keuangan untuk menguji area yang sebelumnya sulit diuji (mis. accounts payable multi-lokasi, invoice palsu atau ganda); (c) risk assessments, yaitu mengolah laporan internal, eksternal, dan pihak ketiga untuk memprediksi area yang risikonya meningkat agar bisa diaudit secara proaktif.","3.3.2 Audit Process Improvement: mengotomasi audit manual yang repetitif (mis. reconciliation testing) agar auditor fokus pada area yang butuh keahlian; audit resource allocation, yaitu memodelkan kapabilitas/training/minat auditor untuk penugasan, on-the-job training, rotasi demi objektivitas, mencegah kolusi dan burnout.","Process improvement (lanjutan): AI virtual assistant untuk dokumentasi, penulisan temuan, recordkeeping, status report, dan bahkan peer review berdasarkan best practice; NLP untuk merekam, merangkum, dan mengkategorikan wawancara ke working papers serta membandingkan antar-wawancara untuk menemukan gap/inkonsistensi; penyusunan draft laporan audit dari hasil pengujian, dikombinasikan dengan GenAI untuk rekomendasi remediasi.","3.3.3 Generative AI (kuat namun kontroversial): audit planning (riset teknologi baru, identifikasi risiko, usulan area audit, penyesuaian audit plan terhadap risiko emerging) serta penyusunan indicative scope dan pertanyaan wawancara berdasarkan data terkini tentang ancaman, kerentanan, dan risiko.","3.3.4 Audit-specific AI Applications, audit sampling: tool ekstraksi data memungkinkan pengujian 100% populasi (mis. semua tiket change management dibandingkan dengan change policy), mengurangi error auditor dan meningkatkan efektivitas dibanding sampel kecil manual.","Untuk itu audit perlu akses read-only yang 'always on' ke sumber data organisasi, sehingga audit dapat menyediakan data sendiri secara independen dan bergerak menuju continuous auditing; ini juga peluang membangun hubungan dengan data owner/steward.","Pattern recognition pada data keuangan: misalnya otomasi Benford's Law untuk menguji distribusi angka dan mendeteksi data yang difabrikasi atau dimanipulasi.","Anomaly detection: tool seperti SIEM memakai ML untuk baseline behavioral profiling dan analisis perilaku real time; dikombinasikan dengan analisis statistik dapat mendeteksi tren dan memprediksi risiko.","Continuous monitoring dan process automation: pengujian manual bulanan (mis. kartu kredit korporat) dapat diganti alur otomatis, yaitu akses data, ekstraksi, load ke tool, uji terhadap kriteria (duplikasi, fraud, pelanggaran policy), deteksi anomali/pola baru, pembuatan laporan dengan visualisasi, lalu distribusi ke penerima."],"terms":[{"term":"Benford's Law","def":"Pola distribusi digit awal pada data alami; penyimpangannya dapat mengindikasikan data fabrikasi atau manipulasi."},{"term":"Continuous auditing","def":"Pengujian audit otomatis dan berulang atas data secara (hampir) real time, menggantikan pengujian manual periodik."},{"term":"Anomaly detection","def":"Teknik (sering berbasis ML) untuk menemukan perilaku/data yang menyimpang dari baseline normal."},{"term":"Read-only access","def":"Akses data tanpa hak mengubah; memungkinkan audit mengambil data secara independen tanpa mengganggu integritas."}],"examTip":"Akses data audit seharusnya read-only (menjaga independensi dan integritas data). Otomasi tugas repetitif adalah cara BEST mengintegrasikan AI ke audit, tetapi output AI tetap harus divalidasi auditor. Pengujian 100% populasi dengan tool lebih efektif daripada sampel manual kecil."},{"num":"3.4","title":"Internal Training for AI Use","bookPage":139,"pdfPage":145,"summary":"Program edukasi, pengembangan skill, dan pengukuran kompetensi auditor adalah kunci audit AI yang efektif; karena AI terus berubah, pendidikan harus berkelanjutan. Sebelum menyusun program, organisasi perlu menyepakati definisi AI.","points":["Definisi AI yang disepakati bisa merujuk ke thought leadership industri (mis. OECD) atau regulasi (mis. EU AI Act). Karakter penting: sistem AI dibuat untuk dilatih (trained), bukan diprogram seperti aplikasi lain.","Orang awam sering menyebut AI, machine learning, dan deep learning sebagai 'AI'; auditor harus memahami nuansanya saat mewawancarai stakeholder dan mengagregasi data. Hierarki umum (Figure 3.2): DL adalah bagian dari ML, dan ML adalah bagian dari AI.","Istilah dasar (Figure 3.3): AI (sistem yang mensimulasikan kemampuan manusia seperti analisis), AGI (mampu melakukan tugas intelektual apa pun seperti manusia), ANI (terbatas pada domain tertentu), ML (sistem yang melatih model prediktif dari data input).","3.4.1 Key Components for Auditor Knowledge (Figure 3.4): technical knowledge (AI, data, ML, neural networks, NLP, computer vision, ethics, trustworthiness); konsep dan terminologi dasar terkait framework/standar/regulasi; model dan aplikasi AI yang umum dipakai; bias; AI governance; AI ethics; trustworthy AI; AI risk assessment frameworks; audit-specific AI applications; regulasi dan compliance yang relevan.","Bias: karena AI pada dasarnya sangat pandai membedakan, bias sering masuk tanpa disengaja. Menguji outcome AI dan memvalidasi pengujian outcome adalah keterampilan esensial auditor.","AI governance adalah kerangka menyeluruh berisi policy, prosedur, dan kontrol yang mencakup risk management, compliance, akuntabilitas, serta oversight manajemen atas AI.","AI ethics memiliki dua subbidang: applied (menerapkan prinsip moral, yaitu fairness/non-diskriminasi, transparansi dan explainability, privasi, HAM dan well-being, oversight, keamanan, dampak sosial, sustainability) dan theoretical (kajian kewajiban dan dilema moral, mis. consequentialism, virtue ethics, deontology).","Trustworthy AI menekankan AI yang explainable, transparent, fair, robust/reliable, interpretable, accountable, safe, dan secure. Risk assessment AI berbeda dari area lain, misalnya harus mempertimbangkan discriminatory harm akibat training data yang tidak memadai atau diskriminatif.","3.4.2 Practical Skills Development: audit AI membutuhkan gabungan keahlian IT, data science, etika, dan domain industri. Auditor harus memahami security, internal control, dan proses teknologi serta memakai professional judgment untuk memilih metode/test steps dan menentukan perlunya pengujian tambahan; juga perlu pemahaman bisnis untuk menilai keselarasan dengan strategi.","Metode pengembangan skill: hands-on experience, training berkelanjutan yang rutin diperbarui, case study dan skenario nyata (idealnya dikembangkan internal), simulation exercises seperti latihan crisis management/disaster recovery yang menuntut kolaborasi lintas fungsi, serta pakar atau lembaga training eksternal untuk menutup gap pengetahuan."],"terms":[{"term":"AGI","def":"Artificial General Intelligence: AI yang mampu melakukan tugas intelektual apa pun yang bisa dilakukan manusia."},{"term":"ANI","def":"Artificial Narrow Intelligence: AI yang terbatas pada domain/area pengetahuan tertentu."},{"term":"Trustworthy AI","def":"Kerangka agar AI explainable, transparent, fair, robust, interpretable, accountable, safe, dan secure."},{"term":"Applied vs theoretical AI ethics","def":"Applied: penerapan prinsip moral pada pengembangan/penggunaan AI; theoretical: kajian filosofis kewajiban dan dilema moral."}],"examTip":"Definisi AI yang disepakati adalah prasyarat SEBELUM menyusun program training. Jika tim audit kekurangan keahlian AI, jawaban yang tepat biasanya training berkelanjutan dan/atau memakai pakar eksternal (co-source), bukan membatalkan atau mempersempit audit tanpa dasar risiko."}]},{"id":"B","title":"Audit Testing and Sampling Methodologies","overview":"Audit AI memperluas scope audit IS tradisional: apakah outcome berbasis data yang andal dan tidak bias, apakah keputusan dapat dijelaskan, dan apakah outcome menimbulkan risiko/harm. Model (terutama deep learning) sering opaque, sehingga pengujian membutuhkan gabungan keahlian teknis dan judgment, mulai dari desain audit, metodologi uji per tahap life cycle, sampling, hingga pengujian outcome.","sections":[{"num":"3.5","title":"Designing an AI Audit","bookPage":143,"pdfPage":149,"summary":"Seperti audit lain, audit AI dimulai dengan menetapkan scope dan objectives, tetapi wajib memasukkan aspek etika, trustworthiness, dan privasi. Pendekatan top-down yang strategis dipakai untuk fokus pada risiko jangka panjang, bukan sekadar implementasi teknis.","points":["Auditor AI menilai dan melaporkan dimensi yang lebih luas: efisiensi, kontrol operasional, security, safety, kepatuhan regulasi, etika, dan trust dari AIS, plus governance, proses, dan akuntabilitas organisasi terkait AI.","Pengujian tetap berfokus pada risiko dan kontrol AI. Pendekatan scope top-down menuntut auditor berpikir strategis dan holistik agar tujuan bisnis jangka pendek tidak menghambat strategi masa depan.","Fokus audit sebaiknya pada risiko dan dampak jangka panjang investasi AI, seperti ketidakpatuhan regulasi, tantangan etika, kerusakan reputasi, serta keberlanjutan, umur, dan pemeliharaan deployment AI, bukan hanya review teknis/taktis. Contoh: AI dapat mendukung sekaligus menghambat upaya ESG.","Auditor perlu menggunakan judgment, independensi, dan strategic risk management untuk memberi perspektif yang tepat tentang risiko, dampak, atau manfaat jangka panjang.","3.5.1 AI Audit Objectives: memastikan (1) pendekatan konsisten dan terintegrasi yang selaras tujuan perusahaan; (2) keputusan desain dan outcome selaras strategi; (3) project management serta pelaporan dan kontrol keuangan diikuti; (4) proses SDLC diawasi efektif dan transparan; (5) kepatuhan hukum/regulasi tervalidasi; (6) pelaporan operasional tentang outcome, kinerja, kewajiban, dan etika disampaikan ke owner akuntabel dan AI governance committee.","3.5.2 Audit Scoping and Resources: karena auditor harus cepat mempelajari teknologi baru, wajar memakai staf terampil atau advisor eksternal untuk konsultasi atau co-sourcing; mereka membantu menentukan scope dan langkah audit.","Langkah scoping (Figure 3.5): tentukan sistem yang diaudit beserta owner/pihak akuntabel; review asesmen dan hasil pengujian yang sudah ada (second line testing, trustworthy AI/ethical assessment, privacy dan security testing); pastikan seluruh regulasi dan hukum AI yang relevan tercakup dalam perencanaan; peroleh dokumentasi AI (explainability dan transparency, dokumentasi serta hasil ethics dan bias)."],"terms":[{"term":"Top-down approach","def":"Penentuan scope yang dimulai dari tujuan strategis dan risiko organisasi, lalu turun ke sistem dan kontrol."},{"term":"Co-sourcing","def":"Melibatkan pakar eksternal bersama tim internal audit untuk melaksanakan pekerjaan audit."},{"term":"Second line testing","def":"Pengujian oleh fungsi lini kedua (risk/compliance) yang hasilnya dapat direview auditor saat scoping."}],"examTip":"Langkah pertama scoping: identifikasi sistem yang diaudit dan owner/pihak akuntabelnya. Audit AI harus risk-based dan strategis (risiko jangka panjang: regulasi, etika, reputasi), dan etika/privasi tidak boleh di-descope begitu saja."},{"num":"3.6","title":"AI Audit Testing Methodologies","bookPage":144,"pdfPage":150,"summary":"Metodologi pengujian terstruktur memberi assurance bahwa AIS berfungsi sesuai desain, andal, bebas manipulasi/bias, patuh hukum, dan memenuhi tujuan bisnis. Area uji utama (Figure 3.6) adalah definition, development, testing, deployment, dan operations, ditambah pertimbangan khusus untuk financial models.","points":["3.6.1 Definition: memvalidasi bahwa organisasi paham 'apa' solusi AI-nya. Uji business case (goals/objectives, problem statement, business value, proses/produk saat ini, change management, use cases, data sources, timeline) dan dependencies (risiko teridentifikasi, transparansi bagi user internal/eksternal, pertimbangan etika, rencana adopsi/implementasi).","Development: menilai cara AI dibuat dan kelayakan prosesnya, dengan fokus pada data training. Kebutuhan data berbeda antar-algoritma (mis. foundation model butuh dataset luas), dan auditor perlu tahu bagaimana serta dalam kondisi apa data training diperoleh; kinerja dan kecepatan model sangat bergantung pada data.","Data management & sampling: data governance (policy, akses, retensi diikuti dan dilaporkan); full/population testing untuk memastikan data relevan dengan domain dan mencakup edge case, keragaman demografis, dan subgrup; representativeness serta ukuran sampel (mis. 100 dari 1.000 record bisa memadai tergantung kompleksitas); kualitas data ('dirty data': duplikat, error, typo, karakter tak perlu) dan pemantauan berkelanjutan; metode sampling seperti random, manual/haphazard, atau stratified.","Data integration: review metode dan kontrol untuk mengumpulkan, mengagregasi, dan memindahkan data; cek apakah akses terkontrol (mis. API publik tanpa password); verifikasi integritas dengan membandingkan sampel dataset asal dengan dataset hasil integrasi.","Testing: assurance bahwa proses training dan validasi model sound, meliputi model development & tuning (analisis fairness/algorithmic bias, transparansi dan explainability, decision logic, disclosure ke stakeholder, proses opt-out, hak user) serta model performance (seberapa sering prediksi benar, pemenuhan SLA, pengujian kinerja oleh tim; untuk model klasifikasi: F1 score, recall, confusion matrix; auditor sebaiknya di-walkthrough tentang desain dan hasil uji).","Testing (lanjutan): interface/integrasi (UAT, SLA, user feedback, pengalaman auditor); compliance privasi/security/legal/etika/regulasi (kebijakan internal, standar eksternal seperti ISO 27001 dan GDPR, kewajiban yurisdiksi seperti CPRA dan EU AI Act); pertimbangan etika (accountability, transparency, explainability); notifikasi regulator setelah deployment.","Deployment: proses go-live AIS, mencakup release management plan dan rollback plan, training/awareness user internal, public training, proses deployment, dan notifikasi regulator.","Operations: kesiapan operasi dan dukungan berkelanjutan, mencakup dukungan user internal/eksternal, pelaporan kinerja (validasi akurasi model dari waktu ke waktu saat data baru masuk), integrasi operasi-development untuk perbaikan model, serta update/patching model, sistem, dan interface.","3.6.2 Financial Models: journal entry testing diintegrasikan ke pengujian model, yaitu memvalidasi entri otomatis hasil keputusan AI menggunakan model training logs, financial decision logs, dan audit trail (log audit dan error log).","Professional skepticism: seluruh bukti harus dipertanyakan dan divalidasi, misalnya berpikir kritis atas proses development dan kepatuhan kontrol, menanyakan data dan metode pengumpulannya, menggali kemungkinan salah saji karena error/manipulasi/fraud, serta memvalidasi hasil pengujian algoritmik seperti bias."],"terms":[{"term":"F1 score","def":"Metrik kinerja model klasifikasi yang menyeimbangkan precision dan recall."},{"term":"Confusion matrix","def":"Tabel yang membandingkan prediksi model dengan nilai aktual (true/false positive/negative)."},{"term":"Rollback plan","def":"Rencana mengembalikan sistem ke versi sebelumnya jika deployment bermasalah."},{"term":"Professional skepticism","def":"Sikap mempertanyakan dan memvalidasi semua bukti sebelum menerimanya sebagai dasar assurance."},{"term":"Journal entry testing","def":"Pengujian entri jurnal, di sini termasuk entri otomatis yang dihasilkan keputusan AI."}],"examTip":"Hafalkan 5 area uji: definition, development, testing, deployment, operations. Auditor tidak menghitung metrik sendiri; ia meminta walkthrough dan bukti hasil uji dari tim development, lalu memvalidasinya dengan professional skepticism."},{"num":"3.7","title":"AI Sampling","bookPage":147,"pdfPage":153,"summary":"Data AI berukuran sangat besar dan beragam dari banyak sumber, sehingga pengujian seluruh populasi sering tidak mungkin. Auditor tidak diharapkan menghitung ulang kalkulasi model, tetapi harus memilih metode dan ukuran sampel berdasarkan temuan fase desain dan scoping.","points":["Perbedaan utama audit AI dengan audit tradisional adalah volume dan keragaman data; memecah pengujian ke area-area (Figure 3.6) membantu menanganinya.","3.7.1 Data Population Sample Testing: sampel bergantung pada ukuran dan skala data training serta produksi. Full population testing mungkin bisa atau tidak praktis; untuk narrow AI dengan dataset kecil, auditor dapat menguji sampel terpilih.","Untuk sebagian besar model, data terlalu besar untuk diuji langsung, sehingga auditor mengevaluasi proses agregasi dan pengumpulan data, tingkat keyakinan validitas atas tipe dan keragaman data, serta risiko dan kerentanan integrasi data.","Random sampling: data dipilih acak dari seluruh record (mis. memilih 10 dari 100 CV pada AI rekrutmen).","Stratified sampling: sampel dipilih berdasarkan karakteristik data (mis. lama pengalaman di peran tersebut), sehingga setiap subgrup penting terwakili.","Data splitting considerations: bila data sudah dibagi menjadi training-validation-test, sampel dipilih mengikuti rasio pembagian tersebut.","3.7.2 Judgmental Sampling: nonprobability sampling berdasarkan judgment auditor, sehingga butuh subject matter expertise. Teknik ini penting untuk menilai akurasi outcome atau apakah data training benar-benar mewakili populasi deployment (mis. AI diagnosis medis: auditor perlu paham rekam medis dan populasi pasien). Kelemahannya: subjektif dan rentan bias auditor."],"terms":[{"term":"Random sampling","def":"Setiap item punya peluang yang sama untuk terpilih."},{"term":"Stratified sampling","def":"Populasi dibagi ke subgrup berdasarkan karakteristik, lalu sampel diambil dari tiap subgrup."},{"term":"Judgmental sampling","def":"Nonprobability sampling; item dipilih berdasarkan keahlian dan judgment auditor."},{"term":"Data splitting","def":"Pembagian dataset menjadi training, validation, dan test; sampel audit mengikuti rasionya."}],"examTip":"Untuk memastikan training data mewakili populasi deployment yang beragam (banyak subgrup), stratified sampling umumnya jawaban BEST. Judgmental sampling butuh keahlian domain tetapi subjektif. Ingat: auditor tidak me-reperform kalkulasi model."},{"num":"3.8","title":"Testing AI Outcomes","bookPage":148,"pdfPage":154,"summary":"Area khas audit AI adalah memberi assurance bahwa outcome model berjalan sesuai harapan. Fokusnya pada false positive, underfitting/overfitting, outlier, serta realitas bahwa AI mengubah (bukan menggantikan) peran auditor.","points":["3.8.1 Reduce False Positives: auditor tidak menghitung sendiri tingkat false positive, tetapi merujuk hasil pengujian yang dilakukan tim. Isu ini terkait erat dengan overfitting/underfitting, sehingga auditor menanyakan kualitas dan keragaman data training.","Underfitting: model terlalu sederhana untuk menangkap pola, sehingga kinerja buruk pada data training maupun test, dan prediksi yang tidak akurat dapat memunculkan bias. Auditor memastikan ada proses mencari penyebab: masalah data (tidak layak, terlalu sedikit) atau masalah model (tipe salah, parameter terlalu sedikit).","Overfitting: model 'menghafal' data training beserta noise, outlier, dan error-nya, sehingga sangat baik pada data training tetapi buruk pada data baru/dunia nyata. Auditor memvalidasi proses training serta analisis hasil training vs test; model overfit yang di-deploy dapat menghasilkan prediksi keliru dan bias.","3.8.2 Outliers: nilai yang menyimpang dari distribusi normal atau terlalu besar/kecil dibanding data sejenis. Outlier harus diuji pada data training, validation, test, dan selama training karena bukan sekadar noise dan dapat menggagalkan proses training.","Auditor memverifikasi bahwa tools/teknik deteksi outlier telah dipakai dan outlier yang tersisa memang disengaja (by design). Saat mengambil sampel, auditor dapat memuat data training ke Excel, Power BI, atau Tableau untuk melihat pola distribusi berdasarkan parameter model.","3.8.3 Reduce Workforce Needs: analitik otomatis sudah menggantikan sebagian pengujian keuangan manual dan tren ini akan meningkat. Namun auditor tetap dibutuhkan untuk memvalidasi pekerjaan AI dan akurasi data yang mendasari output-nya."],"terms":[{"term":"False positive","def":"Hasil yang ditandai positif/bermasalah oleh model padahal sebenarnya tidak."},{"term":"Underfitting","def":"Model terlalu sederhana; kinerja buruk di data training dan data test."},{"term":"Overfitting","def":"Model terlalu pas dengan data training (termasuk noise); bagus di training, buruk pada data baru."},{"term":"Outlier","def":"Data yang menyimpang jauh dari distribusi normal; harus dideteksi dan dipastikan disengaja."}],"examTip":"Overfit = training bagus, data baru buruk; underfit = buruk di keduanya. Peran auditor adalah memvalidasi proses dan mengutip hasil pengujian, bukan menghitung ulang false positive. AI tidak menggantikan auditor, karena validasi output AI tetap tugas manusia."},{"num":"3.9","title":"Sample AI Audit Process","bookPage":149,"pdfPage":155,"summary":"Contoh proses audit atas AI rekrutmen yang tergolong high-risk menurut EU AI Act. Alurnya (Figure 3.7): Scoping, Data Collection, Model Assessment, Bias & Fairness Assessment, Transparency & Explainability, Performance & Outcomes, Compliance Assessment, Reporting, Remediation, lalu Monitoring.","points":["Konteks: AI menerima CV/lamaran dan menentukan kandidat yang 'acceptable' untuk diwawancara. Istilah netral 'acceptable' dipakai karena AI seharusnya mengidentifikasi kandidat berdasarkan peran dan kriteria, sementara proses rekrutmen tetap memerlukan human oversight agar hasil konsisten dan adil.","Scoping: model screening kandidat, sumber data (lamaran, cover letter, CV, profil media sosial), proses keputusan memilih kandidat dan memprediksi keberhasilan peran, serta hukum terkait (equal employment opportunity dan hukum AI).","Data collection: review sumber dataset training (data historis rekrutmen, demografi kandidat, data protected class, kinerja karyawan yang direkrut); verifikasi kelengkapan, keragaman, dan bebas error dengan menilai proses akuisisi data dan sample testing terhadap catatan HR; tanyakan hasil asesmen data management dan privasi; pastikan kandidat memberi consent.","Model assessment: tanyakan cara model dirancang dan dilatih; nilai arsitektur (decision tree, neural network), explainability, dan dataflow; review dokumentasi hyperparameter; evaluasi metrik seperti akurasi dan F1 score, termasuk alasan pemilihan nilai/ambang metrik tersebut.","Bias & fairness: tanyakan bagaimana etika dimasukkan dalam development; analisis disparitas output berdasarkan gender, etnis, usia, atau protected class lain. Contoh indikasi bias: proporsi pria di antara kandidat 'acceptable' jauh lebih tinggi daripada proporsi pria di seluruh pelamar.","Transparency & explainability: review dokumentasi yang menjelaskan mengapa kandidat tertentu direkomendasikan, dan pastikan kriteria seleksi (mis. skor skill tertentu) dikomunikasikan dengan jelas.","Compliance: verifikasi data pribadi dan protected class diproses secara sah, transparan, dan untuk tujuan tertentu; cek lokasi deployment (lokal vs dapat diakses global via internet) dan kepatuhan pada regulasi yang berlaku ekstrateritorial.","Performance & outcomes: pastikan hasil konsisten sejak tahap training; ini evaluasi jangka panjang karena keberhasilan mungkin baru terlihat setelah lama di produksi. Bandingkan dengan metode tradisional (mis. retensi karyawan hasil AI vs non-AI). Bisa digabung dengan model assessment, atau menjadi fase terpisah bagi vendor yang menjual AI rekrutmen.","Reporting: dokumentasikan scope, objektif, regulasi, bias, isu compliance/kinerja/etika/akuntabilitas beserta rekomendasi (mis. retrain model dengan data lebih beragam); peroleh persetujuan dan ownership manajemen atas laporan.","Remediation & monitoring: rekomendasi menjadi action yang diselesaikan manajemen dan dilaporkan ke stakeholder; progres dilacak melalui aplikasi/mekanisme yang dikelola fungsi yang tepat (mis. risk management atau internal audit)."],"terms":[{"term":"Protected class","def":"Karakteristik yang dilindungi hukum dari diskriminasi (mis. gender, etnis, usia)."},{"term":"Hyperparameter","def":"Parameter pengaturan training model yang ditetapkan sebelum training; dokumentasinya direview auditor."},{"term":"Disparate outcome","def":"Perbedaan hasil yang tidak proporsional antar kelompok sebagai indikasi potensi bias."}],"examTip":"Perhatikan urutan proses: scoping lebih dulu, reporting sebelum remediation dan monitoring. Remediasi (mis. retraining model) adalah tanggung jawab manajemen; auditor merekomendasikan dan memantau, tidak mengerjakannya sendiri. Kepemilikan manajemen atas temuan harus diperoleh."}]},{"id":"C","title":"Audit Evidence Collection Techniques","overview":"Audit AI tetap membutuhkan bukti yang memadai; banyak teknik konvensional masih relevan, tetapi ada nuansa khusus AI. Part ini membahas jenis data (training, testing, produksi), teknik pengumpulan data, walkthrough dan wawancara, serta tools pengumpulan berbasis AI.","sections":[{"num":"3.10","title":"Data Collection","bookPage":153,"pdfPage":159,"summary":"Data adalah fondasi pembelajaran dan kinerja model; tanpa data, model tidak punya bahan untuk bekerja. Sumber data seharusnya teridentifikasi di business case, dan dalam pengembangan AI ada tiga set data utama: training, validation, dan testing. Section ini juga membahas unstructured/structured data, ETL, manipulasi data, dan scraping.","points":["3.10.1 Training Data: data tempat model belajar pola dan relasi. Pada supervised learning data memiliki pasangan input-output berlabel; pada unsupervised learning tidak ada label sehingga model menemukan pola sendiri. Bentuknya bisa gambar, teks, audio, dan lain-lain (structured, unstructured, semi-structured); harus berkualitas tinggi dan representatif, yang juga membantu mencegah overfitting.","Pertanyaan auditor tentang training data: data apa yang dipakai, apakah representatif, apakah overfitting/underfitting terdeteksi, apakah butuh consent dan apakah bukti consent disimpan.","3.10.2 Testing Data: data untuk menguji fungsi, kinerja, dan prediksi model terhadap skenario nyata. Training data dan testing data berbeda fungsi dan harus dipisahkan. Synthetic data adalah data uji yang dihasilkan AI (bisa teranonimisasi, dirancang beragam), misalnya dengan deep learning plus GAN atau VAE. Pertanyaan: apakah test data terpisah dari training data, dan bagaimana synthetic data dibuat?","Production data: data untuk model yang sudah di-deploy, bisa dikumpulkan dari populasi (mis. wearable), dibeli, crowdsourced, atau berasal dari sumber internal. Pertanyaan: data apa yang dipakai, bagaimana sumbernya, dan bagaimana dipantau agar model tidak drift.","3.10.3 Unstructured Data Collection: data tanpa struktur/skema/data dictionary, dengan sumber seperti file share, dokumen Office/flat/text file, audio, video, gambar, media sosial, website, dan metadata. Auditor perlu memperhatikan lokasi data dan pembatasan aksesnya; contoh risiko: salah konfigurasi membuat Microsoft Copilot mengindeks share yang dibatasi lalu memakai isinya untuk menjawab pertanyaan internal.","3.10.4 Structured Data Collection: data berformat baku di database relasional dengan schema dan data dictionary (tipe, ukuran, format, relasi), sering di-query untuk transaction testing. Audit kini membangun data store sendiri (termasuk data historis) untuk analitik dan continuous auditing, sehingga audit menjadi target pelaku jahat internal/eksternal dan wajib melindungi data store tersebut sesuai kebijakan, standar audit, dan hukum.","3.10.5 Extract, Transform, and Load (ETL): data diekstrak ke repositori yang dikelola audit, ditransformasi/'dibersihkan' agar siap dianalisis, lalu di-load ke sistem target untuk query dan analisis. Tool populer: ACL, Tableau, Power BI. Dengan AI, ETL bisa diotomasi end-to-end (butuh coding). Tren AI agent: mis. agent memantau sistem HR, mengekstrak data karyawan baru, memvalidasi, mendeteksi perubahan, lalu menjalankan uji user access certification/recertification.","3.10.6 Data Manipulation: (a) bias, karena manusia (developer, data scientist, bahkan auditor) inheren bias dalam memilih data sehingga hasil bisa merugikan kelompok tertentu; (b) data poisoning, yaitu penyerang menyisipkan data untuk membelokkan output, yang dapat dideteksi dengan kontrol data management; (c) adversarial attacks, yaitu manipulasi input untuk menipu model (sangat berbahaya bagi LLM), yang dapat diuji dengan tool seperti LLMFuzzer. Kapabilitas AI internal audit sendiri juga rentan terhadap serangan serupa.","3.10.7 Scraping: mengumpulkan data dari banyak website ke satu tempat; kurang efektif dibanding API pada website modern yang dinamis, tetapi berguna untuk LLM yang butuh data sangat besar. Pertanyaan: bagaimana data di-scrape dan divalidasi, seberapa efisien (apakah script sering harus di-tune), dan apakah ada intervensi manual untuk membersihkan data yang bisa menimbulkan risiko integritas."],"terms":[{"term":"Training data","def":"Data yang dipakai model untuk belajar pola dan relasi."},{"term":"Testing data","def":"Data terpisah untuk menguji fungsi dan kinerja model pada skenario nyata."},{"term":"Synthetic data","def":"Data uji yang dihasilkan AI (mis. via GAN/VAE), bisa teranonimisasi dan dirancang beragam."},{"term":"ETL","def":"Extract, Transform, Load: proses mengambil, membersihkan, dan memuat data untuk dianalisis."},{"term":"Data poisoning","def":"Serangan dengan menyisipkan data berbahaya ke data training untuk membelokkan output model."},{"term":"Adversarial attack","def":"Manipulasi input untuk menipu model agar membuat keputusan salah atau output berbahaya."},{"term":"Supervised vs unsupervised learning","def":"Supervised memakai data berlabel input-output; unsupervised menemukan pola tanpa label."}],"examTip":"Testing data harus terpisah dari training data. Verifikasi consent atas data training. Data store yang dibangun audit juga merupakan aset berisiko yang wajib diamankan. Synthetic data adalah opsi bila data kurang."},{"num":"3.11","title":"Walkthroughs and Interviews","bookPage":155,"pdfPage":161,"summary":"Walkthrough dan wawancara esensial untuk memperoleh informasi selengkap mungkin secara kolaboratif. Auditor sebaiknya mengumpulkan data secara independen bila memungkinkan, tetapi tetap perlu berdiskusi dengan stakeholder; audit AI memiliki area fokus khusus yang dirangkum dalam Figure 3.9.","points":["3.11.1 Designing Walkthrough and Interview Questions: walkthrough dilakukan beberapa kali sepanjang audit untuk memahami organisasi dan mengonfirmasi kontrol internal. Urutan umum: permintaan dokumentasi, review dokumen, lalu walkthrough oleh personel kunci.","Walkthrough membantu auditor melihat potensi kelemahan kontrol dan mengevaluasi desain serta implementasi kontrol; wawancara personel yang terlibat dalam development dan deployment adalah komponen kuncinya.","General AI context & business: tujuan dan konteks bisnis AI, masalah yang diselesaikan, user dan stakeholder (apakah dikonsultasikan saat desain), regulasi, asumsi, business case, dampak sosial positif/negatif, asesmen risiko (project dan model risk, metodologi, keterkaitan dengan risk management organisasi, risk register, potensi harm pada individu/kelompok/lingkungan, HAM, remediasi, reassessment sepanjang life cycle), pelaporan proyek, dan siapa yang akuntabel atas keputusan model.","Data collection: apakah ada data register, data apa yang dipakai untuk training, dari mana dan bagaimana diperoleh, bagaimana kualitasnya dievaluasi, apakah consent diperoleh, serta apakah kebijakan internal dan persyaratan privasi/regulasi dipatuhi.","Model assessment: preprocessing (cleaning, anonymization dan validasinya, ukuran/keragaman data, outlier); algoritma (alasan pemilihan, buatan in-house, register algoritma); outcome dan explainability (bisa dijelaskan ke nonteknis, disclosure bahwa user berinteraksi dengan AI, model register, cara pengujian outcome); security testing (adversarial prompt/injection, data leakage); automated testing (mis. pytest, PyTorch Lightning, TensorFlow Extended, GitHub Actions) dan pengujian berkelanjutan.","Model assessment (lanjutan): proteksi kode algoritma/model (siapa memvalidasi, siapa boleh rilis ke produksi, version management, apakah keputusan model bisa diubah); human oversight dalam pengambilan keputusan; pengukuran kinerja dan pengujian iteratif untuk mendeteksi model drift; frekuensi rilis dan cara maintenance.","Bias & fairness: keselarasan AI dengan nilai organisasi; penggunaan protected class/atribut sensitif; apakah model membuat keputusan sensitif (infrastruktur kritis, penegakan hukum, biometrik, migrasi, layanan esensial, transportasi, pendidikan, peradilan, rekrutmen); langkah identifikasi dan remediasi bias data; pengujian edge case dan kelompok beragam serta re-evaluasi; penanganan dan pelaporan anomali; keterlibatan stakeholder beragam; pelaporan bias/fairness berkelanjutan.","Performance & outcomes: ukuran kinerja yang ditetapkan, alasannya, dan sumber nilainya (F1 score, recall, confusion matrix); cara mengevaluasi hasil; pengujian 'real-world' dan penggunaan data nyata; stress testing (kondisi beban, edge case, anomali).","Compliance assessment: cara menentukan hukum yang relevan, compliance register, status kepatuhan dan pelaporannya (ke siapa, seberapa sering), kewajiban memberi tahu regulator/market surveillance body dan conformity assessment (EU AI Act), informasi hak stakeholder (contest keputusan, opt-out), serta proses pelaporan insiden atau breach.","Daftar pertanyaan Figure 3.9 juga dipakai sebagai kerangka QA untuk menilai kelengkapan scope dan test plan (lihat 3.18)."],"terms":[{"term":"Walkthrough","def":"Penelusuran proses/kontrol bersama personel kunci untuk memahami dan mengonfirmasi desain serta implementasi kontrol."},{"term":"Model/algorithm/data register","def":"Daftar terkelola atas model, algoritma, dan dataset yang digunakan organisasi."},{"term":"Conformity assessment","def":"Penilaian kesesuaian AI high-risk terhadap persyaratan EU AI Act sebelum digunakan/dipasarkan."},{"term":"Data leakage","def":"Kebocoran data sensitif melalui model atau output-nya; termasuk area pengujian keamanan."}],"examTip":"Walkthrough biasanya didahului review dokumentasi dan bertujuan menilai desain dan implementasi kontrol. Wawancara penting, tetapi auditor tetap mengutamakan bukti yang dikumpulkan secara independen bila memungkinkan."},{"num":"3.12","title":"AI Collection Tools","bookPage":159,"pdfPage":165,"summary":"Fungsi audit mulai memakai tools pengumpulan bukti yang memiliki komponen AI, seperti data analysis tools, perekam suara/rapat, serta data collection dan ETL tools. Manfaatnya besar, tetapi ada risiko privasi dan integritas yang harus dikelola.","points":["3.12.1 Using AI to Collect Logs: log yang dikumpulkan dengan AI sangat berguna untuk audit teknologi dan keamanan. SIEM sudah lama memakai berbagai algoritma ML untuk identifikasi, analisis, dan threat hunting atas volume log yang besar, dan log teragregasi membantu pengujian auditor.","3.12.2 Voice to Text: dipakai untuk merekam dan merangkum catatan wawancara, mendokumentasikan rapat untuk analisis, atau pattern matching.","Risiko voice to text: beberapa tool memproses audio di luar lingkungan organisasi (offsite), sehingga data keluar dari kendali audit dan menimbulkan isu integritas serta privasi. Di beberapa yurisdiksi diperlukan consent narasumber untuk merekam/memproses/menyimpan, dan pemrosesan offsite bahkan dapat dianggap breach.","3.12.3 Optical Character Recognition (OCR): mengubah teks cetak menjadi format digital yang dapat diolah; teknologi lama (sejak 1914) yang akurasinya meningkat drastis berkat AI.","Use case OCR untuk audit: memindai dokumen dalam volume besar dan mengekstrak fakta kunci, misalnya membaca semua kontrak IT, membuat matriks SLA, membandingkannya dengan data kinerja IT, dan langsung melaporkan vendor yang tidak memenuhi target SLA, jauh lebih cepat dan minim error dibanding pembacaan manual."],"terms":[{"term":"SIEM","def":"Security Information and Event Management: sistem agregasi dan analisis log keamanan berbasis ML."},{"term":"OCR","def":"Optical Character Recognition: konversi teks cetak/hasil pindai menjadi teks digital."},{"term":"Voice to text","def":"Konversi ucapan menjadi teks, mis. untuk notulen wawancara audit."}],"examTip":"Sebelum memakai tool AI pihak ketiga/cloud (mis. voice to text), auditor harus memastikan consent dan lokasi pemrosesan data; data audit yang keluar dari kendali organisasi adalah risiko privasi dan integritas."}]},{"id":"D","title":"Audit Data Quality and Data Analytics","overview":"Kualitas data krusial bukan hanya bagi model AI tetapi juga bagi audit itu sendiri. Auditor berperan memberi assurance atas data quality sekaligus memastikan AI yang dipakai tim audit memenuhi standar data yang tinggi; part ini juga membahas data analytics dan data reporting.","sections":[{"num":"3.13","title":"Data Quality","bookPage":161,"pdfPage":167,"summary":"Proses data quality menilai sejauh mana dataset memenuhi standar accuracy, completeness, validity, consistency, uniqueness, timeliness, dan fitness for purpose. Data quality, data integrity, dan data profiling saling terkait dan menjadi fondasi keberhasilan AI maupun audit AI.","points":["Data quality penting bagi banyak fungsi: AI, audit, dan data governance (lihat juga 2.1 Data Collection).","Hubungan tiga konsep (Figure 3.10): data integrity hanya mencakup sebagian atribut data quality, yaitu accuracy, consistency, completeness, ditambah aspek keamanan berupa safeguard terhadap manipulasi atau korupsi data yang tidak sah, baik karena human error maupun aktor jahat.","Keseimbangan data quality, data profiling, dan data integrity menentukan keberhasilan jangka panjang deployer AI; kegagalan di salah satu area dapat menyeret pengembangan dan deployment komersial AI menuju kegagalan.","3.13.1 Data Optimization: memastikan data akurat, andal, dan dapat diakses untuk analisis dan keputusan AI, dengan teknik data cleaning, integration, enrichment, dan transformation. Dasar data management dan kontrol yang benar mempercepat pengembangan dan deployment AI.","Aspek data optimization (Figure 3.11): data governance (menjaga kualitas, keamanan, kepatuhan); data storage (efisiensi ruang); data processing (kecepatan transformasi dan komputasi); data cleaning dan quality improvement (inkonsistensi, error, missing value); data integration (menyatukan banyak sumber); data life cycle management (ketersediaan hingga disposal); query dan access (performa database); cost; data security dan compliance (akses, enkripsi, auditing); scalability."],"terms":[{"term":"Data quality","def":"Tingkat pemenuhan standar accuracy, completeness, validity, consistency, uniqueness, timeliness, dan fitness for purpose."},{"term":"Data integrity","def":"Subset data quality (accuracy, consistency, completeness) ditambah perlindungan dari perubahan/korupsi yang tidak sah."},{"term":"Data profiling","def":"Analisis struktur, isi, dan karakteristik data untuk memahami kualitasnya."},{"term":"Data optimization","def":"Upaya membuat data akurat, andal, dan mudah diakses melalui cleaning, integration, enrichment, transformation."}],"examTip":"Bedakan data quality (banyak dimensi) dari data integrity (accuracy/consistency/completeness plus proteksi dari manipulasi). Jika soal menyebut perlindungan dari perubahan tidak sah, jawabannya mengarah ke integrity."},{"num":"3.14","title":"Data Analytics","bookPage":162,"pdfPage":168,"summary":"Data analytics adalah interogasi data untuk menghasilkan insight yang faktual dan actionable menggunakan beragam tools, teknik, dan proses. AI memungkinkan audit mengotomasi pengujian dan pelaporan sehingga auditor punya lebih banyak waktu untuk area strategis.","points":["Ketergantungan audit pada data analytics terus meningkat; beberapa audit manual dan repetitif dapat dihilangkan, mis. technical change management, analisis kartu kredit korporat, accounts payable, dan fraud detection.","Setelah auditor melatih model untuk menjalankan pengujian, mengotomasinya, dan mengotomasi pembuatan laporan, waktu auditor dapat dialihkan ke area seperti strategi dan project auditing.","3.14.1 Sentiment Analysis (opinion mining): menganalisis volume teks besar untuk menentukan apakah opini bernada positif, negatif, atau netral (disebut polarity); umum dipakai memantau media sosial dan tren opini publik terhadap perusahaan.","Kegunaan bagi auditor: menelaah feedback survei atau dokumen untuk melihat perubahan kepuasan/reputasi, memvalidasi keberhasilan deployment AI, atau menangkap persepsi stakeholder terhadap penggunaan AI oleh perusahaan.","Jenis sentiment analysis: rule-based (mengklasifikasi kata kunci tertentu dalam teks) dan ML-based (algoritma seperti linear regression, Naive Bayes, support vector machine, deep learning yang menganalisis kata dan urutannya)."],"terms":[{"term":"Data analytics","def":"Interogasi data untuk menghasilkan insight faktual dan actionable."},{"term":"Sentiment analysis","def":"Opinion mining: klasifikasi opini dalam teks menjadi positif, negatif, atau netral."},{"term":"Polarity","def":"Klasifikasi arah sentimen (positif/negatif/netral) dalam sentiment analysis."}],"examTip":"Sentiment analysis cocok untuk menilai persepsi stakeholder atau keberhasilan deployment AI dari feedback tekstual. Manfaat utama analitik/otomasi bagi audit: menggeser waktu auditor dari pengujian repetitif ke area berisiko dan strategis."},{"num":"3.15","title":"Data Reporting","bookPage":163,"pdfPage":169,"summary":"Data reporting adalah pengumpulan dan perangkuman insight dari AI dan/atau data analytics untuk mendukung keputusan dan outcome bisnis yang lebih baik. Intinya adalah data visualization, yang disajikan dalam bentuk laporan dan dashboard.","points":["Data visualization adalah representasi grafis atas pola fakta yang ditemukan dalam analisis data.","Tools visualisasi berbayar maupun gratis: R Studio, Python (library seperti Pandas, Matplotlib, Plotly), Microsoft Excel, Microsoft Power BI, dan Tableau.","3.15.1 Reports: analitik menghasilkan laporan defect dan temuan yang mengidentifikasi risiko, gap kontrol, dan kegagalan proses. Tableau dan Power BI dapat membuat laporan atau dashboard temuan audit, misalnya laporan continuous audit bulanan atas kerentanan server (Figure 3.12).","3.15.2 Dashboards: output dari analisis dan visualisasi data yang dipakai untuk proses bisnis, keputusan, dan kemitraan; dapat ditampilkan via web, diekspor ke sistem lain, dicetak, atau dibawa ke PowerPoint, dan umumnya extensible melalui mekanisme reporting.","Dashboard metrik AI (KPI/KRI) memberi snapshot kinerja dan risiko yang berguna untuk memantau kinerja kontrol AI, sejalan dengan task statement Domain 3 tentang monitoring dan pelaporan metrik AI."],"terms":[{"term":"Data visualization","def":"Representasi grafis atas pola atau fakta hasil analisis data."},{"term":"Dashboard","def":"Tampilan ringkas hasil analisis dan visualisasi untuk memantau metrik dan mendukung keputusan."},{"term":"KPI / KRI","def":"Key Performance Indicator / Key Risk Indicator: metrik kinerja dan metrik risiko."}],"examTip":"Untuk melihat kinerja kontrol AI secara berkelanjutan, dashboard metrik (KPI/KRI) lebih tepat daripada dokumen asesmen statis. Untuk visualisasi data dalam volume besar, tool seperti Tableau atau Power BI lebih sesuai daripada spreadsheet."}]},{"id":"E","title":"AI Audit Outputs and Reports","overview":"Laporan audit AI memiliki kedalaman yang sama dengan laporan audit konvensional, ditambah data dan poin laporan khusus AI. Part ini mencakup struktur laporan, advisory report, visualisasi dan heat map, follow-up, serta quality assurance.","sections":[{"num":"3.16","title":"Reports","bookPage":165,"pdfPage":171,"summary":"Figure 3.14 memberi contoh isi laporan audit AI (tidak exhaustive dan bergantung pada perusahaan): executive summary, scope dan objectives, metodologi, detailed findings, serta appendices. Section ini juga membahas advisory report, chart/visualisasi, dashboard, dan heat map.","points":["Executive summary: ringkasan temuan kunci dan action items, kesimpulan dan opini audit, serta overall audit rating.","Scope & objectives: akuntabilitas, sistem, model, data, proses, dan kontrol yang masuk scope.","Methodology: data management (quality, integrity, privacy); model performance testing (ukuran kinerja seperti F1 score, hasil bias dan fairness, transparency dan explainability, security testing); technology & process testing (SDLC, change, configuration, release management); hasil ethical testing; compliance (internal terhadap policy/prosedur, eksternal terhadap kewajiban).","Detailed findings dikaitkan dengan pemetaan risk assessment dan controls assessment; disertai rekomendasi action item dan timeline remediasi (dengan pertimbangan praktis operasional dan finansial), owner serta tanggapan manajemen. Appendices memuat detail teknis atau statistik.","3.16.1 Advisory Reports: dihasilkan dari consulting engagement internal audit, yang kontroversial tetapi makin dibutuhkan. Auditor berada di luar rantai manajemen normal (CAE melapor ke board/audit committee) namun memahami organisasi, proses, orang, dan teknologinya, sehingga memberi perspektif kritis 'dari dalam' yang tidak dimiliki konsultan eksternal dan dapat mengurangi konsekuensi tak terduga pengembangan AI.","Advisory juga membantu auditor membangun pengetahuan desain/produk/development AI untuk audit berikutnya dan memperkuat kolaborasi, karena AI melibatkan stakeholder dari hampir semua unit.","Pertimbangan advisory: scope, karena advisory bukan audit sehingga tujuan harus diformalkan, didokumentasikan, dan disepakati, termasuk penerima laporan (komite, sponsor, eksekutif), timeline deliverable, dan jalur komunikasi; risk considerations, yaitu auditor memberi saran risk management dan perbaikan kontrol, boleh mendampingi remediasi, asalkan tidak mendesain kontrol atau mengambil alih kepemilikan proses/kontrol.","3.16.2 Charts and Visualizations: semua visualisasi analisis data disertakan, baik di badan laporan untuk menyorot insight maupun dikelompokkan di appendix dan dirujuk. Dashboard sangat penting bagi stakeholder audit, audit committee, dan board untuk menangkap poin penting dengan cepat, dan penggunaannya (termasuk yang dibuat AI agent/assistant) akan meluas.","Heat map design: heat map dibuat dari rating standar dalam metodologi audit departemen, atau dari risk management framework bisnis; keduanya dapat menjadi bagian rutin pelaporan audit."],"terms":[{"term":"Advisory report","def":"Laporan hasil consulting engagement internal audit; bukan opini audit/assurance."},{"term":"Overall audit rating","def":"Penilaian keseluruhan hasil audit yang dimuat di executive summary."},{"term":"Heat map","def":"Visualisasi tingkat risiko/rating berbasis warna, mengacu pada metodologi audit atau framework risiko bisnis."},{"term":"CAE","def":"Chief Audit Executive; melapor ke board atau audit committee."}],"examTip":"Dalam advisory/consulting, auditor tidak boleh mendesain kontrol atau mengambil ownership proses, karena itu akan merusak independensi. Temuan harus dikaitkan dengan risiko dan kontrol, serta memuat respons dan owner dari manajemen."},{"num":"3.17","title":"Audit Follow-up","bookPage":167,"pdfPage":173,"summary":"Follow-up sangat penting dalam audit AI dan bisa berbeda dari follow-up konvensional. Auditor yang mengikuti proyek dan deployment AI dapat mengamati remediasi saat berlangsung sehingga dapat menutup action terbuka lebih cepat.","points":["Setelah laporan terbit dan tracking dimulai, auditor yang terlibat mengikuti proyek AI dapat melihat remediasi secara langsung dan mempercepat penutupan temuan.","Tracking action remediasi idealnya memakai aplikasi/mekanisme yang dikelola fungsi yang tepat (mis. risk management atau internal audit) dan statusnya dilaporkan ke stakeholder (lihat 3.9).","3.17.1 Automated Follow-up: seiring makin terintegrasinya sistem, kegiatan follow-up dapat diotomasi, dan validasi atas action item yang ditutup dapat dialihkan ke sistem."],"terms":[{"term":"Audit follow-up","def":"Pemantauan dan verifikasi bahwa action remediasi manajemen atas temuan audit telah diselesaikan."},{"term":"Automated follow-up","def":"Validasi otomatis oleh sistem bahwa action item telah ditutup."}],"examTip":"Manajemen yang melaksanakan remediasi; auditor memverifikasi penyelesaiannya (manual atau otomatis), bukan melakukan perbaikannya."},{"num":"3.18","title":"Quality Assurance","bookPage":167,"pdfPage":173,"summary":"QA penting bagi internal audit secara umum dan audit AI. Seorang pemimpin senior ditunjuk sebagai QA reviewer untuk menilai pemenuhan standar kualitas kerja (IIA dan lainnya) dan mendorong continuous improvement, sementara external QA dilakukan berkala oleh pihak independen.","points":["Internal audit menunjuk senior leader sebagai QA reviewer yang menilai seberapa baik departemen memenuhi standar kualitas kerja, proses, dan praktik; QA menjadi penahan (stopgap) terhadap kegagalan memenuhi standar IIA dan badan lain serta kelengkapan dokumentasi.","QA juga sarana continuous improvement: seluruh proses dan personel audit tercakup, dan rekomendasi eksternal diterapkan untuk memperbaiki fungsi audit atau menyesuaikannya dengan standar.","Untuk audit AI, reviewer QA memakai kerangka 3.11 (pertanyaan walkthrough/interview) untuk menilai kelengkapan scope dan test plan serta seberapa kuat auditor mendukung opini dan temuannya.","Area yang dinilai dalam QA review: purpose; scope of work (termasuk AI yang dinilai serta area yang secara eksplisit di-descope); accountability; independence; responsibility; authority; efektivitas dan efisiensi audit; value-added operation; ongoing reviews; periodic reviews.","QA eksternal atas fungsi internal audit dilakukan oleh auditor independen eksternal secara terjadwal, biasanya sekali dalam periode tiga sampai lima tahun, dengan laporan ke audit committee atau board."],"terms":[{"term":"QA reviewer","def":"Pemimpin senior internal audit yang menilai kualitas dan kepatuhan pekerjaan audit terhadap standar."},{"term":"External quality assessment","def":"Penilaian independen oleh pihak eksternal atas fungsi internal audit, umumnya tiap 3 sampai 5 tahun."},{"term":"De-scoping","def":"Mengeluarkan area tertentu dari scope secara eksplisit; harus didokumentasikan dan direview QA."}],"examTip":"External QA biasanya setiap 3 sampai 5 tahun dan dilaporkan ke audit committee/board. Area yang di-descope secara eksplisit tetap menjadi perhatian QA, dan independence termasuk area yang dinilai."}]}],"keyTakeaways":["Auditor memvalidasi kontrol dan hasil pengujian AI (mis. bias testing, false positive, metrik kinerja), bukan menjalankan atau menghitung ulang sendiri.","Internal audit tidak memimpin pembuatan AI inventory; auditor menilai kelengkapan dan akurasinya. AI usage policy adalah titik awal yang baik, inventaris diperbarui minimal tahunan, dan Shadow AI menjadi tantangan utama.","Enam kategori kontrol AI: Governance & Organizational; Technical, Security & Privacy; Operation & Life Cycle Management; SDLC; Legal, Compliance & Regulatory; Ethical & Human Values. FRIA wajib untuk AI high-risk EU AI Act, sedangkan DPIA untuk risiko privasi.","Desain audit AI bersifat top-down dan risk-based, fokus pada risiko jangka panjang (regulasi, etika, reputasi, keberlanjutan); scoping dimulai dengan identifikasi sistem dan owner, review asesmen yang ada, regulasi, dan dokumentasi AI. Gunakan pakar eksternal/co-source bila perlu.","Lima area uji AI: definition, development, testing, deployment, operations; ditambah journal entry testing dan professional skepticism untuk financial models.","Sampling: random, stratified (terbaik untuk memastikan subgrup populasi terwakili), data splitting sesuai rasio, dan judgmental (nonprobability, butuh keahlian domain, subjektif). Data AI yang sangat besar membuat auditor menilai proses pengumpulan/agregasi data.","Overfitting: bagus di training, buruk di data baru. Underfitting: buruk di keduanya. Outlier harus dideteksi dan dipastikan by design.","Training data harus berkualitas, representatif, dan ber-consent; testing data harus terpisah dari training data; synthetic data (GAN/VAE) dapat mengisi kekurangan data. Waspadai bias, data poisoning, dan adversarial attacks.","Akses data audit sebaiknya read-only dan 'always on' untuk continuous auditing; data store milik audit dan tool AI audit (voice to text offsite) membawa risiko keamanan, privasi, dan consent.","Laporan audit AI memuat executive summary/rating, scope, metodologi (data, model performance, bias, explainability, security, SDLC, etika, compliance), temuan terkait risiko-kontrol, dan respons manajemen. Dalam advisory, auditor tidak mendesain kontrol atau memiliki proses; external QA dilakukan tiap 3 sampai 5 tahun."]}],"examInfo":{"summary":"Ujian AAIA terdiri dari 90 soal pilihan ganda dalam sesi 2,5 jam, tersedia secara kontinu di test center maupun online remote proctoring. Skor dilaporkan sebagai scaled score 200 sampai 800, dan nilai lulus minimal 450. Gelar AAIA diberikan bila kandidat lulus ujian, setuju mematuhi Code of Professional Ethics dan kebijakan continuing education, serta memegang sertifikasi CISA, CIA, atau CPA; lulus ujian saja tidak otomatis memberi gelar karena aplikasi sertifikasi harus diajukan dan disetujui.","domains":[{"domain":"Domain 1 – AI Governance and Risk","weight":"33%"},{"domain":"Domain 2 – AI Operations","weight":"46%"},{"domain":"Domain 3 – AI Auditing Tools and Techniques","weight":"21%"}],"tips":["Budgeting waktu: manual menyebut alokasi sedikit lebih dari 1,5 menit per soal, jadi atur tempo agar seluruh soal terjawab (90 soal dalam 2,5 jam sekitar 1,67 menit per soal).","Sebagian soal hanya untuk riset dan tidak dinilai, serta tidak ditandai; jawab semua soal dengan serius.","Skor sementara muncul di layar segera setelah ujian; skor resmi dikirim via email dan tersedia online dalam 10 hari kerja. Hasil per soal tidak diberikan, tetapi ada analisis skor per content area.","Jadwal ujian dapat diubah paling lambat 48 jam sebelum jadwal awal; di dalam 48 jam kandidat harus ujian atau kehilangan biaya registrasi.","Datang 15 menit lebih awal, bawa ID yang sah, dan jangan membawa catatan, kalkulator, ponsel/smartwatch, tas, atau makanan ke ruang ujian. Untuk remote proctoring, uji komputer terlebih dahulu.","Kandidat yang gagal (skor di bawah 450) dapat mendaftar ulang dengan membayar biaya ujian, atau meminta rescoring dalam 30 hari setelah hasil keluar dengan biaya US$75.","Banyak soal meminta jawaban MOST/BEST; pilih jawaban yang mencerminkan mindset auditor: risk-based, independen, memvalidasi/merekomendasikan, bukan mengimplementasikan."]},"questions":[{"id":1,"topic":1,"qn":40,"question":"An organization uses third-party licensed data for training its AI models. During an audit, it is discovered that data usage restrictions were violated. Which of the following is the IS auditor’s MOST appropriate recommendation?","options":{"A":"Review all organizational data agreements.","B":"Discontinue use of the AI model training data.","C":"Strengthen system development life cycle (SDLC) controls.","D":"Implement stronger data clustering techniques."},"url":"https://www.examtopics.com/discussions/isaca/view/366588-exam-aaia-topic-1-question-40-discussion/","community":{"A":4},"answer":"A","confidence":"high","explanation":"Pelanggaran pembatasan penggunaan data berlisensi adalah masalah governance dan kontraktual, bukan masalah teknis. Manual menekankan bahwa data licensing agreement harus mengatur secara jelas permissions, restrictions, ownership, dan hak redistribusi, serta melibatkan fungsi legal. Karena satu pelanggaran sudah ditemukan, auditor sebaiknya merekomendasikan review atas seluruh data agreement untuk menentukan cakupan masalah dan memastikan semua penggunaan data sesuai kontrak. Ini sejalan dengan prinsip ISACA: auditor merekomendasikan perbaikan kontrol tata kelola, manajemen yang mengeksekusi.","distractors":{"B":"Terlalu drastis sebagai rekomendasi awal; menghentikan seluruh training data tanpa mengetahui cakupan pelanggaran bisa mengganggu operasi dan bukan keputusan auditor.","C":"SDLC controls tidak langsung mengatasi kepatuhan terhadap syarat lisensi data pihak ketiga.","D":"Data clustering adalah teknik ML untuk mengelompokkan data, tidak relevan dengan pelanggaran lisensi."},"manualRef":{"chapter":1,"section":"1.14.3","title":"Data Licensing","bookPage":61,"pdfPage":67},"links":[{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":2,"topic":2,"qn":27,"question":"When evaluating the process flowchart of an AI machine learning (ML) model, which task should be performed FIRST to provide assurance that the model will function as intended?","options":{"A":"Scale and standardize numerical variables.","B":"Split the data set into training and test sets.","C":"Apply the model algorithm.","D":"Address imbalances in the data."},"url":"https://www.examtopics.com/discussions/isaca/view/315962-exam-aaia-topic-2-question-27-discussion/","community":{"B":7,"D":2},"answer":"B","confidence":"medium","explanation":"Untuk memberi assurance bahwa model berfungsi sesuai harapan, data harus dipisah dulu menjadi training dan test set sebelum transformasi lain dilakukan. Jika scaling atau penyeimbangan data (oversampling) dilakukan sebelum split, informasi dari test set bisa bocor ke training (data leakage), sehingga hasil evaluasi terlihat lebih bagus dari kenyataan. Manual menekankan bahwa splitting dataset (training, validation, testing) diperlukan untuk menjaga integritas fase training dan evaluasi. Parameter scaling dan teknik balancing kemudian di-fit hanya pada training set.","distractors":{"A":"Scaling penting, tetapi parameternya harus dihitung dari training set saja; jika dilakukan sebelum split akan menimbulkan data leakage.","C":"Algoritma baru diterapkan setelah data dipisah dan dipersiapkan; ini langkah yang lebih akhir.","D":"Penanganan imbalance (mis. oversampling) sebaiknya hanya dilakukan pada training set setelah split agar test set tetap merepresentasikan distribusi nyata."},"manualRef":{"chapter":2,"section":"2.8.3","title":"Development (Dataset Preparation)","bookPage":94,"pdfPage":100},"links":[{"label":"scikit-learn cross-validation guide","url":"https://scikit-learn.org/stable/modules/cross_validation.html"},{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":3,"topic":2,"qn":38,"question":"If an organization’s business objectives require an AI solution that continually learns from the results of its outputs, an IS auditor would need to confirm risk and controls around:","options":{"A":"backpropagation.","B":"applying biases.","C":"activation functions.","D":"applying weights."},"url":"https://www.examtopics.com/discussions/isaca/view/366569-exam-aaia-topic-2-question-38-discussion/","community":{"A":2},"answer":"A","confidence":"medium","explanation":"Solusi AI yang terus belajar dari hasil output-nya bergantung pada mekanisme umpan balik error dari output ke dalam model. Backpropagation adalah algoritma yang menghitung error di output lalu menyesuaikan weights jaringan secara iteratif, sehingga inilah proses yang membuat model berubah seiring waktu. Karena itu auditor perlu memastikan risiko dan kontrol di sekitar backpropagation, misalnya kualitas data umpan balik, risiko poisoning, dan kontrol perubahan model. Opsi lain adalah komponen statis arsitektur, bukan mekanisme pembelajaran berkelanjutan.","distractors":{"B":"Bias adalah parameter dalam neuron; penerapannya bukan mekanisme yang membuat model belajar dari output.","C":"Activation function menentukan output neuron, tetapi tidak memproses umpan balik dari hasil output.","D":"Weights memang berubah, tetapi perubahan itu dihasilkan oleh backpropagation; sekadar menerapkan weights tidak mencakup proses belajar."},"manualRef":{"chapter":1,"section":"1.2.2","title":"Neural Networks","bookPage":27,"pdfPage":33},"links":[{"label":"Wikipedia: Backpropagation","url":"https://en.wikipedia.org/wiki/Backpropagation"}]},{"id":4,"topic":2,"qn":62,"question":"An IS auditor for a veterinary clinic was informed that the dog breed categorical variable within the data set is necessary for the predictive machine learning (ML) model conclusions. Which of the following introduces the MOST risk in this situation?","options":{"A":"Data scaling was not utilized.","B":"Clustering was not utilized.","C":"Ordinal label encoding was utilized.","D":"One-hot encoding was utilized."},"url":"https://www.examtopics.com/discussions/isaca/view/382871-exam-aaia-topic-2-question-62-discussion/","community":{"C":2},"answer":"C","confidence":"high","explanation":"Ras anjing adalah variabel kategorikal nominal yang tidak memiliki urutan alami. Ordinal label encoding memberi angka berurutan (1, 2, 3, ...) sehingga model akan menganggap ada urutan atau jarak matematis antar ras, yang menghasilkan korelasi palsu dan kesimpulan yang salah. Karena variabel ini penting bagi kesimpulan model, risiko distorsi ini paling besar. One-hot encoding justru teknik yang tepat untuk variabel nominal.","distractors":{"A":"Scaling relevan untuk fitur numerik dengan rentang berbeda, bukan untuk variabel kategorikal ras.","B":"Clustering bukan langkah wajib untuk model prediktif; ketiadaannya tidak menimbulkan risiko utama di sini.","D":"One-hot encoding adalah praktik yang tepat untuk kategori nominal karena tidak menyiratkan urutan."},"manualRef":{"chapter":2,"section":"2.8.3","title":"Development (Data Preprocessing)","bookPage":94,"pdfPage":100},"links":[{"label":"Wikipedia: One-hot","url":"https://en.wikipedia.org/wiki/One-hot"},{"label":"scikit-learn preprocessing guide","url":"https://scikit-learn.org/stable/modules/preprocessing.html"}]},{"id":5,"topic":2,"qn":83,"question":"During an AI review, an IS auditor identified that model testing data was used in an inappropriate format.\nWhich of the following BEST addresses the situation?","options":{"A":"Access controls","B":"Data minimization","C":"Separation of data","D":"Data encoding"},"url":"https://www.examtopics.com/discussions/isaca/view/394932-exam-aaia-topic-2-question-83-discussion/","community":{"D":2},"answer":"D","confidence":"medium","explanation":"Masalahnya adalah format data testing yang tidak sesuai, sehingga solusinya adalah mengubah data ke representasi yang dapat diproses model secara konsisten. Data encoding (misalnya tokenization, embedding, atau encoding kategori) mentransformasi data ke format yang dibutuhkan model, sebagaimana manual menjelaskan bahwa banyak model memerlukan data mentah dikodekan atau di-tokenize sebelum dipakai. Kontrol lain menjawab risiko yang berbeda (akses, privasi, atau pemisahan dataset), bukan masalah format.","distractors":{"A":"Access controls melindungi kerahasiaan data, tidak memperbaiki format data.","B":"Data minimization mengurangi jumlah data yang dikumpulkan demi privasi, tidak terkait format.","C":"Separation of data mencegah tercampurnya training dan testing data, tetapi temuan di sini adalah format, bukan pemisahan."},"manualRef":{"chapter":2,"section":"2.7.1","title":"Data Encoding","bookPage":88,"pdfPage":94},"links":[{"label":"scikit-learn preprocessing guide","url":"https://scikit-learn.org/stable/modules/preprocessing.html"}]},{"id":6,"topic":3,"qn":26,"question":"An organization uses an AI-powered tool to detect and respond to cybersecurity threats in real time. An IS auditor finds that the tool produces excessive false positives, increasing the workload of the security team. Which of the following techniques should the auditor recommend to BEST evaluate the tool’s effectiveness in managing this issue?","options":{"A":"Conduct penetration testing to assess the system’s ability to detect genuine threats.","B":"Deploy a machine learning (ML) validation tool to increase the model’s accuracy and performance.","C":"Implement a benchmarking tool to compare the system’s alerting capability with industry standards.","D":"Use a log analysis tool to examine the types and frequency of alerts generated."},"url":"https://www.examtopics.com/discussions/isaca/view/315520-exam-aaia-topic-3-question-26-discussion/","community":{"D":5,"C":2},"answer":"D","confidence":"medium","explanation":"Untuk mengevaluasi efektivitas tool dalam masalah false positive, auditor membutuhkan bukti tentang alert yang benar-benar dihasilkan: jenis, frekuensi, dan pola alert. Log analysis tool memungkinkan auditor menganalisis data alert aktual untuk mengukur proporsi false positive dan penyebabnya, sehingga rekomendasi berbasis bukti. Manual mencatat bahwa log yang dikumpulkan dan dianalisis dengan bantuan AI (seperti pada SIEM) sangat berguna bagi auditor keamanan. Opsi lain menguji hal lain atau merupakan tindakan perbaikan, bukan evaluasi.","distractors":{"A":"Penetration testing menguji kemampuan mendeteksi ancaman nyata (false negative), bukan masalah false positive.","B":"Ini tindakan perbaikan model oleh manajemen, bukan teknik untuk mengevaluasi efektivitas; selain itu auditor tidak men-deploy tool.","C":"Benchmarking terhadap standar industri bersifat umum dan tidak menjelaskan sumber false positive di lingkungan organisasi."},"manualRef":{"chapter":3,"section":"3.12.1","title":"Using AI to Collect Logs","bookPage":159,"pdfPage":165},"links":[{"label":"Wikipedia: Precision and recall","url":"https://en.wikipedia.org/wiki/Precision_and_recall"}]},{"id":7,"topic":1,"qn":133,"question":"A school uses an AI detection tool to identify AI-generated content in student assignments. During an audit, the IS auditor notes concerns about the tool’s accuracy, with some original student work being incorrectly flagged as AI-generated.\nWhich of the following should the auditor recommend to BEST address this issue?","options":{"A":"Adjust the detection tool’s settings to increase the model temperature.","B":"Train teachers to interpret AI detection results cautiously before taking action.","C":"Limit the use of the AI detection tool to cases where plagiarism is strongly suspected.","D":"Require students to sign a declaration confirming that their work is original."},"url":"https://www.examtopics.com/discussions/isaca/view/394900-exam-aaia-topic-1-question-133-discussion/","community":{"
