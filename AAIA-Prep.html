 transfer tidak pernah menyeluruh; saat breach, penyedia data tetap menanggung penalti/reputasi. Validasi kontrol penerima sebelum berbagi, pertimbangkan DRM, dan sediakan proses agar data tetap akurat dan mutakhir (GDPR Art. 5) termasuk mekanisme koreksi oleh data subject.","1.14.5 Data cleansing: menangani missing values, menghapus duplikat, memperbaiki inkonsistensi format, memperbaiki salah input, serta mendeteksi/menangani outlier. Enam dimensi data quality (DAMA UK): completeness, uniqueness, timeliness, validity, accuracy, consistency. Dataset awal dan output AI diretensi sesuai klasifikasi; kebutuhan retensi berasal dari kebijakan internal (konsisten dengan use limitation) dan regulasi eksternal, berfokus pada kelas data seperti PII dan PHI.","1.14.6 Data clustering (unsupervised): hard/exclusive clustering menempatkan tiap titik data di satu cluster (contoh K-means); soft clustering memberi derajat keanggotaan 0–1 di beberapa cluster (contoh Fuzzy C-means). Clustering tanpa pengawasan dapat menambah bias, sehingga perlu keterlibatan manusia, akuntabilitas keputusan yang jelas, dan oversight etis."],"terms":[{"term":"Data minimization","def":"Membatasi AI hanya mengakses data minimum yang dibutuhkan untuk tujuan yang disetujui."},{"term":"Data classification","def":"Penetapan tingkat sensitivitas dan kekritisan data untuk menentukan kontrol akses dan perlindungan."},{"term":"Consent","def":"Persetujuan data subject yang bebas, spesifik, terinformasi, dan tegas atas pemrosesan data pribadinya."},{"term":"Data licensing","def":"Perjanjian hukum yang mengatur akses, penggunaan, berbagi, dan distribusi data pihak lain untuk training AI."},{"term":"Purpose limitation","def":"Data pribadi dikumpulkan untuk tujuan tertentu yang sah dan tidak diproses lebih lanjut secara tidak kompatibel (GDPR Art. 5(1)(b))."},{"term":"Data quality dimensions (DAMA)","def":"Completeness, uniqueness, timeliness, validity, accuracy, consistency."},{"term":"Data retention","def":"Disiplin menyimpan data persisten sesuai kebutuhan legal dan arsip bisnis."},{"term":"Hard vs soft clustering","def":"Hard: satu titik data hanya di satu cluster; soft: titik data punya derajat keanggotaan di beberapa cluster."}],"examTip":"Langkah PERTAMA mengendalikan data adalah inventaris, lalu klasifikasi. Data owner tetap bertanggung jawab atas data yang dipakai AI dan atas output-nya. Untuk data yang dibagikan ke pihak ketiga, ingat bahwa risiko (terutama reputasi) tidak bisa ditransfer sepenuhnya melalui kontrak."},{"num":"1.15","title":"Privacy Considerations","bookPage":66,"pdfPage":72,"summary":"Privasi menjadi isu ketika dataset sensitif dipakai melatih model ML, karena model dapat 'mengingat' data dan rentan terhadap inference attack. Organisasi perlu memahami peran data governance, kepemilikan data, dan regulasi privasi yang secara eksplisit mengatur automated decision-making.","points":["1.15.1 Model ML dapat 'mengingat' data melalui respons atas query sehingga rentan inference: membership inference (menentukan apakah suatu record ada di training data) dan attribute inference (menebak atribut sensitif seseorang).","Pertahanan terhadap inference bertentangan dengan tujuan ML karena mengurangi optimasi model; namun dalam praktik serangan ini lebih sulit dilakukan daripada teorinya.","Pertimbangan terpenting bagi organisasi yang memproses data sensitif dengan AI adalah liabilitas atas inference yang berhasil. CPRA (California) secara eksplisit mengatur inference, sedangkan GDPR tidak menitikberatkannya saat disusun; efisiensi AI harus diseimbangkan dengan potensi sanksi.","1.15.2 Data governance adalah proses sistematis untuk mengelola data dan meningkatkan kualitasnya; kebijakan data governance menjelaskan kontrol keamanan di setiap fase data life cycle.","Peran data governance: data custodian (menyimpan dan mengamankan data), data owner (integritas, pelaporan akurat, dan penggunaan data), data protection officer/DPO (memberi advis dan memantau kepatuhan perlindungan data; wajib bagi sebagian organisasi menurut GDPR), dan data steward (kualitas data).","1.15.3 Klausul AI dalam regulasi privasi: GDPR (hak individu untuk tidak tunduk pada automated decision-making, plus transparansi dan akuntabilitas untuk explainability); CPRA (wajib mengungkapkan penggunaan automated decision-making technology dan menyediakan opt-out); PIPL Tiongkok (warga harus diberi tahu bila AI dipakai untuk keputusan dan berhak atas penjelasan bila diminta).","Tema privasi yang berulang: transparency, consent eksplisit, fairness & accountability (tidak bias dan dapat diaudit), explanations (logika keputusan AI), dan opsi opt-out.","Organisasi yang memproses data pribadi dengan AI harus memasukkan persyaratan privasi melalui proses data governance, termasuk data protection impact assessment (DPIA) — asesmen dampak pemrosesan terhadap perlindungan data pribadi yang menurut GDPR terutama wajib saat memakai teknologi baru."],"terms":[{"term":"Membership inference","def":"Serangan untuk mengetahui apakah suatu data spesifik termasuk dalam training dataset."},{"term":"Attribute inference","def":"Serangan untuk menebak atribut sensitif yang dimiliki data subject."},{"term":"Data custodian","def":"Pihak yang bertanggung jawab menyimpan dan mengamankan data."},{"term":"Data owner","def":"Pihak yang bertanggung jawab atas integritas, pelaporan, dan penggunaan data."},{"term":"Data steward","def":"Pihak yang bertanggung jawab atas kualitas data."},{"term":"Data protection officer (DPO)","def":"Pihak yang memberi advis dan memantau kepatuhan perlindungan data."},{"term":"DPIA","def":"Data protection impact assessment — asesmen risiko dampak pemrosesan data pada perlindungan data pribadi."}],"examTip":"Hafalkan perbedaan peran data owner (akuntabel atas penggunaan/integritas), custodian (penyimpanan/pengamanan), steward (kualitas), dan DPO (advis/monitoring kepatuhan). Untuk AI yang memproses data pribadi, DPIA adalah kontrol kunci yang perlu diverifikasi auditor; bila soal menyinggung opt-out automated decision-making, kaitkan dengan CPRA/GDPR."}]},{"id":"E","title":"Leading Practices, Ethics, Regulations, and Standards for AI","overview":"Karena praktik dan regulasi AI masih baru dan banyak yang belum teruji, organisasi umumnya menetapkan standar sendiri berdasarkan riset akademik, standar/framework industri, dan pengalaman. Part ini merangkum sumber best practice, standar dan regulasi utama, serta pertimbangan etika (bias, transparansi, trust & safety, IP, HAM, lingkungan).","sections":[{"num":"1.16","title":"Standards, Frameworks, and Regulations Related to AI","bookPage":69,"pdfPage":75,"summary":"Best practice keamanan dan assurance yang sudah ada tetap berlaku untuk AI, dengan tambahan pertimbangan khusus AI. Sumber best practice adalah riset akademik, standar/framework industri, serta hukum dan regulasi yang masih relatif baru dan belum teruji.","points":["1.16.1 Secara umum AI dapat diperlakukan seperti teknologi lain dari sisi information assurance; pertimbangan keamanan dan privasi pada pengembangan AI pada dasarnya sama dengan SDLC sistem lain, ditambah aspek khusus AI (lihat Part C).","Tiga sumber best practice: academic research (dipertimbangkan industri, badan standar, dan pemerintah), industry standards & frameworks (sering dirujuk saat menyusun hukum/regulasi), dan laws & regulations (ditetapkan pemerintah). Saat ini kebanyakan organisasi menetapkan standarnya sendiri karena legislasi AI masih baru.","1.16.2 Contoh riset akademik berpengaruh: 'Accountability in AI' (University of Oxford) tentang strategi audit AI serta pentingnya transparansi dan explainability; 'Exploring the Impact of AI on Black Americans' (Stanford) sebagai masukan kebijakan AI yang adil bagi Congressional Black Caucus AS.","1.16.3 Standar dan framework: ISO/IEC 23053 (kerangka mendeskripsikan sistem AI generik berbasis ML); ISO/IEC 42001 (AI management system yang voluntary — persyaratan untuk menetapkan, menerapkan, memelihara, dan terus meningkatkan AIMS dengan fokus etika, transparansi, akuntabilitas); IEEE 7000-2021 (proses menanamkan nilai/etika manusia ke desain sistem, termasuk privasi, transparansi, fairness).","Framework lain: OECD AI Principles (transparansi, inklusivitas, keberlanjutan, akuntabilitas; diadopsi negara anggota lintas kawasan); NIST AI RMF (identifikasi, asesmen, mitigasi risiko AI); Model AI Governance Framework dari PDPC Singapura (deployment AI secara bertanggung jawab).","1.16.4 Hukum/regulasi AI relatif baru, belum teruji di pengadilan, dan banyak yang masih draf; umumnya merujuk pada standar/framework; ketidakpatuhan dapat berujung denda. Contoh: EU AI Act (regulasi berbasis tingkat risiko), EU AI Liability Directive (usulan tanggung jawab perdata atas kerugian akibat AI), Algorithmic Accountability Act AS (usulan kewajiban menilai dampak automated decision system), National AI Act AS (aktif; mendorong riset dan pengembangan AI serta menjadi pendorong lahirnya NIST AI RMF), dan AI Development Plan Tiongkok (strategi, pedoman etika, terkait Data Security Law 2021)."],"terms":[{"term":"ISO/IEC 42001","def":"Standar voluntary untuk AI management system (AIMS): menetapkan, menerapkan, memelihara, dan meningkatkan tata kelola AI."},{"term":"ISO/IEC 23053","def":"Kerangka untuk mendeskripsikan sistem AI generik yang memakai machine learning."},{"term":"IEEE 7000-2021","def":"Model proses untuk menangani isu etika selama desain sistem."},{"term":"EU AI Act","def":"Regulasi Uni Eropa yang mengkategorikan sistem AI berdasarkan tingkat risiko dengan kewajiban yang sesuai."},{"term":"Model AI Governance Framework","def":"Framework PDPC Singapura untuk deployment AI yang bertanggung jawab."},{"term":"Algorithmic Accountability Act","def":"Usulan legislasi AS yang mewajibkan asesmen dampak automated decision system."}],"examTip":"Kenali fungsi tiap standar: ISO/IEC 42001 = management system (bisa disertifikasi/diadopsi untuk governance), NIST AI RMF = manajemen risiko, IEEE 7000 = etika dalam desain, OECD = prinsip. Karena regulasi AI masih baru, pendekatan yang tepat adalah memanfaatkan framework yang diterima umum dan memantau perkembangan regulasi di yurisdiksi terkait."},{"num":"1.17","title":"Ethical Considerations","bookPage":71,"pdfPage":77,"summary":"Solusi AI harus dirancang untuk meminimalkan bias dan menjamin fairness, transparan dan explainable, serta menumbuhkan trust dan safety; pertimbangan etika juga mencakup IP, hak asasi manusia, dan dampak lingkungan. Kajian etika harus dilakukan sejak awal dan terintegrasi ke risk assessment dan change management.","points":["1.17.1 Ethical use: AI harus selaras dengan nilai inti masyarakat, mendorong kebaikan sosial, dan meminimalkan harm; solusi yang tidak memenuhinya tidak seharusnya dibuat. Pertimbangan etika ditinjau sejak awal pengembangan sebagai bagian risk assessment dan change management. UNESCO mendefinisikan ethical impact assessment (EIA) untuk menilai risiko sebelum dan sesudah rilis; EIA dilakukan untuk setiap solusi baru maupun perubahan.","1.17.2 Tiga kategori bias menurut NIST SP 1270: systemic (berasal dari prosedur/praktik institusi yang menguntungkan kelompok tertentu — contoh alat rekrutmen AI Amazon 2018 yang bias gender; mitigasi: fairness constraint, bias audit sebelum deployment), statistical/computational (sampel tidak representatif — contoh error rate facial recognition jauh lebih tinggi pada perempuan berkulit gelap; mitigasi: diversitas dataset), dan human (kesalahan sistematis cara berpikir manusia, mis. anchoring/confirmation bias, prompt berbeda menghasilkan interpretasi berbeda; mitigasi: awareness/training, output yang dikutip sumbernya dan explainable).","Fairness = AI menghasilkan hasil yang setara dan akurat tanpa merugikan kelompok rentan/marginal. Tool pendukung: AI Fairness 360 (toolkit open-source Linux Foundation untuk memeriksa, melaporkan, dan memitigasi bias) dan What-If Tool (Google, untuk menguji skenario hipotetis, pentingnya fitur, dan perilaku model).","1.17.3 Transparency and explainability: AI 'black box' meningkatkan risiko output yang tidak dapat dipercaya. Developer kadang enggan membuka detail karena alasan keamanan, dan menjelaskan AI kepada non-ahli memang sulit. Transparansi dicapai melalui dokumentasi jelas (nama model, tujuan, tingkat risiko, kebijakan, data training, asumsi bias, metrik fairness/explainability, kontak). Explainability menjawab pertanyaan 'bagaimana AI sampai pada hasilnya', mis. dengan mencantumkan sumber pada output.","1.17.4 Trust and safety: AI harus andal, etis, dan aman. Hilangnya kepercayaan dapat membuat sistem ditinggalkan dengan sunk cost dan potensi litigasi (contoh alat rekrutmen Amazon). Risiko meningkat untuk AI yang terhubung ke dunia fisik (mis. mobil otonom yang dapat mencelakai manusia; developer menanggung liabilitas).","1.17.5 IP considerations: penggunaan materi berhak cipta tanpa lisensi untuk training memicu gugatan (mis. class action Andersen v. Stability AI oleh para seniman). Developer harus memperoleh data secara sah, sering lewat kemitraan (mis. Axel Springer dengan OpenAI 2023). Kepemilikan hak cipta konten GenAI (pengguna, developer, atau pemilik data training) masih belum jelas; kebijakan organisasi harus mengatur isu IP.","1.17.6 Human rights: bias dan diskriminasi dapat melanggar hak (privasi, perlindungan data, kesetaraan) dan menimbulkan risiko reputasi serta litigasi. EU AI Act mewajibkan fundamental rights impact assessment (FRIA) untuk AI berisiko tinggi, mengacu pada EU Charter of Fundamental Rights; DPIA mirip tetapi cakupan haknya lebih sempit daripada FRIA.","1.17.7 Environmental impact: AI sangat intensif sumber daya (menurut IEA satu permintaan ChatGPT memakan listrik sekitar 10x pencarian Google; data center diperkirakan mendekati 35% konsumsi energi Irlandia pada 2026), membutuhkan mineral langka, dan air pendingin dalam jumlah besar. Lebih dari 190 negara mengadopsi rekomendasi etika AI UNESCO yang tidak mengikat; developer didorong membuat algoritma lebih efisien."],"terms":[{"term":"Ethical impact assessment (EIA)","def":"Proses UNESCO untuk menilai desain, pengembangan, dan deployment AI serta risikonya sebelum dan sesudah rilis."},{"term":"Systemic bias","def":"Bias dari prosedur/praktik institusi atau data training yang menguntungkan kelompok sosial tertentu (mis. diskriminasi gender)."},{"term":"Statistical/computational bias","def":"Bias akibat sampel data yang tidak representatif terhadap populasi."},{"term":"Human bias","def":"Kesalahan sistematis dalam penilaian manusia (anchoring, confirmation bias) yang memengaruhi penggunaan/interpretasi AI."},{"term":"Fairness","def":"AI memberikan hasil yang setara dan akurat tanpa merugikan kelompok rentan."},{"term":"Explainability","def":"Kemampuan menjelaskan bagaimana AI sampai pada suatu hasil/keputusan."},{"term":"FRIA","def":"Fundamental rights impact assessment — wajib di EU AI Act untuk AI berisiko tinggi; cakupannya lebih luas dari DPIA."}],"examTip":"Soal klasik: diskriminasi gender dalam keputusan AI = systemic bias (bukan statistical, human, atau overfitting). Pertimbangan etika harus dikaji SEBELUM proyek dimulai (EIA) dan pada setiap perubahan. FRIA ≠ DPIA: FRIA lebih luas dan diwajibkan untuk high-risk AI menurut EU AI Act."}]}],"keyTakeaways":["Domain 1 berbobot 33% (sekitar 25 soal): fondasi konsep AI ditambah governance, risk, privacy, dan etika.","Hierarki AI > ML > DL > GenAI; klasifikasi fungsionalitas (reactive, limited memory, ToM, self-aware) vs kapabilitas (ANI, AGI, ASI). Hampir semua AI saat ini adalah ANI/limited memory (termasuk chatbot).","Risiko utama per paradigma: supervised = kualitas data & bias; unsupervised = explainability; reinforcement = otonomi/keselamatan — mitigasi kunci adalah human-in-the-loop.","Risiko harus dipertimbangkan di SETIAP fase AI life cycle sejak plan & design; solusi AI mengikuti change management standar dan perlu business case terdokumentasi.","Governance AI: strategi (didukung senior management, lintas fungsi) → roles & responsibilities → policies/AUP → training & awareness → program metrics; akuntabilitas akhir ada pada executive management, internal audit menilai risiko AI dalam audit plan.","NIST AI RMF: Govern, Map (identifikasi), Measure (asesmen), Manage (monitoring); terapkan professional skepticism karena AI sering dianggap lebih objektif dari kenyataannya.","Risk appetite (strategis, enterprise) vs risk tolerance (taktis, deviasi yang diterima); opsi respons avoid/mitigate/share-transfer/accept; remediasi butuh risk owner, target waktu, compensating controls, dan verifikasi independen.","KRI = peringatan dini berbasis threshold; KPI = kinerja. KAIRI memakai SAFE (Sustainability, Accuracy, Fairness, Explainability).","Data governance untuk AI: inventaris → klasifikasi → data minimization; data owner tetap akuntabel atas input dan output AI; consent, data licensing, purpose limitation, enam dimensi data quality DAMA, DPIA; risiko berbagi data tidak bisa sepenuhnya ditransfer.","Etika: bias (systemic, statistical/computational, human — NIST SP 1270), transparency & explainability, trust & safety, IP, human rights (FRIA di EU AI Act), dampak lingkungan; standar kunci: ISO/IEC 42001, ISO/IEC 23053, IEEE 7000, OECD AI Principles, NIST AI RMF, EU AI Act."]},{"id":2,"title":"AI Operations","domain":"Domain 2","weight":"46% (sekitar 34 soal)","pdfStart":83,"pdfEnd":130,"overview":"Chapter ini membahas bagaimana AI dibangun, dioperasikan, diawasi, diuji, diamankan, dan ditangani saat terjadi insiden. Pesan utamanya: proses dan kontrol TI konvensional (change management, SDLC, security, incident response) tetap relevan, tetapi harus diadaptasi karena perilaku AI berasal dari data dan model yang dilatih, bukan dari kode yang ditulis eksplisit. Karena model modern (deep learning/LLM) bersifat nondeterministik dan sulit diinterpretasi, data management, monitoring drift, observability, dan kontrol khusus AI menjadi kunci. Domain ini adalah porsi terbesar ujian AAIA (46%), sehingga auditor harus menguasai risiko dan kontrol di setiap tahap siklus hidup AI.","objectives":["Mengevaluasi dampak, peluang, dan risiko ketika AI diintegrasikan ke dalam proses audit.","Mengevaluasi solusi AI untuk memberi saran mengenai dampak, peluang, dan risikonya bagi organisasi.","Mengevaluasi dampak solusi AI terhadap interaksi sistem, lingkungan, dan manusia.","Mengevaluasi peran dan dampak sistem pengambilan keputusan berbasis AI terhadap organisasi dan stakeholder.","Mengevaluasi kebijakan dan prosedur AI organisasi, termasuk kepatuhan terhadap hukum dan regulasi.","Mengevaluasi monitoring dan pelaporan metrik khusus AI (mis. KPI, KRI).","Mengevaluasi apakah ownership atas risiko, kontrol, prosedur, keputusan, dan standar terkait AI sudah ditetapkan.","Mengevaluasi program data governance dan program privacy yang spesifik untuk AI.","Mengevaluasi program problem & incident management, change management, dan configuration management yang spesifik untuk AI.","Mengevaluasi program threat & vulnerability management serta identity & access management yang spesifik untuk AI.","Mengevaluasi program manajemen vendor dan supply chain untuk solusi AI.","Mengevaluasi desain dan efektivitas kontrol yang spesifik untuk AI.","Mengevaluasi kebutuhan data input model AI (kesesuaian data, bias, privacy).","Mengevaluasi kebutuhan sistem/bisnis solusi AI agar selaras dengan enterprise architecture.","Mengevaluasi siklus hidup solusi AI (design, development, deployment, monitoring, decommissioning) beserta input/output-nya dari sisi kepatuhan dan risiko.","Mengevaluasi algoritma dan model agar selaras dengan tujuan bisnis, kebijakan, dan prosedur.","Menganalisis dampak AI terhadap tenaga kerja untuk memberi saran terkait dampak, pelatihan, dan edukasi.","Mengevaluasi apakah program awareness selaras dengan kebijakan dan prosedur AI organisasi."],"parts":[{"id":"A","title":"Data Management Specific to AI","overview":"Fondasi AI adalah data: data dipakai untuk 'mengajari' model sekaligus sebagai input saat inference. Banyak masalah AI (mis. hallucination, bias) berakar pada data yang bias, tidak lengkap, salah label, atau tidak relevan, sehingga kontrol data management harus kuat di seluruh siklus hidup.","sections":[{"num":"2.1","title":"Data Collection","bookPage":83,"pdfPage":89,"summary":"Organisasi perlu mekanisme untuk mengumpulkan dan menghubungkan berbagai sumber data (terstruktur maupun berbasis file) ke repositori terpusat sebelum dipakai melatih model. Risiko utama pengumpulan data adalah consent, kesesuaian tujuan (fit for purpose), dan data lag.","points":["Tantangan umum bukan kekurangan data, melainkan digitalisasi data manual/kertas dan menyatukan data dari banyak sistem; data warehouse dan data lake dipakai untuk sentralisasi agar data mudah diakses untuk training.","Ada korelasi positif antara ukuran, volume, dan variasi data dengan akurasi model AI.","Konsep five Vs dari big data (velocity = kecepatan data dibuat dan dikirim, serta volume, variety, veracity, value) relevan untuk pengumpulan dan pengelolaan data AI.","2.1.1 Consent: data internal korporat umumnya boleh dipakai untuk training (kecuali data sensitif/personal), tetapi customer data sering butuh consent tambahan tergantung tujuan awal pengumpulannya; GDPR (Article 7) mensyaratkan consent untuk pemrosesan data pribadi.","EU AI Act (Article 61) memperluas kewajiban informed consent untuk pengujian high-risk AI dalam kondisi dunia nyata (di luar regulatory sandbox).","Tim privacy dan legal harus dilibatkan untuk menilai dasar hukum penggunaan data dalam training/testing; mekanisme opt-in/opt-out harus ada, dan bila consent ditolak/dicabut, data terkait wajib dikeluarkan dari training dataset (risiko denda regulasi dan hilangnya kepercayaan).","2.1.2 Fit for purpose: solusi AI harus dirancang untuk tujuan/tugas spesifik yang mendukung tujuan bisnis. Indikasi tidak fit for purpose: data ada tetapi sulit diakses untuk training/inference; granularitas, detail, volume, atau veracity data tidak memadai; atau use case dibatasi/dilarang regulasi AI untuk high-risk use.","2.1.3 Data lag: model dilatih dengan data historis dan proses training bisa memakan waktu berminggu-minggu hingga berbulan-bulan, sehingga ada jarak antara data training dan data baru saat model dipakai; ini dapat menimbulkan model drift dan menurunnya relevansi/akurasi untuk keputusan real-time.","Mitigasi data lag: (1) retraining versi model baru dengan dataset terbaru bila model kecil; (2) memakai retrieval augmented generation (RAG) untuk menggrounding prompt LLM dengan data yang spesifik dan terkini tanpa mengubah base model."],"terms":[{"term":"Five Vs of big data","def":"Volume, velocity, variety, veracity, dan value; karakteristik big data yang relevan untuk pengumpulan data AI."},{"term":"Consent","def":"Persetujuan subjek data atas pemrosesan datanya, termasuk untuk training/testing model AI."},{"term":"Fit for purpose","def":"Solusi AI dan datanya dirancang dan memadai untuk mencapai tujuan/tugas spesifik organisasi."},{"term":"Data lag","def":"Selisih waktu antara data yang dipakai melatih model dan data baru yang dihadapi saat model digunakan."},{"term":"Retrieval augmented generation (RAG)","def":"Teknik menambahkan konteks data spesifik dan terkini ke prompt LLM tanpa melatih ulang base model."}],"examTip":"Sebelum customer data dipakai untuk training, auditor harus memastikan dasar hukum/consent sudah diverifikasi bersama legal & privacy, serta ada proses untuk mengeluarkan data subjek yang opt-out/mencabut consent. Untuk masalah data usang pada LLM, RAG adalah jawaban yang lebih praktis daripada retraining model besar."},{"num":"2.2","title":"Data Classification","bookPage":85,"pdfPage":91,"summary":"Risiko klasifikasi data makin besar dalam konteks AI karena data dari berbagai tingkat sensitivitas dapat tertanam dalam model. Sensitivitas data training harus selaras dengan siapa pengguna model tersebut.","points":["Organisasi kesulitan mengklasifikasikan data agar ditangani sesuai tingkat sensitivitasnya; teknologi klasifikasi sudah membantu untuk data teregulasi (personal, kesehatan, finansial).","Kasus yang lebih kompleks seperti intellectual property dan data internal sensitif lebih sulit; contohnya source code internal yang bercampur dengan open-source code sehingga sulit dipisahkan dan rawan salah klasifikasi.","Saat mengumpulkan data training, organisasi harus mempertimbangkan end user model: model untuk publik yang dilatih dengan data pelanggan rahasia menciptakan ketidakcocokan dan risiko kebocoran.","Kontrol kunci: pastikan keselarasan antara tingkat sensitivitas data training dan populasi pengguna model, untuk mencegah pengungkapan data sensitif yang 'tertanam' di dalam model."],"terms":[{"term":"Data classification","def":"Pengelompokan data berdasarkan tingkat sensitivitas untuk menentukan perlakuan dan kontrol yang sesuai."}],"examTip":"Risiko kunci yang sering diuji: data confidential dipakai melatih model yang diakses pengguna yang lebih luas/publik. Auditor menilai apakah klasifikasi data training sudah dibandingkan dengan audiens model."},{"num":"2.3","title":"Data Confidentiality","bookPage":85,"pdfPage":91,"summary":"Kerahasiaan data harus dijaga di seluruh siklus pengembangan dan platform AI, mulai dari sumber data hingga sistem produksi. Manual memetakan pertimbangan kontrol per lokasi data.","points":["Data source: sumber data training dapat dibatasi, diobfuscate, atau dienkripsi atas dasar need-to-know; risikonya, saat diekstrak, metadata (owner, klasifikasi) dan kontrol (akses, masking) bisa tidak ikut terbawa ke tahap berikutnya.","Data lake: data terstruktur dan tidak terstruktur digabung untuk memudahkan modeling; pencampuran data dengan klasifikasi berbeda bisa membuat data yang tadinya restricted menjadi lebih luas aksesnya bila access control tidak dipertahankan.","Data exploration & training platform (mis. Jupyter Notebooks, SageMaker): data dengan berbagai klasifikasi dapat tersimpan di notebook dan file notebook.","Vector database: dokumen, gambar, dan audio disimpan sebagai representasi vektor beserta metadata; meski teks asli tidak disimpan, diperlukan model access control baru (mis. berbasis atribut, index, atau query).","AI system production: data produksi live melewati data prep pipeline sebelum menjadi input model; protokol klasifikasi dan penanganan data tetap harus diterapkan di sistem produksi AI."],"terms":[{"term":"Data lake","def":"Repositori terpusat yang menampung data terstruktur dan tidak terstruktur untuk analitik dan modeling."},{"term":"Vector database","def":"Database yang menyimpan data sebagai embedding vektor (representasi matematis) beserta metadata untuk pencarian semantik."}],"examTip":"Fokus auditor: apakah kontrol akses dan metadata klasifikasi ikut 'terbawa' saat data berpindah dari sumber ke data lake, notebook, vector DB, hingga produksi. Kehilangan kontrol saat agregasi adalah jebakan umum."},{"num":"2.4","title":"Data Quality","bookPage":86,"pdfPage":92,"summary":"Karena AI berbasis deep learning sangat bergantung pada data, kualitas data berbanding lurus dengan performa model. Data harus diprofilkan lalu dibersihkan, dan kualitasnya dinilai dengan enam dimensi.","points":["Berbeda dengan sistem berbasis aturan eksplisit, output AI hanya sebaik data yang dipakai untuk melatihnya.","Praktik umum: lakukan eksplorasi dan data profiling untuk menilai kualitas dataset, lalu data cleansing (koreksi error, imputasi data yang hilang).","Accuracy: data bebas error dan mencerminkan kondisi nyata (mis. salah ketik/transposisi alamat pelanggan menimbulkan inakurasi).","Completeness: semua field dan record wajib terisi lengkap, tidak terpotong.","Consistency: format, panjang, dan metadata seragam lintas dataset (mis. format tanggal yang berbeda-beda).","Timeliness: data mutakhir dan tersedia saat dibutuhkan (mis. navigasi GPS real-time).","Validity: data mematuhi logika bisnis dan teknis yang ditetapkan (mis. divalidasi terhadap database akun aktif).","Uniqueness: tidak ada record duplikat/redundan (mis. setiap pelanggan memiliki identifier unik)."],"terms":[{"term":"Data profiling","def":"Analisis awal dataset untuk memahami struktur, distribusi, dan masalah kualitas data."},{"term":"Six dimensions of data quality","def":"Accuracy, completeness, consistency, timeliness, validity, uniqueness."}],"examTip":"Hafalkan enam dimensi beserta contohnya; soal bisa memberi skenario (mis. format tanggal berbeda = consistency, duplikasi = uniqueness) dan meminta dimensi yang terdampak."},{"num":"2.5","title":"Data Balancing","bookPage":87,"pdfPage":93,"summary":"Dataset yang timpang (imbalanced) karena sampel kelas minoritas kurang dapat menghasilkan output yang bias atau tidak akurat. Penyeimbangan data harus ditangani sejak awal pengembangan.","points":["Tidak semua data yang dihasilkan tertangkap dan tersedia untuk training, sehingga distribusi yang tidak merata dapat terjadi secara alami.","Data imbalance terjadi ketika sampel suatu 'class' minoritas tidak cukup; akar masalahnya adalah kurangnya data yang memadai dan beragam.","Risiko sebaliknya juga ada: organisasi dapat overcompensate dengan menaikkan porsi kelas minoritas melebihi distribusi dunia nyata (manual merujuk kasus generasi gambar Gemini).","Mitigasi: profiling distribusi data saat pengumpulan dan preprocessing; teknik oversampling, undersampling, atau cost-sensitive algorithm saat training."],"terms":[{"term":"Data imbalance","def":"Distribusi kelas dalam dataset yang tidak seimbang sehingga kelas minoritas kurang terwakili."},{"term":"Oversampling / undersampling","def":"Menambah sampel kelas minoritas atau mengurangi sampel kelas mayoritas untuk menyeimbangkan dataset."},{"term":"Cost-sensitive algorithm","def":"Algoritma yang memberi bobot/biaya kesalahan berbeda per kelas untuk mengimbangi ketimpangan data."}],"examTip":"Jika output AI bias terhadap demografi tertentu, jawaban BEST biasanya memperbaiki representativeness/diversity training dataset, bukan menambah compute atau sekadar memeriksa algoritma."},{"num":"2.6","title":"Data Scarcity","bookPage":87,"pdfPage":93,"summary":"Organisasi sering punya banyak data tetapi kekurangan data berkualitas, relevan, ber-consent/berlisensi untuk use case AI prioritas. Mitigasinya melalui augmentation dan pemilihan model yang tepat.","points":["Penyebab data scarcity: masalah kualitas data, kurangnya data kelas minoritas/beragam, keterbatasan data yang sudah ber-consent atau berlisensi, data 'terperangkap' di sistem sumber yang tidak dapat diakses, dan kurangnya labeled data.","Augmentation: melengkapi data yang hilang dengan mengumpulkan/membeli data target (mis. dari data broker terpercaya), membuat synthetic data yang meniru distribusi yang dibutuhkan, atau imputasi dengan algoritma yang dipilih secara hati-hati.","Model selection: ukuran dan variasi data yang tersedia menentukan pilihan model; pilih model yang cocok dengan dataset untuk menghindari overfitting."],"terms":[{"term":"Data scarcity","def":"Kekurangan data berkualitas, relevan, dan sah dipakai untuk mengembangkan model AI."},{"term":"Synthetic data","def":"Data buatan yang meniru karakteristik/distribusi data nyata untuk menambah volume atau variasi."},{"term":"Imputation","def":"Pengisian nilai yang hilang menggunakan metode/algoritma tertentu."}],"examTip":null},{"num":"2.7","title":"Data Security","bookPage":87,"pdfPage":93,"summary":"Dorongan board untuk memakai AI memaksa CIO/CISO membuka akses ke data yang sebelumnya sangat dibatasi, sehingga risiko dan kontrol keamanan data harus dievaluasi sepanjang siklus hidup AI. Manual membahas encoding, access, confidentiality, backup, dan integrity.","points":["Regulasi privacy (GDPR) dan data residency membatasi penggunaan data personal, di samping kewajiban melindungi data finansial, kesehatan, IP, dan data rahasia.","2.7.1 Data encoding: data hasil tokenisasi (mis. TFRecords di TensorFlow), embedding di memori/GPU, dan checkpoint model (.ckpt/.pth) tetap perlu access control dan enkripsi; vector database perlu access control, enkripsi, dan desain/pengelolaan vector index untuk membatasi siapa/apa yang dapat mengaksesnya.","2.7.2 Data access: agregasi data menimbulkan risiko baru: data lake menjadi target empuk untuk exfiltration, access control sumber bisa tidak tertranslasi ke target, eksplorasi oleh data scientist dapat memperlebar least privilege, dan replikasi data menambah sistem yang masuk scope compliance.","Kontrol akses: review data flow sistem AI untuk mengidentifikasi sistem, data store, dan pengguna; pastikan kongruensi access control dari sistem asal ke sistem target, serta review network access policy agar data hanya berada di sistem yang dikenal dan berwenang.","2.7.3 Data confidentiality/secrecy: banyak model membutuhkan data yang machine-readable; metode tokenisasi populer seperti byte-pair encoding (BPE) dan WordPiece memakai cleartext, sehingga data sensitif bisa didekripsi selama pengembangan.","Homomorphic encryption memungkinkan training tanpa dekripsi, tetapi penggunaannya masih terbatas karena biaya komputasi tinggi; untuk saat ini gunakan compensating controls: batasi akses ke data produksi tidak terenkripsi, monitor penggunaan data sensitif, dan disk-level encryption sebagai defense in depth.","2.7.4 Data backup: dataset sumber biasanya sudah di-backup di sistem asal, tetapi artefak baru AI harus di-backup: data hasil postprocessing, tokenized training data (binary), model weights, dan parameter/definisi arsitektur model (JSON/YAML).","Untuk mendukung explainability model yang nondeterministik, simpan salinan training dan testing dataset beserta hasil performance testing dan bias testing.","2.7.5 Data integrity: ancaman meliputi data poisoning (mengubah data training), model tampering (mengubah weights/arsitektur/parameter), dan embedding tampering (mengubah embedding matrix).","Integritas juga bisa rusak akibat error ETL saat preprocessing; kontrolnya adalah mendefinisikan, mendokumentasikan, menguji, dan mengimplementasikan requirement serta logika ETL dengan benar (lihat juga 3.10.5)."],"terms":[{"term":"Tokenization","def":"Pemecahan data mentah (teks) menjadi unit token yang direpresentasikan secara numerik untuk diproses model."},{"term":"Embedding","def":"Representasi vektor numerik dari token/data yang menangkap makna atau karakteristiknya."},{"term":"Homomorphic encryption","def":"Teknik enkripsi yang memungkinkan komputasi (termasuk training) atas data terenkripsi tanpa mendekripsinya; masih mahal secara komputasi."},{"term":"Model tampering","def":"Modifikasi tidak sah terhadap weights, arsitektur, atau parameter model untuk menghasilkan output salah/bias/berbahaya."},{"term":"Embedding tampering","def":"Manipulasi embedding matrix untuk mendistorsi hasil model."}],"examTip":"Enkripsi penuh data training sering tidak praktis karena model butuh data yang terbaca; jawaban yang tepat biasanya compensating controls (pembatasan akses, monitoring penggunaan data sensitif, enkripsi at rest/in transit). Ingat juga artefak AI (weights, tokenized data, konfigurasi arsitektur) harus masuk cakupan backup."}]},{"id":"B","title":"AI Solution Development Methodologies and Life Cycle","overview":"Software konvensional berbasis logika yang dikodekan, sedangkan AI berbasis data dan algoritma ML yang belajar pola sendiri serta dapat berubah seiring waktu (model drift). Karena itu dibutuhkan siklus pengembangan khusus AI yang iteratif dan dilengkapi prinsip privacy & security by design.","sections":[{"num":"2.8","title":"AI Solution Development Life Cycle","bookPage":91,"pdfPage":97,"summary":"Pengembangan AI sangat iteratif: use case development, design, development, evaluation, deployment, monitoring & maintenance, hingga decommission. Metodologi waterfall atau agile murni sering kurang cocok sehingga pendekatan hybrid bisa lebih efektif, dan data governance harus dioperasionalkan di setiap tahap.","points":["2.8.1 Use case development: banyak proyek AI gagal karena use case tidak cocok untuk AI dan ekspektasi berlebihan; faktor kegagalan umum: salah memahami/mengomunikasikan masalah, kurangnya data berkualitas, tidak menyelesaikan masalah bisnis, infrastruktur tidak memadai, dan masalah terlalu sulit untuk AI.","Atribut use case yang baik: fokus pada masalah bisnis (bukan teknologi) dengan sumber daya & waktu cukup serta memahami keterbatasan AI; kualitas data memadai (volume, veracity, bersih, berlabel); kemitraan bisnis-teknis dengan metrik keberhasilan bisnis (bukan sekadar performa model). Use case yang baik mendorong ROI.","2.8.2 Design: berbeda dengan software konvensional, desain AI melibatkan eksplorasi dataset untuk menentukan apakah data cocok menyelesaikan masalah, melalui kolaborasi pakar bisnis/data dan data scientist. Data ingestion mengumpulkan data dari berbagai sumber ke data lake, dan pipeline otomatis mungkin dibutuhkan untuk retraining/inference.","Feature selection: terlalu sedikit fitur menyebabkan underfitting, generalisasi buruk, dan model gagal menangkap penggerak sebenarnya; terlalu banyak fitur menyebabkan overfitting, biaya komputasi tinggi, dan bobot fitur sulit diinterpretasi.","Deep learning (neural network) mengekstraksi fitur secara otomatis; pada LLM berarsitektur transformer, feature engineering bersifat tidak langsung melalui pilihan tokenisasi (granularitas sub-word/word/karakter, karakter khusus) dan desain embedding.","Saat menilai desain, auditor memastikan algoritma dan training dataset fit for purpose, keputusan desain/sumber data/output yang diharapkan terdokumentasi; model supervised lebih mudah dinilai (fitur & label terlihat), sedangkan model self-learning/unsupervised butuh inspeksi lebih dalam atas bagaimana dataset dikurasi.","2.8.3 Development: AI butuh data nyata di lingkungan nonproduksi untuk training akhir (synthetic data hanya untuk tahap awal arsitektur), sehingga data governance harus diperluas ke environment nonproduksi dan bahkan laptop lokal. Data preprocessing mencakup imputasi, normalisasi, menghapus duplikat/outlier, dimensionality reduction, serta menghapus data opt-out dan data sensitif yang tidak diperlukan secara berkala.","Dataset preparation: labeled dataset untuk supervised learning; dataset dibagi minimal tiga bagian dengan menjaga distribusi data: training (60–80%), validation (10–20%, untuk tuning hyperparameter/memilih model), dan testing (10–20%, evaluasi final). Manual menyebut teknik ini cross-validation.","Model training: biaya dan waktu dipengaruhi ukuran dataset, hardware, dan model (dari jam hingga minggu, bisa sampai jutaan USD) serta berdampak pada sustainability; monitor overfitting (early stopping, dropout node) dan simpan progres (checkpoint) untuk mengantisipasi crash.","2.8.4 Evaluation: ukur precision, recall, dan F1 score dengan data yang belum pernah dilihat model; iterasi tuning-retraining hingga target performa dan metrik bisnis tercapai, lalu evaluasi final dengan testing dataset. Uji juga output berbahaya/toxic/bias dan simpan artefak pengujian untuk kebutuhan explainability.","2.8.5 Deployment: model dibungkus software agar dapat dipakai pengguna; inference = memakai model terlatih untuk menghasilkan output dari data baru, dengan preprocessing tambahan sesuai modality input (teks, suara, visual).","2.8.6 Monitoring & maintenance: data drift dan model drift menurunkan performa (mis. karena musiman atau perubahan preferensi), sehingga pantau metrik dan lakukan root cause analysis lalu retraining bila performa turun di bawah batas; AI observability memantau data hingga performa model; maintenance berkala memperbarui model dengan data baru, arsitektur, umpan balik pengguna, atau menekan pola tidak diinginkan.","2.8.7 Decommission: lebih dari sekadar mematikan inference service; turunan (derivatives) dari base model juga harus masuk cakupan. 'Melupakan' data melalui retraining tanpa dataset tertentu tidak praktis untuk model besar dengan miliaran parameter."],"terms":[{"term":"Feature engineering","def":"Pemilihan/pembentukan fitur input yang relevan untuk model ML."},{"term":"Underfitting","def":"Model terlalu sederhana sehingga gagal menangkap hubungan dalam data dan berkinerja buruk."},{"term":"Overfitting","def":"Model terlalu pas dengan data training sehingga gagal menggeneralisasi pada data baru."},{"term":"Hyperparameter","def":"Pengaturan training yang ditentukan sebelum/di luar proses belajar (mis. batch size, attention heads)."},{"term":"Training / validation / testing dataset","def":"Pembagian data untuk melatih (60–80%), menyetel (10–20%), dan mengevaluasi akhir model (10–20%)."},{"term":"Precision, recall, F1 score","def":"Metrik evaluasi: ketepatan prediksi positif, kemampuan menemukan semua kasus positif, dan rata-rata harmonik keduanya."},{"term":"Inference","def":"Proses menggunakan model terlatih untuk menghasilkan output dari data yang belum pernah dilihat."},{"term":"Data drift / model drift","def":"Penurunan performa model karena karakteristik data input berubah atau model tidak lagi sesuai dengan pola baru."}],"examTip":"Penyebab utama kegagalan proyek AI adalah use case yang tidak cocok/tidak jelas masalah bisnisnya, bukan teknologinya. Auditor harus memastikan data governance diperluas ke environment nonproduksi (karena AI memakai data nyata saat development), dan bahwa decommission mencakup model turunan."},{"num":"2.9","title":"Privacy and Security by Design","bookPage":96,"pdfPage":102,"summary":"Untuk menjawab kekhawatiran privacy dan security dari AI yang nondeterministik, organisasi harus menanamkan prinsip privacy by design dan secure by design sejak awal, ditambah upaya explainability dan robustness.","points":["2.9.1 Privacy by design (Ann Cavoukian) memasukkan privacy ke desain teknologi, proses bisnis, dan infrastruktur sejak awal, bukan sebagai tambahan belakangan; tujuannya bukan menghentikan penggunaan data, tetapi memungkinkan penggunaan data secara aman.","Tujuh prinsip privacy by design: proactive not reactive (preventif); privacy as the default setting; privacy embedded into design; full functionality (positive-sum, bukan zero-sum); end-to-end security (perlindungan sepanjang siklus hidup data); visibility & transparency; respect for user privacy (user-centric).","UK ICO juga memiliki tujuh prinsip: pemrosesan adil dan sah; tujuan yang spesifik; batas jumlah data yang disimpan; data akurat dan mutakhir; retensi data; hak individu (akses, keberatan direct marketing, automated decision making, koreksi, kompensasi); dan information security.","2.9.2 Secure by design (CISA, NSA, FBI, dkk.) menanamkan cybersecurity sejak awal pengembangan melalui secure development practices dan defense in depth; termasuk secure by default (proteksi terhadap ancaman umum tanpa biaya tambahan). Tiga prinsipnya: take ownership of customer security outcomes; embrace radical transparency and accountability; build organizational structure and leadership untuk mencapainya.","2.9.3 Explainability: model deep learning menyimpan pola dalam matriks berdimensi tinggi sehingga sulit dijelaskan; GDPR memberi hak terkait keputusan otomatis, dan EU AI Act (Article 86) menambah right to explanation atas keputusan individual dari sistem AI.","Teknik meningkatkan explainability: jelaskan AI governance (melibatkan privacy, legal, security, HR); jelaskan data personal yang dipakai dan bagaimana opt-out diproses; jelaskan cara consent diperoleh; jelaskan proses data cleaning; jelaskan security control atas dataset, model, dan software; dokumentasikan desain model, hyperparameter, dan metrik evaluasi; jelaskan proses training/evaluasi termasuk adversarial, bias, dan toxicity testing.","2.9.4 Robustness: sistem AI harus tetap berfungsi meski ada input tak terduga, perubahan kondisi, atau serangan, dan gagal secara aman (safe failure). Tekniknya: input validation & sanitization (melawan prompt injection), limit/throttling untuk mencegah infinite loop atau konsumsi sumber daya berlebih, error handling proaktif, dan fail safe bila output tidak memenuhi metrik akurasi/trust/safety.","Changing conditions (pola data, norma/preferensi manusia, infrastruktur) memengaruhi robustness, sehingga postproduction monitoring dan maintenance esensial; attacks on AI (data/model poisoning, input/instruction substitution) menambah attack surface di luar IT konvensional."],"terms":[{"term":"Privacy by design","def":"Kerangka yang menanamkan perlindungan privacy ke dalam desain sistem dan proses bisnis sejak awal (7 prinsip Cavoukian)."},{"term":"Secure by design / secure by default","def":"Keamanan siber ditanamkan sejak awal pengembangan; produk sudah terlindungi dari ancaman umum secara default tanpa biaya tambahan."},{"term":"Explainability","def":"Kemampuan menjelaskan bagaimana sistem AI sampai pada suatu output/keputusan."},{"term":"Robustness","def":"Kemampuan sistem AI tetap berkinerja dan gagal secara aman saat menghadapi input tak terduga, perubahan kondisi, atau serangan."},{"term":"Right to explanation","def":"Hak individu (EU AI Act Art. 86) untuk memperoleh penjelasan atas keputusan yang diambil oleh sistem AI."}],"examTip":"Bedakan dua set tujuh prinsip (Cavoukian vs UK ICO) dan tiga prinsip secure by design. Untuk explainability, auditor mengecek bukti dokumentasi (governance, consent, data cleaning, pengujian), bukan menuntut kode model dapat dibaca."}]},{"id":"C","title":"Change Management Specific to AI","overview":"Tujuan change management tetap sama (semua pihak terinformasi, dampak ke layanan minimal, testing, rollback, stakeholder management), tetapi AI menambah dimensi perubahan pada data, model, regulasi/masyarakat, emergency change, dan konfigurasi.","sections":[{"num":"2.10","title":"Change Management Considerations","bookPage":101,"pdfPage":107,"summary":"Solusi AI membutuhkan kontrol change management tambahan karena perilakunya sensitif terhadap perubahan data, model, parameter, dan lingkungan eksternal. Program change management TI harus memasukkan data dan model AI ke dalam cakupannya.","points":["Kesamaan dengan software konvensional: proses perubahan terkontrol dan terstruktur, pentingnya testing, rollback plan, dan stakeholder management (merujuk CISA Review Manual).","2.10.1 Data dependency: model mengharapkan atribut data input tertentu; dokumentasikan data input requirements agar selaras dengan input produksi, dan perubahan pada sumber data atau preprocessing butuh perhatian khusus.","Perubahan yang tidak diinisiasi organisasi (musiman, preferensi pengguna, munculnya kelas data baru) tetap memengaruhi model, sehingga data drift monitoring wajib menjadi bagian program change management AI.","2.10.2 AI model: perilaku model dapat berubah lewat parameter inference (mis. temperature pada GPT-4 yang memengaruhi 'kreativitas' output) atau dengan menukar model/versi model; governance atas model yang dipakai harus masuk program change management.","2.10.3 Regulatory & societal impact: regulasi AI terus berkembang dan sentimen publik berubah; organisasi perlu memasukkan workforce impact analysis (reskilling, desain ulang pekerjaan, dukungan transisi) dan memantau lanskap regulasi serta sentimen masyarakat dalam proses perubahan.","2.10.4 Emergency changes: retraining model butuh jam hingga minggu, tidak cocok dengan jendela patch darurat. Alternatif: rollback ke model sebelumnya (jika masalah tidak ada di dataset model lama) atau implementasi input/output validation di luar model untuk menyaring input bermasalah dan output buruk.","Semua emergency change tetap harus direview dan disetujui stakeholder kunci mengikuti protokol persetujuan change management yang sudah ada.","2.10.5 Configuration management: lacak configurable postproduction parameters dan pantau penyimpangan dari standar; pastikan konsistensi preprocessing antara fase training dan inference produksi, serta gunakan tokenization framework yang sama di training dan produksi."],"terms":[{"term":"Data dependency","def":"Ketergantungan fungsi model AI pada struktur, kualitas, dan atribut data input yang sesuai dengan data training."},{"term":"Temperature","def":"Parameter inference yang mengatur tingkat variasi/kreativitas output model generatif."},{"term":"Rollback (AI model)","def":"Kembali ke versi model sebelumnya sebagai respons perubahan darurat."},{"term":"Workforce impact analysis","def":"Analisis dampak penerapan AI terhadap pekerjaan dan kebutuhan reskilling karyawan."}],"examTip":"Untuk menjaga akurasi output saat data berubah, komponen change management yang paling tepat adalah data drift monitoring. Untuk perubahan darurat, jawaban terbaik biasanya rollback model atau input/output validation, bukan retraining kilat; dan persetujuan stakeholder tetap wajib."}]},{"id":"D","title":"Supervision of AI Solutions","overview":"Seiring AI makin otonom (agency), organisasi perlu supervisi yang kuat atas keputusan, output, dan dampaknya melalui logging & monitoring, AI observability, human in the loop, dan pengendalian hallucination.","sections":[{"num":"2.11","title":"AI Agency","bookPage":103,"pdfPage":109,"summary":"AI agency adalah kemampuan AI bertindak dan memutuskan secara mandiri, yang memunculkan pertanyaan akuntabilitas, etika, konflik nilai, dan explainability. Organisasi harus segera menetapkan mekanisme supervisi atas keputusan, output, dan dampak AI.","points":["Pertanyaan praktis AI agency: siapa yang akuntabel atas konsekuensi tindakan AI otonom/semi-otonom, regulasi diri apa yang dimiliki AI untuk bertindak etis dan aman, bagaimana jika keputusan AI bertentangan dengan nilai pengguna, dan ekspektasi explainability jika desainer pun tidak dapat menginterpretasi keputusan AI.","2.11.1 Logging & monitoring: model DL harus dibuat transparan dengan log jalur keputusan; namun jumlah 'nano decisions' bisa mencapai jutaan sehingga butuh analitik/otomasi. Kompromi praktis: log langkah kunci, data input, parameter & versi model, serta output sebagai audit trail untuk troubleshooting.","2.11.2 AI observability (menjaga availability, reliability, performance, trustworthiness) mencakup empat kategori: data pipelines (telemetri data untuk mendeteksi prompt injection atau kualitas data buruk), infrastructure & system (kesehatan sistem, kapasitas, SLA, biaya storage), model performance (feedback loop input/output dan umpan balik pengguna untuk mendeteksi drift dan hallucination), dan interpretability.","Strategi interpretasi model DL: counterfactual explanations (perubahan fitur terkecil yang mengubah prediksi), feature visualization (memvisualisasikan fitur yang aktif menjadi konsep yang mudah dipahami), dan influential instance (menghapus instance dari training data untuk melihat perubahan perilaku; influence functions dan deletion diagnostics disebut alat debugging terbaik).","Model seperti regresi dan decision tree mudah diinterpretasi; DL dengan hidden layers jauh lebih sulit.","2.11.3 Human in the loop (HITL): untuk keputusan kritis (mis. diagnosis penyakit), manusia ditempatkan sebagai pengambil keputusan akhir; workflow harus dirancang mewajibkan persetujuan eksplisit pada kondisi tertentu, dengan konsekuensi memperlambat sistem.","2.11.4 Hallucination: prediksi yang tidak berdasar pada input data atau realitas, umum pada GenAI; berisiko tinggi pada konteks regulated/high-risk (kepercayaan, keselamatan, kesejahteraan pengguna).","Penyebab hallucination: flawed training data (bias/fiktif, tidak dibersihkan/salah label), lack of real-world grounding ('kebenaran' AI hanya dari data training), dan ambiguity in data input (input tidak cukup atau bias).","Kontrol hallucination: data berkualitas, beragam, relevan; guardrails pada input dan output untuk membatasi opsi; dan templates untuk memberi struktur output yang konsisten."],"terms":[{"term":"AI agency","def":"Kemampuan AI untuk bertindak dan mengambil keputusan secara independen."},{"term":"AI observability","def":"Pemantauan holistik sistem AI (data pipeline, infrastruktur, performa model, interpretability) melalui telemetri."},{"term":"Telemetry","def":"Pengumpulan dan analisis data operasional untuk meningkatkan performa sistem AI."},{"term":"Human in the loop (HITL)","def":"Kontrol yang mewajibkan manusia meninjau/menyetujui keputusan AI sebelum workflow berlanjut."},{"term":"Hallucination","def":"Output AI yang tidak berdasar pada input atau realitas (salah, tidak ada, atau mustahil)."},{"term":"Counterfactual explanation","def":"Penjelasan berupa perubahan minimal pada fitur input yang akan mengubah hasil prediksi."},{"term":"Guardrails","def":"Batasan pada input/output sistem AI untuk menjaga perilaku tetap aman dan konsisten."}],"examTip":"Untuk keputusan berdampak tinggi (kesehatan, keselamatan, finansial), kontrol yang paling tepat biasanya HITL. Log minimal yang harus ada untuk audit trail: data input, parameter dan versi model, serta output."}]},{"id":"E","title":"Testing Techniques for AI Solutions","overview":"Pengujian AI menantang karena banyak model bersifat black box, tetapi teknik pengujian software konvensional tetap dapat diadaptasi dan dilengkapi teknik khusus AI seperti model cards, bias testing, dan adversarial testing.","sections":[{"num":"2.12","title":"Conventional Software Testing Techniques Applied to AI Solutions","bookPage":107,"pdfPage":113,"summary":"Teknik pengujian konvensional (A/B, unit & integration, objective verification, code review, black box) masih berlaku untuk komponen solusi AI dengan penyesuaian terhadap peran data dan sifat model.","points":["2.12.1 A/B testing: membandingkan dua versi model/sistem untuk melihat mana yang lebih baik; dapat dipakai untuk memvariasikan fitur dataset, arsitektur model, hyperparameter, bahkan algoritma.","2.12.2 Unit testing: memecah sistem AI menjadi komponen (mis. Google Maps memakai beberapa model untuk rute, estimasi waktu tiba, dan voice prompt) dan menguji fungsi serta performa masing-masing.","Integration testing: komponen AI berdampak kumulatif; data flow dan pipeline diuji sendiri-sendiri dan sebagai satu kesatuan (mis. jika sanitasi input untuk prompt injection gagal, sistem bisa memberi output salah atau bertindak berbahaya).","2.12.3 Objective verification: kembali ke tujuan bisnis dan success criteria dari tahap use case untuk memastikan KPI tercapai (akurasi prediksi, waktu inference, cost-to-serve per 1.000 prediksi); solusi bisa berfungsi tetapi gagal mencapai tujuan bisnis/finansial, dan AI steering committee dapat mensyaratkan verifikasi ini sebelum go-live.","2.12.4 Code reviews: tetap penting untuk kode preprocessing, training, aplikasi dan API (otomatis via scanner atau manual); efektif untuk model sederhana dan deterministik, tetapi tidak layak untuk menginterpretasi keputusan model besar nondeterministik yang tersimpan sebagai matriks berdimensi tinggi.","2.12.5 Black box testing: memvariasikan input (training maupun inference) sambil menjaga variabel lain tetap untuk memetakan jalur keputusan; kadang menjadi satu-satunya cara menguji model, tetapi sangat memakan sumber daya dan waktu."],"terms":[{"term":"A/B testing","def":"Membandingkan dua versi model/sistem untuk menentukan mana yang lebih baik mencapai hasil yang diinginkan."},{"term":"Objective verification","def":"Verifikasi bahwa solusi AI mencapai tujuan bisnis dan KPI yang ditetapkan saat use case development."},{"term":"Black box testing","def":"Pengujian dengan memvariasikan input dan mengamati output tanpa akses ke logika internal."},{"term":"Cost-to-serve","def":"Biaya operasional untuk menghasilkan sejumlah prediksi (mis. per 1.000 prediksi)."}],"examTip":"Model yang akurat secara teknis belum tentu sukses; objective verification terhadap KPI bisnis adalah syarat sebelum go-live. Code review tidak cukup untuk menjelaskan keputusan model besar yang nondeterministik."},{"num":"2.13","title":"AI-specific Testing Techniques","bookPage":108,"pdfPage":114,"summary":"Teknik pengujian khusus AI meliputi model cards sebagai dasar perencanaan pengujian, bias testing di berbagai tahap siklus hidup, dan adversarial testing yang mirip red teaming dengan rujukan MITRE ATLAS.","points":["2.13.1 Model cards: dokumen pendamping model berisi detail model (arsitektur, training dataset), metrik performa, dan keterbatasan use case; membantu merancang pengujian kelemahan dan panduan penggunaan serta meningkatkan transparansi dan trust.","Template model card berguna tetapi tidak selalu lengkap, sehingga organisasi tidak boleh hanya mengandalkan template dan perlu menyesuaikannya.","2.13.2 Bias testing: bias di training dataset diwarisi model (usia, gender, ras, budaya, agama) dan dapat memicu hallucination atau output berbahaya; data balancing membantu mendeteksi dataset bias.","Terapkan 'shift left': deteksi dan koreksi bias sejak data cleansing/preprocessing agar tidak perlu retraining yang mahal; setelah model dilatih, ulangi skenario bias testing, dan jika bias masih ada, ulangi cleansing dan retraining hingga target mitigasi tercapai.","2.13.3 Adversarial testing: mirip red team/ethical hacking, dengan sengaja memberi input berbahaya untuk memancing respons tak terduga dan menguji ketahanan terhadap threat actor dan edge case.","MITRE ATLAS (Adversarial Threat Landscape for Artificial-Intelligence Systems) adalah knowledge base taktik dan teknik adversarial untuk AI red team, dengan taktik seperti reconnaissance, resource development, initial access, ML model access, execution, persistence, privilege escalation, defense evasion, credential access, discovery, collection, ML attack staging, exfiltration, dan impact."],"terms":[{"term":"Model card","def":"Dokumen ringkas yang menyertai model AI berisi detail model, data training, metrik performa, dan keterbatasan penggunaan."},{"term":"Bias testing","def":"Pengujian eksplisit untuk mendeteksi bias (mis. usia, gender, ras) pada data dan output model."},{"term":"Shift left","def":"Pendekatan mendeteksi dan memperbaiki masalah sedini mungkin dalam siklus pengembangan."},{"term":"Adversarial testing","def":"Pengujian dengan input berbahaya/rekayasa untuk menilai ketahanan model terhadap serangan dan edge case."},{"term":"MITRE ATLAS","def":"Knowledge base taktik dan teknik adversarial terhadap sistem AI, analog MITRE ATT&CK."}],"examTip":"Kapan bias paling efektif (dan murah) ditangani? Sedini mungkin (shift left) di tahap data cleansing/preprocessing, bukan setelah model produksi. MITRE ATLAS adalah rujukan untuk AI red teaming."}]},{"id":"F","title":"Threats and Vulnerabilities Specific to AI","overview":"Adopsi GenAI yang melonjak (lebih dari 70% sejak 2023) membuka vektor ancaman baru. Menurut OWASP AI Exchange, ancaman AI terbagi menjadi development-time threats, runtime application security threats, dan threats through use; kontrol konvensional tetap menjadi fondasi tetapi perlu dilengkapi kontrol khusus AI.","sections":[{"num":"2.14","title":"Types of AI-related Threats","bookPage":111,"pdfPage":117,"summary":"Manual mengklasifikasikan ancaman AI berdasarkan attack surface OWASP AI Exchange lalu membahas ancaman spesifik: training data leakage, data poisoning, model poisoning, model theft, prompt injection, model evasion, model inversion, risiko vendor AI, dan disruption.","points":["Tiga attack surface menurut OWASP AI Exchange: development-time threats (lingkungan engineering dan supply chain, mis. data leak, data/model poisoning, model theft saat development), runtime application security threats (kelemahan IT non-AI pada wrapper/infrastruktur, mis. SQL injection, password guessing, bypass access control, compromise plugin), dan threats through use (saat input/output normal, mis. evasion, model theft, model inversion, membership inference, denial of model service, prompt injection).","2.14.1 Training data leakage: data dapat bocor dari sumber, platform preprocessing, atau environment individual (Jupyter Notebooks, Google Colab); satu baris kode Python bisa mengeksfiltrasi data dan menciptakan data sprawl, sehingga perlu kontrol infrastruktur & jaringan plus monitoring tingkat aplikasi.","2.14.2 Data poisoning: memasukkan data berbahaya/keliru untuk mengubah perilaku model. Entry point: source, supplier/data broker, in transit (sistem perantara pipeline), preprocessing (rutin cleansing dimodifikasi), dan in-context training (knowledge base RAG). Dampaknya: backdoor/Trojan horse untuk perilaku tertentu atau sabotase safety/trust/performa.","2.14.3 Model poisoning: tiga metode: meracuni data, mengubah langsung parameter/arsitektur/library training, atau melalui model supplier (pretrained model pihak ketiga yang di-fine-tune). Mitigasi: access control ke environment development/produksi yang direview berkala.","2.14.4 Model theft: model adalah IP bernilai jutaan dolar; dapat dicuri dengan mengakses repository/sistem tempat file, konfigurasi, dan binary disimpan atau dimuat di memori, atau saat runtime/through use dengan mengirim input yang dirancang khusus dan menganalisis output untuk merekonstruksi model. Model curian juga dipakai untuk merancang serangan lanjutan.","2.14.5 Prompt injection: prompt rekayasa yang membuat model mengabaikan instruksi asli dan mengikuti instruksi penyerang (analog SQL injection); mudah dilakukan tanpa privilege tambahan melalui UI/API normal. Indirect prompt injection terjadi saat model menyerap instruksi berbahaya dari sumber lain (mis. konten RAG). Mitigasi: prompt templates untuk struktur & sanitasi, serta pelarangan output tidak sah saat runtime.","2.14.6 Model evasion: penyerang memodifikasi input untuk mengelabui prediksi (misclassification/misdetection), mis. email berbahaya diubah agar dinilai 'aman' oleh filter email berbasis AI.","2.14.7 Model inversion: bertujuan mengekstrak informasi sensitif dengan mempelajari pola input-output secara sistematis (bahkan melatih model terpisah); hasilnya bisa berupa attribute inference, membership inference (apakah record tertentu ada di training data), atau rekonstruksi training dataset.","2.14.8 Vendor-supplied AI: vendor menanggung training dan pengamanan model, tetapi dampak data/model poisoning tetap dirasakan organisasi pengguna; OWASP threat model untuk GenAI out of the box (OOTB) menekankan model supply chain management, monitoring, rate limiting, dan access control.","2.14.9 AI solution disruption: volume besar request inference atau request yang berat secara komputasi dapat menyebabkan denial of service (DoS) atau degradasi layanan."],"terms":[{"term":"Development-time threats","def":"Ancaman selama pengembangan AI, menyasar lingkungan engineering dan supply chain data/model."},{"term":"Threats through use","def":"Ancaman yang terjadi melalui interaksi normal dengan model (input/output)."},{"term":"Data poisoning","def":"Penyisipan data berbahaya/keliru ke dataset untuk mengubah perilaku model."},{"term":"Model poisoning","def":"Manipulasi model melalui data, perubahan langsung parameter/arsitektur/library, atau model supplier."},{"term":"Model theft","def":"Pencurian model melalui akses ke file/repository atau ekstraksi lewat query input-output."},{"term":"Prompt injection (direct/indirect)","def":"Prompt rekayasa yang membajak instruksi model; indirect bila instruksi berbahaya masuk melalui sumber data lain seperti RAG."},{"term":"Model evasion","def":"Modifikasi input untuk mengelabui model agar salah mengklasifikasi/mendeteksi."},{"term":"Model inversion","def":"Teknik menyimpulkan data training atau atribut sensitif dari perilaku input-output model."},{"term":"Membership inference","def":"Menentukan apakah record data tertentu termasuk dalam training dataset."}],"examTip":"Bedakan: evasion = menipu model agar salah prediksi; inversion = mengekstrak data sensitif; theft = menyalin model; poisoning = merusak data/model saat training. Prompt injection mudah dilakukan karena memakai antarmuka resmi tanpa privilege. Organisasi pengguna AI vendor tetap harus mengelola risiko supply chain meski pengamanan development menjadi tanggung jawab vendor."},{"num":"2.15","title":"Controls for AI-related Threats","bookPage":114,"pdfPage":120,"summary":"Kontrol konvensional (access control, least privilege, confidentiality/minimization/integrity, enkripsi at rest/in transit, security monitoring) tetap menjadi fondasi, diperluas ke seluruh supply chain AI dan dilengkapi kontrol khusus AI.","points":["Access control dan least privilege diterapkan pada training dataset (mencegah leakage & poisoning) dan artefak model (mencegah theft & poisoning), serta diperluas ke seluruh sistem dalam supply chain AI.","Kontrol data confidentiality, minimization, dan integrity menjaga privacy data yang dieksplorasi developer; enkripsi seluruh dataset tidak praktis saat training, tetapi enkripsi at rest dan in transit tetap tepat; integritas data adalah kontrol kunci terhadap poisoning.","Security monitoring diperluas ke semua sistem AI dan dipadukan dengan AI observability untuk mendeteksi serangan runtime dan through use; telemetri konvensional dan spesifik AI digabung untuk cakupan attack chain yang lebih luas.","2.15.1 Threat & vulnerability identification: scanner kerentanan/kode konvensional tidak efektif untuk ancaman khusus AI karena 'instruksi' model ada di arsitektur, fitur, dan weights; namun secure coding (rate limiting, input validation/sanitization, fail close) tetap relevan untuk komponen pendukung seperti inference engine dan API wrapper.","2.15.2 Prompt templates: menstandarkan dan menyanitasi instruksi sebagai langkah preprocessing, efektif mengurangi risiko prompt injection, sekaligus meningkatkan performa output karena standardisasi.","2.15.3 Adversarial testing: lihat 2.13.3 (red teaming terhadap model).","2.15.4 Defensive distillation: melatih model 'teacher' lalu model 'distilled' dari hasil teacher untuk inference, sehingga lebih tahan terhadap adversarial input.","2.15.5 Regularization: mencegah overfitting dan membuat batas keputusan model kurang tegas sehingga lebih sulit dipetakan oleh serangan inferensial yang memakai perubahan kecil pada input."],"terms":[{"term":"Prompt template","def":"Struktur baku untuk input prompt yang membatasi dan menyanitasi instruksi sebelum masuk model."},{"term":"Defensive distillation","def":"Teknik melatih model kedua (distilled) dari output model teacher untuk meningkatkan ketahanan terhadap adversarial input."},{"term":"Regularization","def":"Teknik mencegah overfitting yang juga mempersulit serangan inferensial terhadap batas keputusan model."},{"term":"Fail close","def":"Prinsip secure coding di mana sistem menolak/menghentikan proses ketika terjadi kegagalan, bukan meloloskannya."}],"examTip":"Kontrol BEST untuk prompt injection adalah prompt templates/input structuring dan sanitization (bukan access control data, update algoritma, atau endpoint security). Ingat bahwa vulnerability scanner konvensional tidak cukup mendeteksi ancaman AI-specific."}]},{"id":"G","title":"Incident Response Management Specific to AI","overview":"Proses lima fase ISO/IEC 27035-1 (Prepare, Identify & report, Assess, Respond, Postincident) dapat diadaptasi untuk insiden AI. Tantangannya: output AI probabilistik sehingga sulit menentukan kapan kesalahan menjadi insiden, dan containment/eradication lebih sulit dibanding insiden TI konvensional.","sections":[{"num":"2.16","title":"Prepare","bookPage":118,"pdfPage":124,"summary":"Kesiapan memberi peluang pemulihan dan resiliensi terbaik, tetapi kebanyakan incident response program (IRP) belum diadaptasi untuk insiden AI. Persiapan mencakup kebijakan & dokumentasi model, tim yang tepat, dan tabletop exercise.","points":["ISO/IEC 27035-1:2023 menjadi kerangka lima fase penanganan insiden keamanan yang dapat diadaptasi untuk AI.","Contoh insiden AI: penyalahgunaan output AI yang merugikan masyarakat, pengungkapan data rahasia/personal dari training dataset, dan prediksi yang salah, hallucinated, atau bias.","2.16.1 Policies, procedures & model documentation: kebijakan IR harus mencakup ancaman khusus AI, teknik deteksi & respons, dan pertimbangan etika; debat mengenai penggunaan AI harus diputuskan di luar momen insiden aktif.","Dokumentasi menyeluruh (mis. model cards) membantu investigator memahami arsitektur, data training, dan proses keputusan model; dokumentasi juga harus memuat communication plan dan escalation protocol ke stakeholder internal/eksternal, termasuk penegak hukum.","2.16.2 Incident response team: selain responder TI dan security, libatkan data stewards/owners, data engineers & scientists (menafsirkan perilaku anomali), privacy experts (dampak data pribadi, hak subjek, data sovereignty), dan AI ethicist.","2.16.3 Tabletop exercises: latih tim dengan SOP, keterampilan, dan alat (audit log, forensic tools, model cards); investigasi data poisoning berbeda dari forensik breach biasa karena butuh akses/salinan data lake dan kolaborasi dengan tim data, sehingga latihan perlu memasukkan eksplorasi dataset dan analisis input/output."],"terms":[{"term":"ISO/IEC 27035-1","def":"Standar prinsip dan proses manajemen insiden keamanan informasi (5 fase: prepare, identify & report, assess, respond, postincident)."},{"term":"Incident response program (IRP)","def":"Program organisasi untuk menyiapkan dan menangani insiden, perlu diadaptasi untuk risiko AI."},{"term":"AI ethicist","def":"Peran yang bertanggung jawab atas penggunaan AI yang aman dan etis, anggota baru tim IR AI."},{"term":"Tabletop exercise","def":"Simulasi diskusi skenario insiden untuk melatih kesiapan tim respons."}],"examTip":"Komposisi tim IR AI adalah topik yang mudah diuji: data stewards, data scientists/engineers, privacy experts, dan AI ethicist melengkapi tim IR konvensional. Keputusan etis tentang penggunaan AI sebaiknya ditetapkan dalam kebijakan sebelum insiden, bukan saat insiden berlangsung."},{"num":"2.17","title":"Identify and Report","bookPage":118,"pdfPage":124,"summary":"Karena AI probabilistik dan pasti salah pada persentase tertentu, organisasi harus menetapkan ambang batas kapan prediksi yang salah dianggap insiden. Deteksi bergantung pada AI observability, baseline performa, dan HITL untuk hal subjektif.","points":["Kesalahan prediksi adalah bagian dari desain AI (model overfitted justru tidak menggeneralisasi), sehingga mendefinisikan threshold insiden membuat deteksi lebih menantang.","Perlu metrik yang jelas dan baseline performa/perilaku normal AI untuk mengetahui kapan sistem menyimpang; sebagian deteksi bisa otomatis lewat observability tools, sebagian lain butuh HITL untuk penilaian subjektif.","Serangan pada data seperti data poisoning lebih sulit dideteksi dibanding data loss/leakage tradisional karena dapat terjadi di banyak tahap data pipeline.","Deteksi prompt injection: proses evaluasi dan sanitasi input, serta monitoring input atipikal (struktur mirip kode, karakter khusus berlebihan, perubahan halus bervolume tinggi).","Deteksi data poisoning: monitoring access log dan change log sistem dalam data supply chain, review perubahan tidak sah pada skrip preprocessing, serta review dataset versioning dan hash.","Deteksi adversarial inference: analisis log panggilan API dan pemindaian pola anomali yang mengindikasikan pengujian adversarial sistematis."],"terms":[{"term":"Baseline (AI performance)","def":"Ukuran performa dan perilaku normal AI sebagai acuan mendeteksi penyimpangan."},{"term":"Dataset versioning and hashes","def":"Pencatatan versi dan nilai hash dataset untuk mendeteksi perubahan/tampering."},{"term":"Adversarial inference","def":"Serangan yang memakai query sistematis melalui saluran input sah untuk menyimpulkan perilaku/data model."}],"examTip":"Prasyarat deteksi insiden AI adalah metrik dan baseline performa yang terdefinisi beserta threshold insiden. Untuk data poisoning, bukti audit kunci adalah log akses/perubahan, review skrip preprocessing, dan hash/versioning dataset."},{"num":"2.18","title":"Assess","bookPage":119,"pdfPage":125,"summary":"Fase assess mengumpulkan fakta untuk menetapkan timeline, cakupan, dan dampak insiden secepat mungkin tanpa merusak integritas investigasi, dibantu dokumentasi model.","points":["Seperti insiden TI konvensional, assessment mengumpulkan fakta untuk menentukan timeline, scope, dan impact.","Kecepatan penting, tetapi integritas investigasi (bukti) tidak boleh dikorbankan.","Pertanyaan kunci: apakah insiden sudah berhenti atau masih berlangsung; siapa yang terdampak dan kerugian apa; kapan insiden ditemukan (penting untuk kewajiban breach notification); apa yang terjadi; sistem AI dan data apa yang terdampak; taktik serangan apa yang digunakan.","Identifikasi juga apa yang masih belum diketahui dan informasi apa yang dibutuhkan untuk mengembalikan sistem ke kondisi operasional yang aman.","Dokumentasi model (mis. model cards) mempercepat penilaian insiden AI."],"terms":[{"term":"Breach notification","def":"Kewajiban regulasi untuk memberitahukan pelanggaran data dalam batas waktu tertentu sejak ditemukan."}],"examTip":"Waktu penemuan insiden penting karena memicu tenggat breach notification. Pertanyaan pertama yang relevan: apakah insiden masih berlangsung?"},{"num":"2.19","title":"Respond","bookPage":119,"pdfPage":125,"summary":"Strategi containment, eradication, dan recovery tetap berlaku, tetapi kurang efektif untuk AI karena kompleksitas dan sifat probabilistiknya. Manual memberi teknik per jenis serangan (prompt injection, data poisoning, adversarial inference).","points":["2.19.1 Containment: ancaman terhadap nyawa dan keselamatan manusia menuntut tindakan segera; mengisolasi atau menonaktifkan fungsi AI tertentu bisa sulit karena kompleksitas solusi.","Containment prompt injection: validasi input/output dan prompt templates untuk menyaring prompt berbahaya. Data poisoning: cabut akses ke dataset di semua sistem pipeline dan akses ke kode/skrip preprocessing. Adversarial inference: throttling, validasi, dan sanitasi input tambahan pada API/UI.","2.19.2 Eradication lebih sulit daripada patching atau mengganti kredensial pada insiden konvensional, dan bergantung pada teknik penyerang.","Eradication prompt injection: retraining/fine-tuning agar model tahan injection (mahal/tidak praktis untuk LLM), sehingga input/output validation dan prompt templates tetap menjadi kontrol jangka panjang yang efektif.","Eradication data poisoning: isolasi dan hapus data yang diracuni lalu retrain model (mahal untuk dataset besar); jangka pendek pakai output sanitization, jangka panjang selective retraining dengan data bersih untuk 'memaksa' model melupakan data beracun.","Eradication adversarial inference: regularization dan defensive distillation.","2.19.3 Recovery: pastikan ancaman benar-benar sudah ditahan dan dihapus; sebagian serangan AI tidak dapat dihapus sepenuhnya sehingga solusinya adalah mengurangi attack surface, memonitor ancaman residual, dan terus meningkatkan robustness.","Sebelum sistem AI diaktifkan kembali, terapkan access control lebih ketat, validasi input/output baru, dan guardrails lain, lakukan validasi pascainsiden atas kontrol baru, serta peroleh persetujuan seluruh stakeholder terkait."],"terms":[{"term":"Containment","def":"Tindakan membatasi penyebaran dan dampak insiden."},{"term":"Eradication","def":"Menghilangkan penyebab/ancaman insiden dari sistem."},{"term":"Recovery","def":"Mengembalikan sistem ke kondisi operasional yang aman setelah ancaman ditangani."},{"term":"Selective retraining","def":"Retraining dengan data baru yang bersih untuk menghilangkan pengaruh data beracun dari model."}],"examTip":"Keselamatan manusia selalu prioritas pertama dalam containment. Untuk LLM, retraining sering tidak praktis, jadi kontrol jangka panjang yang realistis adalah input/output validation dan prompt templates. Sistem AI baru boleh diaktifkan kembali setelah kontrol baru divalidasi dan disetujui stakeholder."},{"num":"2.20","title":"Postincident Review","bookPage":121,"pdfPage":127,"summary":"Postmortem insiden AI dilakukan untuk mengidentifikasi area perbaikan dan menggeser organisasi dari postur reaktif menjadi proaktif.","points":["Area yang direview: data preprocessing, security controls, kecukupan adversarial testing, kontrol input/output, fairness output, serta control environment dan proses AI provider.","Fase ini mencakup root cause analysis, lessons learned, dan improvement (sesuai fase kelima ISO/IEC 27035-1).","Tujuannya beralih dari reaksi ke kesiapan proaktif untuk meminimalkan dampak insiden AI di masa depan."],"terms":[{"term":"Postincident review (postmortem)","def":"Evaluasi setelah insiden untuk menemukan akar masalah, pelajaran, dan perbaikan."}],"examTip":"Postincident review untuk AI juga harus mencakup kontrol AI provider/vendor, bukan hanya kontrol internal."}]}],"keyTakeaways":["Domain 2 (AI Operations) adalah porsi terbesar ujian AAIA: 46% atau sekitar 34 soal.","Perilaku AI berasal dari data, bukan kode eksplisit; karena itu data governance (consent, klasifikasi, confidentiality, kualitas, balancing, security) adalah fondasi kontrol AI dan harus diperluas ke environment nonproduksi.","Enam dimensi data quality: accuracy, completeness, consistency, timeliness, validity, uniqueness. Output bias terhadap demografi tertentu paling tepat diatasi dengan memperbaiki diversity/representativeness training data.","Siklus hidup AI: use case, design, development, evaluation, deployment, monitoring & maintenance, decommission. Kegagalan proyek AI paling sering berakar pada use case yang tidak tepat; split data 60–80% training, 10–20% validation, 10–20% testing.","Data drift/model drift harus dipantau sebagai bagian change management; emergency change pada AI ditangani dengan rollback model atau input/output validation, tetap dengan persetujuan stakeholder; konsistensi preprocessing dan tokenization antara training dan produksi adalah kontrol configuration management.","Supervisi AI: logging (input, parameter/versi model, output), AI observability (data pipeline, infrastruktur, performa model, interpretability), human in the loop untuk keputusan kritis, serta guardrails dan templates untuk mengurangi hallucination.","Pengujian AI menggabungkan teknik konvensional (A/B, unit/integration, objective verification terhadap KPI bisnis, code review, black box) dan teknik AI-specific (model cards, bias testing secara shift left, adversarial testing dengan MITRE ATLAS).","Kenali taksonomi ancaman OWASP AI Exchange (development-time, runtime, through use) dan bedakan data poisoning, model poisoning, model theft, prompt injection, model evasion, model inversion/membership inference, serta DoS.","Kontrol BEST untuk prompt injection adalah prompt templates plus input/output validation dan sanitization; scanner konvensional tidak efektif untuk ancaman AI-specific; defensive distillation dan regularization meningkatkan ketahanan terhadap adversarial/inference attack.","Incident response AI mengadaptasi ISO/IEC 27035-1 (prepare, identify & report, assess, respond, postincident): tetapkan baseline dan threshold insiden, perluas tim IR (data steward, data scientist, privacy expert, AI ethicist), prioritaskan keselamatan manusia, dan validasi kontrol baru serta peroleh persetujuan sebelum reaktivasi."]},{"id":3,"title":"AI Auditing Tools and Techniques","domain":"Domain 3","weight":"21% (sekitar 16 soal)","pdfStart":131,"pdfEnd":176,"overview":"Chapter ini membahas dua sisi sekaligus: (1) tools dan teknik khusus untuk mengaudit solusi AI, mulai dari perencanaan, pengujian dan sampling, pengumpulan bukti, kualitas data dan analitik, hingga pelaporan; dan (2) pemanfaatan AI oleh auditor sendiri untuk membuat proses audit lebih efisien. AI system (AIS) jauh lebih kompleks daripada aplikasi biasa karena melibatkan banyak model, dataset, versi, owner, dan kewajiban regulasi, sehingga auditor perlu pendekatan dan keterampilan tambahan. Pesan kunci untuk ujian: auditor memvalidasi kontrol dan hasil pengujian (bukan menjalankannya), memakai pendekatan risk-based dan top-down, menjaga independensi, serta tetap memvalidasi outpu
