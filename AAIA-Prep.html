","bookPage":66,"pdfPage":72},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]},{"id":54,"topic":1,"qn":53,"question":"An IS auditor has identified that the configuration of a proprietary AI model has been leaked. Which of the following is the MOST significant risk?","options":{"A":"Attackers can disable security systems by analyzing the model’s source code.","B":"Attackers can use the data to degrade the model's performance.","C":"Attackers can train their own improved model for legitimate use.","D":"Attackers can exploit vulnerabilities in the model."},"url":"https://www.examtopics.com/discussions/isaca/view/366581-exam-aaia-topic-1-question-53-discussion/","community":{"D":1},"answer":"D","confidence":"medium","explanation":"Konfigurasi model proprietary (arsitektur, parameter, setting, guardrail) mengungkap cara kerja internal model. Dengan informasi ini penyerang dapat mempelajari perilaku model dan merancang serangan lanjutan yang tepat sasaran, misalnya model evasion, prompt injection, atau adversarial input, terhadap kelemahan yang teridentifikasi. Manual menjelaskan bahwa model (termasuk file konfigurasinya) yang dicuri dapat dipakai untuk mempelajari perilaku model guna mengembangkan serangan adversarial lebih lanjut. Risiko ini paling signifikan karena berdampak langsung pada keamanan dan integritas sistem produksi.","distractors":{"A":"Konfigurasi model bukan source code sistem keamanan; klaim bahwa penyerang bisa menonaktifkan security systems terlalu spesifik dan tidak langsung.","B":"Menurunkan performa model umumnya memerlukan akses ke data training atau pipeline (poisoning), bukan sekadar konfigurasi yang bocor.","C":"Pihak lain melatih model untuk penggunaan yang sah lebih merupakan isu IP/kompetisi, bukan risiko keamanan yang paling signifikan."},"manualRef":{"chapter":2,"section":"2.14.4","title":"Model Theft","bookPage":112,"pdfPage":118},"links":[{"label":"MITRE ATLAS","url":"https://atlas.mitre.org/"},{"label":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/"}]},{"id":55,"topic":1,"qn":44,"question":"Which of the following would be of GREATEST concern to an IS auditor reviewing an organization’s AI policies and procedures?","options":{"A":"The documentation of AI models does not address business resiliency and disaster recovery.","B":"The AI model does not have an approval process for production changes.","C":"External validation is not required for AI systems before deployment.","D":"The data privacy policy has not been reviewed in the past three years."},"url":"https://www.examtopics.com/discussions/isaca/view/367168-exam-aaia-topic-1-question-44-discussion/","community":{"B":4},"answer":"B","confidence":"high","explanation":"Tidak adanya proses persetujuan untuk perubahan produksi pada model AI merupakan kelemahan kontrol yang fundamental: perubahan model, data, hyperparameter, atau konfigurasi dapat langsung masuk produksi tanpa review risiko dan pengujian, sehingga membuka peluang perubahan tidak sah atau error yang berdampak luas. Manual menegaskan bahwa governance atas model AI harus menjadi bagian dari program change management, dengan proses perubahan, otoritas persetujuan (termasuk emergency changes), dan retensi bukti persetujuan yang terdokumentasi. Temuan lain adalah kelemahan dokumentasi atau review berkala yang dampaknya lebih tidak langsung.","distractors":{"A":"Kurangnya pembahasan BCP/DR dalam dokumentasi model adalah kelemahan, tetapi terkait ketersediaan dan dapat dikompensasi oleh rencana BCP organisasi.","C":"Validasi eksternal tidak selalu diwajibkan; validasi internal yang memadai dapat cukup sesuai tingkat risiko.","D":"Kebijakan privasi yang belum direview tiga tahun adalah isu pemeliharaan kebijakan, dampaknya kurang langsung dibanding perubahan produksi tanpa otorisasi."},"manualRef":{"chapter":3,"section":"3.2","title":"Types of AI Controls","bookPage":134,"pdfPage":140},"links":[{"label":"COBIT","url":"https://www.isaca.org/resources/cobit"},{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]},{"id":56,"topic":1,"qn":41,"question":"Which of the following is the MOST significant risk associated with a deep learning system algorithm being updated as it learns?","options":{"A":"System algorithms can easily be modified by attackers because the algorithms reside in system memory.","B":"Project stakeholders may not endorse the system because its behavior may be contrary to their expectations.","C":"Operational risk may increase because the system is continuously running.","D":"The system may generate discriminatory output because of biases in training data."},"url":"https://www.examtopics.com/discussions/isaca/view/366597-exam-aaia-topic-1-question-41-discussion/","community":{"D":1,"B":2},"answer":"B","confidence":"low","explanation":"Sistem deep learning yang terus memperbarui algoritmanya saat belajar dapat berubah perilakunya tanpa pemrograman ulang, sehingga output dan keputusannya bisa menyimpang dari desain yang disetujui dan dari ekspektasi stakeholder. Risiko utamanya adalah hilangnya prediktabilitas dan akuntabilitas, yang berujung pada stakeholder tidak lagi mendukung sistem. Manual mengangkat pertanyaan tentang apa yang terjadi bila AI mengambil keputusan yang bertentangan dengan nilai pengguna dan menekankan perlunya supervisi atas keputusan AI yang semakin otonom. Bias dari training data (D) adalah risiko yang ada pada semua model, bukan risiko khas model yang terus belajar; suara komunitas juga condong ke B, tetapi soal ini tetap diperdebatkan.","distractors":{"A":"Keberadaan algoritma di memori bukan karakteristik khas model yang belajar; ancaman modifikasi oleh penyerang dimitigasi kontrol akses umum.","C":"Sistem yang berjalan terus-menerus adalah risiko operasional umum, bukan akibat langsung pembaruan algoritma.","D":"Bias dari training data berlaku untuk semua model ML, tidak spesifik pada model yang memperbarui dirinya saat belajar."},"manualRef":{"chapter":2,"section":"2.11","title":"AI Agency","bookPage":103,"pdfPage":109},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":57,"topic":1,"qn":34,"question":"Which of the following controls helps mitigate the risk of competitors poisoning data utilized by a machine learning (ML) model performing sentiment analysis of product reviews?","options":{"A":"Peer reviewing code that acquires product reviews from social media posts","B":"Hiring a marketing firm to text links to customers requesting product reviews for monetary compensation","C":"Requiring customers to authenticate access to their accounts prior to writing product reviews","D":"Augmenting the unbalanced product review data set with the use of oversampling by the model developer"},"url":"https://www.examtopics.com/discussions/isaca/view/318085-exam-aaia-topic-1-question-34-discussion/","community":{"C":2},"answer":"C","confidence":"medium","explanation":"Data poisoning dapat terjadi di sumber tempat data training dikumpulkan; di sini sumbernya adalah ulasan produk yang bisa ditulis siapa saja, termasuk pesaing yang membuat ulasan palsu secara massal. Mewajibkan pelanggan melakukan autentikasi ke akunnya sebelum menulis ulasan adalah kontrol preventif di titik masuk data, sehingga identitas penulis dapat ditelusuri dan ulasan palsu atau otomatis berkurang. Manual menyebut sumber data sebagai salah satu titik masuk data poisoning dan menekankan kontrol akses untuk mencegah poisoning.","distractors":{"A":"Peer review kode menjaga kualitas kode pengambil data, tetapi tidak mencegah konten ulasan berbahaya yang masuk melalui jalur sah.","B":"Membayar pelanggan untuk menulis ulasan justru menimbulkan bias dan potensi ulasan tidak autentik.","D":"Oversampling menangani class imbalance dan malah dapat memperbanyak data yang sudah tercemar."},"manualRef":{"chapter":2,"section":"2.14.2","title":"Data Poisoning","bookPage":112,"pdfPage":118},"links":[{"label":"MITRE ATLAS","url":"https://atlas.mitre.org/"},{"label":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/"}]},{"id":58,"topic":3,"qn":58,"question":"A data loss prevention (DLP) system was recently implemented to identify data retention policy compliance. Which of the following would be the BEST use of AI to collect evidence?","options":{"A":"Document blockchain immutability as evidence of data integrity.","B":"Redirect workflows through automated monitoring tools.","C":"Deploy analytics to identify suspicious data transactions.","D":"Apply natural language queries to identify sensitive information."},"url":"https://www.examtopics.com/discussions/isaca/view/366544-exam-aaia-topic-3-question-58-discussion/","community":{"D":2},"answer":"D","confidence":"medium","explanation":"Kepatuhan terhadap kebijakan retensi data menuntut identifikasi jenis dan lokasi informasi, terutama data sensitif, yang masih disimpan melebihi periode yang diizinkan. Kemampuan NLP untuk menjalankan natural language queries atas data (termasuk data tidak terstruktur) memungkinkan auditor menemukan dan mengklasifikasikan informasi sensitif secara efisien sebagai evidence. Manual menyebut automated data discovery and classification sebagai salah satu pemanfaatan AI dalam program data governance dan privasi. Analitik transaksi mencurigakan (C) lebih relevan untuk deteksi kebocoran atau fraud, bukan kepatuhan retensi.","distractors":{"A":"Blockchain immutability terkait integritas data, bukan pengumpulan evidence kepatuhan retensi, dan bukan pemanfaatan AI.","B":"Mengalihkan workflow ke monitoring tools adalah perubahan proses, bukan penggunaan AI untuk mengumpulkan evidence.","C":"Analitik transaksi mencurigakan berfokus pada exfiltration/anomali, bukan pada apakah data disimpan sesuai kebijakan retensi."},"manualRef":{"chapter":1,"section":"1.14","title":"Data Governance","bookPage":59,"pdfPage":65},"links":[{"label":"NIST Privacy Framework","url":"https://www.nist.gov/privacy-framework"}]},{"id":59,"topic":2,"qn":23,"question":"An IS auditor learns that the training data for an AI solution has insufficient representation. Which of the following would be the GREATEST risk in this situation?","options":{"A":"Imbalance","B":"Underfitting","C":"Overfitting","D":"Clustering"},"url":"https://www.examtopics.com/discussions/isaca/view/315958-exam-aaia-topic-2-question-23-discussion/","community":{"A":2},"answer":"A","confidence":"medium","explanation":"Representasi yang tidak memadai dalam training data berarti sebagian kelompok atau kelas memiliki sampel jauh lebih sedikit dibanding yang lain, yaitu kondisi data imbalance. Manual menjelaskan bahwa data imbalance terjadi ketika dataset kekurangan sampel minority class, sehingga model menghasilkan output yang bias atau tidak akurat, dan akar masalahnya adalah kurangnya data yang cukup dan beragam. Underfitting dan overfitting adalah masalah kompleksitas/generalization model yang dapat timbul dari banyak penyebab, sedangkan clustering adalah teknik unsupervised learning, bukan risiko.","distractors":{"B":"Underfitting terkait model yang terlalu sederhana atau fitur yang kurang, bukan secara khusus kurangnya representasi kelompok.","C":"Overfitting dapat terjadi pada data terbatas, tetapi isu representasi lebih langsung mengarah ke imbalance dan bias.","D":"Clustering adalah teknik pengelompokan data (unsupervised), bukan risiko akibat representasi yang kurang."},"manualRef":{"chapter":2,"section":"2.5","title":"Data Balancing","bookPage":87,"pdfPage":93},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":60,"topic":3,"qn":62,"question":"Which of the following is the PRIMARY advantage of using K-fold cross validation when evaluating the performance of a machine learning (ML) model?","options":{"A":"It facilitates performing regressions on smaller data sets.","B":"It helps minimize computational costs when evaluating complex models.","C":"It enables the reduction of model bias by setting the K variable to higher values.","D":"It uses multiple training and testing cycles to minimize overfitting."},"url":"https://www.examtopics.com/discussions/isaca/view/383582-exam-aaia-topic-3-question-62-discussion/","community":{"D":2},"answer":"D","confidence":"high","explanation":"K-fold cross validation membagi data menjadi K bagian dan melatih serta menguji model sebanyak K kali dengan fold berbeda sebagai data uji, sehingga setiap data pernah menjadi data training maupun testing. Hasilnya adalah estimasi performa yang lebih stabil dan andal tentang kemampuan generalization, sekaligus membantu mendeteksi dan mengurangi overfitting. Manual menjelaskan bahwa cross-validation membantu organisasi mengurangi bias dan memastikan model generalize dengan baik pada data baru.","distractors":{"A":"Cross-validation tidak terbatas pada regresi atau dataset kecil; berlaku juga untuk klasifikasi.","B":"K-fold justru menambah biaya komputasi karena model dilatih K kali.","C":"Menaikkan K tidak secara langsung mengurangi bias model; nilai K memengaruhi trade-off bias-variance dari estimasi evaluasi, bukan bias model itu sendiri."},"manualRef":{"chapter":2,"section":"2.8.3","title":"Development","bookPage":94,"pdfPage":100},"links":[{"label":"scikit-learn: Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html"},{"label":"Wikipedia: Overfitting","url":"https://en.wikipedia.org/wiki/Overfitting"}]},{"id":61,"topic":3,"qn":37,"question":"A deepfake video is presented as evidence in a court case, falsely implicating an individual in criminal activities. Which of the following is an IS auditor’s BEST recommendation to help ensure the authenticity of digital evidence?","options":{"A":"Employing specialized tools designed to detect deepfake artifacts and inconsistencies","B":"Storing all digital evidence on secure remote cloud servers and on local servers","C":"Requiring digital watermarks for any evidence presented in legal proceedings","D":"Training legal and forensic professionals to recognize deepfake characteristics in evidence"},"url":"https://www.examtopics.com/discussions/isaca/view/315996-exam-aaia-topic-3-question-37-discussion/","community":{"A":3},"answer":"A","confidence":"medium","explanation":"Untuk memastikan keaslian bukti digital yang sudah diajukan, perlu analisis forensik dengan tool khusus pendeteksi deepfake yang memeriksa artefak dan inkonsistensi (misalnya anomali piksel, kedipan mata, lip-sync, metadata). Langkah ini langsung menilai apakah video tersebut asli atau hasil manipulasi generative AI. Digital watermark hanya efektif bila diterapkan di sumber sejak awal dan tidak dapat diwajibkan secara retroaktif pada semua bukti, sedangkan pelatihan manusia saja tidak cukup andal karena deepfake modern sulit dikenali secara kasat mata. Manual mencatat bahwa GAN memungkinkan pembuatan gambar dan video yang sangat realistis seperti deepfake, sehingga verifikasi teknis diperlukan.","distractors":{"B":"Penyimpanan aman menjaga chain of custody setelah bukti diterima, tetapi tidak membuktikan keaslian kontennya.","C":"Watermark membantu provenance konten baru, tetapi tidak dapat diterapkan pada semua bukti yang sudah ada dan dapat dihapus atau dipalsukan.","D":"Pelatihan bermanfaat, tetapi deteksi manual tidak andal untuk deepfake berkualitas tinggi."},"manualRef":{"chapter":1,"section":"1.1.3","title":"Generative Models","bookPage":23,"pdfPage":29},"links":[{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"},{"label":"Wikipedia: Deepfake","url":"https://en.wikipedia.org/wiki/Deepfake"}]},{"id":62,"topic":2,"qn":26,"question":"A model developer is looking to mitigate the risk of information loss within an imbalanced data set that contains majority and minority classes. Which of the following strategies would an IS auditor consider to be MOST appropriate?","options":{"A":"Undersampling to remove excess data points","B":"Splitting data into к-folds with cross-validation","C":"Tuning the model’s hyperparameters","D":"Oversampling to create new data points"},"url":"https://www.examtopics.com/discussions/isaca/view/315961-exam-aaia-topic-2-question-26-discussion/","community":{"D":1},"answer":"D","confidence":"high","explanation":"Kata kunci soal adalah mitigasi information loss. Undersampling membuang data majority class sehingga informasi hilang, sedangkan oversampling (duplikasi terkontrol atau pembuatan sampel sintetis seperti SMOTE) menambah data minority class tanpa membuang data yang ada. Manual menyebut oversampling, undersampling, dan cost-sensitive algorithms sebagai teknik penanganan data imbalance; dari keduanya, hanya oversampling yang mempertahankan seluruh informasi. Auditor tetap perlu memastikan oversampling hanya diterapkan pada training set agar tidak terjadi leakage atau overfitting.","distractors":{"A":"Undersampling menyeimbangkan kelas dengan membuang data, sehingga justru menyebabkan information loss.","B":"K-fold cross-validation adalah teknik evaluasi, tidak menyeimbangkan kelas.","C":"Tuning hyperparameter tidak mengatasi kekurangan sampel pada minority class."},"manualRef":{"chapter":2,"section":"2.5","title":"Data Balancing","bookPage":87,"pdfPage":93},"links":[{"label":"Wikipedia: Oversampling and undersampling in data analysis","url":"https://en.wikipedia.org/wiki/Oversampling_and_undersampling_in_data_analysis"},{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":63,"topic":1,"qn":83,"question":"Which of the following should be an IS auditor’s GREATEST concern if class imbalance is identified in training data for an AI model?","options":{"A":"Data drift","B":"Data quality","C":"Model bias","D":"Model overfitting"},"url":"https://www.examtopics.com/discussions/isaca/view/383577-exam-aaia-topic-1-question-83-discussion/","community":{"C":1},"answer":"C","confidence":"high","explanation":"Class imbalance membuat model cenderung mengoptimalkan prediksi untuk majority class dan berkinerja buruk pada minority class, sehingga hasilnya bias, misalnya secara sistematis merugikan kelompok tertentu. Manual menyatakan bahwa data imbalance dapat menghasilkan output AI yang bias atau tidak akurat, dan bias berdampak langsung pada fairness, etika, serta kepatuhan. Karena itu model bias adalah concern terbesar bagi auditor.","distractors":{"A":"Data drift adalah perubahan data setelah deployment dari waktu ke waktu, bukan akibat langsung imbalance pada training data.","B":"Imbalance bisa dianggap aspek data quality, tetapi dampak yang paling dikhawatirkan adalah bias pada keputusan model.","D":"Overfitting dapat terjadi pada minority class, tetapi bukan konsekuensi utama class imbalance."},"manualRef":{"chapter":2,"section":"2.5","title":"Data Balancing","bookPage":87,"pdfPage":93},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":64,"topic":1,"qn":75,"question":"An AI tool is being implemented for a regional healthcare organization. Which of the following training methods BEST ensures the AI output does not reveal whether someone's personal data was used?","options":{"A":"Supervised learning with labeled patient records","B":"Data augmentation during training to improve privacy","C":"Differential privacy applied during model training","D":"Transfer learning using public health data sets"},"url":"https://www.examtopics.com/discussions/isaca/view/383576-exam-aaia-topic-1-question-75-discussion/","community":{"C":1},"answer":"C","confidence":"high","explanation":"Differential privacy menambahkan noise terkalibrasi selama training (misalnya DP-SGD) sehingga kontribusi satu individu tidak dapat dibedakan dari output model. Secara matematis, teknik ini membatasi kemampuan penyerang melakukan membership inference, yaitu menebak apakah data seseorang termasuk dalam training dataset. Manual menjelaskan bahwa model ML dapat 'mengingat' data dan rentan terhadap membership inference maupun attribute inference, sehingga teknik privacy-preserving saat training adalah jawaban yang tepat.","distractors":{"A":"Supervised learning dengan rekam medis berlabel justru memakai data pribadi tanpa perlindungan privasi tambahan.","B":"Data augmentation memperluas variasi data untuk akurasi, bukan memberikan jaminan privasi formal.","D":"Transfer learning dari data publik tetap memerlukan fine-tuning dengan data pasien, yang tetap rentan membership inference."},"manualRef":{"chapter":1,"section":"1.15.1","title":"Data Privacy","bookPage":66,"pdfPage":72},"links":[{"label":"Wikipedia: Differential privacy","url":"https://en.wikipedia.org/wiki/Differential_privacy"},{"label":"NIST Privacy Framework","url":"https://www.nist.gov/privacy-framework"}]},{"id":65,"topic":1,"qn":62,"question":"A large organization is implementing a new AI system that uses customer data. Which of the following is the BEST approach for risk mitigation to protect customer privacy?","options":{"A":"Implement a mechanism for customers to opt out of the use of their data.","B":"Assign sole responsibility for risk mitigation to the development team.","C":"Implement data anonymization and impact assessments.","D":"Conduct periodic risk and vulnerability assessments."},"url":"https://www.examtopics.com/discussions/isaca/view/367217-exam-aaia-topic-1-question-62-discussion/","community":{"C":2},"answer":"C","confidence":"high","explanation":"Pendekatan terbaik menggabungkan kontrol preventif dan proses berbasis risiko: anonymization mengurangi eksposur data pribadi dalam sistem AI, sedangkan impact assessment (misalnya DPIA) mengidentifikasi dan menilai risiko privasi sebelum dan selama pemrosesan, terutama untuk teknologi baru. Manual merekomendasikan DPIA melalui proses data governance untuk sistem AI yang memproses data pribadi, dan mencantumkan anonymization serta privacy impact assessment berkala sebagai kontrol privasi. Opsi lain bersifat parsial atau keliru dalam pembagian tanggung jawab.","distractors":{"A":"Opt-out penting sebagai hak subjek data, tetapi bergantung pada tindakan pelanggan dan tidak melindungi data yang tetap diproses.","B":"Mitigasi risiko tidak boleh hanya menjadi tanggung jawab tim pengembang; perlu keterlibatan fungsi privacy, legal, dan pemilik risiko.","D":"Risk dan vulnerability assessment berkala berguna, tetapi lebih fokus pada keamanan teknis dan tidak secara langsung melindungi privasi data pelanggan."},"manualRef":{"chapter":1,"section":"1.15.3","title":"Privacy Regulation Considerations","bookPage":67,"pdfPage":73},"links":[{"label":"GDPR text","url":"https://gdpr-info.eu/"},{"label":"NIST Privacy Framework","url":"https://www.nist.gov/privacy-framework"}]},{"id":66,"topic":1,"qn":50,"question":"A car insurance company uses an AI model to determine customer premiums. To ensure the ethical use of this model, which of the following testing practices should the company consider to be MOST important?","options":{"A":"Running model performance tests on randomized data to improve the model's accuracy","B":"Ensuring demographic data is not used to train models outside of the defined use case","C":"Testing to ensure the model’s predictions do not discriminate based on age or gender","D":"Deploying the model only for a small randomly selected group of existing customers"},"url":"https://www.examtopics.com/discussions/isaca/view/316032-exam-aaia-topic-1-question-50-discussion/","community":{"C":2},"answer":"C","confidence":"high","explanation":"Penetapan premi asuransi berdampak langsung pada individu, sehingga isu etis utamanya adalah diskriminasi terhadap karakteristik yang dilindungi seperti usia atau gender. Bias testing secara eksplisit memverifikasi bahwa prediksi model tidak memperlakukan kelompok tersebut secara tidak adil. Manual menekankan pentingnya bias testing di berbagai tahap siklus hidup AI (dengan usia dan gender sebagai contoh bentuk bias) serta pengulangan pengujian setelah model dilatih untuk memastikan bias sudah dimitigasi.","distractors":{"A":"Uji performa pada data acak berfokus pada akurasi, bukan etika atau fairness.","B":"Membatasi penggunaan data demografis di luar use case adalah kontrol tata kelola data (purpose limitation), bukan praktik pengujian fairness model.","D":"Rollout terbatas mengurangi dampak, tetapi tidak menguji apakah model bersifat diskriminatif."},"manualRef":{"chapter":2,"section":"2.13.2","title":"Bias Testing","bookPage":108,"pdfPage":114},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"OECD AI Principles","url":"https://oecd.ai/en/ai-principles"}]},{"id":67,"topic":2,"qn":6,"question":"An IS auditor notes that an AI model achieved significantly better results on training data than on test data. Which of the following problems with the model has the IS auditor identified?","options":{"A":"Underfitting","B":"Bias","C":"Overfitting","D":"Generalization"},"url":"https://www.examtopics.com/discussions/isaca/view/318195-exam-aaia-topic-2-question-6-discussion/","community":{"C":2},"answer":"C","confidence":"high","explanation":"Performa yang jauh lebih baik pada training data dibanding test data adalah gejala klasik overfitting: model 'menghafal' data training termasuk noise dan outlier sehingga gagal generalize ke data baru. Manual menjelaskan bahwa model yang overfit berkinerja sangat baik pada training data tetapi buruk pada data baru, dan auditor perlu memvalidasi proses training serta analisis hasil training versus test untuk mendeteksinya.","distractors":{"A":"Underfitting ditandai performa buruk pada training maupun test data.","B":"Bias dapat menjadi akibat model yang overfit, tetapi pola gap training-test secara spesifik mengindikasikan overfitting.","D":"Generalization adalah kemampuan yang diharapkan; gap performa justru menunjukkan generalization yang buruk."},"manualRef":{"chapter":3,"section":"3.8.1","title":"Reduce False Positives","bookPage":148,"pdfPage":154},"links":[{"label":"Wikipedia: Overfitting","url":"https://en.wikipedia.org/wiki/Overfitting"},{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":68,"topic":1,"qn":46,"question":"In order to ensure effective alignment with organizational priorities, which of the following is MOST important for an IS auditor to address when developing an audit plan for an AI-based tool?","options":{"A":"Cost-benefit strategy for AI adoption","B":"AI users’ understanding of ethical standards","C":"The AI tool’s security alignment with governance policies","D":"Management practices for AI oversight"},"url":"https://www.examtopics.com/discussions/isaca/view/315949-exam-aaia-topic-1-question-46-discussion/","community":{"D":4,"C":3},"answer":"D","confidence":"medium","explanation":"Agar audit plan selaras dengan prioritas organisasi, auditor perlu memakai pendekatan top-down yang berfokus pada governance, akuntabilitas, dan cara manajemen mengawasi AI, misalnya peran komite AI serta pelaporan kinerja dan risiko kepada accountable owner. Manual menyatakan bahwa tujuan audit AI mencakup keselarasan dengan tujuan dan strategi enterprise serta pelaporan operasional ke AI governance committee, dan auditor sebaiknya tidak terlalu sempit pada implementasi teknis. Praktik oversight manajemen adalah mekanisme yang menghubungkan tool AI dengan prioritas organisasi, sedangkan aspek keamanan (C) hanya satu dimensi. Suara komunitas juga condong ke D, meski cukup banyak yang memilih C.","distractors":{"A":"Strategi cost-benefit adalah keputusan manajemen sebelum adopsi, bukan fokus utama perencanaan audit.","B":"Pemahaman etika oleh pengguna adalah aspek awareness yang lebih sempit.","C":"Keselarasan keamanan dengan kebijakan governance penting, tetapi hanya satu area kontrol dan tidak mencakup keselarasan menyeluruh dengan prioritas organisasi."},"manualRef":{"chapter":3,"section":"3.5","title":"Designing an AI Audit","bookPage":143,"pdfPage":149},"links":[{"label":"ISACA ITAF","url":"https://www.isaca.org/resources/frameworks-standards-and-models"},{"label":"COBIT","url":"https://www.isaca.org/resources/cobit"}]},{"id":69,"topic":2,"qn":56,"question":"Which of the following should be applied to an AI system but are not typically used in traditional systems?","options":{"A":"Controls to protect data privacy","B":"Controls to monitor data poisoning","C":"Controls to prevent data exfiltration","D":"Controls to manage data governance"},"url":"https://www.examtopics.com/discussions/isaca/view/382864-exam-aaia-topic-2-question-56-discussion/","community":{"B":2},"answer":"B","confidence":"high","explanation":"Data poisoning adalah ancaman khas AI: penyerang menyisipkan data berbahaya atau salah ke dataset training (di sumber, supplier, transit, preprocessing, atau knowledge base RAG) untuk mengubah perilaku model. Sistem tradisional tidak 'belajar' dari data, sehingga kontrol untuk memantau poisoning tidak lazim diterapkan di sana. Manual menjelaskan bahwa scanner kerentanan konvensional tidak mampu mendeteksi ancaman spesifik AI, sehingga diperlukan kontrol tambahan seperti monitoring access dan change log pipeline data, review skrip preprocessing, serta versioning dan hash dataset. Privasi, pencegahan exfiltration, dan data governance sudah umum pada sistem tradisional.","distractors":{"A":"Kontrol privasi data sudah lazim pada sistem tradisional, misalnya untuk kepatuhan GDPR.","C":"Pencegahan data exfiltration (misalnya DLP) adalah kontrol keamanan konvensional.","D":"Data governance adalah praktik umum untuk semua sistem informasi, bukan khas AI."},"manualRef":{"chapter":2,"section":"2.14.2","title":"Data Poisoning","bookPage":112,"pdfPage":118},"links":[{"label":"MITRE ATLAS","url":"https://atlas.mitre.org/"},{"label":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/"}]},{"id":70,"topic":2,"qn":52,"question":"Which of the following techniques would be MOST effective as part of incident management procedures for a prompt injection attack?","options":{"A":"Fine-tune the AI model.","B":"Scan inputs for code-like structure of text.","C":"Deploy input validation to sanitize abuse prompts.","D":"Monitor the prompts for excessive special characters."},"url":"https://www.examtopics.com/discussions/isaca/view/382863-exam-aaia-topic-2-question-52-discussion/","community":{"C":2},"answer":"C","confidence":"high","explanation":"Dalam incident management, setelah prompt injection terkonfirmasi, langkah paling efektif adalah containment: menerapkan input (dan output) validation serta prompt templates untuk menyaring dan mensanitasi prompt berbahaya sehingga model terlindung dari serangan langsung. Manual mencantumkan teknik ini sebagai containment untuk prompt injection, dan juga sebagai kontrol jangka panjang yang tetap efektif karena retraining LLM sering tidak praktis dan mahal. Pemindaian struktur mirip kode (B) dan monitoring karakter khusus (D) adalah teknik deteksi, bukan respons yang menghentikan serangan.","distractors":{"A":"Fine-tuning/retraining adalah opsi eradikasi yang mahal dan lambat, bukan langkah paling efektif dalam penanganan insiden.","B":"Memindai struktur teks mirip kode adalah teknik deteksi; membantu identifikasi, tetapi tidak menghentikan serangan.","D":"Monitoring karakter khusus juga hanya indikator deteksi dan mudah dihindari penyerang."},"manualRef":{"chapter":2,"section":"2.19.1","title":"Containment","bookPage":120,"pdfPage":126},"links":[{"label":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/"},{"label":"Wikipedia: Prompt injection","url":"https://en.wikipedia.org/wiki/Prompt_injection"}]},{"id":71,"topic":2,"qn":44,"question":"A logistics company uses an AI model to optimize delivery routes. Which of the following methods would BEST verify the model’s accuracy?","options":{"A":"Using advanced outlier detection techniques to identify anomalies in route length","B":"Running bias tests to confirm that the model does not favor certain delivery areas","C":"Comparing the AI-generated routes with routes generated using traditional methods","D":"Testing the model on the most recent data for the latest conditions"},"url":"https://www.examtopics.com/discussions/isaca/view/315969-exam-aaia-topic-2-question-44-discussion/","community":{"C":6,"D":2},"answer":"C","confidence":"medium","explanation":"Cara paling langsung untuk memverifikasi akurasi model optimasi rute adalah membandingkan output AI dengan baseline, yaitu rute dari metode tradisional (algoritma klasik atau perencanaan manual), dari sisi jarak, waktu, dan biaya. Manual memberi contoh serupa dalam sampel proses audit AI: membandingkan hasil sistem AI dengan metode tradisional untuk mendukung penilaian efektivitas model, dan juga menyebut perlunya baseline pembanding untuk solusi yang menggantikan aktivitas manusia. Pengujian dengan data terbaru (D) menilai relevansi terhadap kondisi saat ini, tetapi tanpa pembanding tidak menunjukkan apakah rute tersebut akurat atau optimal.","distractors":{"A":"Outlier detection menemukan anomali panjang rute, bukan mengukur akurasi secara keseluruhan.","B":"Bias testing menilai fairness antarwilayah, bukan akurasi optimasi rute.","D":"Data terbaru berguna untuk menguji robustness dan drift, tetapi tanpa baseline pembanding sulit menyimpulkan akurasi."},"manualRef":{"chapter":3,"section":"3.9","title":"Sample AI Audit Process","bookPage":151,"pdfPage":157},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":72,"topic":2,"qn":41,"question":"Which data preparation method simplifies data correlations but presents the GREATEST risk for introducing bias?","options":{"A":"Using the mode of a column to fill individual records where that field is blank","B":"Deleting duplicate or copied entries","C":"Separating multiple data attributes within one field into individual attribute columns","D":"Placing numerical data in bins or buckets"},"url":"https://www.examtopics.com/discussions/isaca/view/316532-exam-aaia-topic-2-question-41-discussion/","community":{"D":4,"A":1},"answer":"D","confidence":"medium","explanation":"Binning/bucketing mengelompokkan nilai numerik kontinu ke dalam rentang (bin), sehingga hubungan antarvariabel menjadi lebih sederhana untuk dianalisis. Namun batas bin yang dipilih secara arbitrer dapat menghilangkan detail, menyamarkan variasi di dalam kelompok, dan membentuk kategori yang merugikan kelompok tertentu, sehingga risiko bias tinggi. Manual menekankan bahwa langkah preprocessing dan transformasi data harus dirancang dan diuji dengan cermat karena memengaruhi hasil dan bias model. Imputasi modus (A) juga dapat menimbulkan bias, tetapi tidak 'menyederhanakan korelasi' sebagaimana binning.","distractors":{"A":"Imputasi modus dapat menggeser distribusi ke nilai mayoritas, tetapi tujuannya mengisi nilai kosong, bukan menyederhanakan korelasi.","B":"Menghapus duplikat meningkatkan kualitas data dan mengurangi bias akibat data berulang.","C":"Memecah beberapa atribut dalam satu field menjadi kolom terpisah meningkatkan struktur dan kualitas data, jarang menimbulkan bias."},"manualRef":{"chapter":2,"section":"2.8.3","title":"Development","bookPage":94,"pdfPage":100},"links":[{"label":"Wikipedia: Data binning","url":"https://en.wikipedia.org/wiki/Data_binning"},{"label":"scikit-learn: Preprocessing data (discretization)","url":"https://scikit-learn.org/stable/modules/preprocessing.html"}]},{"id":73,"topic":3,"qn":32,"question":"From a data appropriateness and bias perspective, which of the following should be of GREATEST concern when reviewing an AI model used in a credit scoring system?","options":{"A":"The model incorporates the applicant’s loan history to assess spending habits.","B":"The model considers the applicant’s income level as a key factor in the credit decision.","C":"The model uses postal codes as a primary factor in determining creditworthiness.","D":"The model utilizes historical credit data to predict future credit behavior."},"url":"https://www.examtopics.com/discussions/isaca/view/313897-exam-aaia-topic-3-question-32-discussion/","community":{"C":3},"answer":"C","confidence":"high","explanation":"Kode pos sering berkorelasi kuat dengan ras, etnis, atau status sosial-ekonomi, sehingga dapat berfungsi sebagai proxy variable atas karakteristik yang dilindungi. Menjadikannya faktor utama kelayakan kredit berisiko menimbulkan diskriminasi tidak langsung (redlining) dan systemic bias, meskipun atribut sensitif tidak digunakan secara eksplisit. Manual menjelaskan bahwa AI dapat melanggengkan atau memperkuat bias dalam data, dan bahwa bias testing harus memeriksa penggunaan karakteristik terlindung seperti kerugian sosial-ekonomi. Riwayat pinjaman, pendapatan, dan data kredit historis adalah faktor yang relevan dan lazim dalam credit scoring.","distractors":{"A":"Riwayat pinjaman relevan secara langsung dengan perilaku kredit.","B":"Tingkat pendapatan adalah faktor kemampuan bayar yang sah dalam penilaian kredit.","D":"Data kredit historis adalah dasar yang wajar untuk memprediksi perilaku kredit, asalkan kualitasnya dikelola."},"manualRef":{"chapter":1,"section":"1.17.2","title":"Bias and Fairness","bookPage":72,"pdfPage":78},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"OECD AI Principles","url":"https://oecd.ai/en/ai-principles"}]},{"id":74,"topic":1,"qn":9,"question":"A healthcare organization uses patient data to train an AI model for early disease detection. Which of the following practices provides the BEST assurance that personal data is secure and its integrity is maintained?","options":{"A":"Implementing strict data access controls and conducting security tests","B":"Encrypting stored data to reduce exposure and log access","C":"Updating the AI model with new data and tracking changes","D":"Anonymizing patient data and performing regular quality checks"},"url":"https://www.examtopics.com/discussions/isaca/view/311785-exam-aaia-topic-1-question-9-discussion/","community":{"D":6,"B":3},"answer":"D","confidence":"low","explanation":"Soal meminta dua hal sekaligus: data pribadi aman dan integritasnya terjaga. Anonymization mengurangi risiko eksposur karena data tidak lagi dapat dikaitkan dengan pasien tertentu (sejalan dengan prinsip data minimization dan masking), sedangkan quality check berkala memastikan data tetap akurat, lengkap, dan konsisten, yang merupakan inti integritas data. Manual menyatakan bahwa mengelola dan meningkatkan kualitas data merupakan bagian dari menjamin integritasnya, serta mendorong teknik masking/tokenization untuk meminimalkan data sensitif yang masuk ke AI. Opsi A (access control dan security testing) juga kuat sehingga soal ini diperdebatkan; D dipilih karena menjawab kedua aspek secara langsung, sejalan dengan mayoritas komunitas.","distractors":{"A":"Access control dan security testing kuat untuk keamanan, tetapi tidak secara langsung memverifikasi akurasi/kelengkapan data, dan data tetap teridentifikasi.","B":"Enkripsi dan logging melindungi kerahasiaan, tetapi data harus didekripsi untuk training dan tidak memastikan kualitas atau integritas isi data.","C":"Memperbarui model dan mencatat perubahannya adalah change management model, bukan perlindungan data pribadi."},"manualRef":{"chapter":1,"section":"1.15.2","title":"Data Ownership With Regard to Governance and Privacy","bookPage":66,"pdfPage":72},"links":[{"label":"NIST Privacy Framework","url":"https://www.nist.gov/privacy-framework"},{"label":"GDPR text","url":"https://gdpr-info.eu/"}]},{"id":75,"topic":3,"qn":6,"question":"An IS auditor is auditing an AI system that predicts inventory needs. The system recently failed to predict a stock outage for a key product. Which of the following audit tests would BEST validate the system’s accuracy?","options":{"A":"Sensitivity analysis on input variables","B":"Historical testing with past sales data","C":"Unit testing of the forecasting algorithm","D":"Load testing during peak sales periods"},"url":"https://www.examtopics.com/discussions/isaca/view/316033-exam-aaia-topic-3-question-6-discussion/","community":{"B":1},"answer":"B","confidence":"medium","explanation":"Untuk memvalidasi akurasi sistem prediksi kebutuhan persediaan, auditor sebaiknya melakukan historical testing (backtesting): menjalankan model pada data penjualan masa lalu dan membandingkan prediksinya dengan permintaan aktual, termasuk periode terjadinya stock-out. Cara ini secara langsung mengukur seberapa tepat model memprediksi kondisi nyata. Manual menjelaskan bahwa model prediktif menggunakan data historis untuk memperkirakan kejadian, dan pengujian area operasi mencakup validasi akurasi model dari waktu ke waktu. Sensitivity analysis berguna untuk memahami pengaruh variabel input, tetapi tidak mengukur akurasi secara langsung.","distractors":{"A":"Sensitivity analysis menunjukkan variabel mana yang paling memengaruhi output (robustness), bukan mengukur akurasi terhadap hasil aktual.","C":"Unit testing memverifikasi fungsi kode algoritma, bukan akurasi prediksi bisnis.","D":"Load testing menguji kinerja dan kapasitas sistem, bukan ketepatan prediksi."},"manualRef":{"chapter":3,"section":"3.6.1","title":"AI Systems Overall Testing","bookPage":146,"pdfPage":152},"links":[{"label":"Wikipedia: Backtesting","url":"https://en.wikipedia.org/wiki/Backtesting"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":76,"topic":1,"qn":25,"question":"In the context of an AI implementation, which of the following actions is MOST critical for an organization's change management program?","options":{"A":"Conducting a comprehensive risk assessment specific to AI-related changes","B":"Reviewing documentation for AI system changes, updates, and patches","C":"Verifying that all employees have completed mandatory AI ethics training","D":"Ensuring the organization has a dedicated AI governance committee"},"url":"https://www.examtopics.com/discussions/isaca/view/316030-exam-aaia-topic-1-question-25-discussion/","community":{"A":1},"answer":"A","confidence":"medium","explanation":"Perubahan pada sistem AI (data, model, parameter, preprocessing) membawa risiko unik yang tidak ada pada software konvensional, misalnya perubahan perilaku model, drift, atau dampak etis. Karena itu inti program change management AI adalah risk assessment yang spesifik untuk perubahan terkait AI sebelum perubahan disetujui. Manual menyatakan bahwa AI membawa perbedaan yang memerlukan kontrol tambahan khusus untuk risiko change management AI, dan kontrol change management mencakup identifikasi risiko serta dampak potensial. Review dokumentasi, pelatihan etika, dan komite governance bersifat pendukung, bukan inti pengendalian perubahan.","distractors":{"B":"Review dokumentasi perubahan bersifat detektif/administratif dan umumnya dilakukan setelah perubahan terjadi.","C":"Pelatihan etika AI adalah program awareness, bukan elemen kunci change management.","D":"Komite governance AI penting secara umum, tetapi keberadaannya tidak menjamin risiko setiap perubahan dinilai."},"manualRef":{"chapter":2,"section":"2.10","title":"Change Management Considerations","bookPage":101,"pdfPage":107},"links":[{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"},{"label":"COBIT","url":"https://www.isaca.org/resources/cobit"}]},{"id":77,"topic":3,"qn":30,"question":"A healthcare organization uses an AI model to analyze patient data and provide diagnostic recommendations. Which of the following MOST effectively detects data drift related to the model’s predictions?","options":{"A":"Using adversarial testing to simulate scenarios that stress test the model’s predictions","B":"Conducting periodic model retraining to ensure alignment with updated patient data","C":"Comparing incoming patient data distributions with the training data set","D":"Applying overrides to allow healthcare professionals to correct the AI model's recommendations"},"url":"https://www.examtopics.com/discussions/isaca/view/316024-exam-aaia-topic-3-question-30-discussion/","community":{"C":1},"answer":"C","confidence":"high","explanation":"Data drift adalah perubahan karakteristik atau distribusi data input dibanding data yang digunakan saat training. Cara paling efektif mendeteksinya adalah membandingkan distribusi data pasien yang masuk dengan distribusi training dataset secara berkala, misalnya dengan uji statistik atau metrik seperti population stability index. Manual menekankan monitoring performa dan diagnosis penyebab variasi metrik, serta memasukkan data drift monitoring ke program change management; retraining dilakukan setelah drift terdeteksi.","distractors":{"A":"Adversarial testing menguji ketahanan terhadap input berbahaya, bukan perubahan distribusi data yang alami.","B":"Retraining periodik adalah tindakan korektif, bukan mekanisme pendeteksi drift.","D":"Override oleh tenaga medis adalah kontrol human-in-the-loop untuk mengoreksi keputusan, bukan pendeteksi drift."},"manualRef":{"chapter":2,"section":"2.8.6","title":"Monitoring and Maintenance","bookPage":96,"pdfPage":102},"links":[{"label":"Wikipedia: Concept drift","url":"https://en.wikipedia.org/wiki/Concept_drift"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":78,"topic":2,"qn":46,"question":"Which of the following is the MOST important key indicator to assess when auditing the deployment of AI in predictive maintenance system in manufacturing operations?","options":{"A":"Percentage of AI’s predictive algorithms that are compliant with industry standards","B":"Frequency of updates to AI predictive models based on equipment usage","C":"Reduction in downtime and maintenance costs due to AI use","D":"Total number of predictive maintenance scenarios implemented using AI"},"url":"https://www.examtopics.com/discussions/isaca/view/315971-exam-aaia-topic-2-question-46-discussion/","community":{"C":1},"answer":"C","confidence":"medium","explanation":"Indikator terpenting saat mengaudit deployment AI untuk predictive maintenance adalah apakah AI mencapai tujuan bisnisnya, yaitu menurunkan downtime dan biaya pemeliharaan. Manual menekankan bahwa solusi AI harus diverifikasi terhadap tujuan bisnis dan KPI yang ditetapkan sejak use case, karena sistem bisa berfungsi tetapi tidak mencapai sasaran bisnis atau finansial. Opsi lain adalah metrik aktivitas atau kepatuhan yang tidak menunjukkan nilai yang dihasilkan.","distractors":{"A":"Kepatuhan terhadap standar industri penting, tetapi tidak mengukur apakah AI memberikan manfaat yang diharapkan.","B":"Frekuensi pembaruan model adalah metrik proses operasional, bukan outcome.","D":"Jumlah skenario yang diimplementasikan adalah metrik kuantitas output, bukan dampak bisnis."},"manualRef":{"chapter":2,"section":"2.12.3","title":"Objective Verification","bookPage":107,"pdfPage":113},"links":[{"label":"COBIT","url":"https://www.isaca.org/resources/cobit"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":79,"topic":2,"qn":42,"question":"Which of the following controls would BEST minimize the risk of bias introduced into AI models from flawed training data?","options":{"A":"Implementing enhanced access controls over AI model training data","B":"Testing AI models using adversarial methods","C":"Separating AI training and production data","D":"Performing cross-validation of AI models"},"url":"https://www.examtopics.com/discussions/isaca/view/315968-exam-aaia-topic-2-question-42-discussion/","community":{"D":1},"answer":"D","confidence":"medium","explanation":"Di antara opsi yang ada, cross-validation adalah satu-satunya teknik yang langsung menguji perilaku model pada subset data yang berbeda, sehingga membantu mengungkap ketergantungan pada pola menyimpang dalam data training dan memastikan model generalize dengan baik. Manual secara eksplisit menyebut bahwa pembagian dataset dengan cross-validation membantu organisasi mengurangi bias dan generalize pada data baru, asalkan pembagian menjaga distribusi data dan tidak menimbulkan selection bias. Kontrol lain berfokus pada keamanan atau pemisahan lingkungan, bukan pada bias dari data training yang cacat.","distractors":{"A":"Access control melindungi data training dari perubahan tidak sah, tetapi tidak memperbaiki data yang sejak awal cacat atau bias.","B":"Adversarial testing menguji ketahanan terhadap input berbahaya, bukan bias akibat kualitas data training.","C":"Pemisahan data training dan produksi adalah kontrol lingkungan/keamanan, tidak mengatasi bias dalam data training."},"manualRef":{"chapter":2,"section":"2.8.3","title":"Development","bookPage":94,"pdfPage":100},"links":[{"label":"scikit-learn: Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":80,"topic":2,"qn":33,"question":"Which of the following metrics should an IS auditor recommend as a key performance indicator (KPI) to assess the reliability of a natural language processing AI model?","options":{"A":"Landmark localization error","B":"Receiver operating characteristic curve","C":"Recall-oriented understudy for gisting evaluations","D":"Mean squared error"},"url":"https://www.examtopics.com/discussions/isaca/view/315966-exam-aaia-topic-2-question-33-discussion/","community":{"C":1},"answer":"C","confidence":"medium","explanation":"ROUGE (Recall-Oriented Understudy for Gisting Evaluation) adalah metrik standar untuk mengevaluasi output NLP seperti ringkasan dan teks yang dihasilkan, dengan mengukur tumpang tindih n-gram antara output model dan teks referensi. Karena itu ROUGE tepat sebagai KPI keandalan model NLP. Metrik lain berasal dari domain berbeda: landmark localization error untuk computer vision, ROC curve untuk klasifikasi umum, dan mean squared error untuk regresi. Manual tidak membahas ROUGE secara spesifik, tetapi menekankan evaluasi model dengan metrik yang sesuai dengan jenis model dan use case.","distractors":{"A":"Landmark localization error dipakai di computer vision (misalnya titik wajah), bukan NLP.","B":"ROC curve mengevaluasi classifier secara umum; bukan metrik khas untuk kualitas teks NLP.","D":"Mean squared error adalah metrik untuk model regresi dengan output numerik kontinu."},"manualRef":{"chapter":2,"section":"2.8.4","title":"Evaluation","bookPage":95,"pdfPage":101},"links":[{"label":"Wikipedia: ROUGE (metric)","url":"https://en.wikipedia.org/wiki/ROUGE_(metric)"},{"label":"Wikipedia: Precision and recall","url":"https://en.wikipedia.org/wiki/Precision_and_recall"}]},{"id":81,"topic":2,"qn":28,"question":"Post-deployment, anomalies in logs suggest a conflict between a critical security patch and an AI model's inference engine. Which of the following is the BEST course of action?","options":{"A":"Investigate the patch’s effect on the model.","B":"Contact the patch vendor for support.","C":"Reapply the patch and test the engine again.","D":"Restart the inference engine to clear conflicts."},"url":"https://www.examtopics.com/discussions/isaca/view/315963-exam-aaia-topic-2-question-28-discussion/","community":{"A":1},"answer":"A","confidence":"medium","explanation":"Ketika log menunjukkan konflik antara patch keamanan kritis dan inference engine, langkah terbaik adalah menyelidiki dampak patch terhadap model terlebih dahulu: mengumpulkan fakta, menentukan scope dan impact, serta akar masalah sebelum mengambil tindakan korektif. Manual menekankan bahwa fase assess dalam respons insiden AI adalah mengumpulkan fakta untuk menyusun timeline, scope, dan impact tanpa merusak integritas investigasi. Restart, menerapkan ulang patch, atau langsung menghubungi vendor tanpa analisis dapat memperburuk keadaan atau menghilangkan bukti.","distractors":{"B":"Menghubungi vendor mungkin diperlukan, tetapi sebaiknya setelah ada analisis awal tentang dampak dan gejalanya.","C":"Menerapkan ulang patch tanpa memahami konflik berisiko mengulang masalah yang sama.","D":"Restart hanya menghilangkan gejala sementara dan dapat menghapus bukti diagnostik."},"manualRef":{"chapter":2,"section":"2.18","title":"Assess","bookPage":119,"pdfPage":125},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"COBIT","url":"https://www.isaca.org/resources/cobit"}]},{"id":82,"topic":2,"qn":24,"question":"Which of the following BEST improves predictions and understanding to refine the accuracy of AI models?","options":{"A":"Data augmentation","B":"Mean clustering","C":"Prompt templates","D":"Data compression"},"url":"https://www.examtopics.com/discussions/isaca/view/315959-exam-aaia-topic-2-question-24-discussion/","community":{"A":1},"answer":"A","confidence":"medium","explanation":"Data augmentation menambah jumlah dan variasi contoh training dengan mentransformasi data yang ada atau menghasilkan data sintetis, sehingga model mempelajari pola yang lebih beragam, generalize lebih baik, dan akurasinya meningkat. Manual menyebut augmentation sebagai strategi mitigasi data scarcity, baik dengan mengumpulkan data yang hilang maupun membuat synthetic data yang meniru distribusi yang dibutuhkan. Opsi lain tidak secara langsung meningkatkan kualitas pembelajaran model.","distractors":{"B":"Mean clustering (k-means) adalah teknik unsupervised untuk mengelompokkan data, bukan cara menyempurnakan akurasi model secara umum.","C":"Prompt templates membantu konsistensi input/output GenAI dan mitigasi prompt injection, bukan peningkatan akurasi model secara mendasar.","D":"Kompresi data mengurangi ukuran penyimpanan dan dapat menghilangkan informasi."},"manualRef":{"chapter":2,"section":"2.6","title":"Data Scarcity","bookPage":87,"pdfPage":93},"links":[{"label":"Wikipedia: Data augmentation","url":"https://en.wikipedia.org/wiki/Data_augmentation"},{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":83,"topic":2,"qn":17,"question":"When auditing an AI model, an IS auditor notices that the controls over transactional processes are inadequate. Which of the following should the auditor recommend to BEST reduce these risks?","options":{"A":"Implement model scorecards.","B":"Clearly define responsibilities for AI risk.","C":"Have the chief risk officer (CRO) perform a risk analysis.","D":"Implement human-in-the-loop processes."},"url":"https://www.examtopics.com/discussions/isaca/view/316023-exam-aaia-topic-2-question-17-discussion/","community":{"D":1},"answer":"D","confidence":"medium","explanation":"Jika kontrol atas proses transaksional yang dijalankan atau didukung model AI tidak memadai, rekomendasi paling langsung untuk menurunkan risiko adalah menempatkan human-in-the-loop pada titik keputusan kritis, sehingga transaksi berisiko memerlukan review dan persetujuan eksplisit sebelum dilanjutkan. Manual menjelaskan HITL sebagai strategi supervisi AI untuk keputusan dan tindakan kritis, dengan workflow yang dirancang mewajibkan persetujuan manusia pada kondisi tertentu. Mendefinisikan tanggung jawab risiko (B) penting dari sisi governance, tetapi tidak langsung menutup kelemahan kontrol transaksi.","distractors":{"A":"Model scorecard mendokumentasikan dan memantau performa model, bukan mengendalikan transaksi individual.","B":"Definisi tanggung jawab risiko AI adalah fondasi governance, tetapi tidak segera mengendalikan risiko pada proses transaksi yang lemah.","C":"Analisis risiko oleh CRO mengidentifikasi risiko, tetapi tidak menguranginya secara langsung."},"manualRef":{"chapter":2,"section":"2.11.3","title":"Human in the Loop","bookPage":104,"pdfPage":110},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"EU AI Act (EUR-Lex)","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"id":84,"topic":3,"qn":56,"question":"Which of the following is the GREATEST benefit to an IS auditor using tree-based feature importance?","options":{"A":"It determines which specific AI model is the most reliable for migration into production.","B":"It identifies the parameters utilized by the AI model when drawing its conclusions.","C":"It determines which specific AI model contains the most complete source data.","D":"It identifies key data attributes influencing AI model conclusions."},"url":"https://www.examtopics.com/discussions/isaca/view/316022-exam-aaia-topic-3-question-56-discussion/","community":{"D":1},"answer":"D","confidence":"medium","explanation":"Tree-based feature importance (misalnya dari random forest atau gradient boosting) mengukur seberapa besar kontribusi setiap fitur atau atribut data terhadap prediksi model. Bagi auditor, ini memberi wawasan explainability tentang atribut mana yang paling memengaruhi kesimpulan model, sehingga dapat dinilai apakah logika model masuk akal, sesuai kebijakan, atau bergantung pada atribut sensitif/proxy yang berpotensi bias. Manual mencantumkan penggunaan tools explainability yang menyediakan feature importance (misalnya SHAP) sebagai kontrol transparansi yang perlu dikonfirmasi auditor.","distractors":{"A":"Feature importance tidak menentukan model mana yang paling andal untuk dipindahkan ke produksi.","B":"Parameter model (bobot, hyperparameter) berbeda dengan fitur input; feature importance menilai fitur, bukan parameter.","C":"Kelengkapan source data dinilai melalui pengujian data quality, bukan feature importance."},"manualRef":{"chapter":3,"section":"3.2","title":"Types of AI Controls","bookPage":137,"pdfPage":143},"links":[{"label":"Wikipedia: Explainable artificial intelligence","url":"https://en.wikipedia.org/wiki/Explainable_artificial_intelligence"},{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":85,"topic":3,"qn":53,"question":"Which of the following would BEST help an organization justify decisions made by an AI model?","options":{"A":"Conducting adversarial testing to evaluate the model's robustness","B":"Implementing a tool for model interpretability","C":"Analyzing key performance indicator (KPI) trends to identify inconsistencies in the model's predictions","D":"Auditing the AI model to assess its alignment with business objectives and policies"},"url":"https://www.examtopics.com/discussions/isaca/view/316021-exam-aaia-topic-3-question-53-discussion/","community":{"B":1},"answer":"B","confidence":"high","explanation":"Untuk menjustifikasi (menjelaskan alasan) keputusan model, organisasi membutuhkan kemampuan explainability/interpretability, yaitu memahami faktor apa yang mendorong suatu output. Manual menekankan bahwa model kompleks seperti DL sulit dijelaskan sehingga organisasi perlu teknik dan tool interpretasi (mis. LIME, SHAP, counterfactual explanation) agar keputusan dapat dipertanggungjawabkan, termasuk untuk memenuhi hak penjelasan menurut regulasi seperti GDPR dan EU AI Act. Tool interpretability langsung menjawab pertanyaan 'mengapa model memutuskan X', sedangkan opsi lain hanya menilai aspek kinerja atau keselarasan secara umum.","distractors":{"A":"Adversarial testing menguji ketahanan (robustness) terhadap input berbahaya, bukan menjelaskan dasar keputusan.","C":"Analisis tren KPI dapat mendeteksi inkonsistensi prediksi, tetapi tidak menjelaskan alasan di balik keputusan individual.","D":"Audit keselarasan dengan tujuan bisnis dan kebijakan memberi assurance tingkat tinggi, namun tidak menghasilkan penjelasan atas keputusan spesifik model."},"manualRef":{"chapter":2,"section":"2.9.3","title":"Explainability","bookPage":98,"pdfPage":104},"links":[{"label":"Wikipedia: Explainable artificial intelligence","url":"https://en.wikipedia.org/wiki/Explainable_artificial_intelligence"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":86,"topic":3,"qn":46,"question":"An IS auditor is planning to audit an AI model for algorithmic bias. Which of the following is the BEST way to test the model?","options":{"A":"Apply anecdotal evidence assessments.","B":"Develop Pareto front analysis.","C":"Use balanced model training.","D":"Assess the feature disparity index."},"url":"https://www.examtopics.com/discussions/isaca/view/315997-exam-aaia-topic-3-question-46-discussion/","community":{"D":1},"answer":"D","confidence":"medium","explanation":"Pengujian algorithmic bias yang baik harus objektif dan terukur, yaitu membandingkan perlakuan/hasil model antar kelompok (mis. disparity atau disparate impact ratio pada fitur sensitif). Menilai feature disparity index memberi bukti kuantitatif apakah model memperlakukan kelompok tertentu secara berbeda, sejalan dengan manual yang menekankan bias testing eksplisit di berbagai tahap life cycle dan pengulangan pengujian setelah model dilatih. Dari sudut pandang auditor, ini adalah prosedur pengujian (test), bukan tindakan perbaikan.","distractors":{"A":"Bukti anekdotal tidak sistematis dan tidak cukup andal sebagai audit evidence untuk menyimpulkan adanya bias.","B":"Pareto front analysis dipakai untuk menimbang trade-off (mis. akurasi vs fairness) saat optimasi model, bukan cara utama menguji keberadaan bias.","C":"Balanced model training adalah teknik mitigasi yang dilakukan pengembang, bukan metode pengujian oleh auditor."},"manualRef":{"chapter":2,"section":"2.13.2","title":"Bias Testing","bookPage":108,"pdfPage":114},"links":[{"label":"Wikipedia: Fairness (machine learning)","url":"https://en.wikipedia.org/wiki/Fairness_(machine_learning)"},{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}]},{"id":87,"topic":2,"qn":10,"question":"Which of the following strategies used by modelers to enhance data accuracy has the GREATEST risk of bias and information loss?","options":{"A":"Filling blank attributes in records with the mean, median, or mode within a grouping","B":"Placing numerical data into bins or buckets for a manageable quantity of correlations and result analyses","C":"Separating multiple data attributes within one field into individual attribute columns","D":"Identifying and deleting duplicate entries in the data set"},"url":"https://www.examtopics.com/discussions/isaca/view/316525-exam-aaia-topic-2-question-10-discussion/","community":{"B":6,"A":2},"answer":"B","confidence":"medium","explanation":"Binning/discretization mengubah nilai numerik kontinu menjadi kategori, sehingga detail (granularity) data hilang secara permanen dan hasil analisis sangat bergantung pada batas interval yang dipilih secara subjektif oleh modeler. Kombinasi kehilangan informasi dan bias dari pemilihan batas bin membuat teknik ini paling berisiko di antara opsi yang ada. Imputasi (opsi A) memang dapat mendistorsi distribusi, tetapi manual memperlakukannya sebagai strategi standar data cleansing untuk missing values, dan ia tidak menghapus informasi yang sudah ada.","distractors":{"A":"Imputasi mean/median/mode per grup dapat mengurangi variansi, namun merupakan praktik data cleansing yang diakui dan tidak menghilangkan informasi yang sudah ada.","C":"Memecah beberapa atribut dalam satu field menjadi kolom terpisah justru meningkatkan struktur dan kualitas data tanpa kehilangan informasi.","D":"Menghapus duplikat termasuk langkah data cleaning yang direkomendasikan manual karena duplikat dapat menimbulkan bias."},"manualRef":{"chapter":1,"section":"1.14.5","title":"Data Cleansing and Retention","bookPage":63,"pdfPage":69},"links":[{"label":"scikit-learn preprocessing guide (discretization)","url":"https://scikit-learn.org/stable/modules/preprocessing.html"},{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":88,"topic":2,"qn":9,"question":"Which of the following is the PRIMARY reason IS auditors must be aware that generative AI may return different investment recommendations from the same set of data?","options":{"A":"Neural node access varies each time the process is executed.","B":"Servers are reconfigured periodically.","C":"Limitations can arise in the quantification of risk profiles.","D":"Computational logic is based on probabilities."},"url":"https://www.examtopics.com/discussions/isaca/view/318083-exam-aaia-topic-2-question-9-discussion/","community":{"D":2},"answer":"D","confidence":"high","explanation":"Generative AI bekerja secara probabilistik: model memprediksi token berikutnya berdasarkan distribusi probabilitas (dipengaruhi parameter seperti temperature), sehingga input yang sama dapat menghasilkan output berbeda. Manual menegaskan bahwa AI berakar pada probabilitas matematis dan GenAI bersifat nondeterministic, sehingga auditor harus memahami bahwa variasi rekomendasi adalah sifat bawaan, bukan semata kesalahan sistem. Hal ini berdampak pada reliabilitas, reproducibility, dan kebutuhan kontrol (mis. human review) atas rekomendasi investasi.","distractors":{"A":"Istilah 'akses neural node yang bervariasi' bukan penjelasan teknis yang tepat; variasi berasal dari sampling probabilistik output.","B":"Rekonfigurasi server tidak menjadi penyebab utama perbedaan output model untuk data yang sama.","C":"Keterbatasan kuantifikasi profil risiko bisa terjadi, tetapi bukan alasan mendasar mengapa output berbeda untuk input identik."},"manualRef":{"chapter":2,"section":"2.17","title":"Identify and Report","bookPage":118,"pdfPage":124},"links":[{"label":"NIST Generative AI Profile (AI 600-1)","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"},{"label":"Wikipedia: Large language model","url":"https://en.wikipedia.org/wiki/Large_language_model"}]},{"id":89,"topic":2,"qn":8,"question":"In order to streamline operations, a bank has deployed an AI application to automatically detect and prevent further fraud on accounts. However, customers have voiced concerns that their usual transactions are being rejected. Which of the following is the MOST likely cause of the false positives?","options":{"A":"Consent is not properly managed.","B":"Compute scale training was not performed.","C":"The hyperparameters are not optimized.","D":"Data versioning controls were not developed."},"url":"https://www.examtopics.com/discussions/isaca/view/317685-exam-aaia-topic-2-question-8-discussion/","community":{"C":2},"answer":"C","confidence":"medium","explanation":"False positive pada deteksi fraud (transaksi normal ditolak) umumnya mencerminkan model yang terlalu sensitif, yaitu masalah tuning seperti hyperparameter dan threshold klasifikasi. Manual menjelaskan bahwa bila metrik kinerja (precision, recall, F1) belum memenuhi target, model perlu iterasi tuning hyperparameter hingga kinerja yang sesuai tercapai. Opsi lain tidak secara langsung memengaruhi trade-off antara deteksi fraud dan penolakan transaksi sah.","distractors":{"A":"Consent management adalah isu privasi/kepatuhan, bukan penyebab model salah mengklasifikasi transaksi.","B":"Compute scale training berkaitan dengan kapasitas komputasi, bukan penyebab langsung tingginya false positive.","D":"Data versioning penting untuk traceability dan rollback, tetapi ketiadaannya tidak secara langsung menyebabkan false positive."},"manualRef":{"chapter":2,"section":"2.8.4","title":"Evaluation","bookPage":95,"pdfPage":101},"links":[{"label":"Wikipedia: Precision and recall","url":"https://en.wikipedia.org/wiki/Precision_and_recall"},{"label":"Google ML Crash Course","url":"https://developers.google.com/machine-learning/crash-course"}]},{"id":90,"topic":2,"qn":5,"question":"When utilizing a machine learning (ML) model to predict whether a wind turbine electricity generator will fail, which model evaluation metric should be the PRIMARY focus?","options":{"A":"Recall","B":"Specificity","C":"Precision","D":"Accuracy"},"url":"https://www.examtopics.com/discussions/isaca/view/317679-exam-aaia-topic-2-question-5-discussion/","community":{"A":2},"answer":"A","confidence":"high","explanation":"Pada prediksi kegagalan turbin, biaya false negative (kegagalan nyata yang tidak terdeteksi) jauh lebih besar daripada false alarm, karena dapat menyebabkan kerusakan mahal, downtime, atau risiko keselamatan. Recall mengukur proporsi kegagalan aktual yang berhasil ditangkap model, sehingga menjadi metrik utama. Manual menyebut precision, recall, dan F1 sebagai metrik evaluasi model; pemilihannya harus disesuaikan dengan konsekuensi bisnis dari tiap jenis kesalahan.","distractors":{"B":"Specificity berfokus pada ketepatan mengenali kondisi normal, bukan menangkap kegagalan yang kritis.","C":"Precision berfokus pada mengurangi false alarm; penting tetapi sekunder dibanding tidak melewatkan kegagalan.","D":"Accuracy menyesatkan pada data tidak seimbang (kegagalan jarang terjadi); model yang selalu memprediksi 'tidak gagal' tetap tampak akurat."},"manualRef":{"chapter":2,"section":"2.8.4","title":"Evaluation","bookPage":95,"pdfPage":101},"links":[{"label":"Wikipedia: Precision and recall","url":"https://en.wikipedia.org/wiki/Precision_and_recall"},{"label":"Wikipedia: Confusion matrix","url":"https://en.wikipedia.org/wiki/Confusion_matrix"}]},{"id":91,"topic":1,"qn":143,"question":"Which of the following would be of GREATEST concern to an IS auditor reviewing an organization’s use of an external AI service provider?","options":{"A":"Service level agreements (SLAs) do not include penalty provisions for AI model errors.","B":"The organization has not validated the origin of the vendor’s training data.","C":"The provider does not hold an AI-specific security certification.","D":"Identification of third-party AI risk was not completed as part of the onboarding process."},"url":"https://www.examtopics.com/discussions/isaca/view/394910-exam-aaia-topic-1-question-143-discussion/","community":{"D":2},"answer":"D","confidence":"high","explanation":"Manual menyatakan vendor AI harus dinilai risikonya saat onboarding melalui proses procurement standar, mencakup keselarasan strategi, etika (transparansi, explainability), serta keamanan dan privasi data, lalu diawasi sepanjang life cycle. Jika identifikasi risiko pihak ketiga tidak dilakukan sejak onboarding, maka seluruh risiko vendor (termasuk asal data training, SLA, dan keamanan) tidak pernah terpetakan secara sistematis. Ini adalah kelemahan governance mendasar yang mencakup opsi-opsi lain.","distractors":{"A":"Ketiadaan klausul penalti di SLA adalah kelemahan kontraktual, tetapi lebih sempit dan bisa ditangani setelah risiko teridentifikasi.","B":"Validasi asal data training vendor penting, namun merupakan bagian dari proses penilaian risiko pihak ketiga yang lebih luas.","C":"Sertifikasi keamanan khusus AI bukan persyaratan wajib; ketiadaannya tidak otomatis berarti risiko tinggi."},"manualRef":{"chapter":1,"section":"1.5.5","title":"Vendors","bookPage":40,"pdfPage":46},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]},{"id":92,"topic":1,"qn":140,"question":"Which of the following is the MOST appropriate role for an IS auditor involved in the pre-implementation review of a new AI model?","options":{"A":"Deciding on the specific technologies to be used by the AI model","B":"Developing data governance controls specific to the AI model","C":"Ensuring industry best practices are followed","D":"Assessing the design of the project plan"},"url":"https://www.examtopics.com/discussions/isaca/view/394907-exam-aaia-topic-1-question-140-discussion/","community":{"D":1},"answer":"D","confidence":"medium","explanation":"Dalam pre-implementation review, peran auditor adalah memberikan assurance independen dengan mengevaluasi rancangan proyek (business case, rencana, dependensi, risiko, rencana adopsi/implementasi), bukan mengambil keputusan desain. Manual menggambarkan area audit 'Definition' yang menguji business case, indicative plan timeline, identified risk, dan adoption/implementation plan. Memutuskan teknologi atau mengembangkan kontrol adalah tanggung jawab manajemen dan akan mengganggu independensi auditor.","distractors":{"A":"Memilih teknologi adalah keputusan manajemen/tim proyek; jika auditor melakukannya, independensi terganggu.","B":"Mengembangkan kontrol data governance adalah tugas manajemen; auditor mengevaluasi, bukan merancang kontrol.","C":"Auditor tidak 'menjamin' best practice diikuti; tanggung jawab itu ada di manajemen, auditor hanya menilai dan merekomendasikan."},"manualRef":{"chapter":3,"section":"3.6.1","title":"AI Systems Overall Testing","bookPage":145,"pdfPage":151},"links":[{"label":"ISACA ITAF","url":"https://www.isaca.org/resources/frameworks-standards-and-models"}]},{"id":93,"topic":1,"qn":128,"question":"An IS auditor is assessing the effectiveness of an organization’s AI governance framework.\nWhich of the following presents the GREATEST risk to AI governance when deploying a new AI system across multiple departments?","options":{"A":"Lack of integration with AI cybersecurity and business processes","B":"Prioritization of rapid AI deployment and scalability","C":"Failure to address ongoing adaptation to evolving AI capabilities","D":"Management of AI governance by external consultants"},"url":"https://www.examtopics.com/discussions/isaca/view/394895-exam-aaia-topic-1-question-128-discussion/","community":{"A":1},"answer":"A","confidence":"low","explanation":"Saat AI diterapkan lintas departemen, governance hanya efektif bila terintegrasi dengan fungsi yang sudah ada, termasuk cybersecurity, risk management, dan proses bisnis. Manual menyebut organisasi umumnya mengintegrasikan AI governance ke dalam fungsi IT governance yang ada, dan bahwa AI risk assessment tidak boleh dilakukan terpisah dari proses risiko organisasi. Tanpa integrasi, tiap departemen dapat berjalan dalam silo dengan kontrol yang tidak konsisten, sehingga ini adalah risiko terbesar bagi governance. Soal ini cukup ambigu karena opsi C dan D juga merupakan risiko yang valid.","distractors":{"B":"Prioritas pada kecepatan dan skalabilitas adalah tekanan bisnis yang umum; risikonya muncul terutama bila governance tidak terintegrasi.","C":"Adaptasi terhadap perkembangan AI penting untuk keberlanjutan, tetapi bukan isu paling kritis pada saat deployment lintas departemen.","D":"Konsultan eksternal dapat membantu selama akuntabilitas tetap dipegang organisasi; ini bukan risiko terbesar."},"manualRef":{"chapter":1,"section":"1.6","title":"AI Strategy (Part B: AI Governance and Program Management)","bookPage":43,"pdfPage":49},"links":[{"label":"COBIT","url":"https://www.isaca.org/resources/cobit"},{"label":"ISO/IEC 42001","url":"https://www.iso.org/standard/42001"}]},{"id":94,"topic":1,"qn":122,"question":"Which of the following is the MOST important element of a risk management strategy when implementing AI in a financial services organization?","options":{"A":"Addressing bias and fairness concerns","B":"Developing an incident identification and response plan","C":"Establishing an employee awareness program","D":"Conducting a privacy impact assessment (PIA)"},"url":"https://www.examtopics.com/discussions/isaca/view/394889-exam-aaia-topic-1-question-122-discussion/","community":{"A":1},"answer":"A","confidence":"low","explanation":"Di sektor jasa keuangan, AI banyak dipakai untuk keputusan berdampak tinggi pada individu (kredit, asuransi, deteksi fraud), sehingga bias dan ketidakadilan dapat menimbulkan diskriminasi, sanksi regulator, dan kerusakan reputasi. Manual menegaskan solusi AI harus bebas bias untuk menjamin fairness dan menghindari dampak merugikan pada kelompok tertentu, serta menjadikan bias dan fairness sebagai karakteristik trustworthy yang harus dievaluasi dalam risk assessment. Opsi lain penting tetapi lebih merupakan kontrol pendukung atau berlaku umum untuk semua sistem.","distractors":{"B":"Rencana incident response penting, tetapi bersifat reaktif dan berlaku umum, bukan elemen risiko khas AI paling penting di sektor keuangan.","C":"Program awareness karyawan adalah kontrol pendukung, bukan inti strategi manajemen risiko AI.","D":"PIA relevan untuk aspek privasi, tetapi cakupannya lebih sempit dibanding risiko bias/fairness pada keputusan keuangan otomatis."},"manualRef":{"chapter":1,"section":"1.17.2","title":"Bias and Fairness","bookPage":72,"pdfPage":78},"links":[{"label":"NIST AI RMF 1.0","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"label":"Wikipedia: Fairness (machine learning)","url":"https://en.wikipedia.org/wiki/Fairness_(machine_learning)"}]},{"id":95,"topic":1,"qn":120,"question":"Which of the following BEST demonstrates effective coordination to ensure comprehensive oversight of an AI system deployed across multiple jurisdictions?","options":{"A":"Establishing joint oversight plans and communication channels between agencies","B":"Centralizing responsibility under a single supervisory authority","C":"Relying on automated processes for anomaly detection and documentation","D":"Focusing oversight activities on technical anomaly detection metrics"},"url":"https://www.examtopics.com/discussions/isaca/view/394887-exam-aaia-topic-1-question-120-discussion/","community":{"A":1},"answer":"A","confidence":"medium","explanation":"Sistem AI yang beroperasi di banyak yurisdiksi tunduk pada hukum dan otoritas yang berbeda-beda, dan manual mencatat bahwa regulasi AI masih berkembang di tingkat nasional maupun subnasional. Koordinasi yang efektif membutuhkan rencana pengawasan bersama dan saluran komunikasi antar lembaga agar kewajiban tiap yurisdiksi terpenuhi tanpa celah atau tumpang tindih. Pendekatan ini sejalan dengan prinsip OECD tentang interoperabilitas governance dan kerja sama internasional.","distractors":{"B":"Sentralisasi di satu otoritas tidak realistis lintas yurisdiksi dan berisiko mengabaikan kewajiban lokal.","C":"Otomasi deteksi anomali adalah alat teknis, bukan mekanisme koordinasi pengawasan.","D":"Fokus pada metrik teknis saja mengabaikan aspek regulasi, etika, dan koordinasi antar lembaga."},"manualRef":{"chapter":1,"section":"1.16.4","title":"Laws and Regulations","bookPage":70,"pdfPage":76},"links":[{"label":"OECD AI Principles","url":"https://oecd.ai/en/ai-principles"},{"label":"EU AI Act (EUR-Lex)","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}]},{"id":96,"topic":1,"qn":119,"question":"Which of the following is the MOST important consideration for change management related to the organization-wide adoption of AI systems and tools?","options":{"A":"Establishment of organization data governance and infrastructure readiness","B":"Implementation of AI-powered systems with shorter user training cycles","C":"Direct involvement from organization senior leadership","D":"Phased implementation and stringent project stage gates"},"url":"https://www.examtopics.com/discussions/isaca/view/394886-exam-aaia-topic-1-question-119-discussion/","community":{"C":2},"answer":"C","confidence":"medium","explanation":"Change management untuk adopsi AI di seluruh organisasi sangat bergantung pada sponsor dan komitmen pimpinan senior, yang menetapkan tone at the top, mengalokasikan sumber daya, dan mendorong penerimaan karyawan. Manual menyatakan strategi AI harus diterima manajemen senior agar berhasil, dan manajemen eksekutif bertanggung jawab atas tone at the top serta persetujuan strategi AI. Tanpa keterlibatan langsung pimpinan, kesiapan data/infrastruktur maupun phased rollout tidak akan cukup mengatasi resistensi organisasi.","distractors":{"A":"Data governance dan kesiapan infrastruktur adalah prasyarat teknis, tetapi bukan pendorong utama perubahan organisasi.","B":"Memperpendek siklus pelatihan justru
