<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAIA Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f1f4f9; --surface-3:#e8edf5; --border:#e3e8f0; --text:#0f172a; --muted:#64748b;
  --accent:#4f46e5; --accent-2:#7c3aed; --accent-soft:#eef2ff; --on-accent:#ffffff;
  --ok:#059669; --ok-soft:#ecfdf5; --bad:#dc2626; --bad-soft:#fef2f2; --warn:#b45309; --warn-soft:#fffbeb;
  --d1:#4f46e5; --d1-soft:#eef2ff; --d2:#0d9488; --d2-soft:#f0fdfa; --d3:#d97706; --d3-soft:#fffbeb;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06); --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.12);
  --shadow-lg:0 20px 40px -20px rgba(79,70,229,.35);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:#121933; --surface-2:#18213f; --surface-3:#1f2a4d; --border:#243056; --text:#e6e9f5; --muted:#94a0c0;
    --accent:#818cf8; --accent-2:#a78bfa; --accent-soft:#1e2550; --on-accent:#0b1020;
    --ok:#34d399; --ok-soft:#0f2e26; --bad:#f87171; --bad-soft:#3a1720; --warn:#fbbf24; --warn-soft:#33270f;
    --d1:#818cf8; --d1-soft:#1e2550; --d2:#2dd4bf; --d2-soft:#0f2e2c; --d3:#fbbf24; --d3-soft:#33270f;
    --shadow-sm:none; --shadow:0 1px 0 rgba(255,255,255,.03); --shadow-lg:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#121933; --surface-2:#18213f; --surface-3:#1f2a4d; --border:#243056; --text:#e6e9f5; --muted:#94a0c0;
  --accent:#818cf8; --accent-2:#a78bfa; --accent-soft:#1e2550; --on-accent:#0b1020;
  --ok:#34d399; --ok-soft:#0f2e26; --bad:#f87171; --bad-soft:#3a1720; --warn:#fbbf24; --warn-soft:#33270f;
  --d1:#818cf8; --d1-soft:#1e2550; --d2:#2dd4bf; --d2-soft:#0f2e2c; --d3:#fbbf24; --d3-soft:#33270f;
  --shadow-sm:none; --shadow:0 1px 0 rgba(255,255,255,.03); --shadow-lg:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
svg{flex:0 0 auto}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.muted{color:var(--muted)}
h1,h2,h3{line-height:1.25;letter-spacing:-.015em}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .35s ease both}

/* header */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;cursor:pointer;margin-right:auto;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-lg)}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0;margin-top:-3px}
.nav{display:flex;gap:2px}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;transition:.15s}
.nav button:hover{color:var(--text);background:var(--surface-2)}
.nav button.on{color:var(--accent);background:var(--accent-soft)}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--text)}
@media (max-width:720px){
  header.top .wrap{height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:8px}
  .nav{order:3;width:100%;justify-content:space-between}
  .nav button{flex:1;justify-content:center;padding:8px 4px;font-size:13px;white-space:nowrap;gap:5px}
  .brand small{display:none}
}
main{padding:28px 0 80px;min-height:70vh}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface);padding:10px 16px;border-radius:12px;cursor:pointer;text-decoration:none;color:var(--text);font-weight:600;font-size:14px;transition:.15s;box-shadow:var(--shadow-sm)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:var(--shadow-lg)}
.btn.primary:hover{filter:brightness(1.07);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.lg{padding:13px 22px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s ease}
.d1{--dc:var(--d1);--ds:var(--d1-soft)} .d2{--dc:var(--d2);--ds:var(--d2-soft)} .d3{--dc:var(--d3);--ds:var(--d3-soft)} .d0{--dc:var(--accent);--ds:var(--accent-soft)}
.dchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--ds);color:var(--dc)}

/* HOME */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:48px 40px;background:radial-gradient(1200px 400px at 100% 0%,rgba(124,58,237,.35),transparent 60%),radial-gradient(800px 400px at 0% 100%,rgba(13,148,136,.28),transparent 60%),linear-gradient(135deg,#1e1b4b,#312e81 55%,#4c1d95);color:#fff;display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:center}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent,#000);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{color:#c7d2fe}
.hero h1{font-size:40px;margin:10px 0 12px;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#a5b4fc,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#e0e7ff;font-size:16px;margin:0 0 22px;max-width:560px}
.hero .btn{box-shadow:none}
.hero .btn:not(.primary){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.hero .btn.primary{background:#fff;color:#312e81}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:16px;backdrop-filter:blur(6px)}
.hstat b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.hstat span{font-size:13px;color:#c7d2fe}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding:32px 22px}.hero h1{font-size:30px}}
.sec-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:40px 0 16px;flex-wrap:wrap}
.sec-title h2{margin:0;font-size:22px}
.domains{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.domains{grid-template-columns:1fr}}
.dcard{position:relative;overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:10px}
.dcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--dc)}
.dcard:hover{transform:translateY(-3px);border-color:var(--dc)}
.dcard .num{width:44px;height:44px;border-radius:12px;background:var(--ds);color:var(--dc);display:grid;place-items:center;font-weight:800;font-size:18px}
.dcard h3{margin:0;font-size:18px}
.dcard .bar>span{background:var(--dc)}
.dcard .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.wbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-top:6px}
.wbar span{display:block;height:100%}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:860px){.feat{grid-template-columns:1fr}}
.fcard{display:flex;gap:16px;align-items:flex-start}
.ficon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.fcard h3{margin:2px 0 4px;font-size:17px}
.fcard p{margin:0 0 12px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:10px}
.spark div{flex:1;max-width:36px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--accent),var(--accent-2));min-height:4px;position:relative}
.spark div span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:600}
.foot{margin-top:48px;font-size:13px;color:var(--muted);text-align:center}

/* EXPLORE */
.explore{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
.explore>*,.examlay>*{min-width:0}
@media (max-width:960px){.explore{grid-template-columns:minmax(0,1fr)}}
aside.side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px;scrollbar-width:thin}
@media (max-width:960px){aside.side{position:static;max-height:none;overflow:visible}}
.chlist{display:flex;flex-direction:column;gap:6px}
@media (max-width:960px){.chlist{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.chbtn{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:9px 10px;cursor:pointer;width:100%}
@media (max-width:960px){.chbtn{width:auto;flex:0 0 auto;border-color:var(--border);background:var(--surface)}}
.chbtn:hover{background:var(--surface)}
.chbtn.on{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow)}
.chbtn .n{width:30px;height:30px;border-radius:9px;background:var(--ds);color:var(--dc);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.chbtn .tt{font-weight:600;font-size:14px;line-height:1.3}
.chbtn .tt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.toc{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
@media (max-width:960px){.toc{display:none}}
.toc .ph{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:12px 0 4px 10px}
.toc a{display:flex;gap:8px;align-items:center;padding:5px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:13.5px;border-left:2px solid transparent}
.toc a:hover{color:var(--text);background:var(--surface)}
.toc a.act{color:var(--dc);border-left-color:var(--dc);background:var(--ds);font-weight:600}
.toc a .ck{margin-left:auto;color:var(--ok);font-size:12px}
.toc a b{font-weight:700;min-width:32px}
.mjump{display:none;width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font:inherit}
@media (max-width:960px){.mjump{display:block}}
.banner{position:relative;overflow:hidden;border-radius:22px;padding:30px 30px 26px;color:#fff;background:linear-gradient(135deg,var(--dc),color-mix(in srgb,var(--dc) 55%,#1e1b4b))}
.banner::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.1)}
.banner .eyebrow{color:rgba(255,255,255,.85)}
.banner h1{font-size:30px;margin:6px 0 10px;font-weight:800}
.banner p{margin:0;color:rgba(255,255,255,.92);max-width:820px}
.banner .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.banner .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
.banner .btn{background:rgba(255,255,255,.95);color:#1e1b4b;border-color:transparent;box-shadow:none}
.banner .bar{background:rgba(255,255,255,.22);width:160px}
.banner .bar>span{background:#fff}
:root[data-theme="dark"] .banner,:root:not([data-theme="light"]) .banner{color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.two h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:16px}
ul.clean{margin:8px 0 0;padding-left:20px}
ul.clean li{margin:5px 0}
ul.checks{list-style:none;padding:0;margin:8px 0 0}
ul.checks li{position:relative;padding-left:26px;margin:7px 0}
ul.checks li::before{content:"";position:absolute;left:0;top:4px;width:16px;height:16px;border-radius:50%;background:var(--ds);box-shadow:inset 0 0 0 5px var(--ds),inset 0 0 0 16px var(--dc)}
.searchbox{position:relative;margin:24px 0 8px}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{width:100%;padding:13px 14px 13px 42px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font:inherit;box-shadow:var(--shadow-sm)}
.searchbox input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.part{margin-top:30px;scroll-margin-top:90px}
.part-h{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.part-h .tag{font-weight:800;color:var(--dc);background:var(--ds);border-radius:10px;padding:4px 10px;font-size:13px;white-space:nowrap}
.part-h h2{margin:0;font-size:20px}
.part>p{margin:4px 0 12px;color:var(--muted)}
details.sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin:10px 0;overflow:hidden;box-shadow:var(--shadow-sm);transition:border-color .15s;scroll-margin-top:90px}
details.sec:hover{border-color:color-mix(in srgb,var(--dc) 40%,var(--border))}
details.sec[open]{border-color:color-mix(in srgb,var(--dc) 55%,var(--border));box-shadow:var(--shadow)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .num{font-weight:800;color:var(--dc);background:var(--ds);border-radius:9px;padding:3px 8px;font-size:13px;min-width:46px;text-align:center}
details.sec .t{font-weight:600;flex:1}
details.sec .pg{font-size:12px;color:var(--muted);white-space:nowrap}
details.sec .rd{color:var(--ok);display:none}
details.sec.read .rd{display:inline-flex}
details.sec .chev{color:var(--muted);transition:transform .2s}
details.sec[open] .chev{transform:rotate(180deg)}
.sec-body{padding:2px 20px 18px 20px;border-top:1px solid var(--border);animation:fadeUp .25s ease}
.sec-body .lead{font-size:15.5px;margin:14px 0 6px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:14px}
.term{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13.5px}
.term b{display:block;color:var(--dc);font-size:13px}
.tip{display:flex;gap:10px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);padding:11px 13px;border-radius:12px;margin-top:14px;font-size:14px}
.tip svg{color:var(--warn);margin-top:2px}
.tip b{color:var(--warn)}
.sec-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.hl{background:color-mix(in srgb,var(--warn) 30%,transparent);border-radius:3px;padding:0 1px}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media (max-width:760px){.info-grid{grid-template-columns:1fr 1fr}}
.istat{background:var(--surface-2);border-radius:14px;padding:14px}
.istat b{display:block;font-size:24px;font-weight:800}
.istat span{font-size:13px;color:var(--muted)}

/* PRACTICE */
.phead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{margin:0;font-size:30px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.modes{grid-template-columns:1fr}}
.mode{position:relative;overflow:hidden}
.mode .ficon{margin-bottom:14px}
.mode.alt .ficon{background:var(--d2-soft);color:var(--d2)}
.mode h3{font-size:20px;margin:0 0 6px}
.mode>p{color:var(--muted);margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text);font:inherit;font-weight:500;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row .field{flex:1;min-width:120px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 14px}
.presets button{border:1px dashed var(--border);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}
.presets button:hover{border-color:var(--accent);color:var(--accent)}
.examlay{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
@media (max-width:960px){.examlay{grid-template-columns:1fr}}
.qbar{position:sticky;top:64px;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:10px 0 12px;margin-bottom:6px}
@media (max-width:720px){.qbar{top:96px}}
.qbar .row{gap:10px}
.qbar .sp{flex:1}
.qprog{margin-top:10px}
.timer{display:inline-flex;gap:7px;align-items:center;font-variant-numeric:tabular-nums;font-weight:700;background:var(--surface);border:1px solid var(--border);padding:7px 13px;border-radius:999px;box-shadow:var(--shadow-sm)}
.timer.low{color:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--bad-soft)}}
.qcard{padding:28px}
@media (max-width:600px){.qcard{padding:18px}}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.qtext{font-size:18px;font-weight:600;white-space:pre-line;margin:0 0 20px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;border:1.5px solid var(--border);background:var(--surface);border-radius:14px;padding:13px 15px;cursor:pointer;width:100%;transition:.15s}
.opt:not([disabled]):hover{border-color:var(--accent);transform:translateX(2px)}
.opt .l{font-weight:800;width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:14px;flex:0 0 auto;transition:.15s}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--on-accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.qnav{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.qnav .sp{flex:1}
.navcard{position:sticky;top:150px}
.navcard h3{margin:0 0 4px;font-size:15px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.navgrid button{height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);position:relative}
.navgrid button.ans{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.navgrid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.navgrid button.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--text)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kbd{display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12px;background:var(--surface);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
/* explanation */
.expl{margin-top:22px;animation:fadeUp .3s ease}
.verdict{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;margin-bottom:14px;font-weight:700;flex-wrap:wrap}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.neu{background:var(--accent-soft);color:var(--accent)}
.verdict .sp{flex:1}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--muted)}
.badge.high{color:var(--ok)} .badge.medium{color:var(--warn)} .badge.low{color:var(--bad)}
.expl p.ex{margin:0 0 4px;font-size:15px}
.blk{border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:12px}
.blk .lbl{display:flex;gap:8px;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:8px}
.dis{display:flex;flex-direction:column;gap:8px}
.dis div{display:flex;gap:10px;font-size:14px}
.dis b{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;flex:0 0 auto}
.refm{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.refm .book{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.refm .txt{flex:1;min-width:200px;font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;text-decoration:none;padding:6px 11px;border-radius:999px;background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.votes{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-3);margin:4px 0 8px;max-width:420px}
.votes span{display:block;height:100%}
.vleg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.vleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
/* result */
.rhero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media (max-width:720px){.rhero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{--p:0;width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center}
.ring div{width:136px;height:136px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-size:38px;font-weight:800;line-height:1}
.ring small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
@media (max-width:720px){.rstats{grid-template-columns:1fr 1fr;width:100%}}
.rstats div{background:var(--surface-2);border-radius:12px;padding:10px 12px;text-align:left}
.rstats b{display:block;font-size:22px;font-weight:800}
.rstats span{font-size:12.5px;color:var(--muted)}
.dbreak{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.dbreak .r{display:grid;grid-template-columns:1fr 2fr auto;gap:12px;align-items:center;font-size:14px}
@media (max-width:600px){.dbreak .r{grid-template-columns:1fr auto}.dbreak .r .bar{grid-column:1/-1;order:3}}
.dbreak .bar>span{background:var(--dc)}
.filter{display:flex;gap:6px;margin:14px 0 6px;flex-wrap:wrap}
.filter button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.filter button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rev{border:1px solid var(--border);border-radius:14px;margin:10px 0;background:var(--surface);box-shadow:var(--shadow-sm)}
.rev>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.rev>summary::-webkit-details-marker{display:none}
.rev .st{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;font-weight:800}
.rev .st.ok{background:var(--ok-soft);color:var(--ok)} .rev .st.bad{background:var(--bad-soft);color:var(--bad)} .rev .st.skip{background:var(--surface-2);color:var(--muted)}
.rev .qs{flex:1;font-size:14.5px}
.rev .qs small{display:flex;gap:10px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.rev .body{padding:0 16px 16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
</style>
</head>

<script id="data" type="application/json">{"pdfFile":null,"chapters":[{"id":1,"title":"AI Governance and Risk","domain":"Domain 1","weight":"33% (sekitar 25 soal)","pdfStart":19,"pdfEnd":82,"overview":"Chapter ini membangun fondasi konseptual AI (jenis AI, model ML, algoritma, AI life cycle) lalu menghubungkannya dengan praktik governance, risk management, data governance/privacy, serta etika dan regulasi. Risiko AI pada dasarnya mirip risiko IS umum (confidentiality, integrity, availability, compliance), tetapi volume data yang masif dan minimnya intervensi manusia membuat dampaknya bisa jauh lebih besar dan cepat membesar. Auditor perlu memahami konsep dasar AI agar dapat menerapkan praktik governance, risk management, dan privacy yang sudah dikenal ke solusi AI dan berperan sebagai trusted advisor. Domain 1 adalah domain terbesar di ujian AAIA (33%), sehingga penguasaan chapter ini sangat menentukan.","objectives":["Mengevaluasi dampak, peluang, dan risiko ketika solusi AI diintegrasikan ke dalam proses audit.","Mengevaluasi solusi AI untuk memberi advis kepada organisasi tentang dampak, peluang, dan risikonya.","Mengevaluasi dampak solusi AI terhadap interaksi sistem, lingkungan, dan manusia.","Mengevaluasi peran dan dampak sistem pengambilan keputusan berbasis AI terhadap organisasi dan stakeholder.","Mengevaluasi kebijakan dan prosedur AI organisasi, termasuk kepatuhan terhadap ketentuan hukum dan regulasi.","Mengevaluasi pemantauan dan pelaporan metrik khusus AI (mis. KPI, KRI).","Mengevaluasi apakah ownership atas risiko, kontrol, prosedur, keputusan, dan standar terkait AI sudah didefinisikan.","Mengevaluasi program data governance dan program privacy organisasi yang spesifik untuk AI.","Mengevaluasi program problem & incident management, change management, dan configuration management yang spesifik untuk AI.","Mengevaluasi program threat & vulnerability management serta identity & access management yang spesifik untuk AI.","Mengevaluasi program vendor dan supply chain management untuk solusi AI.","Mengevaluasi desain dan efektivitas kontrol yang spesifik untuk AI.","Mengevaluasi persyaratan data input model AI (kelayakan data, bias, privacy).","Mengevaluasi persyaratan sistem/bisnis solusi AI agar selaras dengan enterprise architecture.","Mengevaluasi AI life cycle (design, development, deployment, monitoring, decommissioning) beserta input/output-nya dari sisi kepatuhan dan risiko.","Mengevaluasi algoritma dan model agar selaras dengan tujuan bisnis, kebijakan, dan prosedur.","Menganalisis dampak AI terhadap workforce untuk memberi advis tentang penanganan dampak, pelatihan, dan edukasi.","Mengevaluasi apakah program awareness selaras dengan kebijakan dan prosedur AI organisasi."],"parts":[{"id":"A","title":"AI Models, Considerations, and Requirements","overview":"Part A menjelaskan apa itu AI, ML, dan DL beserta hierarkinya, klasifikasi jenis AI, paradigma pembelajaran, algoritma, tahapan AI life cycle (OECD), dan pertimbangan bisnis seperti business case, cost-benefit, hosting, vendor, serta shared responsibility.","sections":[{"num":"1.1","title":"Types of AI","bookPage":19,"pdfPage":25,"summary":"AI dapat dikelompokkan berdasarkan fungsionalitas (reactive machines, limited memory, theory of mind, self-aware) maupun kapabilitas (ANI, AGI, ASI). Bagian ini juga membahas generative model, agentic AI, dan predictive model beserta risiko khasnya.","points":["Hierarki konsep: AI adalah payung besar (dari rule engine 'if-else' sampai mobil otonom); Machine Learning (ML) adalah subset AI yang membangun model prediktif dari data; Deep Learning (DL) adalah jenis ML berlapis yang mengenali pola pada tingkat abstraksi makin tinggi; GenAI berada di dalam DL. Sebagian besar yang disebut 'AI' saat ini sebenarnya adalah tool ML berbasis model statistik.","1.1.1 Berdasarkan fungsionalitas: (1) Reactive machines merespons input terbatas secara otomatis tanpa memori (contoh: Deep Blue, ELIZA, robot industri); (2) Limited memory memakai data pengalaman terbaru dengan memori statis + dinamis yang singkat (contoh: kendaraan otonom, Siri/Alexa, recommendation system, chatbot); (3) Theory of Mind (ToM) berupaya memahami pikiran dan emosi manusia (LLM seperti ChatGPT/CoPilot dan robot sosial Pepper/Sophia baru contoh awal, bukan ToM penuh); (4) Self-aware AI sadar akan kondisi mentalnya sendiri, belum ada contohnya.","1.1.2 Berdasarkan kapabilitas: ANI ('weak AI') terbatas pada satu domain/tugas spesifik dan merupakan kondisi AI saat ini; reactive dan limited memory termasuk ANI, dan mayoritas AI tergolong limited memory. Mobil otonom adalah kombinasi banyak sistem ANI (computer vision, GPS/navigasi, sistem kontrol).","AGI adalah AI hipotetis yang mampu mengerjakan tugas intelektual apa pun setara manusia; syaratnya mencakup sensory perception, fine motor skills, problem solving, navigasi, natural language understanding, kreativitas, dan social-emotional engagement. Kemajuan ada di computer vision dan NLP, tetapi fine motor skill, common sense, dan keterlibatan sosial-emosional masih belum tercapai.","ASI adalah tahap teoretis di mana AI melampaui kecerdasan manusia; walau masih konsep, dampak potensial AGI/ASI cukup besar sehingga peluang kecil pun perlu ditanggapi serius.","1.1.3 Generative models: GenAI menghasilkan konten baru (teks, gambar, kode, suara, musik) berdasarkan pola training data. GAN (generative adversarial network) memakai dua neural network yang bersaing: generator membuat sampel baru, discriminator membedakan sampel asli vs buatan, hingga hasil generator sulit dibedakan dari data nyata (dasar deepfake, style transfer, data augmentation, text-to-image, voice synthesis).","GenAI membawa risiko legal dan etis tersendiri: distribusi konten berbahaya yang dapat memicu tuntutan hukum, serta isu copyright/IP atas konten yang dihasilkan.","Agentic AI: agen AI yang dapat mengambil keputusan dan bertindak secara otonom untuk mencapai tujuan yang ditetapkan. Manfaatnya: spesialisasi tugas granular yang cepat dibuat, cocok untuk inovasi/eksperimen, dan menurut manual cenderung lebih jarang berhalusinasi dibanding GenAI. Tetap butuh human oversight; tujuan yang dirumuskan buruk dapat menggagalkan agen. Use case: customer service, diagnostik kesehatan, manufaktur, workflow management, financial risk management, sales support.","1.1.4 Predictive models memakai data historis dan algoritma ML untuk meramalkan kejadian/tren (predictive maintenance, customer churn, financial forecasting). Risiko terbesarnya adalah ketika prediksi dipakai untuk keputusan bisnis tanpa memahami bagaimana model sampai pada prediksinya."],"terms":[{"term":"Artificial Narrow Intelligence (ANI)","def":"AI 'lemah' yang hanya mampu menjalankan tugas dalam satu domain spesifik; kondisi AI saat ini."},{"term":"Artificial General Intelligence (AGI)","def":"AI hipotetis yang dapat melakukan tugas intelektual apa pun yang bisa dilakukan manusia."},{"term":"Artificial Super Intelligence (ASI)","def":"Tahap teoretis AI yang melampaui kecerdasan manusia."},{"term":"Limited memory AI","def":"AI yang memakai data pengalaman terkini (memori singkat) untuk tugas tertentu; kategori mayoritas AI, termasuk chatbot."},{"term":"Theory of Mind (ToM)","def":"Konsep AI yang memahami dan meniru pikiran, emosi, dan pengambilan keputusan manusia."},{"term":"GAN (Generative Adversarial Network)","def":"Model DL dengan dua jaringan (generator vs discriminator) yang saling bersaing untuk menghasilkan data sintetis realistis."},{"term":"Agentic AI","def":"Agen AI yang secara otonom membuat keputusan dan mengambil tindakan untuk mencapai tujuan tertentu."},{"term":"Predictive AI","def":"Model yang memakai data historis dan ML untuk memprediksi kejadian/tren masa depan."}],"examTip":"Perhatikan perbedaan klasifikasi fungsionalitas vs kapabilitas. Chatbot paling tepat digolongkan sebagai limited memory (yang merupakan bagian dari ANI) — jika ada pilihan yang lebih spesifik, ISACA cenderung memilih jawaban yang paling presisi. Untuk predictive model, risiko utama ada pada keputusan bisnis yang bergantung pada prediksi yang tidak dipahami."},{"num":"1.2","title":"Machine Learning/AI Models","bookPage":24,"pdfPage":30,"summary":"ML memungkinkan mesin belajar dari data tanpa diprogram eksplisit, dengan tiga paradigma utama: supervised, unsupervised, dan reinforcement learning. Section ini juga menjelaskan neural network dan deep learning, serta risiko khas tiap paradigma.","points":["ML berlandaskan statistik, probabilitas, aljabar linear, kalkulus, dan optimisasi; dipakai untuk pattern recognition, klasifikasi, anomaly detection, dan predictive analytics. Big data membuat akurasi ML terus meningkat. Memahami cara kerja algoritma membantu mengenali keterbatasan dan bias.","Label = hasil/kategori yang diketahui yang ingin diprediksi model. Pelabelan bisa sulit karena volume data sangat besar (mahal/lama), kategori kompleks/ambigu yang butuh pakar, atau tidak adanya ground truth.","Supervised learning memetakan input ke label yang disiapkan data scientist. Dua tipe: regression (output kuantitatif/kontinu, mis. harga rumah dari luas bangunan) dan classification (output kualitatif/kategori, mis. email spam vs sah).","Risiko supervised learning: sangat bergantung pada keterlibatan manusia; area risiko terbesar adalah kualitas data dan bias karena butuh data berkualitas tinggi dalam jumlah besar. Semisupervised learning mengombinasikan data berlabel dan tidak berlabel ketika data berlabel terbatas atau mahal.","Unsupervised learning belajar dari data tanpa label untuk menemukan pola tersembunyi. Tipe: clustering (exclusive/centroid, overlapping, hierarchical, density-based, distribution-based), association rules (mis. algoritma Apriori), dan dimensionality reduction (PCA, t-SNE, LLE, Isomap, MDS, UMAP).","Risiko unsupervised learning: kurangnya explainability atas hasil; auditor perlu memastikan ada human-in-the-loop (HITL) untuk menjaga akurasi dan reliabilitas output.","Reinforcement learning (RL) melatih agen melalui reward/penalti untuk memaksimalkan cumulative reward (analogi melatih anjing dengan camilan). Risikonya berasal dari sifat otonom; keselamatan dan etika saat fase eksplorasi harus dipertimbangkan, dan prinsip HITL membantu memastikan tindakan di produksi aman.","1.2.2 Neural network (NN) meniru cara kerja otak dengan tiga lapisan: input layer, hidden layer(s) tempat komputasi/pembelajaran, dan output layer. Makin banyak hidden layer, makin kompleks pola yang bisa dipelajari.","Jenis NN: Feedforward (FNN) — informasi satu arah, untuk klasifikasi gambar/regresi (email filtering, image recognition); Recurrent (RNN) — punya loop untuk data sekuensial/time series (terjemahan, speech recognition, text generation); Convolutional (CNN) — untuk data berbentuk grid seperti gambar (photo tagging, object detection, medical imaging).","NN dengan lebih dari tiga layer (termasuk input dan output) dapat dianggap deep learning; keunggulan DL adalah kemampuan feature extraction secara otomatis sehingga akurasi dan generalisasi tinggi di NLP, computer vision, dan sistem otonom."],"terms":[{"term":"Supervised learning","def":"Pembelajaran dengan data berlabel yang memetakan input ke output yang diketahui."},{"term":"Unsupervised learning","def":"Pembelajaran dari data tanpa label untuk menemukan pola, cluster, asosiasi, atau mereduksi dimensi."},{"term":"Reinforcement learning","def":"Agen belajar dari konsekuensi tindakannya (reward/penalty) untuk memaksimalkan reward kumulatif."},{"term":"Semisupervised learning","def":"Kombinasi data berlabel dan tidak berlabel saat data berlabel terbatas atau mahal."},{"term":"Regression vs Classification","def":"Regression menghasilkan nilai kuantitatif/kontinu; classification menghasilkan kategori kualitatif."},{"term":"Human-in-the-loop (HITL)","def":"Keterlibatan penilaian manusia pada titik kritis untuk memvalidasi output/keputusan AI."},{"term":"Deep learning","def":"Neural network dengan banyak hidden layer (lebih dari tiga layer total) yang mengekstraksi fitur secara otomatis."}],"examTip":"Hafalkan pasangan paradigma–risiko utama: supervised = kualitas data dan bias; unsupervised = explainability (mitigasi: HITL); reinforcement = sifat otonom/keselamatan saat eksplorasi (mitigasi: HITL). Soal 'risiko TERBESAR' untuk tiap paradigma sering mengarah ke pasangan ini."},{"num":"1.3","title":"Algorithms","bookPage":29,"pdfPage":35,"summary":"Algoritma adalah instruksi langkah demi langkah yang menjadi blok bangunan model ML; hyperparameter mengatur cara algoritma belajar. Memilih kelas algoritma yang sesuai tujuan sangat penting, dan auditor perlu mengenal konsep tambahan seperti LLM, prompt, foundation model, NLP, underfitting, dan overfitting.","points":["Model ML dibangun dari satu atau lebih algoritma yang mengatur cara data diproses, fitur diekstraksi, dan parameter disesuaikan. Hyperparameter (mis. learning rate, kedalaman decision tree, jumlah layer) ditetapkan sebelum training; pemilihan hyperparameter bisa sama pentingnya dengan pemilihan algoritma.","1.3.1 Memilih kelas algoritma yang tidak sesuai dengan tujuan dapat menyebabkan inefisiensi atau output yang tidak akurat.","Kelas supervised: linear regression (relasi linear variabel, contoh prediksi harga rumah); logistic regression (probabilitas kejadian/klasifikasi biner, contoh spam filter); tree-based models (memecah data secara rekursif, menangani relasi nonlinear, contoh credit risk assessment); support vector machines (hyperplane sebagai batas keputusan, andal dengan data relatif sedikit, contoh image classification).","Kelas unsupervised: K-means clustering (menentukan K centroid, contoh kampanye pemasaran pelanggan); hierarchical clustering (agglomerative menggabungkan atau divisive memecah, contoh pemetaan gen manusia); principal component analysis/PCA (mengubah variabel menjadi komponen ortogonal yang mewakili varians terbesar, contoh image classification).","Kelas reinforcement: Q-learning (model-free, mempelajari nilai pasangan state-action di Q-table, contoh robotic path planning); Deep Q Networks/DQN (memakai neural network untuk mengaproksimasi Q-value pada state space besar, contoh autonomous driving); policy-based (langsung mengoptimalkan pemetaan state ke action, contoh kontrol lengan robot).","1.3.2 LLM dilatih dengan data teks dalam jumlah sangat besar memakai arsitektur transformer untuk memahami dan menghasilkan respons mirip manusia (chatbot, ringkasan, terjemahan). Prompt adalah input untuk GenAI; kualitas output sangat dipengaruhi spesifisitas prompt.","Foundation model (disebut juga general-purpose AI/GPAI) dilatih pada dataset luas dan dapat diadaptasi untuk berbagai tugas. NLP menggabungkan linguistik komputasional, ML, dan DL untuk memahami dan menghasilkan bahasa manusia; sentiment analysis ('opinion mining') mengklasifikasikan polaritas positif/negatif/netral secara rule-based atau berbasis ML.","Underfitting: model terlalu sederhana sehingga kinerja buruk pada data training maupun test; prediksi tidak akurat menunjukkan bias. Overfitting: model 'menghafal' data training termasuk noise/outlier, bagus di training tetapi buruk di data baru. Dalam kedua kasus, auditor memastikan ada proses untuk mendeteksi penyebab dan menganalisis hasil training vs testing."],"terms":[{"term":"Hyperparameter","def":"Pengaturan yang ditetapkan sebelum training untuk mengatur cara algoritma belajar (mis. learning rate, jumlah layer)."},{"term":"Large Language Model (LLM)","def":"Model AI berbasis transformer yang dilatih pada data teks sangat besar untuk memahami dan menghasilkan bahasa."},{"term":"Foundation model / GPAI","def":"Model yang dilatih pada data luas dan dapat diadaptasi untuk banyak tugas."},{"term":"Prompt","def":"Input (umumnya dari manusia) yang memicu output pada sistem GenAI."},{"term":"Underfitting","def":"Model terlalu sederhana; kinerja buruk pada data training dan test."},{"term":"Overfitting","def":"Model terlalu pas dengan data training (ikut menghafal noise); kinerja buruk pada data baru."},{"term":"Sentiment analysis","def":"Analisis berbasis NLP untuk menentukan polaritas (positif/negatif/netral) suatu teks."}],"examTip":"Bedakan underfitting (buruk di training DAN test) vs overfitting (bagus di training, buruk di data baru). Peran auditor bukan menyetel model, tetapi memvalidasi bahwa proses training/testing ada untuk mendeteksinya. Ingat juga: overfitting adalah isu akurasi, bukan jenis bias sosial."},{"num":"1.4","title":"AI Life Cycle","bookPage":33,"pdfPage":39,"summary":"AI life cycle (versi OECD) mencakup plan & design, collect & process data, build/adapt models, test/evaluate/verify/validate, deploy, operate & monitor, dan retire. Risiko harus dipertimbangkan di setiap fase, karena hasil pengukuran risiko dapat berbeda antarfase dan antaraktor.","points":["Fase AI life cycle mirip SDLC. Menurut NIST AI 100-1, risiko yang diukur di awal bisa berbeda dengan di akhir; sebagian risiko bersifat laten dan meningkat saat sistem beradaptasi. Aktor berbeda (mis. developer pretrained model vs deployer) bisa punya persepsi risiko berbeda, tetapi semua aktor berbagi tanggung jawab atas AI yang trustworthy dan fit for purpose.","1.4.1 Plan and design: merumuskan konsep, tujuan, asumsi, konteks, dan requirement, termasuk success metrics; masalah dan solusi didokumentasikan dalam business use case bersama stakeholder; lakukan initial risk assessment (etika, dampak sosial, bias) dan tetapkan kerangka data governance; prototyping membantu memvalidasi asumsi lebih awal. Kurangnya pertimbangan risiko di sini memicu masalah etika, bias, dan akuntabilitas.","1.4.2 Collect and process data: kumpulkan data dengan consent (tanpa consent dan disclosure → pelanggaran privasi dan risiko litigasi); bersihkan data dari inkonsistensi/duplikasi/error; cek kelengkapan, kualitas, relevansi, dan ketepatan waktu; dokumentasikan karakteristik dataset (sumber, metode, preprocessing, komposisi, intended use, version control, retensi).","1.4.3 Build and/or adapt models: memilih model/algoritma sesuai tujuan, kalibrasi (fine-tuning parameter secara iteratif) dan training. Risiko utama fase ini adalah kurangnya explainability dan robustness. Sistem perlu merekam key events secara otomatis (logging) untuk monitoring/audit dan didesain dengan HITL oversight.","1.4.4 Test, evaluate, verify, validate: verification = model dibangun sesuai spesifikasi desain; validation = model memenuhi tujuan dan memberi output akurat. Teknik: model testing (accuracy, precision, recall), stress testing (edge case), comparative analysis (vs baseline), bias & fairness checks, scenario analysis. Testing mengikuti change management, divalidasi terhadap business justification awal; risiko yang ditemukan masuk ke project risk register dengan rencana mitigasi.","1.4.5 Make available/deploy: pilot di lingkungan terkontrol (proof of concept), cek kompatibilitas dengan sistem legacy dan integrasi, kepatuhan regulasi, instruksi jelas bagi pihak ketiga/downstream deployer, dokumentasi teknis (instruksi, risk assessment, regulatory compliance mapping) yang dipelihara sepanjang life cycle, serta change management organisasi (pelatihan, buy-in, feedback pengguna).","1.4.6 Operate and monitor: proses berkelanjutan untuk memantau metrik kinerja dan kualitas serta menilai konsekuensi yang disengaja maupun tidak disengaja. Quality management system (QMS) dengan dokumentasi komprehensif membantu membuktikan kepatuhan dan perlu diaudit/diperbarui secara berkala.","1.4.7 Retire/decommission: dipicu oleh solusi yang usang, adanya alternatif baru, atau hasil risk assessment/audit yang menunjukkan risiko melampaui risk appetite. Butuh decommissioning plan melalui change management (migrasi atau penghapusan data, integrasi sistem, kontinuitas operasi) dan komunikasi jelas ke stakeholder."],"terms":[{"term":"OECD AI life cycle","def":"Rangkaian fase: plan & design, collect & process data, build/use model, verify & validate, deploy, operate & monitor, retire."},{"term":"Verification vs Validation","def":"Verification: dibangun sesuai spesifikasi desain; validation: memenuhi tujuan penggunaan dengan output yang akurat dan andal."},{"term":"Stress testing","def":"Pengujian robustness model dengan kondisi ekstrem atau edge case."},{"term":"Quality management system (QMS)","def":"Sistem dan dokumentasi untuk menunjukkan kepatuhan pada regulasi dan standar selama operasi."},{"term":"Decommissioning plan","def":"Rencana terdokumentasi untuk menghentikan solusi AI secara aman melalui change management."}],"examTip":"Pertimbangan risiko, etika, dan bias harus dilakukan SEJAK fase plan & design — jawaban yang menunda risk assessment ke fase akhir biasanya salah. Perpindahan ke produksi harus diotorisasi melalui change management organisasi; solusi AI tidak mendapat 'jalur khusus'. Retirement dapat dipicu temuan audit bila risiko melebihi risk appetite."},{"num":"1.5","title":"Business Considerations","bookPage":37,"pdfPage":43,"summary":"Solusi AI harus diimplementasikan melalui change management standar dan didukung business case terdokumentasi, cost-benefit analysis, ekspektasi ROI yang realistis, pilihan hosting yang tepat, pengawasan vendor, dan pembagian tanggung jawab yang jelas (shared responsibility).","points":["Solusi AI tidak diperlakukan berbeda dalam change management; perbedaannya hanya pada pertimbangan operasional dan risiko yang unik.","1.5.1 Business case minimal memuat: masalah yang ingin diselesaikan, cara AI menyelesaikannya, cost-benefit analysis dan ekspektasi ROI, risiko teridentifikasi dan mitigasinya, serta rencana implementasi rinci. Langkah PERTAMA membangun use case adalah mengidentifikasi masalah (melalui IT steering committee/innovation committee, masukan karyawan, atau konsultan).","Pertimbangkan apakah AI benar-benar mampu mencapai hasil yang diharapkan dan seberapa matang teknologinya; Gartner AI Hype Cycle (innovation trigger, peak of inflated expectations, trough of disillusionment, slope of enlightenment, plateau of productivity) dapat dipakai menilai kematangan. Solusi mapan (mis. layanan cloud AI) memiliki variabilitas lebih rendah dibanding membangun solusi baru dari konsep yang masih berkembang.","1.5.2 Biaya khas AI: implementation costs (pengembangan, lisensi, pelatihan karyawan), operational costs (pemeliharaan, konsumsi energi, gaji talenta AI), risk & compliance costs (perlindungan privasi, manajemen reputasi). Manfaat umum: efisiensi & otomasi, pengambilan keputusan lebih baik, dan pengurangan biaya — harus terkait kembali ke business case.","1.5.3 ROI awal bisa rendah akibat biaya awal tinggi dan masa ramp-up pengguna, sehingga ekspektasi perlu ditetapkan realistis sejak awal. Selain kenaikan pendapatan/penurunan biaya, pertimbangkan metrik non-finansial seperti kepuasan karyawan dan customer experience. Manual mengutip survei Google: sekitar 74% organisasi melaporkan ROI dari GenAI.","1.5.4 Hosting internal (on-premises): kontrol dan kustomisasi lebih tinggi, performa teroptimasi, kontrol keamanan/privasi data lebih mudah; namun butuh sumber daya komputasi, daya listrik, dan SDM tambahan serta sulit diskalakan. Cloud: skalabilitas, overhead rendah, biaya awal rendah; namun kontrol infrastruktur berkurang, risiko vendor lock-in, fluktuasi biaya, latency, dan data keluar dari lingkungan terkontrol. Lokasi fisik provider penting bila data training tunduk pada privacy law.","1.5.5 Vendor harus dinilai saat onboarding (melalui proses procurement standar berbasis risiko) dan sepanjang umur solusi. Penilaian khusus AI: keselarasan strategi dan nilai AI, kepatuhan etika (transparency, explainability), serta keamanan dan privasi data. Tetapkan SLA yang jelas dan tinjau secara berkala berbasis risiko; input pengawasan vendor juga dipakai dalam evaluasi ROI.","1.5.6 Solusi off-the-shelf mempercepat adopsi tetapi menimbulkan risiko batas tanggung jawab yang kabur: accountability & ownership (siapa memelihara kontrol), etika (siapa bertanggung jawab bila terjadi bias/hasil salah), dan data security (lebih banyak attack vector). Mendefinisikan pembagian tanggung jawab sepenuhnya adalah kewajiban organisasi pembeli.","Contoh Microsoft AI Shared Responsibility Model: tiga lapisan — AI usage (user training, usage policy, IAM, data governance), AI application (plugin, desain aplikasi, safety system), dan AI platform (model safety, model accountability, tuning, training, compute infrastructure); porsi tanggung jawab bergeser antara customer dan Microsoft tergantung model SaaS (Copilot), PaaS (Azure AI), atau IaaS (bring-your-own model)."],"terms":[{"term":"Business case","def":"Dokumen yang menjustifikasi investasi AI: masalah, solusi, cost-benefit/ROI, risiko & mitigasi, rencana implementasi."},{"term":"Gartner AI Hype Cycle","def":"Representasi grafis kematangan, adopsi, dan dampak bisnis berbagai teknologi AI."},{"term":"Vendor lock-in","def":"Ketergantungan pada satu penyedia sehingga sulit/mahal untuk berpindah."},{"term":"Off-the-shelf AI","def":"Solusi AI siap pakai yang disediakan pihak ketiga."},{"term":"Shared responsibility model","def":"Pembagian tanggung jawab kontrol antara penyedia dan pelanggan solusi AI per lapisan (usage, application, platform)."}],"examTip":"Tanpa business case yang jelas, risiko kegagalan implementasi AI tinggi — auditor sebaiknya memeriksa keberadaan business case sebelum hal lain. Untuk solusi pihak ketiga, akuntabilitas pembagian tanggung jawab tetap pada organisasi pembeli (risiko tidak bisa sepenuhnya dialihkan ke vendor)."}]},{"id":"B","title":"AI Governance and Program Management","overview":"AI governance adalah proses, standar, dan guardrail yang memastikan AI aman dan etis. Urutannya: tetapkan strategi serta roles & responsibilities, turunkan ke kebijakan dan prosedur, sosialisasikan melalui training & awareness, lalu ukur dengan program metrics yang dilaporkan ke badan pengawas.","sections":[{"num":"1.6","title":"AI Strategy","bookPage":43,"pdfPage":49,"summary":"AI strategy adalah pendekatan organisasi untuk mengadopsi, mengembangkan, dan mengatur AI agar manfaat dapat diraih sambil mengelola risiko secara sistematis. Strategi harus berakar pada visi/misi, selaras dengan nilai (value alignment), dan didukung manajemen senior.","points":["Banyak organisasi mengintegrasikan AI governance ke fungsi IT governance yang ada; ini umumnya dapat diterima, tetapi karakter unik AI dapat menantang efektivitas IT governance tradisional.","1.6.1 Jenis strategi: national (selaras etika dan nilai negara, mengarahkan hukum, keamanan nasional), industry (inovasi industri, standar & best practice, interpretasi regulasi), dan corporate (keunggulan kompetitif, keselarasan dengan requirement yang berlaku).","Strategi harus dibangun dari prinsip yang diakui, umumnya berfokus pada explainability, fairness, transparency, dan human-centricity. OECD AI Principles memiliki lima value-based principles (inclusive growth & well-being; rule of law, human rights, democratic values termasuk fairness & privacy; transparency & explainability; robustness, security & safety; accountability) dan lima rekomendasi bagi pemerintah (investasi R&D, ekosistem inklusif, lingkungan kebijakan interoperable, kapasitas SDM & transisi pasar kerja, kerja sama internasional).","Strategi harus diterima manajemen senior dan disusun oleh tim lintas fungsi (IT, risk management, legal, operasional, keuangan). Keahlian AI mendalam tidak wajib untuk menyusun strategi; organisasi dapat memakai konsultan eksternal atau menugaskan komite yang ada (IT steering committee, innovation committee).","1.6.2 Peluang AI: inovasi, analisis data yang lebih kaya secara real-time, layanan pelanggan yang dipersonalisasi, otomasi, serta monitoring risiko dan kepatuhan yang berkelanjutan. Tantangannya: manfaat menuntut redesain proses bisnis bahkan model bisnis, bukan sekadar adopsi teknologi.","1.6.3 Visi dan misi: organisasi harus memahami misinya dan memiliki visi AI yang jelas bagi stakeholder internal dan eksternal; contohnya visi Uni Eropa untuk menumbuhkan 'excellence' AI dan memastikan AI bekerja untuk manusia.","1.6.4 Value alignment (World Economic Forum): mendesain AI agar berperilaku konsisten dengan nilai manusia dan prinsip etika; berbeda antarorganisasi/negara. Elemennya: community, ethical foundations, legal compliance, operational strategy. Enabler: frameworks & guidance, human engagement, organizational change, serta audits & assessments; value alignment dievaluasi sepanjang AI life cycle melalui AI governance yang kuat."],"terms":[{"term":"AI strategy","def":"Pendekatan organisasi untuk mengadopsi, mengembangkan, dan mengatur solusi AI."},{"term":"OECD AI Principles","def":"Lima prinsip berbasis nilai untuk AI yang trustworthy dan lima rekomendasi kebijakan bagi pemerintah."},{"term":"AI value alignment","def":"Mendesain AI agar berperilaku sesuai nilai manusia dan prinsip etika yang relevan bagi pengguna sasarannya."},{"term":"AI vision","def":"Pernyataan niat organisasi tentang adopsi dan penggunaan AI untuk mencapai misinya."}],"examTip":"Fokus utama AI steering committee dalam strategi adalah memberi insight strategis atas peluang dan risiko AI — bukan menyetujui anggaran, mengelola pengembangan, atau mereview detail teknis. Strategi yang efektif membutuhkan dukungan manajemen senior dan masukan lintas fungsi."},{"num":"1.7","title":"AI-related Roles and Responsibilities","bookPage":46,"pdfPage":52,"summary":"Peran AI bervariasi menurut ukuran organisasi dan strategi adopsinya, tetapi umumnya terbagi dalam empat kategori: leadership & strategy, development & operations, users, serta governance & oversight.","points":["Bila organisasi hanya memakai solusi AI pihak ketiga, departemen IT-nya mungkin tidak memiliki peran pengembangan/operasi AI.","Leadership & strategy: executive management menetapkan tone at the top, menyetujui AI strategy, dan pada akhirnya bertanggung jawab atas dampak AI terhadap organisasi dan stakeholder; Chief AI Officer memimpin adopsi AI dan melapor ke manajemen eksekutif (bisa peran tersendiri atau digabung ke peran setara); AI steering committee adalah kelompok lintas fungsi yang memberi masukan strategi terkait dampak AI pada unitnya (bisa digabung dengan IT steering/innovation committee).","Development & operational (biasanya di IT): IT development membuat solusi AI sesuai use case (data scientist, engineer, researcher, developer); IT operations men-deploy dan memelihara solusi serta infrastrukturnya; product management menjembatani tim teknis dan end user untuk memastikan usability.","Users: end user (karyawan atau konsumen); HR mendukung karyawan pengguna melalui klasifikasi jabatan dan pelatihan; customer service mendukung pelanggan pengguna AI.","Governance & oversight: governance committee mengawasi program dan kebijakan AI governance serta melaporkan program metrics; risk management mengintegrasikan AI ke perencanaan enterprise risk management (ERM); information security & privacy menangani isu keamanan dan privasi sepanjang life cycle; internal audit menilai risiko AI sebagai bagian dari audit plan."],"terms":[{"term":"Chief AI Officer","def":"Pemimpin adopsi AI di organisasi yang melapor ke manajemen eksekutif."},{"term":"AI steering committee","def":"Kelompok lintas fungsi yang memberi masukan strategis terkait dampak AI pada unit masing-masing."},{"term":"Governance committee","def":"Badan yang mengawasi program dan kebijakan AI governance serta melaporkan metriknya."},{"term":"Tone at the top","def":"Sikap dan komitmen manajemen eksekutif yang menjadi arah budaya dan perilaku organisasi."}],"examTip":"Akuntabilitas akhir atas dampak AI ada pada executive/senior management, bukan pada IT atau auditor. Internal audit berperan menilai risiko AI dalam audit plan — bukan mengembangkan atau mengoperasikan solusi (jaga independensi)."},{"num":"1.8","title":"AI-related Policies and Procedures","bookPage":47,"pdfPage":53,"summary":"Kebijakan dan prosedur AI harus selaras dengan AI strategy; dapat berdiri sendiri atau diintegrasikan ke kebijakan TI/keamanan yang ada. Minimal ada AI policy formal yang menetapkan penggunaan yang diizinkan/dilarang, dilengkapi AI usage policy (AUP).","points":["Sebelum menulis kebijakan baru, organisasi sebaiknya menelaah kebijakan IT dan information security yang sudah ada untuk kemungkinan integrasi.","Minimal, sikap organisasi terhadap AI didokumentasikan dalam kebijakan formal yang diketahui seluruh stakeholder terkait; kebijakan menetapkan penggunaan AI yang diizinkan dan dilarang serta ekspektasi governance atas solusi AI, dan sebaiknya mengacu pada framework yang diterima umum.","Penerapan AI policy dapat memicu pembaruan standar, rencana, atau prosedur lain (mis. rencana training & awareness).","AI usage policy melengkapi AI policy dan dapat diintegrasikan ke acceptable use policy sistem informasi yang umum.","1.8.1 AI acceptable use policy (AUP) memberi kerangka penggunaan AI yang etis dan bertanggung jawab berdasarkan analisis risk-benefit (terutama karena pesatnya GenAI). AUP harus mudah dipahami, mencantumkan solusi AI yang disetujui, memberi panduan penggunaan data organisasi di solusi tersebut, dan disertai pelatihan bagi pengguna."],"terms":[{"term":"AI policy","def":"Kebijakan formal yang menyatakan sikap organisasi terhadap AI, penggunaan yang diizinkan/dilarang, dan ekspektasi governance."},{"term":"AI acceptable use policy (AUP)","def":"Pedoman penggunaan AI yang etis dan bertanggung jawab bagi pengguna, termasuk daftar solusi yang disetujui dan aturan penggunaan data."}],"examTip":"Jika ditanya langkah awal menyusun kebijakan AI, jawaban yang kuat adalah menelaah kebijakan IT/infosec yang ada untuk diintegrasikan, bukan langsung membuat kebijakan baru dari nol. AUP yang efektif = sederhana + daftar solusi yang disetujui + panduan data + pelatihan."},{"num":"1.9","title":"AI Training and Awareness","bookPage":48,"pdfPage":54,"summary":"Training dan awareness penting agar implementasi AI diterima dan tidak menimbulkan ketidakpercayaan atau ketakutan kehilangan pekerjaan. Organisasi perlu mengelola dampak AI terhadap workforce melalui talent management, job redesign, dan pengembangan skill, knowledge, dan competencies.","points":["Tanpa training dan awareness, muncul kebingungan dan distrust; ketakutan bahwa AI akan menggantikan pekerjaan dapat memicu penolakan. Studi WEF 2023 memperkirakan disrupsi AI terhadap sekitar 23% pekerjaan pada 2027, tetapi secara neto penurunan lapangan kerja relatif kecil (sekitar 2%) karena banyak peran bertransisi dan peran baru muncul.","1.9.1 Talent management: organisasi harus mempertimbangkan dampak neto AI terhadap workforce. Panduan Singapura 'A Guide to Job Redesign in the Age of AI' memuat empat area: transforming jobs (tugas diotomasi, di-augment, atau tetap di tangan manusia), charting clear pathways between jobs, clearing barriers to digital transformation, dan enabling effective communication antara pemberi kerja dan karyawan.","Libatkan HR dan spesialis pelatihan dalam AI strategy; minta masukan process owner (manajer dan karyawan pelaksana) saat menentukan tugas yang akan diganti atau di-augment, dengan memperhitungkan dampak ke karyawan dan stakeholder lain (mis. pelanggan).","Setelah redesain, buat rencana transisi: standardisasi tugas terkait AI lintas jenis jabatan, petakan jalur perpindahan jabatan, dan identifikasi tugas baru serta skill gap.","1.9.2 Pertimbangan awareness pertama adalah persepsi negatif/misinformasi karyawan. Contoh solusi: edukasi tentang peluang dan peran yang diperkaya (atasi kurangnya awareness), nominasikan innovation champion (atasi resistensi), implementasi bertahap dan pelatihan batch kecil (hindari gangguan bisnis), pelatihan spesifik tugas dan mudah diakses, serta tinjau remunerasi dan metrik kinerja untuk peran yang diperkaya (atasi ketidakpastian dan persepsi beban kerja bertambah).","Komunikasi harus dilakukan sebelum, selama, dan sesudah implementasi. Champion/'power user' di tiap unit dengan AI literacy dasar membantu tim implementasi dan menjadi advokat positif bagi rekan yang skeptis.","Kompetensi umum yang perlu dimiliki karyawan: AI acceptable use policies, fundamental AI dan terminologinya, ethical awareness (explainability, bias), dan pertimbangan spesifik solusi (mis. prompt engineering untuk platform GenAI)."],"terms":[{"term":"Job redesign","def":"Penataan ulang tugas dan jabatan untuk mengakomodasi AI, termasuk jalur transisi antarjabatan."},{"term":"AI champion / power user","def":"Early adopter di unit kerja dengan AI literacy yang membantu implementasi dan mendorong penerimaan."},{"term":"AI literacy","def":"Pemahaman dasar tentang AI, istilahnya, dan implikasi penggunaannya."}],"examTip":"Task statement Domain 1 meminta auditor menganalisis dampak AI terhadap workforce dan memastikan program awareness selaras dengan kebijakan AI. Dalam soal, pilih jawaban yang menekankan komunikasi proaktif, pelibatan HR/process owner, dan pelatihan berbasis tugas — bukan sekadar pelatihan teknis generik."},{"num":"1.10","title":"Program Metrics","bookPage":50,"pdfPage":56,"summary":"Program AI governance membutuhkan metrik untuk menilai efektivitas proses desain, pengembangan, dan deployment AI, umumnya selaras dengan prinsip etika. Belum ada konsensus tentang metode pengukuran risiko dan trustworthiness yang robust.","points":["Metrik program umumnya mengikuti prinsip etika AI: bias, fairness, transparency, explainability.","Menurut NIST AI RMF, kurangnya konsensus pengukuran disebabkan oleh: belum ada standar/panduan baku, variasi solusi AI dan laju perubahan yang cepat, pendekatan pengukuran yang terlalu disederhanakan, dan kekhawatiran etis institusional.","Dalam menyusun metrik, potensi bahaya bagi manusia harus dipertimbangkan PERTAMA dan utama; setelah itu faktor bisnis seperti isu karyawan, customer experience, dan realisasi manfaat yang dijanjikan dalam business case.","OECD.AI Policy Observatory menyediakan katalog metrik teknis (sering berupa rumus matematis) untuk AI yang trustworthy: fair, akurat, explainable, transparan, robust, aman, dan secure.","Objektif metrik yang umum: accountability, fairness, human wellbeing, performance, privacy & data governance, robustness & digital security, safety, serta transparency & explainability.","Metrik program dipakai untuk continuous improvement dan dilaporkan ke badan pengawas yang tepat."],"terms":[{"term":"Program metrics","def":"Ukuran untuk memantau efektivitas program AI governance dan proses life cycle AI."},{"term":"OECD Catalogue of Tools & Metrics for Trustworthy AI","def":"Katalog metrik teknis untuk menilai aspek trustworthy AI."}],"examTip":"Saat menilai atau merancang metrik AI, prioritas PERTAMA adalah potensi harm terhadap manusia, baru kemudian faktor bisnis. Auditor juga perlu menyadari keterbatasan metrik (belum ada konsensus), sehingga perlu mengevaluasi kewajaran metrik yang dipilih developer."}]},{"id":"C","title":"AI Risk Management","overview":"AI risk management bertujuan meminimalkan dampak negatif AI terhadap manusia, organisasi, dan ekosistem, dan harus dilakukan proaktif sejak awal serta sepanjang life cycle. Manual memakai NIST AI RMF (Govern, Map, Measure, Manage) sebagai contoh kerangka: identifikasi risiko (Map), asesmen (Measure), dan monitoring (Manage).","sections":[{"num":"1.11","title":"AI-related Risk Identification","bookPage":51,"pdfPage":57,"summary":"Identifikasi risiko AI harus terintegrasi ke program risk management organisasi dan memperhitungkan threat actor, jenis harm, kriteria tingkat risiko, aktor life cycle, kategori risiko EU AI Act, serta tantangan khas manajemen risiko AI.","points":["Pemilihan framework risiko sebaiknya mempertimbangkan panduan industri/negara. Empat fungsi inti NIST AI RMF: Govern (membangun governance dan program risiko), Map (identifikasi dan memahami risiko serta dampaknya), Measure (mengkuantifikasi dan menganalisis risiko), Manage (mengawasi dan memperbarui program secara berkelanjutan).","Identifikasi risiko dilakukan berkala (mis. risk assessment tahunan) serta saat terjadi perubahan sistem atau onboarding vendor baru. Penilai risiko harus menerapkan professional skepticism karena orang cenderung menganggap AI lebih objektif dan lebih andal daripada manusia atau software biasa.","1.11.1 Contoh threat actor: insider (sengaja/tidak sengaja, mis. memasukkan data rahasia ke AI publik atau mengekstrak data sensitif), nation state (cyberespionage, surveillance, sensor), cybercriminal (phishing lebih meyakinkan, malware canggih), dan AI developer (membuat solusi yang tidak etis, mis. algoritma kredit yang bias).","1.11.2 Banyak solusi AI sulit dijelaskan sehingga risikonya sulit diidentifikasi; karena itu risiko perlu ditangani sedini mungkin. NIST AI RMF mengelompokkan harm: terhadap manusia (individu, kelompok/komunitas, masyarakat), terhadap organisasi (operasi bisnis, security breach/kerugian finansial, reputasi), dan terhadap ekosistem (elemen yang saling terhubung, sistem keuangan/supply chain global, sumber daya alam dan lingkungan).","Kriteria tingkat risiko menurut OECD Framework for the Classification of AI Systems: scale (keparahan dan probabilitas dampak), scope (luas penerapan/jumlah orang terdampak), dan optionality (sejauh mana orang dapat memilih untuk tidak terkena dampak sistem AI).","Identifikasi risiko perlu memahami aktor di tiap tahap life cycle (mis. pengumpul dan pemroses data pada tahap data & input), sebagaimana dipetakan OECD.","EU AI Act membagi sistem AI ke dalam empat kategori risiko yang menentukan tingkat regulasi (secara umum: unacceptable/dilarang, high, limited/kewajiban transparansi, dan minimal).","1.11.3 Tantangan AI risk management (NIST): risiko dari solusi pihak ketiga dan datanya; hasil asesmen yang berbeda di tiap tahap life cycle; ketiadaan metrik yang andal (developer bisa memilih metrik yang menguntungkan dirinya); risiko dunia nyata yang tidak muncul di lingkungan uji terkontrol; inscrutability (explainability rendah); dan kebutuhan human baseline sebagai pembanding bagi solusi yang menggantikan/menambah aktivitas manusia. Karena itu dibutuhkan governance yang memfasilitasi kolaborasi developer, risk professional, dan auditor."],"terms":[{"term":"NIST AI RMF","def":"Framework manajemen risiko AI dari NIST dengan fungsi inti Govern, Map, Measure, Manage."},{"term":"Professional skepticism","def":"Sikap mempertanyakan dan tidak menganggap output AI otomatis benar atau objektif."},{"term":"Scale / Scope / Optionality","def":"Kriteria OECD untuk menentukan tingkat risiko: keparahan & probabilitas, luas dampak, dan pilihan untuk tidak terdampak."},{"term":"Inscrutability","def":"Keterbatasan explainability/interpretability yang menimbulkan ketidakpastian inheren."},{"term":"Human baseline","def":"Metrik kinerja manusia sebagai pembanding bagi solusi AI yang menggantikan atau menambah aktivitas manusia."}],"examTip":"Peta NIST AI RMF: Govern = governance, Map = identifikasi, Measure = asesmen, Manage = monitoring/penanganan. Untuk threat detection, ISACA lebih memilih cakupan pemantauan menyeluruh atas semua sistem yang terhubung dan berkelanjutan, bukan hanya saat AI beroperasi atau hanya fokus ancaman eksternal. Jangan lupa professional skepticism terhadap output AI."},{"num":"1.12","title":"AI Risk Assessment","bookPage":55,"pdfPage":61,"summary":"AI risk assessment tidak boleh terisolasi; ia terintegrasi dalam proses risk assessment organisasi, dilakukan berkala dan saat ada perubahan, lalu ditindaklanjuti dengan respons risiko sesuai risk appetite/tolerance, prioritisasi, dan remediation plan yang dipantau secara independen.","points":["1.12.1 Lakukan asesmen secara berkala dan setiap ada perubahan pada solusi AI; definisi likelihood dan impact yang ada bisa menjadi titik awal, lalu tambahkan atribut unik AI ke proses jika belum ada.","Pertimbangan khusus (NIST): methods & metrics yang terdokumentasi dan ditinjau pakar independen terhadap kesimpulan developer; evaluasi karakteristik trustworthy (ethical use, bias & fairness, transparency & explainability, trust & safety, keamanan data/IP, human rights, dampak lingkungan); mekanisme pelacakan risiko yang ada, tak terduga, dan baru muncul; serta umpan balik stakeholder tentang efikasi pengukuran.","1.12.2 Risk appetite = jumlah risiko yang bersedia diambil untuk mencapai tujuan strategis, ditetapkan senior leadership di tingkat enterprise (strategis). Risk tolerance = deviasi yang dapat diterima dari risk appetite, bisa ditetapkan di level departemen/proyek (taktis). Keduanya harus didefinisikan oleh developer dan pengguna AI berdasarkan tujuan bisnis dan ketentuan hukum.","Organisasi yang mengembangkan dan memakai AI umumnya memiliki risk appetite/tolerance relatif lebih tinggi (contoh developer mobil otonom yang menanggung tanggung jawab atas potensi harm).","1.12.3 Tujuan risk treatment adalah menurunkan residual risk ke tingkat yang dapat diterima. Opsi: avoid (tidak menjalankan aktivitas berisiko, mis. tidak memakai AI karena regulasi), mitigate (menerapkan dan memantau kontrol, mis. kebijakan AI dan kontrol keamanan), share/transfer (kemitraan, asuransi, kontrak, mis. perjanjian shared responsibility dengan vendor), accept (keputusan sadar manajemen dalam batas toleransi dengan monitoring formal, mis. tetap meluncurkan chatbot meski ada sentimen negatif).","Tidak semua risiko AI layak atau efisien untuk ditangani; prioritisasi berdasarkan kriteria terdefinisi (mis. tingkat risiko) sesuai kebijakan risk management.","1.12.4 Remediation plan dengan langkah jelas dan tanggal target dibuat untuk setiap risiko yang melampaui appetite/tolerance, ditugaskan kepada risk owner yang melaksanakan dan melapor ke fungsi pengawas; karena AI melintasi banyak unit, akuntabilitas dan ownership krusial.","Bila remediasi memakan waktu melebihi toleransi, pertimbangkan compensating controls (rollout bertahap ke pengguna berisiko rendah, kebijakan baru, pelatihan pengguna, kontrol teknis). Fungsi independen memantau status remediasi, dan penyelesaiannya diverifikasi secara independen."],"terms":[{"term":"Risk appetite","def":"Jumlah risiko yang bersedia diambil enterprise untuk mencapai tujuan strategis; ditetapkan senior leadership."},{"term":"Risk tolerance","def":"Deviasi yang dapat diterima dari risk appetite; lebih taktis, bisa di level departemen/proyek."},{"term":"Residual risk","def":"Risiko yang tersisa setelah risk treatment."},{"term":"Avoid / Mitigate / Share-Transfer / Accept","def":"Empat opsi risk response/treatment."},{"term":"Compensating control","def":"Kontrol pengganti sementara ketika remediasi utama belum dapat diselesaikan dalam batas toleransi."},{"term":"Risk owner","def":"Pihak yang bertanggung jawab melaksanakan remediation plan dan melaporkan progresnya."}],"examTip":"Penerimaan risiko (accept) adalah keputusan manajemen/senior leadership, bukan auditor. Auditor menilai apakah risk appetite terdefinisi, apakah remediasi punya owner dan target, serta apakah ada pemantauan dan verifikasi independen. Ingat bahwa risk transfer tidak pernah menghapus seluruh tanggung jawab (terutama reputasi)."},{"num":"1.13","title":"AI Risk Monitoring","bookPage":56,"pdfPage":62,"summary":"AI risk monitoring adalah proses berkelanjutan untuk menangani risiko sesuai remediation plan, menilai emerging risk, merespons insiden/error, dan mendorong continuous improvement, didukung KRI dan KPI.","points":["Cakupan monitoring: tindak lanjut remediation plan, proses penilaian emerging risk, mekanisme continuous improvement, dan respons terhadap insiden serta error pada solusi AI.","1.13.1 Sumber input continuous improvement: upaya mitigasi risiko (update rencana jika muncul risiko/peluang baru), performance indicators (tinjau untuk dihentikan/diganti bila fungsi atau user experience dipertanyakan), pihak ketiga (dimonitor terus dan diganti bila tidak memenuhi kontrak fungsi/keamanan), dan resolusi insiden (lessons learned). Upaya ini didokumentasikan, umumnya di central risk register.","1.13.2 Key risk indicator (KRI) memberi peringatan dini atas eksposur risiko dan biasanya memiliki threshold yang memicu alert ke pihak pemantau risiko.","Untuk AI yang dibeli dari pihak ketiga, penetapan KRI dapat mengikuti proses standar berbasis hasil proses bisnis dan dikoordinasikan dengan KPI. Contoh KPI chatbot customer service: customer satisfaction score, resolution rate tanpa intervensi manusia, misunderstanding rate, dan escalation rate ke agen manusia.","Untuk AI yang dikembangkan sendiri, KRI lebih menantang: bergantung pada analisis statistik dan butuh tim lintas fungsi (risk management, audit, statistikawan). Contoh kerangka: KAIRI (Key Artificial Intelligence Risk Indicators).","KAIRI memakai prinsip SAFE: Sustainability (robustness dan stabilitas terhadap anomali/manipulasi siber), Accuracy (membandingkan prediksi dengan bukti teramati), Fairness (perlakuan setara antar kelompok populasi), Explainability (model dapat diinterpretasi stakeholder). KRI yang dipilih tergantung apakah model white box atau black box dan jenis metodenya (regresi, klasifikasi)."],"terms":[{"term":"Key risk indicator (KRI)","def":"Indikator peringatan dini eksposur risiko, biasanya dengan threshold pemicu alert."},{"term":"Key performance indicator (KPI)","def":"Ukuran pencapaian kinerja terhadap target (mis. resolution rate chatbot)."},{"term":"KAIRI","def":"Key Artificial Intelligence Risk Indicators — kerangka KRI untuk AI berbasis prinsip SAFE."},{"term":"SAFE","def":"Sustainability, Accuracy, Fairness, Explainability — dimensi KRI dalam KAIRI."},{"term":"Risk register","def":"Catatan terpusat risiko, rencana penanganan, dan upaya perbaikan."}],"examTip":"Bedakan KRI (peringatan dini risiko, berbasis threshold) dari KPI (pencapaian kinerja). Untuk AI pihak ketiga, KRI dapat dikaitkan dengan KPI proses bisnis; untuk AI buatan sendiri, butuh analisis statistik dan tim lintas fungsi. Lessons learned dari insiden harus masuk ke continuous improvement."}]},{"id":"D","title":"Privacy and Data Governance Programs","overview":"AI dapat membantu program data governance dan privacy (data discovery/klasifikasi otomatis, data quality, policy enforcement), tetapi juga menambah risiko bila tidak dikendalikan. Part ini membahas inventaris dan klasifikasi data, consent, licensing, pembatasan penggunaan, cleansing dan retensi, clustering, serta pertimbangan dan regulasi privasi.","sections":[{"num":"1.14","title":"Data Governance","bookPage":59,"pdfPage":65,"summary":"Data governance untuk AI dimulai dari inventaris dan klasifikasi aset data, dilanjutkan dengan consent, data licensing, pembatasan pengumpulan/penggunaan/pengungkapan, cleansing, retensi, dan pengawasan atas clustering. AI tetap tunduk pada program data governance dan privacy organisasi.","points":["Inventaris data/aset informasi yang rinci adalah langkah PERTAMA sebelum klasifikasi dan penentuan tingkat perlindungan; inventaris dan klasifikasi harus ditinjau dan diperbarui berkala. Klasifikasi juga mendukung cost-benefit kontrol agar tidak overspending pada proteksi yang tidak perlu.","Perbedaan AI dengan sistem biasa: batas antara aksi sistem dan aksi pengguna menjadi kabur (terutama automated decision-making), sehingga isu etika (bias, transparency, explainability) harus masuk ke proses governance. AI tidak menghapus tanggung jawab data owner: data input harus dipahami dan disetujui data owner, dan output AI juga harus memiliki owner yang jelas.","Terapkan data minimization agar AI hanya mengakses data minimum sesuai tujuan yang disetujui (mis. masking, tokenization); output AI dilindungi sesuai klasifikasi datanya.","1.14.1 Data classification sebagai kontrol mendefinisikan: tingkat kepentingan data, data owner, proses pemberian akses, pihak yang menyetujui hak dan level akses, serta tingkat kontrol keamanan. Data sangat sensitif (PII, trade secret) harus dilabeli agar developer tahu sebelum memakainya untuk training atau memasukkannya ke AI produksi — data sensitif yang 'terserap' ke AI dengan antarmuka publik berisiko bocor.","Contoh skema klasifikasi: public (bebas diakses, mis. materi pemasaran), internal (khusus karyawan berwenang, mis. bagan organisasi), confidential (mis. data keuangan belum terbit, daftar pelanggan, data kartu pembayaran; bisa tunduk HIPAA/PCI DSS), restricted (sangat sensitif, paparan dapat berujung sanksi pidana/denda). Data yang tidak dilabeli mengindikasikan potensi penyalahgunaan dan rentan social engineering.","1.14.2 Consent harus diberikan secara bebas, spesifik, terinformasi, dan tegas. Consent diperoleh sebelum pengumpulan, sebelum penggunaan untuk tujuan di luar tujuan awal, dan sebelum transfer ke pihak ketiga/yurisdiksi lain; untuk AI pastikan juga notifikasi eksplisit atas penggunaan automated decision-making terpenuhi.","1.14.3 Data licensing: data publik gratis untuk training makin dibatasi (Data Provenance Initiative mencatat pembatasan sekitar 5% seluruh data dan 25% dari sumber berkualitas tertinggi dalam setahun hingga April 2024). Perjanjian lisensi perlu mengatur ownership input/output dan IP, batasan lisensi (exclusivity, redistribution rights), serta etika dan kepatuhan hukum; fungsi legal wajib terlibat. Kasus Cambridge Analytica (data >50 juta pengguna Facebook tanpa consent/perjanjian memadai) berujung denda dan kebangkrutan.","1.14.4 Collection, use, and disclosure: pengumpulan data dipandu masalah yang ingin dijawab model; isu web scraping, pengumpulan tanpa consent, dan data sensitif memerlukan kepatuhan hukum. GDPR Art. 5(1)(b) menegaskan purpose limitation. Data non-personal pun berisiko karena kombinasi dataset dapat mengidentifikasi individu; pembatasan data dipandu tujuan data dan dikelola di metadata repository oleh privacy steward. Usage diagram (vertikal) untuk penggunaan data dalam proses; dataflow diagram (horizontal) untuk aliran data antarsistem.","Berbagi data ke luar organisasi menambah eksposur — risk
