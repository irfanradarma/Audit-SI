<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Sistem Informasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f4f2ed;
  --surface: #ffffff;
  --surface2: #f0ede7;
  --border: #e2ddd5;
  --border2: #cec8be;
  --text: #1a1916;
  --text2: #5a5650;
  --text3: #96918a;
  --accent: #2d5a3d;
  --accent-light: #e6efe9;
  --accent-mid: #4a8c61;
  --header-bg: #1a2e22;
  --link: #2d5a3d;
  --link-hover: #4a8c61;
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* ── HEADER ── */
header {
  background: var(--header-bg);
  padding: 2.2rem 2rem 2rem;
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute;
  top: -50px; right: -50px;
  width: 240px; height: 240px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.05);
  pointer-events: none;
}
header::after {
  content: '';
  position: absolute;
  bottom: -70px; right: 80px;
  width: 150px; height: 150px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.035);
  pointer-events: none;
}
.header-inner {
  max-width: 1000px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}
.header-top-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
}
.header-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
  margin-bottom: 0.45rem;
}
header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(1.7rem, 3.5vw, 2.4rem);
  color: #fff;
  font-weight: 400;
  line-height: 1.15;
}
header h1 em { font-style: italic; color: rgba(255,255,255,0.55); }
.header-meta { font-size: 12.5px; color: rgba(255,255,255,0.4); margin-top: 0.4rem; }
.header-actions { margin-top: 1.4rem; }
.rps-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.13);
  color: rgba(255,255,255,0.8);
  padding: 6px 13px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 12px;
  font-family: 'Outfit', sans-serif;
  transition: background 0.2s, border-color 0.2s;
}
.rps-btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.22); }
.rps-btn svg { width: 13px; height: 13px; opacity: 0.75; flex-shrink: 0; }

/* ── SEMESTER SWITCHER (top-right in header) ── */
.header-switcher {
  display: inline-flex;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 7px;
  padding: 3px;
  gap: 2px;
  flex-shrink: 0;
  margin-top: 2px;
}
.header-switcher button {
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.04em;
  padding: 4px 11px;
  border-radius: 5px;
  border: none;
  cursor: pointer;
  background: transparent;
  color: rgba(255,255,255,0.35);
  transition: all 0.18s;
}
.header-switcher button.active {
  background: rgba(255,255,255,0.11);
  color: rgba(255,255,255,0.88);
}
.header-switcher button:not(.active):hover {
  color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.05);
}

/* ── MAIN ── */
main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 2rem 2rem 5rem;
}

/* ── SECTION LABEL ── */
.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 1.6rem 0 0.6rem;
}

/* ── TABLE ── */
.course-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  table-layout: fixed;
}

.course-table thead th {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  background: var(--surface2);
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.course-table thead th:first-child {
  width: 46px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.col-topik  { width: 22%; }
.col-bahan  { width: 26%; }
.col-prak   { width: 26%; }
.col-lain   { width: 26%; }

.course-table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}
.course-table tbody tr:last-child { border-bottom: none; }
.course-table tbody tr:hover td { background: #faf9f7; }

.course-table td {
  padding: 11px 14px;
  vertical-align: top;
  font-size: 13px;
  color: var(--text);
}
td.num-cell {
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  background: var(--surface2);
  border-right: 1px solid var(--border);
  vertical-align: middle;
}
td.topic-cell {
  font-weight: 500;
  font-size: 13px;
  color: var(--text);
  vertical-align: middle;
}

/* Exam row */
tr.exam-row td {
  background: var(--header-bg) !important;
  color: rgba(255,255,255,0.9);
  text-align: center;
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: 14px;
  font-weight: 400;
  padding: 14px;
  vertical-align: middle;
}
tr.exam-row td.num-cell {
  background: rgba(255,255,255,0.06) !important;
  color: rgba(255,255,255,0.4);
  border-right-color: rgba(255,255,255,0.08);
  font-family: 'DM Mono', monospace;
  font-style: normal;
  font-size: 11px;
  text-align: center;
  vertical-align: middle;
}

/* Links inside cells */
.cell-links { display: flex; flex-direction: column; gap: 5px; }
.cell-link {
  display: inline-flex;
  align-items: flex-start;
  gap: 5px;
  color: var(--link);
  text-decoration: none;
  font-size: 12.5px;
  line-height: 1.4;
  transition: color 0.15s;
}
.cell-link:hover { color: var(--link-hover); text-decoration: underline; }
.cell-link svg { width: 11px; height: 11px; flex-shrink: 0; opacity: 0.55; margin-top: 2px; }
.cell-text { font-size: 12.5px; color: var(--text2); font-style: italic; }
td.empty-cell { color: var(--text3); font-size: 12px; }

@media (max-width: 700px) {
  header, main { padding-left: 1rem; padding-right: 1rem; }
  .course-table { display: block; overflow-x: auto; }
  header h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top-row">
      <div>
        <div class="header-label">Politeknik Keuangan Negara STAN</div>
        <h1>Audit <em>Sistem</em> Informasi</h1>
      </div>
      <div class="header-switcher">
        <button id="btn-genap2026" class="active" onclick="switchSemester('genap2026')">Genap 2026</button>
        <button id="btn-ganjil2025" onclick="switchSemester('ganjil2025')">Ganjil 2025</button>

    <div class="header-actions">
      <a href="https://github.com/irfanradarma/Audit-SI/raw/main/ASP%20STR_2514926D_Audit%20Sistem%20Informasi.pdf" target="_blank" class="rps-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.877a2 2 0 0 0 1.94-1.515L22 17"/></svg>

/* ─────────────────────────────────────────
   RENDERING
───────────────────────────────────────── */
function renderItems(items) {
  if (!items || !items.length) return '';
  return `<div class="cell-links">${items.map(item => {
    if (item.type === 'text') return `<span class="cell-text">${item.text}</span>`;
    return `<a href="${item.href}" target="_blank" class="cell-link">${item.icon}${item.text}</a>`;
  }).join('')}</div>`;
}

function renderTable(data, containerId) {
  const container = document.getElementById(containerId);
  const sections = [
    { label: 'Pra-UTS',   rows: data.slice(0, 8)  },
    { label: 'Pasca-UTS', rows: data.slice(8, 16)  }
  ];

  let html = '';
  sections.forEach(sec => {
    html += `<div class="section-label">${sec.label}</div>`;
    html += `<table class="course-table">
      <thead>
        <tr>
          <th>No</th>
          <th class="col-topik">Topik</th>
          <th class="col-bahan">Bahan Ajar</th>
          <th class="col-prak">Praktikum</th>
          <th class="col-lain">Lain-Lain</th>
        </tr>
      </thead>
      <tbody>`;

    sec.rows.forEach(w => {
      if (w.exam) {
        html += `<tr class="exam-row">
          <td class="num-cell">${w.num}</td>
          <td colspan="4">${w.exam}</td>
        </tr>`;
      } else {
        html += `<tr>
          <td class="num-cell">${w.num}</td>
          <td class="topic-cell">${w.topic}</td>
          <td>${renderItems(w.slides)}</td>
          <td>${renderItems(w.praktikum)}</td>
          <td>${renderItems(w.lain)}</td>
        </tr>`;
      }
    });

    html += `</tbody></table>`;
  });

  container.innerHTML = html;
}

/* ─────────────────────────────────────────
   SEMESTER SWITCH
───────────────────────────────────────── */
function switchSemester(code) {
  document.getElementById('content-genap2026').style.display  = code === 'genap2026'  ? '' : 'none';
  document.getElementById('content-ganjil2025').style.display = code === 'ganjil2025' ? '' : 'none';
  document.getElementById('btn-genap2026').className  = code === 'genap2026'  ? 'active' : '';
  document.getElementById('btn-ganjil2025').className = code === 'ganjil2025' ? 'active' : '';
  document.getElementById('header-semester').textContent = code === 'genap2026' ? 'Genap 2026' : 'Ganjil 2025';
}

/* ── INIT ── */
renderTable(GENAP_2026,   'content-genap2026');
renderTable(GANJIL_2025,  'content-ganjil2025');
